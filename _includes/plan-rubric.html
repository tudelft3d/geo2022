<div class="rubric-page" data-logo="{{ site.baseurl }}/assets/img/tud-logo.svg">
  <div class="header">
    <h1>
      MSc Geomatics for the Built Environment — Kick-off (thesis plan)
      assessment
    </h1>
    <img src="{{ site.baseurl }}/assets/img/tud-logo.svg" alt="TU Delft" />
  </div>

  <div class="student-info">
    <label
      >Student name
      <input type="text" id="studentName" placeholder="e.g. Jane Doe"
    /></label>
    <label
      >Student number
      <input type="text" id="studentNumber" placeholder="e.g. 1234567"
    /></label>
    <label
      >Thesis title
      <input type="text" id="thesisTitle" placeholder="e.g. Automated mapping of building footprints"
    /></label>
    <label
      >Date <input type="date" id="assessmentDate" style="max-width: 180px"
    /></label>
    <label
      >Responsible supervisor
      <input type="text" id="respSupervisor" placeholder="e.g. B. Jones"
    /></label>
    <label
      >Second supervisor
      <input type="text" id="secondSupervisor" placeholder="e.g. C. Brown"
    /></label>
    <label
      >Delegate of BoE
      <input type="text" id="delegateBoE" placeholder="e.g. A. Smith"
    /></label>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" onclick="resetAll()">
      Clear all marks
    </button>
    <button class="btn btn-print" onclick="generatePDF()">
      Download as PDF
    </button>
  </div>

  <div class="summary">
    <h2>Decision summary</h2>
    <table>
      <thead>
        <tr>
          <th>Outcome</th>
          <th>Aspects</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Aspects marked Go</td>
          <td id="sumGo">0</td>
        </tr>
        <tr>
          <td>Aspects marked Borderline</td>
          <td id="sumBorderline">0</td>
        </tr>
        <tr>
          <td>Aspects marked No-go</td>
          <td id="sumNogo">0</td>
        </tr>
        <tr class="final-row">
          <td>Final decision (Go / No-go)</td>
          <td>
            <span class="grade-row" style="padding: 0">
              <span class="grade-option go"
                ><input
                  type="radio"
                  name="finalDecision"
                  value="Go"
                  id="finalGo"
                  onchange="updateSummary()"
                /><label for="finalGo">Go</label></span
              >
              <span class="grade-option nogo"
                ><input
                  type="radio"
                  name="finalDecision"
                  value="No-go"
                  id="finalNogo"
                  onchange="updateSummary()"
                /><label for="finalNogo">No-go</label></span
              >
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="rubric-sections" id="planContainer"></div>

  <div class="general-comments">
    <label for="generalComments"
      >Additional comments / feedback for the student</label
    >
    <textarea
      id="generalComments"
      placeholder="General feedback, strengths, areas for improvement…"
    ></textarea>
  </div>

  <div class="notes" id="planNotes"></div>
</div>

<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/rubric.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/plan-rubric.js"></script>
