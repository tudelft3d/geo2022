# Geomatics-typical keyword tags for the repository search API, feeding
# scripts/find_old_theses.py --keyword-filter.
#
# The repository search API ignores every filter parameter except
# record_type and keyword= (a comma-separated list that ORs the tags;
# spaces inside a tag become underscores). Filtering the per-surname
# sweep to these tags cuts the post-coverage hit list from ~3500 to a
# size whose record pages can all be fetched (20 s robots delay each),
# so the Programme field can decide every candidate instead of a
# metadata-only listing.
#
# The list is the union of the repository's own keyword facets (visible
# in every search response's filters.keywords) that are distinctly
# Geomatics — laser scanning/point clouds, 3D city models, GIS/BIM/SDI,
# remote sensing, photogrammetry/vision, positioning, cadastre/
# topography. Deliberately excluded: Delft3D/flood/hydrodynamics (CEG
# civil), neural-network/computer-vision generic tags (EEMCS), solar
# cells, daylight/facades (Building Technology). Spelling variants are
# kept because the API matches tags verbatim.

