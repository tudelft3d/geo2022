# Hand-checked paper candidates from reports/papers_report.md.
#
# A candidate listed here with 'verdict: not related' is silenced in
# future runs of scripts/find_papers.py (matched on author -- surname or
# full student name --, year and doi/url). An entry-level
# 'verdict: no papers' skips a thesis altogether, for theses whose
# follow-up papers belong to the student's later PhD work rather than to
# the thesis. Papers that ARE the thesis's paper are not recorded here:
# add them directly to the entry's `paper:` field in
# _data/geotheses.yml (optionally `paper_label:`) and they drop out of
# the report by themselves.

# His vario-scale papers continue his PhD work ("Variable-scale
# Geo-information"), not his MSc thesis; the search also keeps matching
# his whole publication record and namesakes (checked by Ken, 2026-09).
- author: Martijn Meijers
  year: 2006
  verdict: no papers

# He continued into a PhD at the radar group (Hanssen/van Leijen); every
# candidate the search surfaced is either their pre-thesis work, a
# colleague's paper he co-authored, or his own PhD-era papers -- nothing
# directly derived from the MSc thesis (checked by Ken, 2026-09).
- author: Sami Samiei-Esfahany
  year: 2008
  verdict: no papers
