# Draft list of likely Geomatics MSc supervisors.
#
# Intended input for scripts/find_old_theses.py, which sweeps the TU Delft
# repository for MSc theses supervised by these people and reports the ones
# missing from _data/geotheses.yml (especially pre-2013, the era before the
# GDMC / 3d.bk.tudelft.nl lists start).
#
# status meanings:
#   yes      supervisor of at least one thesis already in the archive
#            (2013+), so no confirmation needed
#   no       evaluated and not predictive: contributed no confirmed
#            Geomatics thesis in the 2006-2012 sweep window (or its one
#            hit is covered by a kept co-supervisor), so the script skips
#            it; flip back to 'yes' if that ever changes
#   pending  candidate for the pre-2013 / remote-sensing era; Ken confirms
#            or discards (change to 'yes', or delete the entry)
#
# 'aliases' are the exact supervisor strings found in the archive, kept so
# the script can match against the repository's contributor names.
#
# NOTE: every 'yes' name is only a SEARCH KEY -- the theses it turns up are
# classified separately (programme field, mentors, title keywords) and
# never added without review.

