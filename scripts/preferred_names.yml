# Preferred display names for the people appearing in the thesis
# archive's supervisors fields (_data/geotheses.yml). 'name' is the
# preferred form we show; 'aliases' are the other exact strings found in
# the archive (initials variants, spelling variants) that refer to the
# same person. Matching is on exact strings.
#
# source meanings:
#   verified   confirmed against TU Delft staff pages / ORCID / records
#              (see note); OK to keep unless you know better
#   likely     best candidate from public sources, worth a second look
#   mycase     full form taken from MyCase (the graduation system)
#   archive    full form already present in the archive data
#   unresolved no full form found anywhere; initials shown until resolved
#
# scripts/apply_preferred_names.py rewrites the archive supervisors
# fields through this table (dry-run by default, --write to apply);
# scripts/enrich_geotheses.py consults it when ingesting new records.
# Edit by hand: add aliases, fix names, flip source when you confirm.
