name: deploy to github pages

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never two deploys at once; a queued push simply deploys after the running one
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:

    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4
      with:
        # full history, for _plugins/theses_updated.rb
        fetch-depth: 0
    - name: Set up Ruby
      run: sudo apt install ruby-full
    - name: Install dependencies
      run: |
        sudo gem install jekyll jekyll-redirect-from
    - name: jekyll build
      run: |
        jekyll build --trace
    - name: configure pages (enables Pages on first run)
      uses: actions/configure-pages@v5
      with:
        enablement: true
    - name: upload site
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - name: deploy
      id: deploy
      uses: actions/deploy-pages@v4
