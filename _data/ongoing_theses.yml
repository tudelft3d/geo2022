# Ongoing MSc Geomatics theses (open MyCase cases), grouped
# by starting cohort, newest first. scripts/update_theses.py
# syncs names, cohorts, phases, titles and supervisors from
# MyCase; summaries and images are maintained by hand. Validate
# with scripts/check_geotheses.py (archive) — this file has no
# checker yet.
- surname: Schoonderwoerd
  name: Kelly
  cohort: 2026sep
  phase: Midterm
  title: 'Japan’s PLATEAU: from CityGML to CityJSON'
  supervisors: Hugo Ledoux; Hidemichi Baba
  summary: This thesis proposal studies how Japan's Project PLATEAU 3D city
    models, published as CityGML enriched with attributes from the i-Urban
    Revitalization Application Domain Extension, can be converted to the compact,
    developer-friendly CityJSON format while retaining that domain-specific
    data, which existing conversion tools discard. It analyses the building
    attributes of the i-UR Urban Object Module, selects the essential ones,
    and maps them into a CityJSON Extension, evaluating conversion losses
    on PLATEAU datasets from Tokyo and Hachioji. The extension is then used
    to add CityJSON support to the PLATEAU-GIS-Converter, making these open
    3D city models more accessible to researchers and developers.
  image: kelly.jpg
- surname: van der Meer
  name: Mark
  cohort: 2026sep
  phase: Midterm
  title: 'CityGit: a version control system for 3D city models'
  supervisors: Hugo Ledoux; Hidemichi Baba
  summary: 'This thesis proposal addresses the absence of a robust version
    control system for 3D city models: existing tools detect changes through
    graph representations that flag inconsequential differences, overlook
    geometry, and inflate file sizes. It develops a Git-inspired versioning
    tool on top of the CityJSON encoding, aiming for format neutrality across
    encodings such as CityGML. Changes between versions are detected through
    attribute comparisons and the Hausdorff distance metric, while Git-like
    object storage keeps repositories compact. The expected outcome is a scalable,
    user-friendly tool for tracking a city model''s development over time.'
  image: mark.jpg
