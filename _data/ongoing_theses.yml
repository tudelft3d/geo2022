- surname: Winterdal
  name: Josephine
  cohort: 2026feb
  phase: Green light
  title: 'Assessing Coastal Change and Vulnerability Using Remote Sensing:
    A Comparative Study of Aruba and Bonaire'
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh
  summary: This thesis proposal explores methods for generating accurate building
    rooftints and footprints from Airborne Laser Scanning (ALS) point clouds,
    with application to France’s LiDAR HD data. The research investigates
    how point cloud characteristics influence the extraction of both rooftop
    and facade boundaries, combining deep learning for semantic segmentation
    of roof and facade points with geometric processing to reconstruct outlines.
    The work aims to improve upon existing datasets like BD TOPO, which lacks
    harmonization and precise georeferencing, and supports France’s initiative
    to develop a nationwide digital twin with detailed 3D building models.
  image: josephine.jpg
- surname: ter Braak
  name: Segher
  cohort: 2025sep
  phase: Green light
  title: Downscaling ECOSTRESS Land Surface Temperature using Deep Learning
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh
  summary: This thesis proposes a physics-guided deep learning framework to
    downscale ECOSTRESS land surface temperature (LST) data from ~70 m to
    10 m resolution in heterogeneous Dutch landscapes. It integrates Sentinel‑2
    imagery, land cover, and topography into a Swin Transformer‑based U‑Net
    architecture. The approach uses weakly supervised learning with physics‑informed
    loss functions—such as aggregation consistency and edge‑aware smoothness—to
    ensure physical plausibility and coherence across scales. The goal is
    to produce high‑resolution, physically consistent LST estimates suitable
    for detailed urban and agricultural analyses, addressing the limitations
    of traditional downscaling methods in complex environments.
  image: segher.jpg
