- surname: Garcia Mezo
  name: Juan
  cohort: 2026april
  phase: Green light
  title: Semantic Interpretation of Change Detection at the Building Element
    Level
  supervisors: Ken Arroyo Ohori; Gina Stavropoulou
  summary: This thesis proposal investigates semantic change detection in
    urban point clouds at the level of building elements, i.e. meaningful
    geometric components such as roof planes and roof installations. Binary
    change detection methods (e.g. C2C, M3C2) capture geometric differences
    between point clouds, but are sensitive to noise, varying point densities,
    and occlusions, and say little about what actually changed; existing semantic
    and object-based approaches describe changes only generically (e.g. new,
    demolished, taller, lower). The research bridges point-level and building-instance
    change detection by detecting and classifying changes at the element level
    and propagating this semantics to building instances, while accounting
    for the challenges of large-scale, multimodal point clouds.
  image: juan.jpg
- surname: Marx
  name: Danny
  cohort: 2026april
  phase: Kick-off
  title: Applying Implicit Neural Representations to Landsat Thermal Infrared
    Imagery for Super-Resolution
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh; Massimo Menenti
  summary: This thesis proposal applies an implicit neural representation
    (INR) to Landsat 8/9 thermal infrared imagery, whose 30-m product is merely
    interpolated from the 100-m native resolution, to recover land surface
    temperature detail that interpolation cannot. A convolutional encoder
    is paired with a SIREN-based decoder that predicts temperature at continuous
    coordinates, pretrained on 120-m downsampled imagery and fine-tuned with
    a dual-head design, one branch regularised by a 10-m Sentinel-2 land cover
    map. Evaluated over irrigated fields and desert in Arizona, the approach
    aims to deliver sharper, more accurate 10-m temperature estimates for
    crop water-stress monitoring.
  image: danny.jpg
- surname: Winterdal
  name: Josephine
  cohort: 2026feb
  phase: Finalisation
  title: 'Coastal Change in Aruba and Bonaire: A Remote Sensing Assessment
    of Shoreline Change, Development, and Vegetation'
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh
  summary: This thesis proposal assesses coastal change and vulnerability
    along the coastlines of Aruba and Bonaire using multi-source satellite
    data. Coastlines are segmented and classified by coastal type, after which
    per-segment indicators are extracted — shoreline position from optical
    imagery (NDWI/MNDWI), vegetation buffers from NDVI, built-up intensity
    from Sentinel-1 SAR backscatter, and external exposure from coastline
    orientation, wave fetch and reef presence. Linking these indicators reveals
    how external exposure and development pressures shape coastal change,
    and a composite index produces relative vulnerability maps. Comparing
    PlanetScope (Aruba) and NSO (Bonaire) imagery additionally shows how data
    quality and island characteristics affect the results.
  image: josephine.jpg
- surname: ter Braak
  name: Segher
  cohort: 2025sep
  phase: Green light
  title: Downscaling ECOSTRESS Land Surface Temperature using Deep Learning
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh
  summary: This thesis proposes a physics-guided deep learning framework to
    downscale ECOSTRESS land surface temperature (LST) data from ~70 m to
    10 m resolution in heterogeneous Dutch landscapes. It integrates Sentinel‑2
    imagery, land cover, and topography into a Swin Transformer‑based U‑Net
    architecture. The approach uses weakly supervised learning with physics‑informed
    loss functions—such as aggregation consistency and edge‑aware smoothness—to
    ensure physical plausibility and coherence across scales. The goal is
    to produce high‑resolution, physically consistent LST estimates suitable
    for detailed urban and agricultural analyses, addressing the limitations
    of traditional downscaling methods in complex environments.
  image: segher.jpg
