- surname: Ho
  name: Phuong Anh
  cohort: 2026sep
  phase: Kick-off
  title: Estimating air temperature between ECOSTRESS overpasses with a physics-informed
    spatio-temporal transformer
  supervisors: Azarakhsh Rafiee; Joris Timmermans
  summary: This thesis proposal tackles the sparse temporal coverage of ECOSTRESS,
    which observes land surface temperature at 70 m only at irregular overpasses
    and so cannot track the near-surface air temperature people experience.
    It extends a spatio-temporal transformer that estimates air temperature
    from ECOSTRESS imagery with a physics-constrained loss function and, in
    a Delft study domain, with simulated land surface temperature from physically
    based urban climate models as input between overpasses. Evaluating the
    model variants against Dutch weather station observations, the thesis
    aims to show how physics constraints and simulated inputs improve accuracy
    as time since the last overpass grows.
  image: phuonganh.jpg
- surname: Nurmohamed
  name: Faried
  cohort: 2026sep
  phase: Kick-off
  title: 'Measuring the In-Between: Integrating Social and Spatial Data to
    Assess Urban Interstices in Amsterdam'
  supervisors: Daniele Cannatella; Claudiu Forgaci
  summary: This thesis proposal develops a spatial index for assessing urban
    interstices, the weakly defined in-between public spaces of Amsterdam's
    Zuidoost and Nieuw-West districts, where underused leftover spaces coincide
    with lagging liveability and social contact. Standardised field observations
    of public life, collected with an adapted Public Life Data Protocol, are
    combined with open spatial data on physical and microclimate conditions
    such as sun, shade and wind in a spatial database. Per-site indicators
    are normalised, weighted and aggregated into an index that is validated
    against existing assessment tools, revealing each interstice's strengths
    and weaknesses to guide public space design.
  image: faried.jpg
- surname: Prikazchikov
  name: Stepan
  cohort: 2026sep
  phase: Kick-off
  title: Suitability & Prioritisation of Nature based Solutions in the Mediterranean
    and Atlantic Coast
  supervisors: Daniele Cannatella; Claudiu Forgaci
  summary: This thesis proposal addresses the challenge of planning nature-based
    solutions in multi-hazard coastal regions by developing a spatial decision
    support system for the Mediterranean and Atlantic coasts. Using open spatial
    data and multi-criteria methods, it combines expert pairwise comparisons
    on hazards, ecosystem services and socio-economic factors with decision-maker
    preferences to map suitability and rank candidate interventions. Outputs
    are presented through maps and an interactive viewer, piloted for a Croatian
    coastal county. The expected outcome is a framework and working tool that
    provide a transparent evidence base for iterative co-design of climate
    adaptation portfolios.
  image: stepan.jpg
