- surname: Briels
  name: Sven Andreas
  title: Infrasound source location
  supervisors: Läslo Evers; Dick Simons
  year: 2010
  link: https://resolver.tudelft.nl/uuid:5d720169-fc34-4a9c-bf6d-49aa546e3966
  image: 2010_Briels.jpg
  abstract: By recording infrasound signals one is able to listen to the sound
    of highly energetic events such as volcanoes, meteorites and the supersonic
    flight of aircraft, even if these occur hundreds of kilometres away. Recordings
    of infrasound signals are made using infrasound arrays, which can determine
    the incoming direction of the signals. In this research a method is developed
    to use the recordings of multiple infrasound arrays to estimate the location,
    in latitude and longitude, of infrasound sources. The method is applied
    to recordings of three infrasound arrays in the Netherlands which are
    operated by the Koninklijk Nederlands Meteorologisch Instituut (KNMI)
    and three additional arrays located in Germany and France.
  uuid: 5d720169-fc34-4a9c-bf6d-49aa546e3966
