- surname: Cordes
  name: Carlo
  title: Spatio-temporal Transformers for Wildfire Risk Prediction
  supervisors: Azarakhsh Rafiee; Justin Schembri; Simona Bianchi
  year: 2026
  graduation_date: '2026-06-24'
  link: https://resolver.tudelft.nl/uuid:700a6579-a227-4984-8fd8-f980af99c8ba
  image: 2026_Cordes.jpg
  abstract: The ever increasing frequence and destructiveness of wildfires
    across the globe calls for accurate interpretation of the underlying conditions
    to enhance data-driven mitigation strategies. While deep learning techniques
    have produced valuable results in both prediction of wildfire ignition
    as well as its spread, the abstraction of data into the interpretation
    of a generalized risk of occurrence remains largely uninvestigated. This
    thesis represents a novel approach directed at solving this challenge
    by leveraging a spatio-temporal transformer network. By combining multi-modal
    satellite imagery in an early-fusion attention arcitecture, along with
    the explicit temporal and spatial embedding of spatial and dynamic datasets,
    the here proposed transformer architecture STViT (Spatio-temporal Vision
    Transformer) abstracts probabilistic risk of fire occurrence from deterministic
    burn records. A progressive resolution-scaling decoder transfers embedded
    variables into a continuous risk map, optimized by a Weighted Binary Cross-Entropy
    loss function, referencing historical burn records of the MODIS instrument.
    Results validate the STViT architecture's capacity to successfully suppress
    noise and capture both seasonal wildfire trends as well as an understanding
    of natural fire barriers in waterbody regions. Investigations into the
    best applicable context window reveal a 3-day sample extent to provide
    the best accuracy in forecasting a 14-day prediction window, managing
    to contain $70 percent$ of fire events in $20 percent$ of its most risk-prone
    predicted area. A horizon stress test into the error produced by enhancing
    lead-time proves the model to retain a high predictive skill for up to
    5 days after which sharp accuracy degradation is shown. A comprehensive
    discussion of ablation studies demonstrates the model to be exercising
    balanced feature reliance without mathematical shortcuts. By investigating
    seasonal reliance on features, results indicate dominant reliance during
    fire-prone months on land surface temperature and a combination of terrain
    data. NDWI proves to be a more reliable proxy of fuel moisture as compared
    to NDVI. Finally, this work illustrates high-dimensional spatio-temporal
    embedding spaces to successfully capture a wide array of climate conditions,
    making it a valuable asset for wildfire management.
  uuid: 700a6579-a227-4984-8fd8-f980af99c8ba
- surname: den Hartog
  name: Anne
  title: 'Thermally conscious urban mobility: operationalizing urban microclimate
    data into a pedestrian routing tool'
  supervisors: Clara García Sánchez; Daniela Maiullari; Lukas Beuster
  year: 2026
  graduation_date: '2026-06-16'
  link: https://resolver.tudelft.nl/uuid:0e63075e-ae21-4953-b0c1-6b4080de2420
  image: 2026_den-Hartog.jpg
  abstract: This thesis investigated how SOLWEIG-derived urban microclimate
    data can be transformed and integrated into a fully open-source, scalable
    pedestrian routing tool that supports thermally conscious mobility decisions.
    Scalability is treated as a central design requirement because such a
    tool can only contribute to climate-adaptive urban mobility if it can
    be reproduced and extended to different areas without being limited by
    manual processing or computational bottlenecks. The modular workflow prepares
    SOLWEIG input data, runs SOLWEIG_GPU to generate hourly UTCI outputs,
    samples these outputs onto an OpenStreetMap-derived pedestrian network
    as edge-level thermal-comfort attributes, and uses these in a modified,
    state-aware weighted Dijkstra algorithm with user-defined preferences.
    Interaction with the route planner is implemented using a locally deployable
    web interface. Evaluation with stratified origin-destination pairs shows
    that thermally conscious routes can reduce modelled UTCI exposure compared
    with the shortest path, particularly during hotter hours, while requiring
    only limited additional walking distance. The development process further
    shows that scalability depends not only on the routing algorithm, but
    also on data structures, file formats, network representation, and modular
    software design.
  uuid: 0e63075e-ae21-4953-b0c1-6b4080de2420
- surname: Félix Aires
  name: Carmem
  title: A Comparison of Wind Velocity Predictions from Wind-Only and Thermally
    Coupled OpenFOAM Solvers in Urban Models with Complex Terrain
  supervisors: Clara García Sánchez; Themis Vargiemezis; Frank van Gool
  year: 2026
  graduation_date: '2026-06-24'
  link: https://resolver.tudelft.nl/uuid:d18b9ec9-a296-47c3-a2d0-92969777369e
  image: 2026_Felix-Aires.jpg
  abstract: 'Climate change is intensifying urban heat stress, and microclimate
    simulation can support climate-responsive planning. Computational fluid
    dynamics (CFD) is the dominant approach at the microscale, but urban CFD
    studies are predominantly isothermal, neglecting buoyancy effects. Yet
    these effects become non-negligible under the low-wind, thermally active
    conditions that climate change is making more frequent. Coupled solvers
    such as urbanMicroclimateFoam (uMF), built on OpenFOAM, resolve airflow,
    heat and moisture transport, radiation, and vegetation interactions that
    wind-only formulations omit. However, it remains unclear under which conditions
    a wind-only simulation is sufficient and when the additional complexity
    of a coupled solver is justified. Addressing this question is hindered
    by three further gaps: published applications of uMF to realistic urban
    sites with complex terrain are scarce, its computational costs are not
    well characterised, and rigorous validation against field measurements
    is limited. To address these gaps, this thesis asks three questions: whether
    uMF can be feasibly applied to realistic urban models with non-flat terrain;
    how its mesh requirements, solver parameters, and computational demands
    compare to those of the wind-only solver simpleFoam (SF) on the same case;
    and how the two solvers’ wind-speed predictions compare against street-level
    field measurements during a representative heatwave hour. Applied to the
    Carnegie Mellon University campus in Pittsburgh during one hour of a heatwave
    on 27 August 2024, with a 3D model reconstructed in City4CFD from LiDAR
    and building footprints and validated against four MORICHI street-level
    stations, three findings emerge. First, applying uMF to realistic terrain
    is feasible but requires time-consuming, case-specific geometric adaptations
    compared to the geometry-robust SF. Second, on identical geometry and
    20 cores, uMF took 3.6× longer than SF (6 h 28 min versus 1 h 49 min),
    which does not represent a barrier to the use of the solver. Third, uMF
    improved wind-speed agreement across every aggregate indicator: FB moved
    from +0.65 to −0.11, MG from 1.89 to 0.83, NMSE was reduced by 65%, and
    FAC2 rose from 0.50 to 0.75. These results indicate that uMF merits adoption
    when buoyancy effects are non-negligible and the analyst can absorb the
    case-setup overhead. The findings are based on a single one-hour window
    under one inflow direction, with the observed wind speeds at three of
    the four stations falling below the anemometer accuracy threshold, and
    vegetation modelled as a porous medium. Addressing these limitations is
    identified as a priority for future work.'
  uuid: d18b9ec9-a296-47c3-a2d0-92969777369e
- surname: Hu
  name: Ming-Chieh
  title: Adaptive Plane Splatting for 3D Building Reconstruction
  supervisors: Liangliang Nan; Michael Weinmann
  year: 2026
  graduation_date: '2026-06-15'
  link: https://resolver.tudelft.nl/uuid:bbbae5e7-81a5-4cb1-9e01-d349ee7c24ad
  image: 2026_Hu.jpg
  github: https://github.com/MCHU-1999/AdaptivePS
  abstract: In the last three years, 3DGS has attracted widespread attention
    due to its fast training and high-quality rendering, leading to numerous
    surface reconstruction studies proposing geometric constraints to extract
    high-quality meshes. Although these methods demonstrate potential for
    building model reconstruction, modern 3D building applications increasingly
    require watertight, Boundary Representation (B-rep) models for analytical
    tasks rather than the standard triangular meshes typically generated.
    On the other hand, traditional piecewise-planar reconstruction methods
    that rely on point clouds are often computationally heavy and unstable
    when generating plane hypotheses from noisy data. To address these limitations,
    this thesis proposes AdaptivePS, an adaptive, image-to-plane splatting
    pipeline for multi-view indoor and outdoor scene surface reconstruction.
    Designed to function as the foundational step in a broader "image to watertight
    building model" pipeline, it outputs planar primitives ready to be plugged
    into a piecewise-planar reconstructor. AdaptivePS extends the baseline
    PlanarSplatting method to outdoor environments by introducing a foreground
    mask generator and a novel prior generator that jointly recovers camera
    poses, depth, and normal maps in a single inference—bypassing SfM entirely
    while normalizing scenes to a consistent scale. Additionally, the pipeline
    employs a mask-guided densification and pruning strategy to adaptively
    split primitives at object boundaries and remove background noise, alongside
    a mask-guided trimming mechanism applied to sampled points for sharper
    boundary delineation. Experiments demonstrate that AdaptivePS achieves
    sufficient geometric quality for outdoor scenes while running 2x as fast
    as the baseline framework. The code is available at https://github.com/MCHU-1999/AdaptivePS.
  uuid: bbbae5e7-81a5-4cb1-9e01-d349ee7c24ad
- surname: Hutama
  name: Andika Hadi
  title: Patch-Level and Object-Level Deep Learning for Urban Extent Extraction
    from Multi-Temporal Historical Maps
  supervisors: Martijn Meijers; Ana Pereira Roders
  year: 2026
  graduation_date: '2026-06-19'
  link: https://resolver.tudelft.nl/uuid:87d76db5-8f12-45ba-9317-045b71773cc5
  image: 2026_Hutama.jpg
  abstract: 'Historical maps are a rich source of information about past urban
    landscapes, but their contents remain largely inaccessible for computational
    analysis. This thesis investigates and compares two deep learning approaches
    for automated urban extent extraction from Dutch historical topographic
    maps, and applies the results to urban change analysis. Method 1 applies
    patch-level image classification using the MapReader framework on the
    Bonnebladen map series (1:25,000) covering the Province of South Holland.
    Map sheets are divided into 200-meter square patches and classified into
    three classes using a fine-tuned ResNet-101 model. A weak classifier trained
    on 1,768 manually annotated patches achieved a macro-averaged F1-score
    of 0.900. Inference was applied to 74 sheets across two temporal editions
    (T1: 1869–1916, T2: 1910–1943), producing georeferenced classified patch
    datasets at provincial scale. Post-classification comparison between T1
    and T2 detected approximately 65 km² of total urban growth in South Holland,
    with new building blocks as the dominant growth pattern. The results are
    validated against the HGN-1900 land use dataset, showing broad spatial
    agreement in urban areas. Method 2 applies object-level instance segmentation
    using Mask R-CNN on Rotterdam 1897 municipality maps (1:5,000). To avoid
    manual annotation, BGT vector data is style-transferred to approximate
    the historical cartographic style and translated using CycleGAN to generate
    a synthetic training dataset with automatically aligned annotation masks.
    The epoch 6 CycleGAN checkpoint is selected based on FID evaluation and
    visual inspection of building boundary preservation. The Mask R-CNN model
    trained on this synthetic data achieved a validation mAP50 of 0.8784.
    After post-processing and shape regularisation, 12,299 building polygon
    predictions are produced from sheet 3. External evaluation against BGT
    buildings confirmed to predate 1897 yielded a recall of 41.4%, reflecting
    both model detection limitations and the substantial post-war urban renewal
    of Rotterdam following the 1940 bombing. The two methods differ substantially
    in their capabilities and requirements. Method 1 scales to provincial
    level with limited annotation effort and supports statistical-level change
    analysis, but is sensitive to cartographic style shifts across temporal
    editions and produces coarse 200-meter raster output. Method 2 produces
    building-level vector polygons enabling urban persistence analysis, but
    requires a complex multi-stage pipeline, is constrained by georeferencing
    quality, and depends on synthetic training data that underrepresents dense
    historic urban configurations. Both methods are fully operational on a
    consumer-grade GPU laptop, confirming their accessibility without HPC
    infrastructure. Together, they demonstrate that IIIF-based map access
    infrastructure and modern deep learning techniques can be combined to
    support reproducible urban change analysis from historical map collections
    at multiple scales of spatial granularity.'
  uuid: 87d76db5-8f12-45ba-9317-045b71773cc5
- surname: Iliopoulos
  name: Giorgos
  title: (Semi-)automatic modeling of indoor building 3D models for daylight
    simulation with Lidar-enabled mobile devices
  supervisors: Ken Arroyo Ohori; Eleonora Brembilla; Nima Forouzandeh Shahraki
  year: 2026
  graduation_date: '2026-01-16'
  link: https://resolver.tudelft.nl/uuid:1954f6ce-686c-4686-80d1-37f26ee22d8e
  image: 2026_Iliopoulos.jpg
  github: https://github.com/IlioTheG/roomplan_to_honeybee
  abstract: 'This project evaluates the suitability of 3D interior space models
    acquired using Apple’s RoomPlan API for daylight simulations. The main
    contribution is a Python-based tool that converts RoomPlan output into
    HoneyBeeJSON by automatically reconstructing the ceiling and adding window
    frames, which are missing in RoomPlan’s output. Although RoomPlan is also
    able to capture furniture, these elements were not used in the geometric
    evaluation or in the daylight simulations. The resulting models can be
    directly used in Grasshopper for daylight simulations, reducing the modeling
    time required by practitioners. To assess the suitability of RoomPlan,
    three office interiors were scanned using a TLS and modeled both manually
    and with an iPhone 12 Pro. The manual models were used as ground truth.
    For each room, a geometric evaluation and a daylight simulation evaluation
    were performed using three model versions: manual, RoomPlan with extruded
    window frames, and RoomPlan without extruded window frames. For both the
    geometrical and the daylight performance evaluation, it is apparent that
    the windows'' frames extrusion is significant to achieve more accurate
    results. Geometric accuracy was evaluated using Chamfer and Hausdorff
    distances, showing good overall accuracy. However, errors were observed
    in wall heights when the ceiling was not clearly visible and in the separation
    of windows located close to each other. The models were used for point-in-time
    grid-based illuminance and view-based luminance simulations in Grasshopper
    using Honeybee. For the illuminance simulations, the MAE is approximately
    269 lux and the MAPE is 19.5%. For DGP, the MAPE is 7.6% for the RoomPlan
    models with extruded window frames, with only one misclassification of
    the DGP category. The results indicate that RoomPlan can be used for visual
    comfort studies but not for daylight availability studies. Despite these
    results, suggestions for further work are given, considering both the
    geometrical and the daylight simulation performance evaluation of the
    RoomPlan models.'
  uuid: 1954f6ce-686c-4686-80d1-37f26ee22d8e
- surname: Joh
  name: Hyeji
  title: Generating synthetic housing distributions for modelling economic
    segregation
  supervisors: Clémentine Cottineau; Hugo Ledoux
  year: 2026
  graduation_date: '2026-07-02'
  link: https://resolver.tudelft.nl/uuid:4a7d373a-f100-483d-9eb2-9e07a392e1e7
  image: 2026_Joh.jpg
  abstract: 'Economic segregation has been studied using various social simulation
    models, including agent-based models. These models, however, typically
    operate on abstract or schematic spatial representations that strip away
    cities’ morphological character- istics, limiting the extent to which
    simulation results can be interpreted as relevant to actual urban contexts.
    This thesis aims to bridge that gap by developing a six- stage hierarchical
    regression-based pipeline that takes a stochastically generated synthetic
    urban structure as input and populates it with household compositions
    and income distributions calibrated on five Dutch cities: Groningen, Den
    Haag, Haarlem, Amersfoort, and Maastricht. Using the Ordinary Least Squares
    method, building type and distance to the city center are identified as
    the primary spatial predictors of household type, building capacity, and
    a residential unit’s floor area, with income dis- tribution following
    household composition. Applied to CityStackGen’s synthetic urban structures,
    the pipeline produces outputs that are internally consistent, stable across
    repeated runs, and demographically plausible at the city level. Cross-city
    scenario generation further demonstrates the pipeline’s utility as a controlled
    analytical tool for socio-spatial experimentation. The findings of this
    research aim to contribute to a method for generating spatially grounded
    synthetic environments that can serve as realistic starting conditions
    for social simulations of economic segregation.'
  uuid: 4a7d373a-f100-483d-9eb2-9e07a392e1e7
- surname: Jonker
  name: Luc
  title: Automated generation of tree-aware urban shade maps using deep learning
  supervisors: Hugo Ledoux; Lukas Beuster
  year: 2026
  graduation_date: '2026-06-23'
  link: https://resolver.tudelft.nl/uuid:d2954f9d-f996-43ae-81f0-a587c34ed715
  image: 2026_Jonker.jpg
  github: https://github.com/lucjonker/Shady_Shenanigans
  abstract: Ever increasing global heat has necessitated more robust urban
    shade analysis in order to keep, among other applications, pedestrians
    safe and comfortable. Specifically, the impacts of shade-trees on the
    urban shade landscape is a topic of growing interest and research, and
    new tools and workflows are being developed in order to allow urban planners
    to have the clearest understanding of how to best provide shade to citizens.
    Geometric shade calculation techniques have been used for some time, but
    they are slow to run at scale and can involve convoluted workflows that
    slow down analysis. Thus, this thesis investigates the applicability of
    deep learning to generate shade rasters. The goal is to see if deep learning
    can allow for faster shade map derivations and a smoother workflow, without
    sacrificing accuracy. Furthermore, it is the first research of its kind
    to consider a purely deep learning based approach in deriving tree-aware
    urban shade maps which capture the contributions of shade trees. This
    thesis presents a Conditional Generative Adversarial Network based off
    of the pix2pix framework, and explores four different combinations of
    input data and how they affect the final model performance. The model
    can produce shade rasters ~25 - 45.5% faster than the geometric approach,
    depending on the parameters used when generating outputs. It also does
    this using less data and less preprocessing than the geometric alternative.
    However, while it produces very convincing rasters in some cases, the
    outputs have insufficient temporal coherence to serve as a reliable alternative
    to the geometric approach. Thus, while it serves as an interesting foundation
    for future research, the model as presented in this report is not sufficient
    to replace geometric shade derivation techniques.
  uuid: d2954f9d-f996-43ae-81f0-a587c34ed715
- surname: Pille
  name: Julia
  title: Seabed Fingerprinting for Maritime Navigation in GNSS-Denied Environments
  supervisors: Robert Voûte; Liangliang Nan; Roderik Lindenbergh
  year: 2026
  graduation_date: '2026-06-18'
  link: https://resolver.tudelft.nl/uuid:3da9ea32-06b5-444a-bca2-5a0ffec282b2
  image: 2026_Pille.jpg
  github: https://github.com/juliapille/SAND-E
  abstract: Maritime navigation relies heavily on Global Navigation Satellite
    Systems (GNSS), yet military surface vessels must remain operational when
    satellite signals are unavailable, degraded, or denied. In such GNSS-denied
    environments, Inertial Navigation Systems (INS) accumulate unbounded drift,
    while existing Terrain-Aided Navigation (TAN) methods remain sensitive
    to terrain distinctiveness and are rarely evaluated for surface vessels.
    We present SAND-E, a particle-filter framework for seabed-aided maritime
    navigation that treats seabed fingerprinting as an image matching problem.
    Near real-time Multibeam Echosounder (MBES) measurements are matched against
    bathymetric reference maps using Normalized Cross-Correlation (NCC), SuperPoint+LightGlue
    (SP+LG), or a combined prior-gated method, and the resulting position
    fixes are fused into the particle filter for recursive state estimation.
    Evaluated on North Sea and Atlantic Ocean bathymetry, NCC outperforms
    SP+LG across all metrics, achieving an RMSE of 92.1 m, a 100% fix rate,
    92.6% of runs within 500 m, and a runtime of 0.5 ms per fix. The combined
    method matches NCC under nominal conditions but provides additional robustness
    with an outdated reference map, where the prior gate rejects degraded
    NCC fixes and falls back to SP+LG. The framework generalizes across three
    geographically distinct test areas, remains viable with a three-year-old
    reference map, and reduces average final position error from Dead Reckoning
    (DR) to 115.3 m, demonstrating seabed fingerprinting as a viable infrastructure-independent
    navigation solution for GNSS-denied military surface vessels.
  uuid: 3da9ea32-06b5-444a-bca2-5a0ffec282b2
- surname: Roorda
  name: Yair
  title: 'Now you see me, now you don''t: Direct LiDAR-Based Intervisibility
    Modeling with Semi-Transparent Vegetation for Military Mission Planning'
  supervisors: Peter van Oosterom; Martijn Meijers; Nick Leenders
  year: 2026
  graduation_date: '2026-06-19'
  link: https://resolver.tudelft.nl/uuid:7602dac0-1b60-4ccd-bf67-e6d40b3e4da7
  image: 2026_Roorda.jpg
  abstract: In modern warfare and airborne operations, such as those carried
    out by drones and helicopters, precise visibility calculations are critical
    to mission success. However, current automated methods for calculating
    line-of-sight (LoS) often rely on simplified gridded, meshed, or voxelized
    2.5D representations and either ignore vegetation's impact or unrealistically
    model it as fully opaque. To address these limitations, this research
    proposes a novel method for calculating fully 3D, non-binary intervisibility
    directly from airborne LiDAR point clouds. The method leverages Cloud
    Optimized Point Cloud (COPC) streaming and k-d tree spatial indexing to
    rapidly query large, remote datasets. Vegetation is automatically segmented
    using the deep learning Myria3D framework. The algorithm computes viewsheds
    by modeling terrain, buildings, and semi-transparent vegetation, resulting
    in a continuous probability score rather than a traditional binary output.
    This is achieved by adapting the Beer-Lambert law to apply exponential
    attenuation along a discrete, volumetric LoS. Finally, the results are
    visualized as 3D spatial volumes or 2D map overlays for practical integration
    into mission planning workflows, such as safe flight height mapping and
    visibility-aware routing. This direct point cloud analysis bridges the
    gap between raw data and high-level spatial decision-making, offering
    a framework for safer, data-driven mission planning.
  uuid: 7602dac0-1b60-4ccd-bf67-e6d40b3e4da7
- surname: Rotteveel
  name: Heiko
  title: Automatic water detection using ICESat-2 measurements
  supervisors: Hugo Ledoux; Maarten Pronk
  year: 2026
  graduation_date: '2026-06-22'
  link: https://resolver.tudelft.nl/uuid:2fd2a861-a1f8-4b64-a02e-17a804b04bc6
  image: 2026_Rotteveel.jpg
  github: https://github.com/HeikoRotteveel/ICESat-2_automatic_water_detection
  abstract: Accurate data on inland water surface elevations are becoming
    increasingly important as climate change intensifies extreme weather events
    worldwide. Classic data collection methods on water are often expensive
    and both spatially and temporally limited, making water data largely concentrated
    in the global north. Ice, Cloud and Land Elevation Satellite 2 (ICESat-2)
    and its advanced Light Detection And Ranging (LiDAR) instrument are, however,
    well-suited for collecting data as it is capable of measuring elevation
    with centimeter-level accuracy across the planet. Its existing inland
    water data products, ATL13 and ATL22 are, however, constrained by their
    reliance on water masks that exclude lakes and reservoirs smaller than
    0.1 km2 and rivers narrower than 50 m. The goal of this thesis is therefore
    to create a Random Forest (RF) model using ICESat-2 data that can predict
    the presence of inland water, specifically for bodies smaller than 25
    m. A set of window-based features that encode the interaction between
    photons and water was derived at multiple window radii. These features
    try to quantify and characterize the presence of afterpulses, bottom reflectances,
    a low slope, a low distribution of photon elevation, and a high photon
    density. The features were identified by first de-correlating all features
    using Ward’s linkage clustering and then selecting the best using a Mean
    Decrease in Impurity (MDI) and permutation importance score. Photon density
    proved to be the best predicting feature, contributing 41.2% of the total
    mean decrease in impurity in the model. The final random forest model
    used a 2.5 m window and was trained on 7 million points from water segments
    smaller than ≤ 25 m and an equal number of land points in the Netherlands.
    The model was evaluated on approximately 520 million ICESat-2 photons
    across the country and achieved a recall above 80.0% for water segments
    longer than 6 m and up to 87.1% for water bodies between 10 m and 25 m.
    Potential improvements of using the features from multiple windows or
    selecting only windows with a minimum number of photons present proved
    to be ineffective in gaining better results. The main sources of misclassifications
    are currently the presence of snow, uncertainty near water edges, and
    incorrect ground truth data. Manually validating results in the Swiss
    Alps, Greenland, and a Mexican mangrove forest showed promising results.
    The RF performs reasonably well outside its training environment, suggesting
    that the model identified general photon-water interactions rather than
    region-specific characteristics. Future work should focus on expanding
    the training dataset to include geographically diverse data to improve
    performance and combining the classified photons using clustering to create
    line segments of water surface elevation.
  uuid: 2fd2a861-a1f8-4b64-a02e-17a804b04bc6
- surname: Schlosser
  name: Daan
  title: Investigation on the data model requirements for Building Renovation
    Passports
  supervisors: Giorgio Agugiaro; Hiba Doi
  year: 2026
  graduation_date: '2026-06-15'
  link: https://resolver.tudelft.nl/uuid:fe05529d-fe1c-49e4-8d98-1a0acb2bfa93
  image: 2026_Schlosser.jpg
  github: https://github.com/DaanSchlosser/CityGML2.0-EnergyADE3.0_creator
  abstract: 'Reaching the European Union’s 2050 climate targets depends on
    renovating a building stock that accounts for roughly 40% of EU energy
    use and 36% of energy-related greenhouse-gas emissions. Renovation is
    a staged, multi-year process that the Energy Performance Certificate,
    a single-point-in-time snapshot, cannot guide on its own. The recast Energy
    Performance of Buildings Directive answers this with two complementary
    instruments. The Digital Building Logbook is a repository for building
    data across the life cycle, and the Building Renovation Passport (BRP)
    is a stepwise renovation roadmap that draws on that data. Both depend
    on a data model that defines what building data is relevant and stores
    it in a reusable form. The data models proposed by existing BRP and logbook
    initiatives are mostly closed, or specified only as semi-structured Excel,
    so their coverage and completeness cannot be assessed and each new implementation
    starts its data modelling from scratch. An open, formally specified geospatial
    data model for urban energy modelling already exists adjacent to this
    use case, the OGC City Geography Markup Language (CityGML) paired with
    its Energy Application Domain Extension (Energy ADE). Whether it is sufficient
    as a BRP data model has not been tested. This thesis tests it. It first
    synthesises a Minimum Set of Required Data (MSRD) from 14 existing and
    proposed European initiatives, distilling their recurring fields through
    an explicit relevance filter into a reference set of attributes a BRP
    needs. It then assesses how much of that MSRD the CityGML 2.0 + Energy
    ADE 3.0 (beta 8) data model can carry, mapping the set field by field,
    and tests the mapping at two scales on real Dutch building-stock data.
    The first is an audit-depth test on a single owner-occupier dwelling.
    The second is a city-scale breadth test on an entire municipality populated
    from open government sources (BAG, 3DBAG, EP-Online, and CBS statistics).
    The MSRD comprises 276 fields, organised into 13 modules and 3 layers.
    The current CityGML + Energy ADE 3.0 (beta 8) data model covers roughly
    95% of it, 262 of the 276 fields, with coverage complete for 8 of the
    13 modules, including the entire assessment layer. The 14 uncovered fields
    are localised rather than spread across the model, most of them concentrated
    in the renovation-advice module, the staged roadmap that is the BRP’s
    defining feature, where coverage falls to 73%. The two-scale implementation
    confirms that the mapping holds under real data: the schema produced XSD-valid
    output from the single audited dwelling up to roughly 94,000 buildings
    without structural failure. Bringing the Dutch open-data sources together
    in one model also did more than confirm fit. It made the data-quality
    problems of that stock visible and tractable, exposing patterns that the
    source datasets, read apart, do not reveal, and it located the situations
    the model carries only partially. The CityGML + Energy ADE pairing is
    therefore a meaningful, strong, and near-complete starting point for a
    BRP data model, with the gaps localised rather than structural. The contribution
    is to show that an open, formally specified data model already covers
    most of what a BRP needs, to name precisely where it does not, and to
    consolidate the targeted extensions that would close those gaps as input
    to the further development of the Energy ADE. The MSRD and the two-scale
    test pipeline are released openly. https://doi.org/10.5281/zenodo.20669526
    https://github.com/DaanSchlosser/CityGML2.0-EnergyADE3.0_creator https://doi.org/10.4121/89f8909b-4473-4958-8f93-46b55546764d'
  uuid: fe05529d-fe1c-49e4-8d98-1a0acb2bfa93
- surname: Singh
  name: Neelabh
  title: Identifying Sidewalks from Crowdsourced SVI
  supervisors: Hugo Ledoux; Lukas Beuster
  year: 2026
  graduation_date: '2026-06-23'
  link: https://resolver.tudelft.nl/uuid:47f57012-2d9b-4bca-8d72-c31ffd2db163
  image: 2026_Singh.jpg
  github: https://github.com/neelabhz/pixel2sidewalk/
  abstract: Sidewalks are fundamental urban infrastructure, yet large-scale,
    openly available geospatial sidewalk datasets remain scarce worldwide,
    hindering pedestrian routing, accessibility analysis, and urban planning
    applications. This thesis investigates the feasibility of transforming
    crowdsourced street view imagery from Mapillary into structured georeferenced
    sidewalk data using only openly licensed data and pre-trained models.
    Two complementary automated pipelines are developed and evaluated across
    three study areas in Amsterdam (Netherlands) and Boston (United States).
    The first pipeline, Sidewalk Inventory Mapping, constructs a binary presence
    inventory (yes/no per roadside) by aggregating pre-computed semantic segmentation
    outputs and SfM-corrected camera metadata from the Mapillary API onto
    the OpenStreetMap road network, without any local model inference. The
    second pipeline, Sidewalk Geometry Reconstruction, downloads imagery and
    processes it locally using a vision foundation model (DINOv3) for semantic
    segmentation and monocular metric depth estimation (Depth Anything V3)
    to reconstruct sidewalk polygons and centerlines. Results demonstrate
    that the inventory pipeline achieves algorithmic precision of 97.2% to
    98.6% and algorithmic recall up to 86.5%, providing highly reliable sidewalk
    detection where imagery exists. The geometry reconstruction pipeline successfully
    produces sidewalk polygons but with limited spatial accuracy (IoU 0.100–0.329,
    width MAE 1.18–1.40 m), resulting from cascading errors in segmentation,
    depth estimation, and GPS positioning. Both pipelines are fundamentally
    bounded by Mapillary's spatial coverage, with system recall dropping substantially
    in areas lacking imagery. The inventory approach emerges as the practical,
    scalable solution for city-wide deployment, while the geometry reconstruction
    demonstrates technical feasibility but requires further refinement for
    production use. All outputs are compatible with open data standards and
    can support OpenStreetMap enrichment workflows.
  uuid: 47f57012-2d9b-4bca-8d72-c31ffd2db163
- surname: Teo
  name: Mingjie
  title: IndoorGML-Constrained Navigation Across Multiple 3D Gaussian Splatting
    Scenes for Indoor Environments
  supervisors: Edward Verbree; Martijn Meijers
  year: 2026
  graduation_date: '2026-06-22'
  link: https://resolver.tudelft.nl/uuid:6d044e6b-20e2-4329-8fe5-709a7064bb5a
  image: 2026_Teo.jpg
  abstract: '3D Gaussian Splatting (3DGS) has emerged as a compelling method
    for scene reconstruction by producing compact, photorealistic representations
    of physical environments in real-time. Its application to indoor spaces,
    however, introduces a fundamental challenge: reconstructing a multi-room
    building as a single coherent scene is undermined by the frequent occlusions
    that walls introduce, degrading the sparse reconstruction on which 3DGS
    training depends. Per-room reconstruction sidesteps this problem but produces
    a set of independent scenes in arbitrary coordinate frames that have no
    shared spatial reference. This paper presents a pipeline that addresses
    these challenges by integrating IndoorGML''s topological model as the
    organisational backbone for multiple independently reconstructed 3DGS
    scenes. The pipeline proceeds in four stages. First, per-room 3DGS scenes
    are reconstructed using Structure from Motion (SfM) and Gaussian training
    from video-captured image sets. Second, an Umeyama similarity transformation
    is estimated for each room between its (SfM) coordinate frame and a shared
    architectural floor plan reference, simultaneously resolving scale ambiguity
    and establishing a common metric coordinate system across all scenes.
    Third, the IndoorGML model is supplemented with additional attributes,
    and ingested into a PostGIS database that preserves the Cell–Node-Edge
    topological structure of the original schema. Fourth, a web-based viewer
    queries this database at runtime to enforce geometrically derived navigation
    constraints within each room, and to trigger topologically-guided transitions
    between rooms as the user crosses door boundaries. The pipeline is demonstrated
    on three adjacent rooms at the Faculty of Architecture and the Built Environment,
    of the Delft University of Technology. The site comprises two lecture
    halls and a corridor space. The prototype achieves sustained real-time
    rendering performance above 60 frames per second on consumer-grade hardware,
    with navigation constraints successfully preventing the camera from reaching
    scene regions outside the training range. The results confirm that IndoorGML''s
    topological model, when extended to reference 3DGS scene data and spatial
    transforms, provides a strong framework for multi-scene indoor navigation.'
  uuid: 6d044e6b-20e2-4329-8fe5-709a7064bb5a
- surname: van Blokland
  name: Lars
  title: Air temperature estimation through thermal satellite imagery using
    uncertainty-integrated transformers
  supervisors: Azarakhsh Rafiee; Roderik Lindenbergh
  year: 2026
  graduation_date: '2026-06-23'
  link: https://resolver.tudelft.nl/uuid:dd91471f-e3a5-4c71-94d9-1162ee7ac0ae
  image: 2026_van-Blokland.jpg
  abstract: Accurate estimates for air temperatures in urban environments
    can help with timely and precise action against the urban heat island
    (UHI) effect. Uncertainty-aware spatio-temporal transformers are an ideal
    candidate model for producing such predictions. This study details the
    implementation and testing of a transformer model that combines remotely
    sensed land surface temperature (LST) data with in-situ sensor readings
    to predict air temperature values for the entirety of the Netherlands.
    The three best models out of the 21 trained attained an averaged test-set
    error of 1.365° Celsius MAE. Model inference has produced Geotiffs of
    air temperature and uncertainty predictions for all of the Netherlands,
    at a 70m by 70m pixel resolution. NASA's ECOSTRESS dataset supplied LST
    imagery and assorted ancillary bands, ESA's Copernicus provided NDVI and
    Landcover data, and sensor readings were acquired from the royal Dutch
    weather service (KNMI). Overall this study details the design for a spatio-temporal
    transformer model that produces uncertainty-aware air temperature estimations.
  uuid: dd91471f-e3a5-4c71-94d9-1162ee7ac0ae
- surname: Vanderheeren
  name: Vincent
  title: Pillar of Morphology – Enhancing point-based mathematical morphology
    for applications in heritage point clouds
  supervisors: Martijn Meijers; Ken Arroyo Ohori
  year: 2026
  graduation_date: '2026-06-16'
  link: https://resolver.tudelft.nl/uuid:1d9c45bd-1bac-4dbc-8fbf-0218dfba1d3c
  image: 2026_Vanderheeren.jpg
  github: https://github.com/Alcardens/Mathematical-morphology-point-cloud
  abstract: 'Heritage point clouds are an increasingly common tool used in
    the conservation and documentation of cultural assets. Yet, their geometric
    complexity, uniqueness, and scale make automated processing using machine
    learning or deep learning difficult. Mathematical morphology offers an
    alternative using geometric assumptions in the form of a structuring element,
    requiring no training data and remaining interpretable. This thesis extends
    the point-based mathematical morphology algorithms proposed by Balado
    et al. (2020) to make them useful for real-world heritage point cloud
    processing. The original algorithms are optimized using a parallel implementation
    on the GPU in the form of compute shaders, reducing the time complexity
    of both erosion and dilation to O(n) and achieving a speedup of approximately
    100x over the sequential baseline. Four extensions to the algorithms are
    created: a continuous erosion score replacing the binary output, orientation-aware
    operations using TNB matrix rotation with both a predetermined and a brute-force
    variant, density-aware structuring elements in discrete and continuous
    forms, and a set of helper functions enabling compound morphological operations.
    These contributions are evaluated on three heritage applications. Segmentation
    using sequential morphological opening and hit-or-miss transform achieves
    a mIoU of 0.623 and an overall accuracy of 0.813 on the Images&PointClouds
    Cultural Heritage Dataset without parameter optimization. Object detection
    achieves F1 scores above 0.920 on the Fontana dei Mesi dataset. Gap filling
    via morphological closing performs well locally but is sensitive to the
    geometric complexity of the scene when applied globally, with edge detection
    and template matching providing more consistent results. The results show
    that point-based mathematical morphology, when extended with the contributions
    of this thesis, is a practical and effective tool for heritage point cloud
    processing that does not require annotated training data.'
  uuid: 1d9c45bd-1bac-4dbc-8fbf-0218dfba1d3c
- surname: Wang
  name: Sue
  title: From IFC BIM to Semantically Enriched 2.5D Indoor Navigation Graphs
    for Congestion-Aware Pedestrian Simulation
  supervisors: Ken Arroyo Ohori; Martijn Meijers
  year: 2026
  graduation_date: '2026-06-09'
  link: https://resolver.tudelft.nl/uuid:ba9ea5f6-abdf-44e4-8a6f-cb50bdf804f2
  image: 2026_Wang.jpg
  github: https://github.com/tudelftgeomatics/tud-thesis-showcase
  abstract: 'Indoor navigation in complex public buildings requires more than
    geometric shortest-path routing. In multi-level station environments,
    pedestrian movement is shaped by vertical connectors, access-control elements,
    semantic origin–destination regions, congestion, and heterogeneous walking
    behaviour. Although Industry Foundation Classes (IFC) Building Information
    Modeling (BIM) provides rich geometric and semantic information about
    building elements, it is not directly usable as a navigation or pedestrian
    simulation model. This thesis develops and evaluates a reproducible workflow
    for transforming IFC BIM data into a semantically enriched 2.5D indoor
    navigation graph for congestion-aware pedestrian routing and simulation.
    The workflow interprets movement-relevant IFC semantics, extracts floor-based
    walkable layers, samples valid graph nodes, filters obstacles and restricted
    areas, and models vertical connectors and access-control elements as semantic
    graph components. The resulting graph is used as the movement substrate
    for graph-based routing and agent-based pedestrian simulation. The workflow
    is first checked on a simplified two-floor pilot model and subsequently
    applied to Dadongmen Station of Hefei Metro Line 1. The final default
    station graph contains 18,454 nodes and 134,852 edges across three public
    movement levels. Six experiments evaluate static routing, congestion-aware
    replanning, pedestrian-profile effects, mixed-agent behaviour, algorithm-threshold
    sensitivity, and demand-load response. The results show that congestion-aware
    replanning reduces waiting time and peak queue length, although it may
    increase mean travel time because agents use longer alternative routes.
    Elderly agents experience substantially higher travel and waiting burdens
    than normal agents. A sparse graph variant remains routable but produces
    larger queues and earlier demand-load degradation. The findings demonstrate
    that graph connectivity alone is insufficient: indoor navigation graphs
    should also be evaluated through movement-performance metrics. The results
    represent controlled methodological validation rather than calibrated
    operational passenger-flow prediction.'
  uuid: ba9ea5f6-abdf-44e4-8a6f-cb50bdf804f2
- surname: Wu
  name: Jiaoyang
  title: Detecting building element/material through ground-based thermal
    imagery using Deep Neural Networks approach
  supervisors: Azarakhsh Rafiee; Regina Bokel
  year: 2026
  graduation_date: '2026-06-23'
  link: https://resolver.tudelft.nl/uuid:4504aec1-8cb9-4945-90eb-d5f6e9a1d5fd
  image: 2026_Wu.jpg
  abstract: Building material identification plays an important role in applications
    such as sustainable building assessment, facade inspection, energy efficiency
    analysis, and urban environmental studies. Traditional material identification
    approaches mainly rely on optical imagery or geometric information, which
    are often limited in capturing the thermophysical characteristics of facade
    materials. Thermal imagery provides additional information related to
    heat transfer behavior, emissivity, and thermal inertia, offering an alternative
    perspective for building material analysis. This thesis investigates the
    use of spatio-temporal thermal imagery combined with a Convolutional Long
    Short-Term Memory (Convolutional Long Short-Term Memory (ConvLSTM))- based
    deep learning framework for pixel-level building material classification.
    Groundbased thermal image sequences of building facades were collected
    under different environmental and temporal conditions using a thermal
    camera. Building materials including glass, concrete, and brick were manually
    annotated through Red Green Blue (RGB) imagery and Segment Anything Model
    (SAM)-assisted segmentation. Image registration techniques were subsequently
    applied to align the RGB and thermal image sequences, enabling the transfer
    of material labels into the thermal domain. A ConvLSTM-based semantic
    segmentation model was developed to capture both spatial thermal distributions
    and temporal thermal dynamics from sequential thermal imagery. Different
    dataset splitting strategies and temporal datasets were evaluated to investigate
    the influence of spatial generalization and temporal variation on classification
    performance. The experimental results demonstrate that spatio-temporal
    thermal sequences provide meaningful discriminative information for building
    material classification. Under the random sequence-level split strategy,
    the proposed framework achieved a mean F1-score of approximately 0.686
    and a mean Intersection over Union (IoU) of approximately 0.524 across
    the evaluated material classes. The results indicate that temporal thermal
    behavior significantly contributes to distinguishing facade materials.
    Brick surfaces exhibited relatively stable and spatially uniform thermal
    characteristics, while glass surfaces demonstrated stronger temporal variation
    and environmental sensitivity. Concrete exhibited intermediate thermal
    behavior, making it comparatively more difficult to classify. The findings
    suggest that incorporating temporal thermal information improves segmentation
    performance compared with single-frame thermal analysis.
  uuid: 4504aec1-8cb9-4945-90eb-d5f6e9a1d5fd
- surname: Ye
  name: Hongyu
  title: 'LiDAR-TreeRisk: A transferable, LiDAR-driven framework for storm-event
    risk of wind damage to individual urban trees'
  supervisors: Azarakhsh Rafiee; Xuanchen Zhou
  year: 2026
  graduation_date: '2026-06-23'
  link: https://resolver.tudelft.nl/uuid:7c6cabb3-a5a9-43d4-b710-75ed3075b4c3
  image: 2026_Ye.jpg
  abstract: Urban trees deliver ecosystem services until extreme winds turn
    them into hazards, and municipal managers need a defensible, decision-relevant
    risk label for the individual tree during real storm events. The mature
    mechanistic route to tree-level critical wind speed comes from forestry,
    but it embeds closed-canopy stand-context priors, and existing computational
    fluid dynamics (CFD)–mechanistic urban hybrids neither neutralise those
    priors nor drive both branches from one per-tree geometry, reporting a
    continuous score rather than an actionable label. We present a transferable,
    per-tree framework, applied to The Hague under the Storm Poly wind event
    of 5 July 2023. A single airborne-LiDAR-derived per-tree geometry is carried
    coherently into both a direction-resolved urban CFD exposure field, in
    which each crown is an alpha-wrapped porous zone, and a ForestGALES turning-moment-coefficient
    resistance core whose forest-stand priors are neutralised at the coupling
    interface; risk is expressed as a four-class, directional-and-gust operational
    taxonomy. We find that which trees are operationally at risk is governed
    by directional urban exposure and event loading rather than by median
    resistance. Exposure explains the large majority of the between-tree risk
    variance, structural capacity acts as a secondary filter, and the at-risk
    trees concentrate in the low-rise residential district. Results show that
    the labels are stable under moderate analyst choices and qualitatively
    consistent with the reported storm damage at the district scale, providing
    a transferable route from open, city-scale data to a per-tree risk label.
  uuid: 7c6cabb3-a5a9-43d4-b710-75ed3075b4c3
- surname: Alting
  name: Noah
  title: 'From point clouds to porous crowns: A scalable approach for CFD-ready
    urban tree reconstruction'
  supervisors: Hugo Ledoux; Clara García Sánchez
  year: 2025
  graduation_date: '2025-10-31'
  link: https://resolver.tudelft.nl/uuid:adc9c299-b8f7-4854-b004-dcf2393d06fb
  image: 2025_Alting.jpg
  github: https://github.com/NoahAlting/CFTree
  abstract: Urban climate simulations increasingly rely on digital twins of
    cities, yet vegetation remains largely absent or oversimplified despite
    its strong influence on wind flow and heat exchange. Existing lidar-based
    tree studies mainly target forests or small plots, and no scalable method
    currently exists to reconstruct detailed urban trees for computational
    fluid dynamics (CFD) analysis. This thesis presents a scalable, automated
    pipeline for reconstructing CFD-ready urban tree models from open-access
    airborne lidar. The workflow operates directly on unstructured point clouds
    and comprises three main components. The first introduces the High-Order
    Multi-Echo Density (HOMED) vegetation filter, a new approach for distinguishing
    vegetation from non-vegetation in airborne lidar point clouds. Combined
    with TreeSeparation, a cuboid-based tree instance segmentation algorithm,
    it produces clean per-tree clusters for subsequent analysis. The second
    explores taxonomy-based classification to assess structural separability
    between species. The third abstracts each segmented point cloud into CFD-suitable
    crown and trunk geometries and derives per-tree volumetric porosity values,
    ensuring watertightness, manifoldness, and controlled mesh complexity.
    Designed to be dataset-agnostic, the pipeline generalises to any comparable
    airborne laser scanning data. The workflow was applied to several major
    Dutch cities—Amsterdam, Rotterdam, Utrecht, and Delft—processing hundreds
    of thousands of trees from raw point clouds to 3D models within practical
    runtimes (≈ 13 hours for Amsterdam on 16 CPU cores). Segmentation and
    reconstruction proved robust and consistent, yielding α-wrapped crowns,
    cylindrical trunk approximations, and physically meaningful porosity estimates.
    Taxonomic classification, however, was unreliable due to label noise,
    class imbalance, and limited structural separability in lidar-only data;
    supplementary optical features from RGB and infrared imagery were evaluated
    but proved unreliable for consistent integration. The results demonstrate
    that the pipeline enables scalable reconstruction of CFD-ready tree models
    that preserve canopy structure and aerodynamic properties, allowing their
    explicit representation in urban digital twins and supporting more realistic
    urban climate simulations.
  uuid: adc9c299-b8f7-4854-b004-dcf2393d06fb
- surname: Andinasari
  name: Citra
  title: Point Cloud for 3D Land Administration System (LAS)
  supervisors: Peter van Oosterom; Edward Verbree
  year: 2025
  graduation_date: '2025-07-02'
  link: https://resolver.tudelft.nl/uuid:ee07157a-8774-4340-bb71-417894b243e7
  image: 2025_Andinasari.jpg
  abstract: 'As cities grow denser and more and more in vertical directions,
    Land Administration Systems (LAS) must evolve to represent complex, multi-level
    property ownership, particularly in apartment buildings. While Building
    Information Models (BIM) are commonly used for 3D representation, their
    availability remains limited for many buildings. This research explores
    the use of point clouds as an alternative means to represent 3D spatial
    units in LAS, focusing on the integration of cadastral floor plans and
    the airborne Lidar point cloud datasets (in our case Actueel Hoogtebestand
    Nederland (AHN)). Three apartment cadastral drawings from different years
    in Rotterdam serve as case studies. The proposed methodology involves
    five main steps: (1) parsing the scanned image of the floor plans using
    image processing to extract cadastral room boundary polygons; (2) segmenting
    AHN point cloud; (3) generating synthetic point clouds by extruding floor
    plan polygons and aligning them with AHN; (4) storing these 3D spatial
    units in a PostgreSQLbased database following the ISO 19152:2024 Land
    Administration Domain Model (LADM); and (5) developing a web-based 3D
    LAS using Vue.js, Cesium, and FastAPI for visualization and interaction.
    Results show that unit boundaries can be extracted from cadastral drawings
    and converted into 3D point clouds for integration into a cadastral database.
    The synthetic point clouds include room-level attributes and spatial identifiers,
    enabling interactive visualization and LADM information through a web
    interface that can be accessed by the public and stakeholders. However,
    challenges such as misalignment due to occlusion in AHN data and inconsistent
    quality in older floor plan drawings affect the accuracy and automation
    of the process. This research demonstrates that point clouds can effectively
    serve as final 3D representations in land administration, providing a
    scalable solution in the absence of BIM models and minimizing the need
    for additional field surveys. It also enables a seamless integration with
    AHN, offering a representation of real-world features such as building
    facades, walls, and fences, which often delineate cadastral boundaries.
    The code for this project is available in GitHub, while the website can
    be accessed in gist.bk.tudelft.nl/apps/LADMPointCloud/.'
  uuid: ee07157a-8774-4340-bb71-417894b243e7
- surname: Auliyaa Bainus
  name: Der Derian
  title: Harmonisation of Heterogeneous Point Cloud Using Road Marking as
    Benchmark
  supervisors: Daan van der Heide; Jantien Stoter
  year: 2025
  graduation_date: '2025-06-17'
  link: https://resolver.tudelft.nl/uuid:44ccce83-5095-4fc1-a36d-04a2630e391e
  image: 2025_Auliyaa-Bainus.jpg
  abstract: Accurate alignment of heterogeneous LiDAR point clouds is important
    for producing high-quality elevation data. This process, known as harmonisation,
    corrects spatial discrepancies between overlapping datasets collected
    at different times or using different sensors. A key step in harmonisation
    is the use of reliable benchmarks, which are features that are clearly
    detectable in both datasets, to guide the alignment. While artificial
    targets have been traditionally used as such benchmarks, their deployment
    is costly and impractical for large-scale or uncoordinated surveys. Consequently,
    there is growing interest in extracting natural or man-made features directly
    from LiDAR data to serve as benchmarks. Road markings have recently been
    proposed as an alternative benchmark due to their consistent visibility
    in LiDAR point clouds, particularly through intensity value. As part of
    the Integrale Hoogtevoorziening Nederland (IHN) initiative, road markings
    are being explored as benchmarks for national point cloud alignment. However,
    the performance of the road markings as a co-registration benchmark has
    not been well researched yet. This research investigates how the accuracy
    of automatically extracted road markings affects the quality of point
    cloud alignment. It builds upon an adaptive extraction method that adjusts
    intensity thresholds to suit different datasets and applies geometric
    filtering to generate 3D line representations of road markings. These
    extracted features are used to align heterogeneous LiDAR point clouds,
    and their performance is evaluated against manually digitised road markings
    to assess how extraction quality influences alignment accuracy. To support
    this evaluation, a RANSAC-weighted centroid alignment approach is proposed,
    which uses the inlier count of each correspondence as a weight during
    transformation estimation, aiming to prioritise geometrically stable benchmarks
    in the alignment process. The results show that alignment accuracy is
    influenced by the extraction quality and distribution of road markings.
    When fewer road markings are available, especially in datasets with larger
    time gaps due to environmental changes, the spatial distribution has a
    higher chance of becoming uneven, leading to transformation errors. These
    errors grow with distance from the benchmark area, increasing alignment
    inaccuracies across the dataset.
  uuid: 44ccce83-5095-4fc1-a36d-04a2630e391e
- surname: Baba
  name: Hidemichi
  title: 'FlatCityBuf: A new cloud-optimised CityJSON format'
  supervisors: Hugo Ledoux; Ravi Peters
  year: 2025
  graduation_date: '2025-06-18'
  link: https://resolver.tudelft.nl/uuid:6727c979-5e46-4fe0-9349-a7803e825d02
  image: 2025_Baba.jpg
  github: https://github.com/HideBa/flatcitybuf
  abstract: Standardising data formats for 3D city models is crucial for semantically
    storing real-world information as permanent records. CityJSON is a widely
    adopted OGC standard format for this purpose, and its variant, CityJSON
    Text Sequences, decomposes large city objects into line-separated objects
    to enable streaming processing of 3D city model data. However, the shift
    towards cloud-native environments and the increasing demand for handling
    massive datasets necessitate more efficient data processing methods across
    different platforms and on the web. While cloud-optimised data formats
    such as PMTiles, FlatGeoBuf, Mapbox Vector Tiles have been proposed for
    vector and raster data, options for 3D city models remain limited. This
    research aims to explore optimised data formats for CityJSON tailored
    for cloud-native processing and evaluate their performance and use cases.
    Specifically, the study implements FlatBuffers for CityJSON, incorporating
    features like spatial indexing, spatial sorting, indexing with attribute
    values, and partial fetching via HTTP Range requests. The methodology
    includes designing a complete binary representation of the CityJSON standard
    using FlatBuffers, conducting a comprehensive review of existing performance-optimised
    formats, and benchmarking their performance. Successful implementation
    of this research will enable end-users to download arbitrary extents of
    3D city models efficiently. The research demonstrates that FlatCityBuf
    achieves superior read performance compared to CityJSONSeq while generally
    producing smaller file sizes. The approach successfully encoded the entire
    Netherlands dataset into a single 70GB file containing both spatial and
    attribute indices, demonstrating scalability for national-scale applications.
    For developers, the optimised format enables single-file containment of
    entire areas of interest, simplification of serverless cloud architecture,
    and accelerated processing by software applications. Ultimately, this
    work improves the scalability and usability of 3D city models in cloud
    environments, supporting advanced urban planning and smart city initiatives.
  uuid: 6727c979-5e46-4fe0-9349-a7803e825d02
- surname: Bhatt
  name: Vidushi
  title: Geospatial Analytics from IoT ecosystem in Built spaces
  supervisors: Azarakhsh Rafiee; Justin Schembri
  year: 2025
  graduation_date: '2025-10-28'
  link: https://www.gdmc.nl/publications/2025/MScThesisVidushiBhatt.pdf
  image: 2025_Bhatt.jpg
- surname: Boertjes
  name: Lars
  title: Selective image region focus for efficient 3D building reconstruction
    using SAM in oblique aerial imagery
  supervisors: Azarakhsh Rafiee; Ken Arroyo Ohori
  year: 2025
  graduation_date: '2025-06-17'
  link: https://resolver.tudelft.nl/uuid:4384b354-6a98-46b3-a330-f1281cda3090
  image: 2025_Boertjes.jpg
  abstract: High-quality 3D mesh models are increasingly used in urban applications
    ranging from planning and simulation to environmental monitoring. While
    aerial imagery provides a practical balance between resolution and coverage,
    conventional Structure from Motion (SfM) and Multi-View Stereo (MVS) pipelines
    apply uniform processing to all image regions, often overlooking their
    geometric relevance. This research investigates whether reconstruction
    efficiency can be improved by selectively focusing dense matching efforts
    on image regions most critical to mesh quality. We explore the use of
    the Segment Anything Model (SAM) to guide dense matching in oblique aerial
    imagery, applying it for building-level segmentation and importance estimation
    via entropy and edge-based scoring. Initially, we tested SAM for sparse
    reconstruction guidance but encountered poor performance. We then shifted
    to evaluating whether SAMderived importance maps could enable region-aware
    thresholding to improve mesh reconstruction. These methods were benchmarked
    against a simpler Canny edge-based distance approach across varying thresholds
    and scenes. Results show that SAM-based methods can reduce memory usage
    while maintaining mesh quality at low to moderate thresholds (up to 0.4).
    However, contrary to expectations, Canny edge detection consistently outperformed
    SAM across most quality and efficiency metrics, offering better spatial
    coverage, lower computational overhead, and more stable performance. While
    SAM-based thresholding led to file size reductions of up to 16% and marginal
    runtime gains during dense matching ( 2.3%), these were offset by the
    costly preprocessing pipeline required to generate segmentation masks
    and importance maps. Overall, this thesis contributes an evaluation pipeline
    for image region-specific reconstruction strategies and highlights that
    while SAM shows potential for memory-efficient modeling, simpler methods
    like Canny edge detection may offer better trade-offs for scalable, time-sensitive
    workflows. Future research should focus on faster importance estimation
    techniques and pipeline adaptation for more complex, city-scale datasets.
  uuid: 4384b354-6a98-46b3-a330-f1281cda3090
- surname: Chandran
  name: Aswathy
  title: 'Proposal for the integration of a Building Material part: (ISO 19152-7)
    within the Land Administration Domain Model'
  supervisors: Peter van Oosterom; Wilko Quak
  year: 2025
  graduation_date: '2025-03-12'
  link: https://resolver.tudelft.nl/uuid:ccbbc7d1-65d8-42b1-a542-f007961bb28b
  image: 2025_Chandran.jpg
  abstract: The growing global consumption of non-renewable resources is a
    significant societal concern. The shortage of primary raw materials and
    the decreasing availability of space for final waste disposal present
    an alarming situation. Improperly assigning materials to their recycling
    potential often results in high-potential materials being downgraded to
    lower potential uses. Transitioning to a Circular Economy, as proposed
    by the European Union (EU), offers an effective solution to this problem.
    A Circular Economy is an economic system designed from societal production
    and consumption patterns that maximizes the services derived from the
    linear flow of materials and energy between nature and society. It achieves
    this by utilizing cyclical material flows, renewable energy sources, and
    cascading energy flows. To ensure materials remain available and fully
    utilized over time, they must be documented and registered while in use.
    The EU has proposed a Materials Passports for buildings which is an electronic
    set of data and evaluates the recycling potential and environmental impact
    of materials embedded in buildings. Land administration is the process
    of efficient management of land and its associated information, facilitating
    communication among various stakeholders both within one country and internationally.
    In this research, land administration is utilized because ownership information
    from the land administration can be applied to the registration of building
    materials. It also provides data on location and distance details. The
    registration methods used in land administration are well-suited to the
    concept of a materials passports. Hence, this research combines the concepts
    of Circular Economy and Land Administration. The Land Administration Domain
    Model, LADM ISO19152–6 edition II contains six parts- Conceptual Model,
    Land Registration, Marine Georegulation, Valuation Information, Spatial
    Plan Information and Implementation. Building Materials registration has
    a lot of links to the Land Administration, like owner, valuation. Introducing
    the ”Building Materials ISO 19152-7” standard can significantly contribute
    to the Land Administration Domain Model (LADM). It allows building materials
    registration to be aligned with (inter)national standards, ensuring consistency
    and improving the overall quality and reliability of land and property
    management. The main contribution of this study lies in evaluating the
    application of Building Materials and establishing a standardized Materials
    Passports, including its basic requirements and conceptual information
    model. This research identifies and explores the connections between the
    Materials Passports and its integration with the core LADM creating a
    multipurpose harmonized information model.
  uuid: ccbbc7d1-65d8-42b1-a542-f007961bb28b
- surname: Cheng
  name: Hsin-Yu
  title: Roof Structure Extraction from Remote Sensing Images
  supervisors: Liangliang Nan; Weixiao Gao
  year: 2025
  graduation_date: '2025-06-19'
  link: https://resolver.tudelft.nl/uuid:4a31d2f4-1615-4afb-a2d8-a9cbfd1530b2
  image: 2025_Cheng.jpg
  github: https://github.com/appleadele/Roof-Structure-Extraction-from-Remote-Sensing-Images.git
  abstract: 'This thesis presents a method for extracting structured roof
    surfaces from remote sensing images. It achieved this by combining semantic
    segmentation with polygon-based refinement, which allows rooftop boundaries
    to be described more accurately using line and shape information. The
    method includes three main stages: (1) using an instance segmentation
    model to detect and classify rooftop areas; (2) generating polygonal candidates
    for plannar roof regions based on detected line features; and (3) optimizing
    label assignments through a Markov Random Field (MRF) model, which integrates
    prediction confidence with the spatial relationships between polygons.
    Experiments on benchmark datasets show that this approach improves the
    accuracy and consistency of rooftop segmentation while reducing incorrect
    detections. The system is modular and flexible, making it suitable for
    applications that require reliable roof structure analysis in urban environments.'
  uuid: 4a31d2f4-1615-4afb-a2d8-a9cbfd1530b2
- surname: Chontos
  name: Christos
  title: The effect of building footprint uncertainty on CFD simulations
  supervisors: Clara García Sánchez; Akshay Patil
  year: 2025
  graduation_date: '2025-06-23'
  link: https://resolver.tudelft.nl/uuid:423f2ae2-6bb0-403f-875e-781194f87d46
  image: 2025_Chontos.jpg
  abstract: While reconstructing urban environments, the accuracy of the model
    is strongly related to the quality of the input data. The initial type
    of input data for this process could be the footprints of the buildings,
    which are typically used to reconstruct the buildings, either through
    manual or automated methods. However, these data could be biased, and
    when we perform a Computational fluid dynamics (CFD) simulation, they
    could impact our results. An example of such bias could be either translation
    or rotation. In our case, simple building footprints were used to define
    these biases associated with the uncertainty of raw data. Additionally,
    statistical analysis for representing and quantifying this uncertainty
    was performed. The Case C dataset from the Architectural Institute of
    Japan (AIJ) is an example of a canonical case for our simulations, in
    which the building footprints could play an important role in the calculation
    of our results. A CFD simulation on such a canonical case would typically
    involve the steps of preparing the geometry, generating the mesh, setting
    boundary and initial conditions, validating the results using experimental
    data and finally, performing uncertainty analysis. The last step involves
    various ways of representing the results, like scatter plots, box plots
    and contour plots. Important aspects of this analysis were the visualization
    of the flow patterns, the calculation of various quantities of interest
    such as velocity or turbulent kinetic energy, and the comparison of the
    simulation results with the experimental data from the AIJ dataset. The
    effects were examined across multiple wind directions and different footprint
    uncertainties. This approach could help us to improve the accuracy and
    reliability of the CFD simulations.
  uuid: 423f2ae2-6bb0-403f-875e-781194f87d46
  needs_review: true
- surname: de Niet
  name: Lotte
  title: Reconstructing legal 3D apartment models from 2D division drawings
  supervisors: Jantien Stoter; Amir Hakim
  year: 2025
  graduation_date: '2025-06-17'
  link: https://resolver.tudelft.nl/uuid:aae7672b-ffd7-4656-a81a-8c4134f0b197
  image: 2025_de-Niet.jpg
  github: https://github.com/lottedeniet/Thesis_reconstructing_3D_BIM_Legal_models
  abstract: The continued growth in the complexity of apartment buildings,
    and the digitization of building processes have led to a rise in the use
    of BIM models during the architectural development phase. These models
    contain a lot of information, but their life cycle often ends once the
    building is constructed. However, this information can be used by the
    Dutch Cadastre, to bring legal building registration even closer to 3D
    reality. BIM based legal registration, researched under the name BIM Legal,
    is a key driver for this research. Currently in the Netherlands, the separation
    of ownership is registered through notarial deeds that are managed by
    the Dutch Cadastre. This is accompanied by division drawings that indicate
    how apartments are split into private apartment units and shared spaces.
    To develop a full BIM Legal registration, it is necessary to also look
    at buildings without a BIM model. In such cases, BIM Legal models could
    be derived from existing legal documents, specifically division drawings.
    This research investigates the (semi-)automatic reconstruction of 3D legal
    apartment models from 2D vectorized division drawings. The proposed pipeline
    starts with already vectorized division drawings and applies shape-based
    georeferencing techniques, estimating storey heights, vertical alignment,
    and ends with generating 3D BIM Legal models. The georeferencing methods
    tested achieved sufficient alignment across the 10 sample buildings. When
    outside spaces were included in the vectorized division drawing, it resulted
    in an average containment of 81.5%. When they were removed or non existing
    it resulted in 95.2% containment. Storey alignment relies on shape similarity
    and floor-to-floor matching, which performed well in typical cases but
    struggled with floors with low similarity to the floor below it. The accuracy
    of height estimation improves when cross sections are included in the
    division drawing. Otherwise averaged based on values retrieved from the
    3DBAG. The resulting models conform to the BIM Legal standard, written
    in CityJSON format at a LoD1+. While the schematic nature of division
    drawings limits the achievable level of detail, and the geometric and
    positional accuracy, the models offer a valuable 3D visualization of private
    and shared ownership spaces. Improvements to the prior vectorization would
    also improve the accuracy and computation time of the 3D reconstruction.
    Large scale testing is necessary to research the potential incorporation
    of BIM legal models from division drawings with a complete BIM Legal registration.
    This research not only advances the automation of BIM Legal models from
    division drawings, but also provides methods which can be applied in other
    3D reconstructions, such as georeferencing polygons with a reference to
    a cadastral dataset.
  uuid: aae7672b-ffd7-4656-a81a-8c4134f0b197
- surname: Gan
  name: Haohua
  title: Exploration of algorithms for extracting wireframe models from man-made
    urban linear object point clouds
  supervisors: Hugo Ledoux; Weixiao Gao
  year: 2025
  graduation_date: '2025-06-19'
  link: https://resolver.tudelft.nl/uuid:148178a4-f7ce-4f09-b4bd-267e4d7f15bc
  image: 2025_Gan.jpg
  github: https://github.com/Ganbusier/final_thesis
  abstract: 'This thesis addresses the challenge of extracting wireframe models
    which consist of 3d line segments from point clouds of man-made urban
    linear objects, with a specific focus on power lines and pylons. Wireframe
    models are essential for various applications including 3D city modeling,
    infrastructure monitoring, and urban planning. However, the automatic
    extraction of accurate wireframes from sparse airborne LiDAR point clouds
    remains challenging due to the complexity of these structures. Current
    wireframe extraction research either require high-quality data for model
    fitting or depend on complex pre-processing steps, lacking generality.
    To address these challenges, this thesis proposes a comprehensive evaluation
    of multiple wireframe extraction approaches and introduces an energy minimization
    framework which aims to address the limitations of the existing algorithms.
    This thesis investigates four different algorithms for wireframe extraction:
    3D RANSAC, 3D-2D RANSAC, Region Growing, and Hough Transform to address
    their limitations. Additionally, an approach of energy minimization for
    Markov Random Field is proposed to explore the potential of energy minimization
    methods in wireframe model extraction. Each algorithm is evaluated using
    a dataset of power lines and pylons from the Netherlands, with manually
    extracted wireframes serving as ground truth. Experimental results demonstrate
    that each algorithm exhibits distinct advantages and limitations. The
    3D RANSAC algorithm struggles with cylinder radius estimation and overlooks
    significant portions of input data. The 3D-2D RANSAC approach reduces
    dependency on normal estimation but still faces challenges with fitting
    accuracy. Region Growing achieves lower overlooking rates but suffers
    from scattered distribution of extracted elements. Hough Transform performs
    well on simple structures without requiring normal information but becomes
    computationally expensive for complex cases. The proposed energy minimization
    method shows promising results in preserving structural integrity by processing
    dense input graphs, particularly for complex structures with internal
    components. Common limitations across all approaches include difficulties
    in normal estimation from sparse point clouds, misalignment between extracted
    primitives and ground truth, and challenges in balancing completeness
    and accuracy. The research emphasizes the complexity of wireframe extraction
    from point clouds and provides insights for developing more robust methods
    that combine the strengths of different approaches while addressing their
    mutual limitations.'
  uuid: 148178a4-f7ce-4f09-b4bd-267e4d7f15bc
- surname: Gao
  name: Yan
  title: Labeling Vario-scale Maps
  supervisors: Martijn Meijers; Peter van Oosterom
  year: 2025
  graduation_date: '2025-06-26'
  link: https://resolver.tudelft.nl/uuid:ccaddf77-5895-41e1-b957-ad9f3bc1bd7a
  image: 2025_Gao.jpg
  abstract: 'Map labels play an important role in helping users interpret
    geographic information. Traditional label placement algorithms are typically
    designed for static or fixed-scale maps, where labels appear at discrete,
    predefined zoom levels. However, vario-scale maps change content continuously
    during zooming, requiring labels to also transition smoothly to maintain
    readability and visual coherence. This research explores how to place
    and adjust labels on vario-scale maps, ensuring legibility and usability
    throughout scale transitions. Due to limited existing work in this area,
    a set of requirements, both hard and soft, are defined to guide the methodology
    and evaluate results. Different strategies are applied based on geometry
    types. For elongated features such as roads and rivers, label anchor points
    and orientations are derived from the medial axis (skeleton). For compact
    geometries such as buildings, the centroid and pole of inaccessibility
    are used to determine anchor points, while the minimum rotated bounding
    rectangle guides label rotation. Two polygonization methods are developed
    using the tGAP structure: slice-based method extracts geometry at fixed
    scales and computes label positions per feature type; event-based method
    reacts to changes in geometry, computing label anchors whenever a change
    occurs. Label anchor points could be represented as continuous trajectories,
    supporting smooth interpolation. During interactive visualization, label
    positions, orientations, and opacities are interpolated across scales.
    To prevent clutter, real-time collision detection is implemented. The
    methodology was applied to the TOP10NL dataset in the Delft region. Results
    showed that the event-based method allows more precise responsiveness
    to geometry changes but can produce occasional abrupt label movements.
    In contrast, the slice-based method offers more stable transitions but
    may cause unnecessary label shifts even when geometries do not change.
    Event-based labeling also resulted in a higher number of anchor points.
    While hard requirements were generally satisfied, some soft requirements
    were not fully met due to intentional trade-offs or implementation limitations.
    Overall, this research introduces a novel framework for integrating dynamic
    labeling into vario-scale maps using the tGAP structure and demonstrates
    its feasibility through an interactive, real-time prototype with smooth
    label transitions and collision handling.'
  uuid: ccaddf77-5895-41e1-b957-ad9f3bc1bd7a
- surname: Giampaolo
  name: Michele
  title: A Graph Neural Network-based Approach to Predict the Effects of Urban
    Climate on Personal Mobilty Choices in Seoul, South Korea
  supervisors: Azarakhsh Rafiee; Martín Mosteiro Romero
  year: 2025
  graduation_date: '2025-10-31'
  link: https://resolver.tudelft.nl/uuid:c7dea111-2693-4889-a304-2ad135fe824f
  image: 2025_Giampaolo.jpg
  abstract: Urban climate affects how people move through cities, but its
    influence is difficult to capture with models based on generalized comfort
    indices that ignore individual experiences of climate. This thesis instead
    explores a bottom-up approach that uses daily Global Navigation Satellite
    System (GNSS) traces of people traversing an urban environment, which
    inherently contain each individual's personal influences on their mobility.
    A machine learning model was developed and trained using this dataset
    with the purpose of predicting future mobility values, while assessing
    the role that climate played in such predictions. The model employed a
    Spatio-Temporal Graph Neural Network (STGNN) architecture to capture both
    potential spatial dependencies between visited locations and temporal
    patterns in their activity. The work draws on the Seoul Cozie dataset,
    which recorded six weeks of GNSS location data from wearable devices of
    22 participants in Seoul during autumn 2023. Positions were aggregated
    into a graph structure with road intersections as nodes and transitions
    between them as edges. Climate features (temperature, humidity and PM10)
    were interpolated from over 1,000 weather stations using a Triangulated
    Irregular Network method and added as dynamic node features. STGNN variants
    were trained and compared based on whether they included climate node
    features. Results show forecasts of node visits with low Mean Square Error
    of around 0.12 . However, precision and recall values for visited/unvisited
    node detection are low, peaking at 56.51%, reflecting strong class imbalance
    in the input. Adding climate attributes produced only minor and inconclusive
    improvements, in part due to the dataset’s short time span. The thesis
    proposes a reproducible framework linking climate and mobility, while
    underlining the need for richer datasets and for more flexible model architectures,
    capable of addressing class imbalances and representing personal mobility
    datasets.
  uuid: c7dea111-2693-4889-a304-2ad135fe824f
- surname: Gong
  name: Xiaoluo
  title: Dynamic Seamless Oblique Image Mosaics for Aerial Visualization
  supervisors: Martijn Meijers; Edward Verbree
  year: 2025
  graduation_date: '2025-06-26'
  link: https://resolver.tudelft.nl/uuid:183c0840-7b31-4993-a942-89327d1ce8df
  image: 2025_Gong.jpg
  abstract: High-resolution image mosaicking plays a critical role in geomatics
    and remote sensing applications, allowing efficient visualization, measurement,
    and analysis of large-scale envi ronments. Although existing commercial
    tools provide standard stitching capabilities, they often lack mathematical
    transparency and real-time customization, limiting their utility in research
    and professional analysis. This thesis introduces a systematic approach
    to dynamic image stitching and visualization within a C# environment.
    The method uses homography transformations to achieve ac curate image
    alignment while integrating an optimal seam-finding algorithm to improve
    visual coherence in overlapping regions. An exportable homography matrix
    supports co ordinate traceability, enabling users to perform metric evaluations
    on stitched images. The implementation focuses on creating a lightweight,
    interactive stitching prototype capable of processing two to three aerial
    images with high geometric fidelity and run-time efficiency. Experimental
    validation confirms that the system delivers precise stitching results
    and sup ports visual exploration for measurement tasks. By combining mathematical
    clarity, dy namic responsiveness, and user adaptability, this research
    contributes to a modular and extensible foundation for image mosaicking
    in the context of geomatics, with practical rele vance for aerial inspection,
    photogrammetry, and spatial data visualization
  uuid: 183c0840-7b31-4993-a942-89327d1ce8df
- surname: Huizer
  name: Lars
  title: 'PHYSHADE-Net: Leveraging Geometric-Priors in Physics-Guided Neural
    Networks for Building Shadow Segmentation and Height Estimation'
  supervisors: Azarakhsh Rafiee; Edward Verbree
  year: 2025
  graduation_date: '2025-06-18'
  link: https://resolver.tudelft.nl/uuid:dddf8cce-f516-4715-b810-9adb3ad2cfb0
  image: 2025_Huizer.jpg
  abstract: 'Building heights are important information for a variety of subjects,
    such as wind analysis, energy demand simulations and solar potential assessment,
    yet large-scale LiDAR scanning is costly. This thesis introduces PHYSHADE:
    a set of physics-guided U-Net-based models. It employs shadow projections
    derived from building footprints and solar geometry into an aerial image
    shadow segmentation pipeline, for the purposes of building shadow extraction
    and consequently the large-scale estimation of building heights. Thirty-five
    aerial images in the Netherlands were manually annotated for buildings
    and their associated buildings. By employing transfer learning, based
    on a general purpose shadow-segmentation model, a total of 130 models
    were trained, which can be categorized into three different implementations
    of PHYSHADE. Through these different configurations, the performance impact
    of the various methods of addition of pseudo-shadows to the models was
    ablated. Afterwards, the best-performing PHYSHADE configurations were
    used with a raycasting algorithm to convert shadow lengths and solar altitudes
    back into building heights. The inclusion of pseudo-shadows lifted the
    mean Dice scores from 0.53 to 0.85, with an average gain of 0.32 and statistical
    significance across different folds. Physics-guided loss, based on the
    pseudo-shadows, was not found to be significantly different in most cases,
    whilst hurting model performance in some cases compared to the pseudo-shadow
    enabled models. On six out-of-fold test tiles the best PHYSHADE variants
    retained Dice scores of 0.72 – 0.95, although recall declined in one winter
    scene. Finally, height estimation on these tiles using the inference from
    the best PHYSHADE variants resulted in mean RMSE of ≅ 1.9m and MAE of
    ≅ 1.5m. While its application needs to be tested in broader contexts,
    PHYSHADE offers a viable low-cost complement to LiDAR for building height
    estimation.'
  uuid: dddf8cce-f516-4715-b810-9adb3ad2cfb0
- surname: Kahn
  name: Walter Hugo Johannes
  title: Working Towards Oblique Aerial Adjustment through the Creation of
    Synthetic Testcases
  supervisors: Edward Verbree; Martijn Meijers
  year: 2025
  graduation_date: '2025-06-26'
  link: https://resolver.tudelft.nl/uuid:522563f9-c443-473a-894b-820b92e97f8a
  image: 2025_Kahn.jpg
  abstract: This thesis explores the development and validation of a synthetic
    framework for oblique aerial image adjustment and object point detection,
    with the goal of improving photogrammetric workflows in complex urban
    environments. The research is motivated by the inherent challenges of
    oblique imagery, such as occlusion, perspective distortion, and variable
    visibility, which complicate traditional adjustment procedures. To address
    these issues, the study employs a novel approach by generating synthetic
    test cases that emulate real-world oblique aerial data, enabling controlled
    experiments and sensitivity analyses. Utilizing data from recent aerial
    campaigns over Rotterdam, including both nadir and oblique images, the
    research implements and evaluates various adjustment and feature detection
    algorithms, including Bundle, DISK, SIFT, and LightGlue. The synthetic
    framework allows systematic testing of key parameters and environmental
    conditions, such as occlusion and lighting variations, providing insights
    into the robustness and limitations of different methods. Although the
    results demonstrate promising potential for synthetic data to replicate
    key geometric and photogrammetric behaviors, challenges remain in achieving
    full photorealism and seamless transferability to real-world applications.
    The findings underscore the importance of synthetic data in advancing
    urban geospatial systems and support the early-stage design of aerial
    collection systems, with particular relevance for municipal maintenance,
    planning, and infrastructure management in the Netherlands. The study
    concludes with recommendations for future research directions, emphasizing
    the integration of more photorealistic synthetic imagery and improved
    synthetic-to-real transfer methods to enhance the accuracy and reliability
    of oblique aerial mapping workflows. Overall, this work contributes to
    the growing body of knowledge on synthetic data use in photogrammetry
    and opens pathways for more resilient and efficient urban mapping solutions.
  uuid: 522563f9-c443-473a-894b-820b92e97f8a
- surname: Li
  name: Xueheng
  title: 3D Visualization and Dissemination of Property Valuation Information
    Based on LADM Part 4
  supervisors: Peter van Oosterom; Abdullah Kara
  year: 2025
  graduation_date: '2025-10-30'
  link: https://www.gdmc.nl/publications/2025/MScThesisXuehengLi.pdf
