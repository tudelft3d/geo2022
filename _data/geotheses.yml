- surname: Brakelé
  name: Sara
  title: Extracting building typology parameters from 3D city models for earthquake
    risk assessment
  supervisors: Jantien Stoter; Giorgia Giardina; Ihsan E. Bal
  year: 2026
  graduation_date: '2026-04-24'
  link: https://resolver.tudelft.nl/uuid:c4b6866d-fc45-430a-962a-4b53fd883ef0
  image: 2026_Brakele.jpg
  abstract: Earthquakes pose a significant risk to communities worldwide,
    damaging buildings and disrupting society. This makes it essential to
    understand how buildings respond to seismic events. Earthquake risk assessments
    rely on structural building information, typically based on clusters of
    buildings with similar structural characteristics. Traditionally, this
    data is collected through time-consuming and expensive field surveys,
    because many relevant structural attributes are not openly available on
    a large scale. Meanwhile, developments in 3D city models offer accurate
    geometric data that could support automated building analysis. However,
    many models currently lack information on structural characteristics.
    Therefore, this research aims to explore how 3D city models can be used
    to automatically extract and predict building typology parameters at the
    individual building level to improve earthquake risk assessment. This
    approach focuses on extracting and predicting Global Earthquake Model
    (GEM) taxonomy parameters from 3D city building models. First, the geometric
    and descriptive attributes are extracted using a computational process.
    Then, correlation analysis is performed to select a unique set of predictive
    features. Machine learning techniques are then used to predict non-visual
    structural characteristics, such as the type of walls, foundations, and
    floors. This study applies the methodology to the area around the Groningen
    gas field in the Netherlands as a case study. It uses 3DBAG, an automatically
    generated 3D model of buildings in the Netherlands, alongside a small
    dataset of structural characteristics of buildings in Groningen obtained
    through field surveys. The results demonstrate that geometry-based attributes
    of the GEM, such as building height, inter-storey height, structural irregularity,
    roof shape, and floor plan shape, can be reliably derived from 3D building
    data. Predictions of non-visual structural attributes (i.e., wall, foundation,
    and floor types, and Lateral Load-Resisting System (LLRS)) reach an accuracy
    of around 90%, while full vulnerability class predictions achieve approximately
    75% accuracy. However, these results should be interpreted with caution
    due to the small validation dataset and the probabilistic nature of the
    models. Nevertheless, these findings demonstrate the potential value of
    3D city models as data sources for the automated, large-scale retrieval
    of individual building typology parameters.
  uuid: c4b6866d-fc45-430a-962a-4b53fd883ef0
- surname: Bry
  name: Alexandre
  title: From points to prints -- Generating building roofprints and footprints
    from airborne lidar data and inaccurate outlines
  supervisors: Hugo Ledoux; Ravi Peters; Bruno Vallet
  year: 2026
  graduation_date: '2026-06-26'
  link: https://resolver.tudelft.nl/uuid:101ba3d8-1988-4025-b041-fafb12d2d2f3
  image: 2026_Bry.jpg
  github: https://github.com/alexandre-bry/MSc_Thesis-Code
  abstract: 'In recent years, several methods have been successfully developed
    to create 3D building models in LoD2.2 from ALS point clouds. These methods
    however rely on 2D horizontal uilding outlines whose definitions and quality
    vary significantly. There are mainly two types of outlines: roofprints
    and footprints, and having access to both of them allows to reconstruct
    the façades and the roof independently, therefore improving from LoD2.2
    to LoD2.3 models. Moreover, this distinction also allows more precise
    analyses depending on the use case. Therefore, we present a method to
    construct both a roofprint and a footprint from ALS data and existing
    inaccurate outlines. By first precisely deforming and aligning the outline
    on the roof to turn it into the roofprint, our method can then accurately
    identify the few ground and façade points available, if there are any,
    in order to produce a footprint coherent with the roofprint. Our method
    preserves the validity of the polygons and the topological relations between
    them. It has been tested successfully on the French national datasets
    BD TOPO and LiDAR HD.'
  uuid: 101ba3d8-1988-4025-b041-fafb12d2d2f3
