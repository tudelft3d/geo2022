- surname: Molijn
  name: Ramses Amadeus
  title: ICESat full waveform signal analysis for the classification of land
    cover types over the cryosphere
  supervisors: Roderik Lindenbergh; Brian Gunter; Roland Klees
  year: 2009
  link: https://resolver.tudelft.nl/uuid:84ae2335-bda6-4880-af3e-217cd6289f27
  image: 2009_Molijn.jpg
  abstract: 'The Earth needs attention. That is the bottom line of today’s
    discussion on the impact of humans on the environment and their contribution
    to global warming. With the rapid sea level rise and the melting ice caps,
    it is becoming increasingly important to understand these processes. Mass
    balance estimates of the cryosphere (e.g. Greenland and Antarctica) are
    one of the keys to unlocking the secrets of today’s concerns and predicting
    tomorrow’s problems. The primary objective of this research is to construct
    an automatic classification algorithm to that will distinguish between
    the polar land cover types: ice, rock, snow and water. The algorithm is
    based on full waveform laser altimetry measurements gathered by the Ice,
    Cloud and Elevation Satellite (ICESat). The results of this research have
    the potential to play an important role in improving the current methods
    for computing mass balance estimates and monitoring seasonal changes in
    land cover type of the cryosphere.'
  uuid: 84ae2335-bda6-4880-af3e-217cd6289f27
  needs_review: true
- surname: Widiastuti
  name: Endang
  title: Data assimilation of GRACE terrestrial water storage data into a
    hydrological model using the Ensemble Kalman Smoother
  supervisors: Nick van de Giesen; Susan Steele-Dunne; Brian Gunter
  year: 2009
  link: https://resolver.tudelft.nl/uuid:a91d6dc5-bdeb-4ee3-9a34-75a72c89f806
  image: 2009_Widiastuti.jpg
  abstract: Terrestrial water storage (TWS) can be defined as the storage
    of water on and below the land surface, and includes snow, ice, surface
    water, soil moisture, and ground water. TWS is a key component of the
    terrestrial and global hydrological cycles, which have important control
    over the water, energy and biogeochemical fluxes, and plays a major role
    in the Earth’s climate. An accurate estimation of terrestrial water storage
    is thus important for improved water management. However, direct determination
    of TWS is difficult due to insufficient in-situ data. TWS estimation can
    be obtained through hydrological modelling, although models are not free
    from uncertainties due to inaccurate forcing data and weak modelling assumptions.
    However, the launch of the Gravity Recovery and Climate Experiment (GRACE)
    twin satellite mission has provided the first space based dataset for
    TWS estimates, although with coarse resolution and limited accuracy. It
    is expected that combining GRACE observations and estimates from a model
    could improve TWS estimates, and one way to this through data assimilation.
    In this thesis, the ensemble Kalman filter (EnKF) and the ensemble Kalman
    smoother (EnKS) have been applied to assimilate the GRACE TWS variation
    data into the HBV-96 model, a conceptual rainfall-runoff model over the
    Rhine river basin, for the study period of February 1st 2003 to January
    31st 2004. Two TWS variation estimates were inferred from two sets of
    GRACE solutions, one from DEOS – TU Delft, and another from CSR - University
    of Texas. Both solutions use different filtering methods which yield different
    estimates, and therefore can be expected to have different effect on the
    data assimilation. The EnKF and EnKS have been successfully applied, fulfilling
    the expectation of having a new estimate with lower variance than both
    the prior model estimate and the GRACE observation estimate. The model
    estimated discharge after the data assimilation was compared with measured
    discharge at several stations. The discharge estimates were improved at
    the beginning of the experiment, but the degree of improvement decreased
    with time. Both of the GRACE data sets gave comparable results. Longer
    experiment period and comparison with other validation data could lead
    to a more definitive conclusion.
  uuid: a91d6dc5-bdeb-4ee3-9a34-75a72c89f806
  needs_review: true
- surname: Wortel
  name: Tom
  title: Automating quantity surveying in road construction using UAV Videogrammetry
  supervisors: Kourosh Khoshelham; Ben Gorte
  year: 2009
  link: https://resolver.tudelft.nl/uuid:9a2421c2-9c7b-4e4f-945c-1246ffa35bd4
  image: 2009_Wortel.jpg
  abstract: Due to changing contract forms in road construction, contractors
    feel the need for accurate and fast quantity measurement methods. UAV
    Photogrammetry is a potential answer for contractors. Photogrammetric
    measurement processing should be automated in order to reach its full
    potential in speed and obtainability. Automatic extraction of reliable
    point correspondences between stereoscopic images is still difficult.
    This research presents a solution to obtain reliable point correspondences
    between multiple images. The approach is to use Scale Invariant Feature
    Transform (SIFT) to automatically extract point matches. These point matches
    are not reliable. SIFT Tracking is a new method that tracks SIFT features
    in a sequence of images with very high overlap. SIFT tracking, in combination
    with a motion constraint and a unique matching constraint, extracts reliable
    point matches. SIFT tracking is tested in road construction image sequences
    with 99% overlap between consecutive images. SIFT extracts approximately
    30 reliable point correspondences over 40 images, such that there is 60%
    overlap between the first and the ast image of the sequence. These point
    correspondences can be used to compute a reliable digital terrain model
    of the road construction site. SIFT Tracking is an improved version of
    SIFT that can be used to extract reliable point correspondences between
    photogrammetric images. It fills the last gap in automating photogrammetric
    measurement campaigns.
  uuid: 9a2421c2-9c7b-4e4f-945c-1246ffa35bd4
