- surname: de Vreede
  name: Irene
  title: Managing Historic Automatic Identification System data by using a
    proper Database Management System structure
  supervisors: Wilko Quak; Peter van Oosterom
  year: 2016
  link: https://resolver.tudelft.nl/uuid:d11552c7-8b87-41a0-8b88-1090ea07e858
  image: 2016_de-Vreede.jpg
  abstract: This MSc thesis aims to develop a management solution for historical
    Automatic Identification Structure (AIS) data by finding a suitable database
    and data(base) structure for an effective extraction of historical AIS
    data to support Spatial-Temporal analyses. The work-flow the thesis proposes
    focusses on the selection of a database, the organization of the data
    inside this database and the effectiveness of the extraction of information
    that can be used in Spatial-Temporal analyses. AIS data, vessel movement
    data, has a complex structure consisting of 27 different kind of encoded
    messages. These messages hold their own unique and similar data and are
    related to each other by their vessel-ID number (MMSI). The update rate
    of the messages, the data, is dynamic, different for each kind of message.
    Storing and structuring historic AIS data should be able to handle the
    data features. Based on the comparison between the AIS data features,
    the requirements that the database has to meet which are set by Rijkswaterstaat
    and related literature and documentation is MongoDB a suitable database
    to manage AIS data. The requirements that are set by Rijkswaterstaat are
    based on three use cases; location, trajectory and bounding box. Extraction
    of the information, that can answer the use cases, from the historic AIS
    data that is stored within the database, should be effective. To ensure
    this, two data(base) organizations are developed, one storing AIS data
    in a way that it will support the Spatial-Temporal analyses of the specified
    use cases and one storing AIS data in a way that it will support all possible
    spatial-temporal use cases. The first will store only the four decoded
    attributes that are necessary to answer the use cases together with the
    original encoded AIS message. The second will store all decoded attributes
    an AIS message holds. To enhance the performance of MongoDB holding AIS
    data in one of the two data(base) organization, four indexes on individual
    attributes and one 4D Morton code index are developed. A 4D Morton code
    index based on latitude, longitude, MMSI and date-time is developed to
    enhance the effectiveness of the extraction of the information from the
    database that will answer the three use cases. A comparison between the
    two data(base) organizations and the five indexes by measuring their effectiveness
    while executing three, on the by Rijkswaterstaat specified use cases based,
    queries, concludes on a suitable management solution for historical AIS
    data which will support Spatial-Temporal analyses.
  uuid: d11552c7-8b87-41a0-8b88-1090ea07e858
  needs_review: true
- surname: Fichtner
  name: Florian W.
  title: Semantic enrichment of a point cloud based on an octree for multi-storey
    pathfinding
  supervisors: Abdoulaye Diakite; Sisi Zlatanova
  year: 2016
  link: https://resolver.tudelft.nl/uuid:b4c13508-dbcc-4a32-a7b7-9cb22230e0a7
  image: 2016_Fichtner.jpg
  abstract: Acquiring point clouds of indoor environments became increasingly
    accessible in recent years. However, the resulting 3D point cloud data
    is unstructured, and does not contain enough information to be useful
    for complex tasks like pathfinding. Indoor models which are currently
    derived from point clouds do not include furniture and stairs. The necessary
    graph to enable multi-storey pathfinding is not available in the point
    cloud. This thesis proposes a workflow to semantically enrich indoor point
    clouds using an octree data structure. Meaning is added to the point cloud
    scene that allows to act as a basis for a graph. This graph can then follow
    navigation constraints of humans through an indoor environment. The approach
    for semantic enrichment of this study is capable of separating storeys,
    detecting floors, walls, stairs and obstacles like furniture. Strict preconditions
    are used, like walls being perpendicular to each other and using noise
    free point clouds. The implementation works as a proof of concept and
    the octree proves to be a helpful data structure. The contribution is
    a novel approach of using octrees for the semantic enrichment of indoor
    point clouds, including the detection of stairs. Combining and extending
    different works from various fields of research helped to develop the
    presented methodology. The semantic classification of floors and stairs
    in 3D point clouds allows to create a graph across multiple storeys. A
    big part of the methodology was implemented and tested on different types
    of buildings and scanned with dissimilar kinds of laser scanners. Mobile
    scanners were found to be advantageous, because they are less dependent
    on the line of sight. On top of that, they can provide a path of the scanner,
    which is precious information that can support several structuring improvements
    of the acquired data. The octree generalises the point cloud to leafs
    and adds a structure to the empty space. This does not only improve the
    calculation performance, but also provides more distinguishable results.
    Concluding, the thesis proposes to extent the framework to cover a wider
    range of architectural structures. Furthermore, future research should
    deepen the knowledge for the stair detection of the presented conceptual
    framework. As the representation of stairs differ for every scanner, future
    research should focus on point clouds acquired by one kind of scanner
    first.
  uuid: b4c13508-dbcc-4a32-a7b7-9cb22230e0a7
- surname: Heeres
  name: Erik
  title: 'Exploring the 3D BAG: How to define it and to what extent can it
    automatically be created using open data'
  supervisors: Jantien Stoter; Hugo Ledoux
  year: 2016
  link: https://resolver.tudelft.nl/uuid:bb4a1667-1d6f-41ac-b12e-fb70c0013881
  image: 2016_Heeres.jpg
  uuid: bb4a1667-1d6f-41ac-b12e-fb70c0013881
- surname: Jonker
  name: Kees
  title: Automatic generation of raster-based height data for the Netherlands
    based on the AHN2 data set
  supervisors: Jantien Stoter; Hugo Ledoux; Ben Gorte
  year: 2016
  link: https://resolver.tudelft.nl/uuid:b1d1c50d-24bf-4a12-b0e5-3c2479907d66
  image: 2016_Jonker.jpg
  abstract: 'The recent emergence of Light Detection And Ranging (LiDAR) scanning
    technology has resulted in the availability of very large three dimensional
    point cloud data sets. These LiDAR data sets have become a main source
    for the modeling and reconstruction of both ground surface as well as
    above-ground objects such as buildings and vegetation. For the Netherlands,
    the second version of the Algemeen Hoogtebestand Nederland (AHN) is a
    country-wide high-resolution point cloud data set comprising the nation’s
    terrain by measuring heights, obtained by LiDAR, using Airborne Laser
    Scanning (ALS). None of the currently available raster-based products
    based on the AHN2 data set can be considered as being good: height maps
    contain holes, unintentional dynamic objects are present and more. Causes
    for errors can be found in deviations during the collection of the point
    cloud data as well as the applied methodology to process the data. This
    thesis will identify the possibilities to improve the quality of raster-based
    height map products based on the AHN2 data set with respect to currently
    available products. Quality will be determined with respect to the Geographic
    Information Quality principles standard, introduced by the International
    Organization for Standardization (ISO). A five-step methodology is proposed
    in order to generate raster-based height data from massive LiDAR point
    cloud samples from the AHN2 data set. In the first step, the massive LiDAR
    point cloud data will be split up in overlapping tiles in order to pipeline
    subsets of data in order to feed data sequentially to the computers’ main
    memory. In the second step filtering of different classes takes place
    in order to filter specific information within the point cloud data. In
    the third step, for each filtered class specific interpolation methods
    will be applied in order to achieve raster-based data from the point cloud
    data that fits best for a certain class of data. In the fourth step some
    post-processing steps will be applied in order to optimize the raster
    data and a composition of the tiles that were decomposed in the first
    step. In the fifth step raster visualization will be applied in order
    to support visual inspection of the data. Quality assessment shows that
    the methodology proposed within this thesis is capable to process data
    with a completeness rate of 100%. Positional accuracy is determined with
    respect to currently available raster-based height maps since no reference
    data is available. For Digital Elevation Model (DEM)s low positional errors
    are measured where for Digital Surface Model (DSM)s higher positional
    errors are measured due to erroneous data within current DSM products.
    Thematic accuracy is defined for a larger amount of classes in comparison
    with currently available raster-based height maps with a sensitivity rate
    between 56?100% ± 5%.'
  uuid: b1d1c50d-24bf-4a12-b0e5-3c2479907d66
- surname: Kalogianni
  name: Eftychia
  title: Linking the legal with the physical reality of 3D objects in the
    context of Land Administration Domain Model
  supervisors: Peter van Oosterom; Wilko Quak
  year: 2016
  link: https://resolver.tudelft.nl/uuid:2e3d7f53-9ca3-4003-b09b-77b82f312873
  image: 2016_Kalogianni.jpg
  abstract: 'The massive developments and uses of high rise buildings indicate
    that the demand for use of space above and below the ground surface is
    rapidly increasing in recent years. In the context of this thesis, the
    research is focused on exploring the possibilities of linking 3D legal
    RRR spaces, modeled with LADM (ISO 19152), with physical reality of 3D
    objects. The possibilities are explored towards the development of a prototype
    which is elaborated in two core stages: At first, a physical model is
    derived from the corresponding conceptual model, using existing national
    and international standards and then, its efficiency is tested using real
    world sample data, querying the database and visualizing the result in
    3D environment. The conceptual modeling of the proposed model is based
    on the "people to land" relationship using LADM core concepts described
    with UML diagrams. Towards the conversion from conceptual model to implementation
    of a working prototype, the model is first converted into the INTERLIS
    modeling language, in order to be formally expressed including various
    constraints in a platform/ vendor neutral manner. INTERLIS is a standard
    modeling language for geodata exchange which is used to provide more direct
    implementable models and at the same time support the constraints. The
    model described, initially, with UML diagrams and especially the constraints
    in OCL cannot be automatically converted into implementations. During
    the prototype, emphasis is given at the exploitation of the capabilities
    of INTERLIS, under the scope of LADM, which is used in actual implementation
    of land administration system. INTERLIS tools are used to automatically
    generate implementation components for specific environments; e.g. database
    schema or exchange file format. Challenges among others during the system''s
    development cycle include the following: how to express the various LADM
    constraints OCL and semi-formal in standard) formally in INTERLIS, how
    to include extensible hierarchical code lists in INTERLIS models (not
    natively available) and distinguish them from enumeration values, how
    to model 3D volumetric primitives in INTERLIS (not natively available),
    how to link two models (legal - physical) using cross domain constraints,
    etc. The system’s development cycle, is illustrated with a proposed model
    for MLAS in Greece. The model is based on international standards, covering
    a broader perspective than the existing one used today, including several
    types of objects and interests that are not currently registered by the
    Hellenic Cadastre. More precisely, utility networks (both the legal and
    their physical counterpart), planning zones, marine parcels and 3D (land)
    parcels are now included at the proposed model and organized appropriately.
    The different types of spatial units are organized in levels according
    to the LA_Level structure of LADM, ISO19152. This model is considered
    as an effort for overcoming these shortcomings, based on international
    standards, including the representation of a wide range of different types
    of spatial units, in three dimensions, aiming to establish an appropriate
    basis for the NSDI of Greece. It is a flexible proposal for comprehensive
    multipurpose LAS supporting both 2D and 3D cadastral registration in Greece.
    The prototype is developed in order to evaluate the strengths and limitations
    of the proposed conceptual model (linking legal and physical objects),
    as well as to investigate the efficiency and limitations of the existing
    technological (INTERLIS) tools. The process followed during the prototype
    development is cyclical and repetitive, providing feedback to the initial
    model during all the stages and improving it in terms of efficiency, reality
    and technical implementation. Finally, differences and similarities are
    mentioned from the comparison of the final (corrected) conceptual model,
    which results after the evaluation of the prototype, with the initial
    one. Conclusions and remarks made based on the database queries and visualization,
    as well as similarities, differences and patterns can be observed between
    the legal and physical objects. All the design and technical decisions
    that were taken during the system’s development cycle together with the
    problems arised, the solutions proposed and challenges for future work
    are described at the following chapters.'
  uuid: 2e3d7f53-9ca3-4003-b09b-77b82f312873
  needs_review: true
- surname: Kastelijns
  name: Matthijs
  title: Making sense of standards An evaluation and harmonisation of standards
    in the Sensor Web
  supervisors: Wilko Quak; Bastiaan van Loenen
  year: 2016
  link: https://resolver.tudelft.nl/uuid:35f9ef5c-0923-4ceb-8932-830fcf7d18d8
  image: 2016_Kastelijns.jpg
  abstract: Sensor data plays a significant role in our life. Sensors are
    devices that can sense our environment. This sensor data is part of the
    Sensor Web and needs a vast data infrastructure design, because many organisations
    are involved, the abundance of different sensors and because of the big
    volume of data and near-real time data. The extent to which sensor data
    can be used depends on a variety of factors, among them the observations
    of the sensor, the data about the sensor itself and interoperability between
    sensor systems. Standards will lead the way to a well-functioning interoperable
    Sensor Web, meaning all the systems can communicate with and understand
    each other. Therefore, the sensor standards need to be discoverable, interoperable
    and usable in their own domain. Currently this is not yet the case. There
    is not sufficient information available about the gaps and overlaps in
    the Sensor Web and there are a lot of different standards and therefore
    the systems are not capable of communicating to each other. Currently
    the standards are made and maintained by different organizations. There
    is one cluster of standards assembled by Open Geospatial Consortium (OGC),
    called Sensor Web Enablement (SWE), which forms the spine of the Sensor
    Web, but there are also other non-OGC standards that are useful for the
    Sensor Web, such as the IEEE standards and W3C's Semantic Sensor Network.
    A use case demonstrates both the usefulness and the gaps and overlaps
    of the standards in the Sensor Web, because it sketches a real-life situation
    in which standards can bring interoperability. The Smart Emission project
    in Nijmegen is a suitable candidate to assist in answering questions regarding
    sensor standards. In Nijmegen there is a citizen request for air quality
    data. The Smart Emission Project was initiated to respond to this request.
    The project is a collaboration between different organizations to to keep
    the city liveable by incorporating citizen participation in the Sensor
    Web. Sensors that measure different environmental indicators namely air
    quality, sound pollution, and meteorological data are placed all over
    Nijmegen to sense the city. The plan is to provide the data to the citizen
    for both viewing and downloading via applications. The project team is
    currently using OGC sensor standards, namely the SensorThingsApi and Sensor
    Observation Service, but is interested in alternatives, such as for remote
    access to the sensor, and can profit from research on sensor standards.
    The requirements for implementation in the use case are extracted from
    meetings with citizens, network maintainers, experts in the Sensor Web
    and project members. Validation of requirements from the Smart Emission
    project demonstrates weaknesses and strong points in the current standards
    and how they can be used in a combination to provide the right data to
    the citizen. Validation is done through a data model based mainly on Observations
    and Measurements. Results show that not all requirements for the use case
    are met and that standardisation is not achieved for every requirement.
    To improve standardisation for future projects the adapted Open Systems
    Interconnection (OSI) model in combination with a digital sensor portal
    is suggested to be used. The OSI model, adapted from computer science
    and used for data interoperability on the Internet is an ordering system
    and can indicate the right standard for the right usage. It is a layered
    system in which data is added in all the five layers. The chosen data
    flows through this system and ends up with relevant information for the
    user and the system. The adapted OSI-model is changed on several aspects.
    The layers are different than the original OSI-model. Furthermore division
    between standards is made by categorizing them on implementation method.
    Using the Adapted OSI-model will fill the gaps and demonstrate the overlaps
    in the Sensor Web make it more interoperable. In this thesis data modeling
    of a use case has been used to analyse sensor standards. The results show
    that in the current situation the sensor standards are insufficient ordered,
    interoperable and harmonised. The Adapted OSI-model can bring order and
    the model can open up the way towards a more interoperable sensor web.
  uuid: 35f9ef5c-0923-4ceb-8932-830fcf7d18d8
  needs_review: true
- surname: Koopman
  name: Martijn
  title: 3D Path-finding in a voxelized model of an indoor environment
  supervisors: Sisi Zlatanova; Ben Gorte; Ulf Hackauf
  year: 2016
  link: https://resolver.tudelft.nl/uuid:13788271-e19d-41e1-b827-fe7535a66281
  image: 2016_Koopman.jpg
  abstract: Indoor environments can be complex and need to be represented
    by a 3D representation. This is especially important for 3D path-finding.
    3D features of the environment can have an effect on the computed path
    and these features can not be represented correctly in a 2D representation.
    A voxelized model is a good 3D representation that supports path-finding.
    It is a geometrical and topological model and it is easy to incorporate
    semantics. It is also fairly easy to consider the shape and size of the
    actor. This thesis presents a new path-finding method that operates on
    a voxelized model and supports different kinds of actors. Distinction
    is made between actors by their size and mode of locomotion. Supported
    modes of locomotion are walking, driving and flying. A hierarchical data
    structure is used to reduce the time complexity of the path-finding problem.
    This hierarchical data structure is a graph which is derived from a cell
    decomposition of space. The results indicate that the path-finding method
    in its current state operates well for walking and driving actors, but
    further improvements are required for flying actors.
  uuid: 13788271-e19d-41e1-b827-fe7535a66281
- surname: Lam
  name: Marco
  title: Creating the medial axis transform for billions of lidar points using
    a memory efficient method
  supervisors: Jantien Stoter; Ravi Peters; Pirouz Nourian
  year: 2016
  link: https://resolver.tudelft.nl/uuid:2452566b-058a-4fde-aa0e-e300421bb8b2
  image: 2016_Lam.jpg
  abstract: Using Light Detection And Radar (LiDAR) large parts of the earth's
    geography can be captured an represented as a 3D pointcloud. The whole
    elevation dataset of the Netherlands (AHN2) is currently available and
    captured using this technique, it contains around 640 billion points.
    These massive dataset in its current form is well suited for visualisation
    and certain forms of analysis, as the 3D points are the outer boundary
    of objects. However, the Medial Axis Transform (MAT) is another way to
    represent these objects. As it represents the inner/outer skeleton of
    the objects some features become more easily detectable and it could be
    used as a tool in point cloud analysis. The MAT can be created from pointclouds
    using various methods, however the shrinking ball algorithm is used as
    it is relative simple to implement, more storage efficient and easier
    to parallellize compared to other methods. Yet the computation of it for
    a massive dataset such as the AHN2/3 is troublesome as it does not fit
    inside the main memory of the computer. This thesis focusses on how to
    scale the MAT so it can be computed for massive datasets using a main
    memory efficient approach. Two methods (i.e. tiling and streaming based
    algorithms) are proposed. They both subdivide the pointcloud dataset in
    to manageable subsets, so that the MAT can be computed on these smaller
    sets. However, the tiling approach relies heavily on temporal storage
    on the external memory (harddisk) by creating smaller tiles. whilst the
    streaming approach tries to manage it within the Main memory by scanning
    the input dataset multiple times and storing tiles in the main memory.
    This thesis concludes that using both methods it is possible to compute
    the MAT of a dataset which is larger than the main memory. The tiling
    approach seems suited as the temporal storage of the external memory is
    about the same size as the output data, further more the main memory usage
    can be regulated easily as the amount of tiles which will be processed
    at the same time can be chosen. The streaming approach shows potential
    to be efficient as well in computing the MAT. However, because streaming
    computations loads the input data sequentially and processes it using
    a limited memory buffer, outputting data and freeing memory space is needed.
    In this thesis a first step in finding a way to achieve that is made,
    however it is not functioning that well. As such the data outputting can
    not be as rapid as it should be when using streaming algorithms.
  uuid: 2452566b-058a-4fde-aa0e-e300421bb8b2
- surname: Nagelkerke
  name: Tim
  title: Navigation to a human in motion by using points of interest
  supervisors: Sisi Zlatanova; Abdoulaye Diakite
  year: 2016
  link: https://resolver.tudelft.nl/uuid:b9e42100-1bad-43de-bd1f-87f47779460a
  image: 2016_Nagelkerke.jpg
  abstract: Navigating to a human target is underexposed in the current literature.
    However, there are cases where it is necessary to get to the moving target
    as fast as possible. This thesis supports navigation of a person to another
    person in motion that they lost or need. In this way, children, elderly,
    family, coworkers and friends could be found more quickly. This research
    thesis proposes the Semantically Enriched A * (SEA*) method to use semantics,
    in the form of points of interest, to determine the prediction of the
    target and uses this prediction to approach the target. Overall the SEA*
    method uses the positive components of the iterative A* algorithm, semantics
    and the direction of the target to predict where the target is going to,
    to successfully reach the target. Points of interest, landmarks, are critical
    points to check where a person is moving towards. These static locations
    are promising for navigating to a person in motion. Estimating the predicting
    location of the target is recommended by first limiting down the points
    of interest by the approaching points of interest by the target and then
    using the point of interest that is the closest to the target. This process
    gives a good prediction of the target in both implementations. The proposed
    SEA* method is tested both in an indoor environment, as in an outdoor
    environment. The SEA* method shows promising results in both the simulated
    indoor environment, represented by a 2D square regular grid, as in the
    outdoor environment, represented by a road network, using real GPS data.
    In this thesis the SEA* method is compared to the iterative A* approach
    and shows promising improvements. This thesis provides a framework that
    could be implemented to always find a person in motion or find them faster
    by using shortcuts to get to this person. A variety of different spatial
    models could implement the SEA* algorithm as long as the spatial model
    supports the A* algorithm, is able to translate the positions of the user
    and the target to the spatial model and supports adding points of interest
    to the model. Finally this research discusses further implementations
    of this method. Future research must provide answers to the questions
    if this method also works in a real-time case or if it works using a 3D
    spatial model to support 3D indoor navigation.
  uuid: b9e42100-1bad-43de-bd1f-87f47779460a
- surname: Rodenberg
  name: Olivier
  title: The effect of A* pathfinding characteristics on the path length and
    performance in an octree representation of an indoor point cloud
  supervisors: Sisi Zlatanova; Edward Verbree
  year: 2016
  link: https://resolver.tudelft.nl/uuid:fa1444c0-b957-43a3-9a9e-a0a7664bb6c8
  image: 2016_Rodenberg.jpg
  abstract: 'This thesis presents a new workflow for path finding through
    an octree representation of an indoor point cloud. I applied the following
    steps: 1) the point cloud is processed so it fits best in an octree; 2)
    during the octree generation the interior empty nodes are identified and
    further processed; 3) for each interior empty node the distance to the
    closest non empty node directly under it is computed, this can be used
    as constraint in path finding; 4) a network graph is computed with the
    connectivity of all interior empty nodes; 5) a collision avoidance system
    is pre-processed in two steps: firstly the clearance of each empty node
    is computed, and secondly the maximal crossing value between two empty
    neighbouring nodes is computed. 6) the A* path finding algorithm is conducted.
    The A* uses the interior empty nodes and the network graph to find a path.
    Finally, benchmark test were conducted to identify the effect of octree
    operators and A* operations on the path length and computation time. The
    A* path finding computation time is positively effected by: firstly, pre-processing
    a network graph, using a Manhattan distance and by keeping the octree
    depth to a minimum. The path length is positively influenced by: extending
    the path connectivity, by using an Euclidean distance type and by increasing
    the octree depth. Although, the octree depth depends on the minimal and
    maximal spatial resolution needed for path finding. And this is dependant
    of the size and orientation of the point cloud. By pre processing a point
    cloud the spatial resolution can be increased.'
  uuid: fa1444c0-b957-43a3-9a9e-a0a7664bb6c8
- surname: Rook
  name: Merwin
  title: Automatic thematic and semantic classification of 3D city models
  supervisors: Filip Biljecki; Abdoulaye Diakite
  year: 2016
  link: https://resolver.tudelft.nl/uuid:61236178-3b72-4923-8d72-1d44446783df
  image: 2016_Rook.jpg
  paper: http://doi.org/10.5194/isprs-annals-IV-2-W1-23-2016
  abstract: 'Developments in remote sensing created new possibilities to capture
    the human environment on a large scale. This data is used in the generation
    of large scale Three dimensional (3D) city models, which has led to a
    higher demand for 3D city models in a wide range of fields. The lack of
    semantic information in many 3D city models is a considerable limiting
    factor in their use, as a lot of applications rely on semantic information.
    This research is a first step in creating an automatic workflow, that
    semantically labels a plain 3D city model, with level of detail 1 or 2,
    represented by a triangulated polygon mesh, with semantic and thematic
    information as defined in the CityGML standard. The first step in this
    labelling process is the reconstruction of the building entities and (parts
    of) the terrain: the thematic features. Next, two methods are proposed
    to semantically label the surfaces in the previously defined building
    entities. The first implemented method is a best practice of methods that
    are tested, which aim at labelling the 3D city model with the classes
    WallSurface, Roof- Surface, and GroundSurface. The second method is an
    explorative approach and a proposal that additionally recognises the classes
    OuterCeilingSurface and OuterFloorSurface. In this approach, an proposal
    is made that extends the current class definitions of a RoofSurface and
    a WallSurface in CityGML. This research shows that by extending these
    defintions, a CityGML file with Level of Detail 1 and 2 can be semantically
    labelled automatically. The results show that a high semantic classification
    accuracy is possible. The accuracy depends on a number of factors, floating
    point precision errors is the biggest limitation factor in the thematic
    and the semantic labelling.'
  uuid: 61236178-3b72-4923-8d72-1d44446783df
- surname: Rovers
  name: Adrie
  title: Exploring the use of a generic spatial access method for caching
    and efficient retrieval of vario-scale data in a client-server architecture
  supervisors: Martijn Meijers; Peter van Oosterom
  year: 2016
  link: https://resolver.tudelft.nl/uuid:215c9363-7fc8-466e-9c77-8a37defbce34
  image: 2016_Rovers.jpg
  abstract: Vario-scale data structures make it possible to derive maps at
    arbitrary scale. When requesting a map, data has to be transferred from
    server to client. This takes time, which affects the responsiveness of
    the system, and sometimes costs can be involved for every byte that is
    send over the network. Redundant data transfers should thus be avoided.
    Having vario-scale data, the opportunity arises to reuse data already
    present on the client and retrieve only the missing data from the server
    when requesting a new map. This thesis explores if a generic data driven
    spatial access method can be used for this purpose, while keeping the
    service scalable and responsive. The research shows that there is no ready-made
    solution available that can facilitate in reaching this goal, but that
    the Hilbert R-tree is suited to be used as a starting point. Like the
    generic Hilbert R-tree, an index is build using a space filling curve.
    However, instead of indexing individual objects, an index is made based
    on a set of objects. The objects are grouped together into packages based
    on spatial proximity and level of detail. Using the index, a client can
    request these packages over the network. The newly suggested method makes
    it possible to utilize client side processing for constructing vario-scale
    maps and thereby use the client cache to reuse already received responses.
    The results show that the efficiency of data communication and the responsiveness
    of the client can improve for an average user scenario. This is shown
    with the use of a prototype. Furthermore, the method is generic for the
    way in which data is retrieved by a client from the server. Therefore,
    the hypothesis is that the method can also facilitate communication for
    other use cases with higher dimensional data such as 4D point clouds.
    It is expected that communication can be similar as with vario-scale data,
    and that only the filter and visualization steps are different.
  uuid: 215c9363-7fc8-466e-9c77-8a37defbce34
  needs_review: true
- surname: Aarsen
  name: Rosann
  title: Using sensor-data collected by a meet rollator for deriving outdoor
    accessibility information concerning mobility impaired people
  supervisors: Sisi Zlatanova; Edward Verbree; Alexander Wandl
  year: 2015
  link: https://resolver.tudelft.nl/uuid:29fc70b1-c262-4f3d-837f-5ecddb56d6f0
  image: 2015_Aarsen.jpg
  abstract: 'Nowadays, not all pedestrian paths are accessible for mobility
    impaired people. Especially paths which consist of complex public spaces
    and old streets constitute problems. However, no reliable information
    is (quickly) available about problems that cause hindrance. The sensing
    rollator called meet rollator is equipped with several sensors that provide
    detailed data about a range of factors which affect the accessibility
    of the outdoors environment. A meet rollator gathers data that is supplementary,
    new and different. The goal of this thesis is to use sensor-data collected
    by a meet rollator to develop a geo-database that provides insight into
    the accessibility of pedestrian routes for mobility impaired people who
    need a wheelchair, rollator or mobility scooter. In order to achieve this
    goal, the following research question is defined: Does the current setting
    of the meet rollator provide insight into the accessibility of pedestrian
    routes for mobility impaired people? If not, how can the current setting
    be improved? This research has evaluated the available sensor (handheld
    Global Positioning System (GPS), Real-Time Kinematic (RTK) GPS and camera)
    data collected by a meet rollator. Literature study showed that in order
    to determine walking restrictions in the outdoor activity space of people
    with mobility impairments, the geometrical demands for movement can be
    taken into account. According to the Manual-book of Accessibility and
    an expert Job Haug, a good pedestrian path for people with a wheelchair,
    rollator and scoot mobile has to meet three geometrical demands for movement.
    This means that a pedestrian path forms an obstacle if it is narrower
    than 0.9 meter, steeper than 9.46° or if the height difference on the
    path is higher than 0.05 meter. The outcome, according to the assessment
    of the three available sensors (handheld Global Positioning System (GPS),
    Real-Time Kinematic (RTK) GPS and camera) of the meet rollator by using
    the knowledge of the Master of Science program Geomatics, is that with
    a handheld GPS no precise positioning can be reached. Therefore handheld
    GPS data is not useful for generating accessibility information. According
    to the knowledge the two sensors RTK GPS and camera are useful for generating
    accessibility information. The outcome, according to the implementation
    of the developed workflow for deriving outdoor accessibility information
    for a selected research area, is that some paths in the outdoor environment
    of Amsterdam require improvements to make them accessible for mobility
    impaired people. Furthermore through data processing, more insight is
    gained into the usefulness of RTK GPS and camera data. The results showed
    that the used sensors did not provide the needed precision. For the validation
    of the derived outdoor accessibility information a division is made between
    the validation of RTK GPS observations and camera observations. The BGT+
    is proved suitable for providing more insight in and put semantics to
    the total observations obtained by implementing the workflows. The ground
    truth is proved suitable for validating the obtained accessibility information
    derived from RTK GPS and camera data. Finally, the results of an algorithm
    made by the Urban Modelling Group (UMG) of the University College Dublin
    are proved suitable for validating the obtained accessibility information
    derived from camera data. A geo-database that structures the validated
    accessibility information is created in order to give an overview of the
    accessible and non-accessible paths for the research area. The derived
    accessibility information obtained via camera data can best be stored
    by using polygons, to represent complex areas. The derived accessibility
    information obtained via RTK GPS data can best be stored by using line
    strings. In conclusion, this MSc thesis has demonstrated that the current
    setting of the meet rollator provides insight into the accessibility of
    pedestrian routes for mobility impaired people. However, the used sensors
    did not provide the needed precision. In order to improve the current
    setting of the meet rollator the usefulness of other sensors should be
    further investigated.'
  uuid: 29fc70b1-c262-4f3d-837f-5ecddb56d6f0
- surname: Abhilakh Missier
  name: Godelief
  title: Towards a Web application for viewing Spatial Linked Open Data of
    Rotterdam
  supervisors: Peter van Oosterom; Marianne de Vries; Bastiaan van Loenen
  year: 2015
  link: https://resolver.tudelft.nl/uuid:c5a80e2d-b1ab-46ed-95e9-56c7f0fefb83
  image: 2015_Abhilakh-Missier.jpg
  abstract: Governments and municipalities open up their data and publish
    spatial data on the Web, to be transparent to their citizens and to stimulate
    innovation. This spatial open data can be confusing for non-GIS experts,
    since data is published as either typical geo-formats or metadata is missing.
    Linked data could benefit in that regard. Linked data is a method to publish
    data on the Web in a way that it can be easily combined with other datasets
    on the Web. Linked data has benefits for spatial data regarding the combining
    of datasets to solve cross knowledge domain issues, the linking of metadata
    with the spatial data and the possibility to ask spatial queries. The
    research focused on how to apply the linked data method for spatial open
    data in order to profit from the benefits of linked data. The research
    provided a methodology to create spatial linked open data. In the case
    study for the Municipality of Rotterdam, four spatial open datasets concerning
    the composition of areas and neighborhoods in Rotterdam Zuid were converted
    to spatial linked open data and visualized on a Web map to exemplify the
    possibilities and limitations for spatial linked open data. The case study
    showed that there are multiple users who benefit from spatial linked open
    data. The results also showed that modeling spatial data according to
    the OGC standard for spatial linked data, the GeoSPARQL ontology, provides
    the possibility to ask spatial queries over the data to do a simple analysis
    or inventory over multiple heterogeneous and distributed datasets, by
    dynamically and implicitly linking datasets together on their location.
    As of now, not all tools for creating linked data support spatial data
    yet, therefore it can be time consuming to convert the data to spatial
    linked data. The on-the-fly method, where the existing spatial data is
    converted on the fly to linked data would be ideal, in terms of data management,
    since the data is more up-to-date and not copied. Spatial linked open
    data has benefits in cross knowledge domain issues where multiple heterogeneous
    and distributed datasets are required, such as in emergency management
    and urban planning.
  uuid: c5a80e2d-b1ab-46ed-95e9-56c7f0fefb83
  needs_review: true
- surname: Chen
  name: Carl
  title: Edge-aware simplification of roof and facade point clouds into a
    uniformly dense point cloud
  supervisors: Sisi Zlatanova; Elmar Eisemann; Bert Buchholz
  year: 2015
  link: https://resolver.tudelft.nl/uuid:662fad08-51a9-4f8d-acb1-4caf78d602bb
  image: 2015_Chen.jpg
  abstract: 'Point clouds can be obtained by airborne or terrestrial Light
    Detection and Ranging (LiDAR) scanning or directly from street-view panoramic
    imagery. Point clouds obtained from airborne scanners cover most roof
    information but lack facade information. Similar but orthogonal to airborne
    scanning, street-view point clouds cover well of the facade information
    but lack roof points. Therefore, it is necessary to combine those point
    clouds in order to construct a complete building model. For this combination,
    simplification is needed in which edge preservation, outlier removal,
    noise smoothing and uniform density have to be considered as these properties
    are desired in many post-processing applications. In this thesis, an algorithm
    pipeline is proposed that is able to take in an outlier-ridden, noisy
    and non-uniform roof and facade point clouds and generate an outlier-removed,
    edge-aware and uniform point cloud. The algorithm pipeline can be divided
    into two independent phases: outlier removal and simplification. The outlier
    removal algorithm can remove singly scattered and small cluster of outliers,
    whereas the simplification algorithm pipeline is able to generate a noise-reduced,
    uniform and edge-aware point cloud. The pipeline is validated to be able
    to achieve the objectives. Proof of efficiency in running-time is given,
    so that it can be used for processing large-size real-scene point clouds.'
  uuid: 662fad08-51a9-4f8d-acb1-4caf78d602bb
- surname: Janssen
  name: Milo
  title: 3D Intersection operations for voxel data represented as surfaces
    in GIS
  supervisors: Sisi Zlatanova; Marianne de Vries; Fransje Hooimeijer
  year: 2015
  link: https://resolver.tudelft.nl/uuid:7cec6091-5c62-4645-b2b2-c74c149e92a6
  image: 2015_Janssen.jpg
  abstract: 'This thesis focusses on the intersection 3D Boolean set operation
    on voxel data represented as surfaces, with other 3D surface based vector
    data, in GIS. The Application of this research makes the linkage with
    geohydrology possible: based on the vectorised GeoTOP (TNO) data the water
    infiltration and storage capacity of specific locations can be determined.'
  uuid: 7cec6091-5c62-4645-b2b2-c74c149e92a6
- surname: Makri
  name: Antigoni
  title: Indoor Signposting and Wayfinding through an Adaptation of the Dutch
    cyclist Junction Network System
  supervisors: Edward Verbree
  year: 2015
  link: https://resolver.tudelft.nl/uuid:ae4c0beb-f864-4274-aeb6-2b33514862de
  image: 2015_Makri.jpg
  abstract: 'Finding one''s way in complex indoor settings can be a quite
    stressful and time-consuming task, especially for users unfamiliar with
    the environment. There have been several different approaches to provide
    wayfinding assistance in order to guide a person from a starting point
    to a destination, ranging from traditional maps and signposting systems
    to the most recent developments of navigation systems displaying direction
    information on a mobile device screen. However, so far none of them has
    emerged to be efficient enough in order to act as a uniform solution for
    the wayfinding problem in indoor environments. Moreover, referencing to
    landmarks is not widely employed by wayfinding assistance systems despite
    the fact that landmark-based navigation is the most common way for people
    to navigate themselves through unfamiliar environments. The aim of this
    work is to propose a new wayfinding assistance method for indoor environments
    that makes use of the landmark concept. The method to achieve it is by
    translating the main principles of an already existing outdoor system
    named Junction Network System, which applies successfully for providing
    guidance to cyclists in The Netherlands. The most important parameter
    of the system is that assistance is provided to users where they actually
    need to make a directional choice. The first step is to automatically
    define the locations, i.e. the decision points, where wayfinding assistance
    is needed in indoor settings and the second is to supply them with a special
    type of landmark which will have the form of a signpost that provides
    all the necessary information. A graph based representation of the indoor
    setting is generated in order to extract the decision points and create
    the network of all possible routes in the environment. The conceptual
    framework for the determination of the decision points is implemented
    in two case studies: GeoFort main building and the Faculty of Architecture
    and the Built Environment (BK) of TU Delft. Two different building cases
    are used in order to gain an insight on how the system can be applied
    in different indoor environments. The part of the navigable indoor space
    where movement mainly occurs when people are in search of a destination
    was subdivided according to a geometric criterion (Constrained Delaunay
    Triangulation) while also the semantics of the space were taken into account
    in order to determine the decision points. By connecting all the decision
    points and the destinations a network of all the possible routes is created.
    A route is followed by referring to the sequence of numbers corresponding
    to the nodes of the network. The proposed system was verified based on
    a human-based survey. The proposed landmark-signs were installed at part
    of the faculty of Architecture and users were asked to find their way
    in the building relying only on them. The time to reach the destination
    and the number of detours were counted, while a questionnaire-based survey
    was used in order to further investigate the feelings and views of participants
    regarding the effectiveness of the system. The findings of the experiment
    are quite promising, as the performance of the participants in both measures
    was very good. Additionally, the results of the questionnaire indicate
    that users consider the system simple and comprehensive and they are in
    general satisfied by the provided assistance. However, further implementation
    and testing in more indoor space cases is needed in order to draw an indisputable
    conclusion about its effectiveness. Nevertheless, an important contribution
    of the research is the generation of a conceptual model in order to automatically
    determine the decision points in indoor environments that this can be
    applied invariable to other wayfinding assistance systems.'
  uuid: ae4c0beb-f864-4274-aeb6-2b33514862de
  needs_review: true
- surname: Mulder
  name: Damien
  title: Automatic repair of geometrically invalid 3D City Building models
    using a voxel-based repair method
  supervisors: Jantien Stoter; Hugo Ledoux; Pirouz Nourian
  year: 2015
  link: https://resolver.tudelft.nl/uuid:8ef4459d-b940-4007-bc3c-d87349015129
  image: 2015_Mulder.jpg
  github: https://github.com/dtmulder/VoxelRepair
  abstract: In recent years, the concept of 3D city models has been gaining
    in importance as more 3D geometry of urban areas is becoming available.
    Although 3D City models offer a structured way of storing geometry, in
    practice a significant amount of geometry is not considered valid. This
    hinders the further analyzing or processing of these models. Since manual
    repair of 3D City models is very time consuming and prone to errors, automatic
    repair methods are highly desirable. However, none of the existing repair
    methods are able to entirely repair all defects in 3D City Models. This
    thesis focuses on the process of transforming a defect 3D city model into
    a valid one by using a voxel-based repair method. The first step of this
    process is the scan conversion of a (defect) 3D building model into a
    volumetric representation. By applying a set of morphological operators,
    a single volume without holes can be acquired. The second step is to reconstruct
    a triangle mesh for a given volumetric representation. Two workflows are
    proposed to perform this step. The first workflow is based on the Marching
    Cubes algorithm, which generates a triangle mesh for a grid with binary
    or scalar values. The second workflow has been developed on the base of
    the Dual Contouring algorithm, which uses intersection points and surface
    normal vectors of the input model to generate a triangle or quad mesh.
    Finally a detriangulation is performed in the post processing, which writes
    the repaired model back to a polygonal 3D City model. In order to preserve
    any attributes of 3D City Models throughout the repair process, three
    alternatives are proposed; geometry based assumption, voxel based preservation
    or grid edge based preservation. Each of these possibilities may be suitable,
    depending on the selected workflow and desired application. Both workflows
    were tested on existing 3D City models. Validation of the first workflow
    shows that using the Marching Cubes algorithm is suitable for a reliable
    repair method. Applying it on a dataset with 90% of defect buildings,
    resulted in a dataset where only 4% of the building models remained defect.
    It must be noted however, that during this process sharp features are
    rounded off and jagged surfaces may appear. The validation of the second
    workflow, which aims to preserve sharp features by using the Dual Contouring
    algorithm, often resulted in self-intersections and thus defect output
    models. It was concluded that more research, including an implementation
    of an extension on the Dual Contouring algorithm are needed in order to
    determine the suitability of the second workflow for the repair of 3D
    City Building Models.
  uuid: 8ef4459d-b940-4007-bc3c-d87349015129
- surname: Onrust
  name: Benny
  title: Automatic generation of plant distributions for existing and future
    natural environments using spatial data
  supervisors: Wilko Quak
  year: 2015
  link: https://resolver.tudelft.nl/uuid:35f4cc9b-0cb8-4030-b1ae-ad2be146636f
  image: 2015_Onrust.jpg
  abstract: This research proposes an algorithm for the generation of realistic
    plant distribution for both existing and future areas using spatial data.
    The main motivation for this research is to be able to generate realistic
    plant positions for the 3D visualization of existing and future natural
    environments. Current techniques for determining plant positions are limited.
    Plant detection techniques from the remote sensing domain are only able
    to detect positions for large plants using high-resolution imagery and
    LiDAR data. Often, the plant type of each detected position is not known.
    In addition, imagery and LiDAR data are not available for future areas.
    This research demonstrates that spatial data for future can be generated
    by using dynamic ecological models. These models can produce height, biomass,
    and coverage maps for future areas. The proposed algorithm must be able
    to translate data from existing areas as well as data produces by ecological
    models to a realistic plant distribution. A realistic plant distribution
    can contain plant positions for small and large plants with their corresponding
    plant type. To be able to realize this, an algorithm is proposed that
    integrates concepts of procedural generation and ecological modeling.
    Different spatial datasets can be provided as input and are analyzed to
    obtain information of where certain plant types can or cannot be placed
    in the target area. The algorithm was tested on both an existing area
    and a future area generated by an ecological model. The results were validated
    with statistical and expert validation methods. The statistical validation
    showed that algorithm is able to map the spatial data input correctly
    to a plant distribution. The expert validation showed that the generated
    plant distributions were in general judged realistic and that most issues
    in each plant distribution were because of missing data input or due to
    low data quality. In the future, the algorithm could be used for different
    applications and research. One possibility is to improve the current plant
    detection technique by providing additional information about the positions
    of small plants and by providing information about the plant type for
    each point with this algorithm.
  uuid: 35f4cc9b-0cb8-4030-b1ae-ad2be146636f
  needs_review: true
- surname: Pronk
  name: Maarten
  title: Storing massive TINs in a DBMS - A comparison and a prototype implementation
    of the multistar approach
  supervisors: Jantien Stoter; Hugo Ledoux; Martijn Meijers
  year: 2015
  link: https://resolver.tudelft.nl/uuid:da6b7329-f45b-4560-8374-bb522e78121f
  image: 2015_Pronk.jpg
  github: https://github.com/evetion/multistar
  abstract: 'Solutions have been introduced to handle massive point clouds
    in Database Management Systems (DBMS), namely by Oracle in 2011 and postgreSQL
    in 2013. Many common operations on these massive point clouds require
    knowledge about the original surface in order to analyse them. A possible
    method to recreate a representation of the original surface is reducing
    a point cloud to a 2.5D structure such as a Triangular Irregular Network
    (TIN). This thesis explores the possibilities to store such massive TINs
    in a DBMS and presents criteria to define an efficient approach. The term
    ‘efficient’ is defined by the size of the data structure and the performance
    of spatial queries. Criteria for an efficient approach are developed by
    reviewing existing literature and comparisons of existing implementations.
    These criteria include: (1) the explicit storage of nodes of TIN, preventing
    duplicate information and resulting in small data structures. (2) the
    use of atomic functions such as slope, aspect and degree in order to enable
    analysis of the TIN inside the database. (3) the storage of topological
    relationships of the TIN, which is used for both atomic functions and
    spatial access to the TIN. (4) the use of buckets to split the TIN into
    non-massive sections that can be processed one at a time. A very large
    spatial index on each element of a TIN is therefore not needed. An index
    is only applied on the extents of the bucket. The TIN inside the bucket
    can be traversed using the topological relationships stored. The main
    problem encountered is to combine solutions for massive datasets with
    a TIN data structure, such as the use of buckets with a topological data
    structure. These problems are overcome by a novel data structure to store
    TINs in a DBMS called the Multistar. This data structure implements the
    aforementioned criteria for an efficient approach. The Multistar is compared
    in practice with the two existing database structures: the SDO_TIN by
    Oracle and the Simple Feature TIN type implemented in the PostGIS extension
    of PostgreSQL. This thesis shows that current implementations are not
    usable for both storing and accessing a massive TIN of 370M points. The
    Multistar is one of the smallest structures available and outperforms
    the other data structures significantly on massive TINs.'
