- surname: Yu
  name: Hang
  title: Monitoring Glacier Elevation Changes over the Tibetan Plateau Using
    ALOS PRISM and ICESat
  supervisors: Massimo Menenti; Roderik Lindenbergh; Kourosh Khoshelham
  year: 2010
  link: https://resolver.tudelft.nl/uuid:9e11a9bd-49a9-4e86-a856-8558e39dfb34
  image: 2010_Yu.jpg
  abstract: Glacier melting has become a key issue in the current discussion
    on global climate change. Glaciers of the Tibetan Plateau may be heavily
    affected by global warming. Hence, possible glacier melting over the plateau
    attracts the most attention. Possible glacier melting is evaluated via
    studies on mass balance of the glaciers. Glacier elevation change is an
    important parameter in mass balance assessments. Traditional observations
    of glacier elevation changes were acquired by surveying. As an example,
    a large elevation change of 1.5 m decrease was reported at Zhadang glacier
    on the southwest Tibetan Plateau between 2005 and 2006. Traditional surveying
    is expensive for large areas and is limited by the extreme terrain and
    weather conditions on the Tibetan plateau. Therefore, remote sensing techniques
    are preferred in the research on ongoing glacier elevation changes. The
    research method assessed here considers elevation changes obtained by
    comparing serial DEMs. Photogrammetry techniques are applied for DEM generation.
    The 2.5 m horizontal resolution satellite images of the ALOS PRISM instrument
    are used as base image. One PRISM scene centered at longitude 81°15´37”N
    and latitude 29°49´53”E, available at both Level 1A/1B and Level 1B2R/1B2G,
    is employed for DEM and quality evaluation. ICESat laser altimetry data
    from campaign L3I is selected as ground control points (GCPs). ICESat
    has decimeter vertical accuracy over flat terrain In this case ICESat
    elevations are chosen as GCPs because sufficient GCPs from other sources
    are not available. The DEM generation is performed in the ERDAS LPS 9.3
    software. The quality of the resulting TDEM (Tibetan Plateau DEM) is evaluated
    by ASTER GDEM and by data from different ICESat campaigns. Compared with
    ASTER GDEM, the mean difference is -41 meters. The TDEM has a mean difference
    of 5-10 meters with ICESat data from campaigns L3H, L3J and L3K. It is
    concluded that TDEM’s accuracy is sufficient to detect 15 m elevation
    change in 10 year’s time, which correspond to an annual glacier elevation
    change rate of 1.5 meters. The accuracy of TDEM is notably better than
    ASTER GDEM. As one TDEM tile reports the elevation of a glacier at a clear
    moment in time, TDEM is more suitable than ASTER GDEM for glacier mass
    balance studies.
  uuid: 9e11a9bd-49a9-4e86-a856-8558e39dfb34
