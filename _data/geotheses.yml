- surname: Kagkaras
  name: Adamantios
  title: Laser scanning modelling of a Cessna citation
  supervisors: Peter Teunissen; Ben Gorte; Alexander Bucksch
  year: 2006
  link: https://resolver.tudelft.nl/uuid:20993923-81e7-44ea-a296-1f02893412f1
  image: 2006_Kagkaras.jpg
  abstract: In Aerospace Engineering the field of Computational Flow Dynamics
    (CFD) studies the aerodynamic behaviour of aircrafts. What is currently
    being used to perform CFD simulations are Computer Aided Design (CAD)
    models of the airplanes, which are usually low-detail industrial design
    models. Research of new methods for improving the results of the simulating
    process is of great importance. One method that can be tested in this
    direction is the creation of more detailed models of the actual airplanes
    via reverse engineering techniques. Laser scanning is one of these techniques.
    Here, a laser scanner is used to measure TU Delft’s Cessna Citation. Afterwards,
    parts of the airplane are modelled by using suitable methods to process
    the obtained laser points.
