- surname: Verlaar
  name: Stijn
  title: Evaluation of close range photogrammetric support for Pavescan
  supervisors: Roderik Lindenbergh; Ben Gorte
  year: 2011
  link: https://resolver.tudelft.nl/uuid:3c8d42b1-fdf1-47f2-91af-cc71882c75ff
  image: 2011_Verlaar.jpg
  abstract: Pavescan is a low cost mobile system for road modelling survey.
    Because of the absence of navigation sensors it has several practical
    drawbacks compared to most of the other mobile mapping systems, but those
    sensors are very expensive and do not fulfil most of the accuracy requirements.
    Pavescan will be more attractive if some of the practical drawbacks are
    reduced. Pavescan measures road profiles across the road by laser scanning
    at a series of positions. The separate scans are linked via control points,
    which have to be measured in an additional survey. The accuracy in height
    of the scans is most important (e.g. for volume calculations) and has
    to be in the range of millimetres. It is evaluated if integrating close
    range photogrammetry can achieve millimeter accuracy of the scan and reduce
    the number of control points. A test survey was conducted with a downward
    looking camera, which was mounted close to the scanner at a height of
    around 3.6 metres above the road's surface. The position and orientation
    of the camera at each exposure is retrieved by bundle adjustment. The
    accuracy of the bundle adjustment depended strongly on the configuration
    of the control points. Due to the narrow shape of a strip of images, this
    configuration will always be weak. For a sequence of 28 images ( 43 metres),
    around five control points are needed to achieve sub-centimetre accuracy
    of the object points. If more than 36 images or fewer than four control
    points were used, the bundle adjustment diverged (i.e. no solution could
    be obtained). A reduction of control points is therefore not possible.
    The practical feasibility for integrating close range photogrammetry into
    Pavescan is low, since too many control points are needed that should
    spatially be well distributed and measured with tachymetry (or with similar
    accuracy). Therefore it is not recommended to integrate photogrammetry
    in Pavescan.
  uuid: 3c8d42b1-fdf1-47f2-91af-cc71882c75ff
