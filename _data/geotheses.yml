- surname: Yang
  name: Yue
  title: Directly Serving 3D Tiles From A Geo-DBMS
  supervisors: Martijn Meijers
  year: 2024
  graduation_date: '2024-04-12'
  link: https://resolver.tudelft.nl/uuid:096553de-711c-49fd-8428-50ee6203b4ce
  image: 2024_Yang.jpg
  abstract: The rise of urban digital twins emphasises the critical role of
    representing real-world environments for decision-making and collaboration
    among stakeholders. This leads to an expectation of effective management
    and visualisation of large-scale urban data models. 3D Tiles is an open
    specification designed for streaming and rendering massive heterogeneous
    3D geospatial datasets. It is widely adopted in fields such as urban planning
    and engineering construction, where geospatial data is crucial for decision-making
    and collaboration. However, as the 3D data size grows, the performance
    of traditional file-based solutions is facing challenges. Currently, dissemination
    and visualisation of 3D data are often reliant on file-based systems.
    Users suffer from problems such as long load times, data inconsistencies,
    and lack of flexibility. In this thesis, an approach for compactly storing
    both geometries and attributes in the Database Management System (DBMS)
    and efficiently serving data compliant with 3D Web standards to the client
    is proposed, advocating the direct serving of 3D Tiles from the database.
  uuid: 096553de-711c-49fd-8428-50ee6203b4ce
- surname: Zhang
  name: Chi
  title: 'Diffusion MVSNet: A Learning-based MVS Boosted by Diffusion-Based
    Image Enhancement Model'
  supervisors: Nail Ibrahimli
  year: 2024
  graduation_date: '2024-06-27'
  link: https://resolver.tudelft.nl/uuid:02a605e4-ebb1-4f5d-b7c8-7ef32baa82b1
  image: 2024_Zhang.jpg
  abstract: Multiview Stereo (MVS) reconstruction techniques have made significant
    advancements with the development of deep learning. However, their performance
    often deteriorates in low-light conditions, where feature extraction and
    matching become challenging. Traditional image enhancement solutions are
    insufficient for MVS tasks in low illumination, relying on manual adjustments.
    We introduce an end-to-end MVS framework incorporating a diffusion-based
    image enhancement algorithm with MVS to build an end-to-end framework
    for improving the performance of MVS in low-light conditions. This integration
    improves color rendering and visualization of 3D reconstructions and slightly
    enhances geometric shapes. Our method uses a feature adapter to integrate
    the enhanced images from the Low-light Diffusion model into CasMVSNet,
    refining the feature maps in poorly lit environments. Validation on the
    DTU and Tanks and Temples datasets demonstrates our model’s robustness
    and generalizability across various lighting conditions and MVS pipelines,
    including GeoMVSNet and MVSNet. Our approach simplifies the training process
    by requiring only the training of an adapter rather than a multi-view
    image enhancement model, underscoring the effectiveness of incorporating
    image enhancement into learning-based MVS frameworks for low-light conditions.
  uuid: 02a605e4-ebb1-4f5d-b7c8-7ef32baa82b1
- surname: Bachert
  name: Carolin
  title: Mapping the Energy ADE to CityGML 3.0
  supervisors: Giorgio Agugiaro
  year: 2023
  graduation_date: '2023-01-20'
  link: https://resolver.tudelft.nl/uuid:d253b343-7c96-45ee-9239-5c85594ad4fa
  image: 2023_Bachert.jpg
  github: https://github.com/tudelft3d/EnergyADEv1_toCityGMLv3
  abstract: In order to limit the global warming to well below 2 degrees Celsius,
    all sectors have to reduce their greenhouse gas emissions and become more
    sustainable. This also includes the building sector, which is in Europe
    responsible for 40% of the total energy consumption (European Commission,
    2020). A way to work towards this goal is by retrofitting the existing
    building stock to become more energy efficient. Urban Building Energy
    Modelling (UBEM) can help in this endeavour by identifying energy-saving
    potentials and thus to effectively allocate the required resources (Horak
    et al., 2022). Yet, UBEM involves many stakeholders which is why standards
    are crucial to facilitate data exchange and interoperability among them.
    In this context, the Energy ADE v1.0 was developed as an extension for
    the semantic 3D city model standard CityGML 2.0. It serves two purposes,
    first by storing energy related information on the individual building
    level, and second by providing the necessary input data for UBEM simulations
    (Agugiaro et al., 2018). However, in September 2021 CityGML 3.0 was released.
    The introduced changes directly affect the structure of the Energy ADE,
    which is why it cannot fully function on it anymore. This thesis therefore
    answers the question, how and to what extent the Energy ADE for CityGML
    2.0 needs to be adapted to be conformant with the new CityGML 3.0 standard.
    It is accomplished by following a model-driven approach, where the UML
    class diagrams for the mapped Energy ADE are created first, before automatically
    deriving the corresponding XSD schema file. Through the lossless mapping
    itself, the Energy ADE is integrated as much as possible into CityGML
    3.0, while also maintaining a logical symmetry. As such it accounts for
    the introduced changes of CityGML 3.0, by making use of the space and
    geometry concept, the versioning possibilities as well as the provided
    structures to model time-dependent data. The result is eventually tested
    and verified by converting a sample dataset to the Energy ADE for CityGML
    3.0. This work provides an example on how other ADEs can be adapted to
    fit the new CityGML 3.0 standard and thus hopefully to the further establishment
    of it.
  uuid: d253b343-7c96-45ee-9239-5c85594ad4fa
- surname: Dobson
  name: Daniël
  title: Floor count from street view imagery using learning-based façade
    parsing
  supervisors: Ken Arroyo Ohori
  year: 2023
  graduation_date: '2023-01-20'
  link: https://resolver.tudelft.nl/uuid:857658d4-9134-4935-9c28-fef907d9ace1
  image: 2023_Dobson.jpg
  github: https://github.com/Dobberzoon/Facade2Floorcount
  abstract: 'Street view imagery (SVI) is one of the largest (growing) resources
    in urban analytics. A global close-up of the urban environment, if you
    will, which is rich in (untapped) information such as floor count. Floor
    count is useful in many applications, from improving energy consumption
    calculations to creation of 3D city models without elevation data. So
    far, efforts to extract floor count from SVI are mainly approached as
    a classification problem with the use of convolutional neural networks
    (CNNs). Limitations of this approach include the need of large (manually
    annotated) datasets, and uncertainty how these models learn to count storeys.
    Therefore, we aim to develop a method that can be trained on available
    datasets and determine floor count in a more explainable manner. In order
    to make the floor count determination method more transparent, we mimic
    the row-wise counting of storeys as humans do: by vertically parsing a
    column of windows (and occasional door). Façade parsing is a common computer
    vision task that we can solve with deep learning. In this work, we employ
    the Mask R-CNN framework, that is trained on publicly available datasets,
    for the detection and segmentation of windows and doors. Then, the vertical
    distribution of detected / segmented windows and doors is estimated by
    computing the kernel density estimation function. The floor count is extracted
    by finding the number of maxima in the function, as the maxima represent
    the dense areas of windows and doors on a horizontal axis (i.e. storeys).
    To improve the results, an automatic image rectification is added as pre-processing
    step that enforces the regularity and repetitive occurrence of windows
    and doors. The full pipeline thus consists of three stages: 1) automatic
    image rectification, 2) window and door detection/ segmentation with Mask
    RCNN, 3) floor count estimation via maxima finding on the kernel density
    estimation (KDE) function. In addition, a small "wild" dataset was created
    that contains a higher variability in floor count, image quality and architectural
    styles, which better reflect real world SVI than existing façade datasets.
    The floor count performance of the full pipeline was evaluated on the
    Amsterdam Facade (subset), ECP, TRIMS and "wild SVI" datasets. Since floor
    count annotations were missing, these are manually added. For detection-based
    data, the best results are an accuracy of 83% and a mean absolute error
    (MAE) of 0.17. For normalised segmentation-based data, the best results
    are an accuracy of 80% and a MAE of 0.20. Considering the method is still
    at its infancy, the results are promising. With further improvements in
    the pipeline and addition of automatic façade acquisition, the approach
    can contribute in large scale extraction of floor count information from
    SVI. To encourage further development, the pipeline prototype, dataset
    and floor count annotations are open source and will be released on https://github.com/Dobberzoon/Facade2Floorcount.'
  uuid: 857658d4-9134-4935-9c28-fef907d9ace1
- surname: Dong
  name: Haoyang
  title: Correcting global elevation models for canopy and infrastructure
    using a residual U-Net
  supervisors: Maarten Pronk
  year: 2023
  graduation_date: '2023-07-03'
  link: https://resolver.tudelft.nl/uuid:8a314c3d-81ad-45e4-9b78-a00a3dae0a86
  image: 2023_Dong.jpg
  github: https://github.com/AkiGoat/DSM2DTM-ResUNet
  abstract: Digital Surface Models (DSMs) are commonly employed to investigate
    topographical characteristics and processes; however, the presence of
    canopy and infrastructure in urban and forested areas can lead to height
    biases and inaccuracies. In this study, I aim to correct such biases by
    applying a deep learning approach known as Residual U-Net to remove the
    selected pixels and generate Digital Terrain Models (DTMs) that accurately
    represent the Earth's surface without canopy and infrastructure influence.
    The Residual U-Net model was trained and tested on a dataset of DSM and
    DTM pairs, which were acquired from resampled AHN4. The model was evaluated
    on its ability to predict DTMs from DSMs, and its performance was compared
    with other existing methods. Additionally, the model was tested on different
    resolutions and the Copernicus DEM to assess its adaptability and generalization
    capabilities. The results indicate that the Residual U-Net model outperforms
    conventional techniques, effectively reducing the influence of canopy
    and infrastructure, and resulting in DTMs with enhanced precision. The
    study also explores the errors in detail and identifies the model's error
    causes, highlighting its limitations and areas for potential improvement.
    This study concludes by demonstrating the efficacy of applying deep learning
    techniques, such as Residual U-Net, to correct global elevation models
    for canopy and infrastructure. The results indicate that the model is
    a promising tool for topographical investigation in both urban and woodland
    situations, offering a versatile solution for generating accurate DTMs
    from DSMs.
  uuid: 8a314c3d-81ad-45e4-9b78-a00a3dae0a86
- surname: Erbașu
  name: Mihai-Alexandru
  title: Improving the content of Vario-Scale Maps - An analysis into the
    generalization of border structures
  supervisors: Martijn Meijers; Peter van Oosterom
  year: 2023
  graduation_date: '2023-01-19'
  link: https://resolver.tudelft.nl/uuid:1f17418f-63a8-47ab-a843-8a2624925a7c
  image: 2023_Erbasu.jpg
  abstract: 'As the way we interact with maps keeps changing, so do the maps
    change alongside. And it can be easily pointed out how these changes come
    alongside a large number of advantages for the average map user, such
    as quick access to data or the ability to view more or less of the Earth''s
    surface with just a mouse scroll, as well as for specialists such as cartographers
    or spatial data analysts, as it is now easier then ever to manipulate
    complex data. That being said, the challenges have also shifted, from
    the expertise of the map maker to the software solutions which now do
    all the work. One of the many challenges imposed by the aforementioned
    is represented by the way the map generalization process is achieved.
    This graduation project serves as a continuation to the countless amount
    of research which has already been performed in this field, with a focus
    on the niche world on Vario-Scale Maps, and in particular how borders
    are handled in this generalization process. There is already a large number
    of different solutions available, some of them being considered as standard
    and used by some of the biggest players in the world of geo-information.
    However, it seems that no single one solution is a `silver bullet`, as
    they all have their advantages and disadvantages, as well as cases where
    one generalization workflow is clearly more suited then others. Considering
    the actual status quo of the industry, this thesis will take a look at
    some of these already available solutions on the market, both individually
    as well as together, and will try to answer the following research question:
    \emph{To what extent can multiple line-generalization algorithms be (simultaneously)
    introduced in the Vario-Scale structure such that they preserve the topology
    and enable an optimal line density (while trying to preserve the characteristics
    of the initial shape as well).} To reach an answer, it is necessary to
    start first from the lowest level, with understanding how line generalization
    function in different situations, then slowly building up the structure
    by introducing these new concepts in the broader workflow, to see what
    impact it has on it as a whole.'
  uuid: 1f17418f-63a8-47ab-a843-8a2624925a7c
- surname: Geers
  name: Lisa Yvette
  title: 'Localising objects with drones: A case study on the localisation
    of fisher boats in restricted areas'
  supervisors: Martijn Meijers; Azarakhsh Rafiee; Niels van der Vaart
  year: 2023
  graduation_date: '2023-01-17'
  link: https://resolver.tudelft.nl/uuid:bced95cc-54eb-474d-b963-21cc9eb0cf13
  image: 2023_Geers.jpg
  abstract: Due to safety or preservation reasons, certain objects or areas
    need to be inspected regularly. Currently, the inspection of objects is
    mostly done in-person, which is labour-intensive and not very effective.
    With the use of drones, areas and objects can be inspected from new angles
    at a much faster rate. To effectively monitor these objects with drones,
    the position and location needs to be extracted from drone data in real
    time. In this thesis, a case study is done on the localisation of fisher
    boats in restricted areas. Several components are integrated to create
    a prototype. The pretrained YOLOv3 detection model is trained on acquired
    nadir boat images, which makes it able to predict the bounding boxes of
    boats on images captured with drones. A positioning algorithm is constructed,
    which calculates the geographical coordinates from the pixel coordinates
    for images taken both in a nadir and an oblique angle. A real time connection
    is constructed between the drone and the prototype. This is done by creating
    a connection with Google Drive with the drone controller and the prototype.
    The positioned polygon bounding boxes are localised using a real time
    dashboard, which visualises the bounding boxes in a map with other relevant
    layers. The results indicate that the performance of the components and
    prototype as a whole are satisfactory for this use case. To deploy this
    prototype in other object localisation use cases, it is recommended to
    train the pretrained model further, use a drone with more accurate equipment
    and run the prototype on the drone controller.
  uuid: bced95cc-54eb-474d-b963-21cc9eb0cf13
- surname: Mbwanda
  name: Tendai
  title: Further Development of a QGIS plugin for the CityGML 3D City Database
  supervisors: Giorgio Agugiaro; Camilo León Sánchez
  year: 2023
  graduation_date: '2023-06-20'
  link: https://resolver.tudelft.nl/uuid:6786ac5c-b61d-4e17-8501-e3cf2c7a9577
  image: 2023_Mbwanda.jpg
  abstract: Diversity in the use cases of semantic 3D city models today is
    unprecedented. A key enabler for this is the CityGML standard developed
    by the OGC to facilitate storing and exchanging these city models. Nevertheless,
    CityGML only provides object definitions which cater for a wide range
    of applications, making necessary the need to attach additional semantic
    information specific to each domain. For this reason, CityGML was designed
    with generic components that allow it to be extended. Alternatively, an
    extensibility mechanism that strengthens semantic interoperability in
    data exchange is the ADE. An example is the Energy ADE which augments
    CityGML for Urban Energy Modelling at single-building and city-wide scales.
    Base CityGML datasets are commonly encoded using the XML, though there
    are other encodings based on the JSON and SQL. The latter encoding is
    favourable for its associated benefits that come from the underlying DBMS.
    The 3DCityDB , upon which this thesis is based, is one such encoding that
    is open source and developed for PostgreSQL and Oracle. It has a complex
    structure which makes it difficult for users without extensive knowledge
    of CityGML, databases and SQL to access data. Hence, the 3DCityDB-Tools
    plugin was developed to simplify user interaction with the 3DCityDB using
    QGIS. However, encoding an extended CityGML dataset in the 3DCityDB adds
    greater complexity to a system that is already complex. In addition, 3DCityDB-Tools
    currently has no support for ADEs. On this backdrop, this research was
    initiated to investigate the extent to which ADE support can be introduced
    to the 3DCityDB-Tools plugin. Its server-and-client-side components are
    further developed to have extended layers that interact with data in 3DCityDB
    tables, can be managed from the GUI in QGIS and whose attributes are editable.
    This was achieved in an incremental and iterative process while maintaining
    the current architecture and user experience of the plugin. Areas identified
    for future development relate to the underlying database encoding of CityGML
    and capabilities not yet supported.
  uuid: 6786ac5c-b61d-4e17-8501-e3cf2c7a9577
- surname: Meines
  name: Siebren
  title: 'LuminaCity: a Real-Time Daylight Analysis Tool for Architectural
    and Urban Development Using Unreal Engine'
  supervisors: Azarakhsh Rafiee; Eleonora Brembilla
  year: 2023
  graduation_date: '2023-07-03'
  link: https://resolver.tudelft.nl/uuid:8fefa31e-636d-48b6-9647-1181859c8300
  image: 2023_Meines.jpg
  abstract: This thesis presents the development of a real-time daylight analysis
    tool for architectural and urban development using the Unreal Game Engine.
    The tool offers architects and urban planners a fast and precise way of
    analysing outdoor daylight conditions in their designs. The Unreal Game
    Engine provides real-time visualisation and analysis of daylight conditions,
    which makes it an effective tool for real-time decision-making during
    the design process. The study compares the light values and the process
    of extracting these values in Unreal with the validated light model Radiance
    used in Honeybee & Ladybug in the visual scripting program Grasshopper
    for Rhino. The thesis compares the values of Unreal & Honeybee/ladybug
    based on outdoor illuminance values, calculation time and ease of use.
    The comparison demonstrates the potential of Unreal as a valuable daylight
    analysis tool, with measurements showing a Mean Absolute Error of 9.78%
    between Honeybee and Unreal. In terms of computational time, the Unreal
    application requires only 0.6ms to execute and recalculate the daylight
    analysis, whereas the complete Honeybee script took an average of 93 minutes
    to calculate daylight values, and a new angle calculation took approximately
    645 seconds. Furthermore, unlike Honeybee, which is sensitive to the complexity
    of urban or complex geometries and requires challenging adjustments, the
    Unreal application effortlessly accommodates complex geometry without
    the need for extensive modification. The thesis concludes that the tool
    provides a robust and efficient method for analysing daylight conditions
    in architectural and urban design. The tool's ease of use and real-time
    visualisation capabilities make it an essential addition to the design
    workflow. Finally, the thesis presents the tool as a proof of concept
    for a geospatial urban development platform with built-in geospatial analysis.
    The research has demonstrated the potential of real-time simulation and
    analysis using the Unreal Game Engine as a powerful tool for architects
    and urban planners.
  uuid: 8fefa31e-636d-48b6-9647-1181859c8300
- surname: Meschin
  name: Katrin
  title: Canopy gap fraction estimation from ICESat-2 ATL08 product
  supervisors: Maarten Pronk
  year: 2023
  graduation_date: '2023-04-19'
  link: https://resolver.tudelft.nl/uuid:4c44f0fb-bd69-44d8-8ba9-6ae0b9584828
  image: 2023_Meschin.jpg
  github: https://github.com/Mschn-k/MSc_thesis
  abstract: With the increasing pressure on global forests due to deforestation
    and habitat loss, it is more important than ever to understand our forest
    ecosystems on a larger scale. Canopy gap fraction is an indicator used
    for estimating forest biomass and better understanding of ecosystem functioning.
    For decades there have been research on computing canopy gap fraction
    using ground measurements as well as Airborne Laser Scanning (ALS). These
    approaches, however, are limited by the data available. A global coverage
    of data on canopy gap fraction could be made available by space-based
    laser altimetry mission Ice, Cloud and land Elevation Satellite (ICESat-2).
    Although its main scientific objectives are focused on polar areas, it
    has already proven to facilitate broader scientific disciplines. The ATL08
    data product is focused on land-vegetation and already provides global
    data on canopy heights. However, there is ongoing research for using ATL08
    data for canopy gap fraction estimation. Although some approaches have
    been suggested in the literature, a tested workflow to achieve this goal
    has not been published. This thesis tests two methods for estimating canopy
    gap fraction from ICESat-2 ATL08 data and evaluates the results against
    openly available ALS data. First, a simple method of using canopy to total
    photon ratio is used. Then, an alternative method that aims to correct
    for the surface reflectivity is tested. The results from both methods
    are similar, therefore the computationally less expensive method is recommended.
    Although this thesis does not achieve to present a sufficiently accurate
    approach for using ICESat-2 ATL08 data for canopy structure estimation,
    it is shown that further research is needed and the results are promising.
    Furthermore, it is demonstrated that annual trends in canopy gap fraction
    can be seen in ATL08 data. Considering the global coverage of ICESat-2
    data, it is concluded that despite the accuracy not meeting the expectations,
    using ATL08 for studying canopy gap fraction on a global scale and through
    time has high value and great potential for environmental research.
  uuid: 4c44f0fb-bd69-44d8-8ba9-6ae0b9584828
- surname: Panagiotidou
  name: Ioanna
  title: 'Semantically-Guided 3D Building Facade Reconstruction: A Learning-Based
    MVS Approach'
  supervisors: Nail Ibrahimli
  year: 2023
  graduation_date: '2023-10-27'
  link: https://resolver.tudelft.nl/uuid:6b3a4d29-45f6-4432-ac31-67ceae7dd75a
  image: 2023_Panagiotidou.jpg
  github: https://github.com/ipanagiotidou/CasMVSNet_pl
  abstract: 'This thesis introduces a Learned-Based Multi-View Semantic Stereo
    method, addressing the limitations of traditional and learned-based Multi-View
    Stereo (MVS) techniques in reconstructing reflective and low-textured
    regions, particularly prevalent in 3D models of buildings. Traditional
    methods lack completeness, while learned-based methods struggle with accuracy.
    Focusing on enhancing 3D models of buildings, this research integrates
    semantic information into the existing deep learning architecture for
    depth prediction, specifically CasMVSNet, to guide the reconstruction
    process. Three key strategies are employed: first, the incorporation of
    semantic maps into the network through a multi-modal approach; second,
    the introduction of a multi-modal refinement module at the end of the
    CasMVSNet model to improve the initial output depth maps; and third, the
    introduction of two new loss terms designed to enforce varying degrees
    of smoothness on specific semantic categories. Experimental results, conducted
    on the DTU dataset, demonstrate a significant enhancement in accuracy
    at the point cloud level while maintaining the completeness of the reconstructed
    models. Validation and generalization on the ETH3D dataset show consistent
    patterns. This research showcases the potential of integrating semantic
    guidance in 3D reconstruction of buildings, advancing the field of computer
    vision.'
  uuid: 6b3a4d29-45f6-4432-ac31-67ceae7dd75a
- surname: Papadimitriou
  name: Chrysanthi
  title: 'All in? Identifying and tackling private sector’s barriers to data
    sharing: A Perspective on geospatial data in the Netherlands'
  supervisors: Bastiaan van Loenen
  year: 2023
  graduation_date: '2023-10-31'
  link: https://resolver.tudelft.nl/uuid:0e21cba1-a238-43b0-935e-ef70ec9b160d
  image: 2023_Papadimitriou.jpg
  abstract: There is a drive to create an inclusive open data ecosystem, that
    includes public, private and academic open data [Loenen et al., 2021].
    There is a lot of existing research in Open Government Data [Janssen et
    al., 2012; van Panhuis et al., 2014; Martin et al., 2013] and plethora
    of OGD in the Netherlands. Although the private sector produces a lot
    of data, those are not open, as they are not participating in data sharing.
    In order, to fill the existing data gap, that OGD create, the EU [Commission,
    2018], specifically with the Open Data Directive, started to promote more
    openness in private sector data, especially geospatial data. So far this,
    it is only done for public undertakings, as a sector in between public
    and private Boone and van Loenen [2022]; van Veenstra and van den Broek
    [2013]. The private sector is not bounded by legislation to share their
    geospatial data. This research aims to identify what are the challenges
    to arrive at an ecosystem with more open private sector data, through
    the identification of the barriers in the process, in relation to the
    level of openness they are and how to move forward. Five categories of
    barriers are identified, strategic, technical, legal, economic, cultural
    and a multi model with 4 levels of openness is used, to identify the current
    state of geospatial data sharing of 9 companies in the Netherlands. The
    results show that companies that are providers of data are mostly sharing
    internally, trying to share with external users, while companies that
    are intermediaries are mostly sharing with some external users but they
    are not sharing fully open data yet, and the companies as user of existing
    open data are difficult to identify. This research demonstrates the influence
    of the role of the company in data sharing and the level of dataset, project,
    department in the barriers that the private sector faces and prevent them
    from sharing geospatial data in the Netherlands.
  uuid: 0e21cba1-a238-43b0-935e-ef70ec9b160d
- surname: Pereira
  name: Simon Pena
  title: Automated rooftop solar panel detection through Convolutional Neural
    Networks
  supervisors: Azarakhsh Rafiee; Stef Lhermitte
  year: 2023
  graduation_date: '2023-01-18'
  link: https://resolver.tudelft.nl/uuid:deceb957-59ae-46f7-9c48-cf0489ce0f23
  image: 2023_Pereira.jpg
  abstract: Transforming the global energy sector from fossil-fuel based to
    renewable energy sources is key to limiting global warming and efficiently
    achieving climate neutrality. The decentralized nature of the renewable
    energy system allows private households to install photovoltaic (PV) systems
    on their rooftops. In this context, planning an efficient grid expansion
    is becoming increasingly difficult. Therefore, deep learning (DL) techniques,
    such as convolutional neural networks (CNNs), can support collecting meta
    data about PV systems from aerial or satellite images, as research in
    the field of remote sensing has shown. However, previous research lacks
    the consideration of ground truth data-specific characteristics of PV
    panels. This thesis aims to implement a semantic segmentation model that
    detects PV systems in aerial imagery to emphasize the relevance of area-specific
    characteristics for the training data and convolutional neural network
    (CNN) hyperparameters. A CNN with U-Net architecture is employed to analyze
    the impacts of land use types, rooftop colors, near-infrared (NIR) data,
    and lower-resolution images on the detection rate of PV panels in aerial
    imagery. The results indicate that a U-Net is suitable for classifying
    PV panels in high-resolution aerial images (10 cm) by reaching F1-scores
    of up to 91.75% while demonstrating the importance of adapting the training
    data to area-specific ground truth data in terms of urban and architectural
    properties.
  uuid: deceb957-59ae-46f7-9c48-cf0489ce0f23
- surname: Powalka
  name: Leon
  title: Shape-guided artistic route finding
  supervisors: Liangliang Nan
  year: 2023
  graduation_date: '2023-06-19'
  link: https://resolver.tudelft.nl/uuid:11e9b0c2-5d67-475a-8653-71c7afe03dad
  image: 2023_Powalka.jpg
  abstract: Creating GPS art on the map is an interesting way to make one’s
    outdoor activity more engaging. Cyclists, runners and hikers can create
    impressive drawings on the map by traversing the road/pedestrian network
    in a carefully planned way. Such planning, however, is often tedious and
    time consuming, which makes the GPS artists have to meticulously design
    the routes with the complex road network in mind. The aim of our research
    is to come up with a full process that can express a person’s initial
    idea (for example a contour drawing) as a route, which the user can then
    follow to create their GPS art. This involves transforming the input image
    to match the routing network in a selected area and generating a route
    which approximates the shape in the best possible way. In our work, searching
    for patterns in the road network is cast to an image matching problem
    with template matching as the solution. Generating routes is achieved
    using a graph routing algorithm with a custom cost function, to make the
    resulting route as similar to the input shape as possible. Finally, two
    ways of generating artistic routes are presented. First is an automatic
    GPS art workflow, which attempts to find an optimal initial location of
    the route, then generates a number of candidate routes and selects the
    best one according to various evaluation criteria. The second method is
    an interactive browser application, where the user can select an initial
    location for his shape on the map, move, scale or rotate it and get instant
    feedback in the form of artistic routes displayed in real time.
  uuid: 11e9b0c2-5d67-475a-8653-71c7afe03dad
- surname: Theodoridou
  name: Eleni
  title: Implementation of OGC SensorThings API standard for the integration
    of dynamic sensor data in a 3D urban digital twin
  supervisors: Azarakhsh Rafiee
  year: 2023
  graduation_date: '2023-11-16'
  link: https://resolver.tudelft.nl/uuid:b92de6b0-a868-4910-9392-cf1063fb9639
  image: 2023_Theodoridou.jpg
  abstract: Urban areas are home to over half of the global population and
    consume significant natural resources, necessitating effective city management
    for urban resilience and sustainability. Resilient cities are better prepared
    to face challenges, from natural disasters to economic downturns, and
    adapt to climate change, resource scarcity, and population growth. Urban
    digital twins, which are virtual replicas of cities integrating data from
    various sources, play a pivotal role in enhancing and supporting urban
    resilience. These digital twins empower urban planners, designers, and
    the public to make informed decisions, identify vulnerabilities, and respond
    to acute shocks in real-time. Leveraging technologies like the Internet
    of Things (IoT) and 3D city models, urban digital twins offer a dynamic
    representation of the city’s functions, allowing for better visualization,
    monitoring, and decision-making. However, challenges related to interoperability
    and data acquisition need to be addressed to maximize the potential of
    urban digital twins. This thesis investigates how environmental sensor
    data can be collected, processed, and integrated into 3D city models to
    visualize the dynamic elements of a city comprehensively. It explores
    the use of international standards, such as the OGC SensorThings API standard
    to acquire, store, and manipulate real-time and historical crowd-source,
    sensor data in a consistent and interoperable manner. The concepts of
    sensor data pre-processing and interpolating are also explored through
    OGC standards, in the context of providing detailed spatio-temporal information
    for the urban environment, while the results are visualized in a 3D web
    application.
  uuid: b92de6b0-a868-4910-9392-cf1063fb9639
- surname: Therias
  name: Adele
  title: 'Integrating radar and multi-spectral data to detect cocoa crops:
    a deep learning approach'
  supervisors: Azarakhsh Rafiee
  year: 2023
  graduation_date: '2023-06-21'
  link: https://resolver.tudelft.nl/uuid:314e12c9-c3bc-478b-b664-d0c0680f3caf
  image: 2023_Therias.jpg
  abstract: The production of cocoa beans contributes to 7.5% of European
    Union (EU) driven deforestation. For this reason, the recent European
    Union Deforestation-free Regulation (EUDR) requires producers to perform
    comprehensive tracking of cocoa farm extents. However, cocoa crops present
    unique detection challenges due to their complex canopy structure, spectral
    similarity to forest, variable farming methods, and location in frequently
    cloudy regions. Previous work employs Multispectral Imagery (MSI) and/or
    Synthetic Aperture Radar (SAR) for pixel-based classification of satellite
    images. Convolutional Neural Network (CNN)s offer a promising approach
    to semantic segmentation of cocoa parcels that considers = both spectral
    and spatial characteristics. This thesis aims to evaluate the impact of
    combining SAR and MSI data in the training of a CNN for cocoa detection,
    in order to demonstrate the importance of texture, moisture and canopy
    characteristics in identifying cocoa canopies. A U-NET is employed to
    evaluate how prediction results are impacted by the stacking of MSI datasets
    with different SAR polarizations, seasons and temporality. The results
    show that the addition of single-day and temporal SAR to a single-day
    MSI image can improve the predictions, reaching an F1 score of 86.62%.
    This research demonstrates the influence of SAR measurement season and
    polarization, and ground truth classes, on the semantic segmentation of
    cocoa.
  uuid: 314e12c9-c3bc-478b-b664-d0c0680f3caf
- surname: Visser
  name: Fabian
  title: Neural Surface Reconstruction and Stylization
  supervisors: Nail Ibrahimli; Liangliang Nan
  year: 2023
  graduation_date: '2023-06-21'
  link: https://resolver.tudelft.nl/uuid:7f8ef49b-7c9c-4281-bd93-b921d9b28d49
  image: 2023_Visser.jpg
  github: https://github.com/fabisser/stylesdf
  abstract: Style transfer is a recent field in the development of deep neural
    networks, which allows for the style from one image to be transferred
    onto another image. This has been well-researched for 2D images, but transferring
    style onto 3D reconstructed content can still be further developed. Being
    able to style a 3D reconstruction would allow users to recreate anything
    in the real world, such as a chair, with any style they see fit. Where
    other methods use texture-based approaches which often create low quality
    geometry and appearance, or use radiance fields which style a whole scene
    instead of just the 3D reconstructed object, we have developed a method
    which styles an implicit surface. We achieve this by using Implicit Differentiable
    Renderer (IDR), which trains, using masked images as input, two neural
    networks that learn the geometry and appearance. Rendered views of the
    object are styled using 2D neural style transfer (NST) methods, and the
    style information is used to further train the appearance network to display
    the given style. With Masked deferred back-propagation we are able to
    optimize the appearance renderer, which is normally trained on only patches
    of the rendered image to save memory, while using style transfers designed
    for full-resolution images. We showcase different results from our method
    using different 3D reconstruction datasets and style images, and showcase
    how to implement a user-created dataset. We carry out extensive tests
    on what effects different parameters have on the final result. Comparing
    our results to similar 3D style methods demonstrates that our method performs
    equally well in achieving faithful style transfer, while having the benefits
    of creating high quality geometry and only styling the reconstructed surface.
  uuid: 7f8ef49b-7c9c-4281-bd93-b921d9b28d49
- surname: Xia
  name: Yitong
  title: A data-driven approach to add openings to 3D BAG building models
  supervisors: Jantien Stoter
  year: 2023
  graduation_date: '2023-06-19'
  link: https://resolver.tudelft.nl/uuid:eaff38b9-65f4-4c1c-8cec-aebd8fc4b18f
  image: 2023_Xia.jpg
  github: https://github.com/YitongXia/LOD3-Model
  abstract: The reconstruction of 3D city models has garnered significant
    interest in recent years. However, the majority of existing reconstruction
    methods primarily focus on LOD2 models, while LOD3 model reconstruction
    often relies on manual labor, and the primary data sources are street
    view images. This research aims to advance this field by reconstructing
    LOD3 models through the addition of windows and doors to existing LOD2
    models, thereby maximizing the utility of available 3D building models,
    as well as the accurate addition of windows and doors. This research innovatively
    utilizes aerial oblique images as the data source for extracting building
    openings and employs 3D BAG LOD2.2 models as the basic 3D building structures.
    The 3D facades are projected onto the 2D aerial image space using perspective
    projection and registration is employed on the projection facade and oblique
    aerial images. Subsequently, Mask R-CNN is employed to detect and extract
    the building openings from these projections. Following the extraction,
    the layout of the openings within the same facade is optimized in terms
    of both size and position. Lastly, the relative positions of the openings
    on the facade images are combined with the 3D coordinates of the corresponding
    facade to calculate the positions of the openings in 3D space. This information
    is then integrated into the LOD3 model, resulting in a more detailed and
    accurate representation of the buildings. This approach successfully reconstructs
    the final LOD3 model in CityJSON format, which passes the val3dity validation.
    By effectively utilizing existing 3D building models, this approach conserves
    a considerable amount of computational resources required for reconstruction.
    The simplicity and high level of automation of this approach make it a
    promising solution for reconstructing large-scale LOD3 buildings, leading
    to more accurate and detailed large 3D urban models.
  uuid: eaff38b9-65f4-4c1c-8cec-aebd8fc4b18f
- surname: Yan
  name: Lan
  title: Extraction of Exterior Building Envelopes from Building Information
    Models
  supervisors: Ken Arroyo Ohori
  year: 2023
  graduation_date: '2023-06-19'
  link: https://resolver.tudelft.nl/uuid:2ff23b56-dc28-4c71-adf7-a9aecfcce413
  image: 2023_Yan.jpg
  github: https://github.com/tudelft3d/Building_Envelope
  abstract: With the development of technologies and people’s raising standards
    for both indoor and outdoor environments, buildings have expanded their
    functionalities of merely being human’s everyday sheltering place. Common
    modern building applications include but are not limited to Building Energy
    Modelling (BEM), solar potential estimation, wind simulations, shadow
    analysis, noise propagation, and digital building permit checking. Among
    all the common building applications, many of them only need to use the
    building’s envelope (A building’s envelope is composed of all building
    elements that are exposed to the outdoor environment). It is apparent
    that building envelope extraction can be beneficial to these applications.
    Currently, building envelopes are mainly constructed from point cloud
    data or satellite image data. With the increased usage of Building Information
    Model (BIM) models within the Architecture, Engineering and Construction
    (AEC) industry, more attempts have been done on extracting building envelopes
    from BIM models as well. In addition, the BIM-based building envelope
    tool can be used throughout the building’s life cycle. However, previously
    developed BIM-based building envelope extraction tools all have different
    types of flaws. The main problem with the existing methods is separating
    the building envelope elements is difficult and time-consuming. Considering
    the benefits extracting building envelopes from BIM models can bring and
    the limitations of the developed methods, it is beneficial to develop
    a different BIM-based building envelope extraction approach that can produce
    high-quality building envelopes efficiently. Therefore, in this study,
    to avoid the difficult problem of separating building interiors and building
    exteriors, we first extract the point cloud from BIM models and then extract
    this point cloud’s exterior boundary using the 3D alpha shape algorithm,
    and therefore obtain the building envelope. The quality of the extracted
    building envelopes is evaluated by their geometric accuracy, simplicity,
    and time efficiency. Among them, the geometric accuracy is evaluated by
    the deviations between the extracted surfaces and the original surfaces.
    The simplicity is measured by the number of vertices and faces, and the
    time efficiency is measured by the building envelope extraction speed.
    The results show that despite the developed method has some limitations,
    it can extract building envelopes with high geometric accuracy from various
    types of small-scale BIM models. The main limitations include its inability
    to process big BIM models, the extracted building envelope merely contains
    its geometry without the enrichment of topological and semantic information.
    For all the tested BIM models, the average geometric accuracy is within
    2.00cm. Walls and roofs are very accurately extracted, with errors of
    less than 0.01cm. Windows, doors, and other types of small-scale objects
    are extracted with a bigger error of 0.1m to 0.3m. The extracted building
    envelope also simplifies the input models significantly regarding the
    number of vertices and the number of faces. Lastly, for small-scale models,
    the developed building envelope extraction tool is able to process them
    within 150s.
  uuid: 2ff23b56-dc28-4c71-adf7-a9aecfcce413
- surname: Zhang
  name: Fengyan
  title: Snap rounding polygons with a triangulation
  supervisors: Ken Arroyo Ohori; Hugo Ledoux
  year: 2023
  graduation_date: '2023-06-22'
  link: https://resolver.tudelft.nl/uuid:295f89f6-445b-4f3c-a764-cb78d7e9b825
  image: 2023_Zhang.jpg
  github: https://github.com/zfengyan/snapoly
  abstract: Geometric algorithms are usually designed based on the assumption
    of using arbitraryprecision representations. However, in modern computer
    systems floating-point arithmetic and finite-precision approximation are
    often used as implementing exact computations would require large computational
    resources and would be rather slow in the applications. Snap rounding
    (SR) is a widely used technique to transform representations of infinite
    precision into fixed-precision formats. It slightly modifies the original
    geometry of the input in order to obtain a better organized geometric
    object arrangement and avoid the issues caused by applying floating-point
    arithmetic in geometric algorithms. The existing implementations of SR
    primarily focus on processing sets of line segments, while in practice
    polygons are of great significance as well yet has not received adequate
    attention so far. In this thesis, a new method is proposed to perform
    SR on 2-dimensional polygons. Firstly the input polygons are embedded
    into a triangulation. Subsequently, the triangulation is tagged with the
    ID information of polygons and the polygon boundaries are extracted and
    stored in a container. The boundaries and the triangulation are then dynamically
    processed according to the identification of close polygonal vertices
    and close vertex and boundaries (under a predefined tolerance). After
    having snapped all the close elements the rounded polygons will be reconstructed
    from the processed boundaries. The testing results show the proposed method
    is capable of eliminating small gaps between elements (i.e. vertices and
    boundaries) and is adaptable to various inputs. The topological and geometrical
    properties of polygons are preserved as much as possible. Finally, an
    overview of the limitations is provided, along with potential directions
    for future research.
  uuid: 295f89f6-445b-4f3c-a764-cb78d7e9b825
- surname: Apra
  name: Irène
  title: Semantic segmentation of roof superstructures
  supervisors: Ken Arroyo Ohori
  year: 2022
  graduation_date: '2022-06-28'
  link: https://resolver.tudelft.nl/uuid:a9530c9d-3732-4c68-9cf0-0b25d994f691
  image: 2022_Apra.jpg
  github: https://github.com/iapra/height-data-preparation
  abstract: 'Automated reconstruction of detailed semantic 3D city models
    is challenging due to the need for high-resolution (HR) and large-scale
    input datasets, the ambiguous definition of the ensuing model, the intricacy
    of the processing pipeline, and its costs. Furthermore, existing methods
    mainly focus on geometry rather than semantics. Detailed semantic models
    may include roof installations whose size and function vary: dormers,
    windows, chimneys, etc. All elements visible on the roof from an aerial
    view are called ‘‘superstructures”. Deep Learning techniques can facilitate
    their modelization. This work inscribes itself in a project developed
    at the Technical University of Munich. The existing pipeline employs a
    convolutional neural network (CNN) on aerial images segmenting roof superstructures.
    These results can then be vectorized, extruded in 3D with their semantic
    description, and added to a simple 3D model. This thesis demonstrates
    that building height data fused to a CNN on RGB aerial images improves
    the semantic segmentation of roof superstructures for classes with relief.
    Fusion of absolute and relative height data with different interpolation
    methods applied to LiDAR point cloud data is achieved through a fusion
    network from the state-of-the-art (FuseNet). First, experiments prove
    that detection accuracies increase by 11% on average for dormers and 12%
    for chimneys compared to U-Net output on the same dataset. Best performance
    is reached with the fusion of absolute height (rather than normalized)
    and IDW or NN interpolation technique (rather than none). However, although
    superstructure types are better recognized, their boundaries are fuzzier
    due to data input mismatches, and more background pixels are classified.
    Secondly, the predictions and modelization of both a Bavarian and Dutch
    test set prove the technique scalability. However, a training set annotated
    for Bavaria and applied to a test set in the Netherlands yields inaccurate
    results due to local architectural typologies and different input data
    characteristics.'
  uuid: a9530c9d-3732-4c68-9cf0-0b25d994f691
- surname: Caceres Tocora
  name: Camilo
  title: Automated Semantic Segmentation of Aerial Imagery using Synthetic
    Data
  supervisors: Shenglan Du
  year: 2022
  graduation_date: '2022-06-15'
  link: https://resolver.tudelft.nl/uuid:677ad184-1169-45b3-a31b-bcb7239dd451
  image: 2022_Caceres-Tocora.jpg
  abstract: Semantic segmentation of aerial images is the ability to assign
    labels to all pixels of an image. It proves to be essential for various
    applications such as urban planning, agriculture and real-estate analysis.
    Deep Learning techniques have shown satisfactory results in performing
    semantic segmentation tasks. Training a deep learning model is an expensive
    operation, while most of the time manually labelled images are required.
    Additionally, a bottleneck in semantic segmentation projects concerns
    the annotation of images. Consequently, synthetic data, which consists
    of images from a virtual world that simulates the real world, can be used
    as training data for segmentation tasks to improve the classification
    results. Therefore, this thesis aims to create a pipeline that generates
    synthetic images with semantic segmentation labels to be used in an existing
    deep learning model and discuss how the generated synthetic data improves
    the semantic segmentation of aerial images. In this research work, an
    existing model (FuseNet), which in previous works achieved satisfactory
    results, is trained with solely synthetic data and a mix of real data
    in different training and testing scenarios to classify true ortho imagery
    from Haaksbergen, Netherlands and Potsdam, Germany. In addition, a benchmark
    of domain adaptation techniques is performed to close the domain gap between
    the synthetic and real imagery. The semantic maps include building, road
    and other classes. Experiments are performed to test the performance of
    the synthetic data using 1) Different 3D models of the virtual world,
    2) Different quantities of synthetic and real training data, 3) Different
    cross-geographical scenarios, and 4) Different domain adaptation techniques.
    The assessment is based on the (mean) intersection over union (IoU), F1
    score, precision and recall and an extensive visual assessment. The virtual
    world is created through a pipeline in CityEngine using procedural modelling
    techniques and then rendered in Blender to create the training dataset.
    The results show that the synthetic data has a mIoU of 0.48, which is
    lower compared to cases when solely real data (0.75) are used, when the
    segmentation is performed in the same training and testing area. In addition,
    the 3D models partly affect the segmentation results. When using a mix
    of real and synthetic data, the results are maintained to a mIoU of 0.75.
    On the contrary, when training and testing in different areas, the use
    of synthetic data seems to improve the results on average by 21.5, 12.5,
    1.5 and 2 percentage points on the mIoU, IoU for classes building, road
    and other respectively. Additionally, domain adaptation techniques such
    as Cycle GAN and Cycada improve the performance of synthetic datasets
    by 4 percentage points. Overall, this thesis shows that when the domain
    difference between the training and testing datasets is big, the addition
    of the synthetic data helps to improve the performance of the semantic
    segmentation of aerial images. Synthetic datasets improve the segmentation
    results by using a mix of existing labelled imagery from different geographical
    regions when a project lacks labelled imagery. In contrast, when labelled
    imagery is present in the same testing area, the real training data obtains
    robust results, thus the addition of synthetic data does not improve the
    segmentation results.
  uuid: 677ad184-1169-45b3-a31b-bcb7239dd451
- surname: Dardavesis
  name: Ioannis
  title: Indoor localisation and location tracking in semi-public buildings
    based on LiDAR point clouds and images of the ceilings
  supervisors: Edward Verbree
  year: 2022
  graduation_date: '2022-06-28'
  link: https://resolver.tudelft.nl/uuid:40b823ed-9334-4a35-a69b-83c7ab393e5c
  image: 2022_Dardavesis.jpg
  abstract: Nowadays, the evolution of localisation and navigation technologies
    is vast, aiding towards facilitating users’ guidance in various environments.
    Outdoor positioning can be easily achieved, with the widely used Global
    Navigation Satellite Systems (GNSS), which comprise a universal standard
    for positioning and are included in every person’s mobile device. However,
    due to the presence of high buildings in dense urban environments and
    bad reception in indoor environments, the performance of GNSS is significantly
    degraded. Therefore, alternative ways of positioning and localisation
    respectively, need to be explored. In indoor environments, unlike outdoors,
    there is no universal standard, as the different indoor localisation techniques,
    that are currently implemented have their own bottlenecks. The most widely
    used Wi-Fi fingerprinting, requires a constantly up-to-date radio map
    of the signals from the Wi-Fi access points, whose creation is also a
    heavy and time-consuming technique. Additionally, other techniques require
    an installation of costly sensors or either equipment. Therefore, this
    thesis investigates the possibility of the ceilings in public or semi-public
    buildings, being used for indoor localisation, by using features that
    are included in a simple mobile device. The research additionally involves
    location tracking of different users, in order to discover different movement
    patterns in an indoor facility. Indoor localisation is achieved based
    on the comparison of user and reference data, that can be both point clouds
    and images, using the Light detection and ranging (LiDAR) of an iPad 12
    pro and camera sensors of an Android device. The point cloud-based localisation
    is implemented based on different combinations of global and local registration
    techniques, while the image-based approach involves different feature
    detection, description and matching techniques. Using a web-application
    to visualise the indoor localisation results, an indoor model and a network
    graph of the Faculty of Architecture and the Built Environment, location
    tracking of different users is implemented and visualised in a heat-map.
    Additionally, a dashboard is created that can be used by a facility manager
    to translate the user paths to valuable information and reveal different
    movement patterns in an indoor facility. The followed methodology showed
    promising results, concerning the reliability of ceilings for real-time
    indoor localisation, based on LiDAR and camera sensors, that are incorporated
    in up-to-date mobile devices. The robustness of Colored Iterative Closest
    Point (ICP) algorithm for indoor localisation based on point clouds was
    revealed, both in terms of time efficiency and quality, while the combination
    of Speeded-Up Robust Features (SURF) feature detector and Scale Invariant
    Feature Transform (SIFT) descriptor provides the optimal indoor localisation
    results with image data. The proposed pipeline revealed encouraging results
    for use in emergency situations, based on static data acquisition of a
    user, while it is also suitable for dynamic applications, in case a sensor
    is mounted on an automated device for indoor mapping operations.
  uuid: 40b823ed-9334-4a35-a69b-83c7ab393e5c
- surname: de Jong
  name: Michiel
  title: Using voxelised spaces for the generation and visualisation of dynamic
    evacuation routes
  supervisors: Robert Voûte
  year: 2022
  graduation_date: '2022-06-17'
  link: https://resolver.tudelft.nl/uuid:0b5e90b8-6ca1-4cd8-b5db-31539bddad1d
  image: 2022_de-Jong.jpg
  abstract: 'In the modern world, evacuating a building in a safe and orderly
    manner remains a challenge. Fire-based emergencies in a building are dynamic
    environments that can be simulated to better understand, analyse, and
    contribute to safer and smarter buildings. While different spatial representations
    exist, voxels provide a structured, flexible and efficient 3-dimensional
    grid for applications like analysis, classification, surface reconstruction
    and simulation. Furthermore, voxels implicitly contain topological and
    spatial relations that are relevant for 3-dimensional events such as evacuations
    in a rapidly changing building, with a fire spanning multiple floors.
    Voxels can suffer from the problem of scale and resolution, where high
    resolution voxel scenes take up a lot of memory space. For this, there
    are solutions that make more efficient data storage for voxels possible.
    These include but are not limited to: the regular voxel grid, the sparse
    voxel octree, directed acyclic graphs and the use of space filling curves.
    Finding the shortest safe path for the evacuees is a challenge, especially
    if the area is dynamic, and there are other actors that have to share
    the space. Many different pathfinding algorithms exist, each with their
    own speciality, such as A*, any-angle pathfinding algorithms like Theta*
    and incremental algorithms like D*-Lite. In this thesis, we look at whether
    voxelised indoor spaces can form the basis for evacuation simulations
    with multiple actors in a dynamic situation. We do this by comparing both
    the voxel data structure and pathfinding algorithm combinations in a dynamic
    evacuation simulation application. The comparison is done by looking at
    the quality of the paths, if the algorithms are able to adapt to a dynamic
    situation and the performance of the paths, both in computation times
    and memory load. These experiments reveal that a time-aware variant of
    A* is able to outperform the other algorithms, when applied on a sparse
    Morton grid. Additionally, it shows that the use of a sparse Morton grid
    is preferable to implementing a full octree or the use of a non-sparse
    regular voxel grid for dynamic multi-actor voxel scenes. Finally, the
    experiments show that dynamic events can be added into pathfinding algorithms
    by separating walking the path from finding the path, and using a data
    structure that is time-aware.'
  uuid: 0b5e90b8-6ca1-4cd8-b5db-31539bddad1d
- surname: Feenstra
  name: Jos
  title: 'Geofront: directly accessible GIS tools using a web-based visual
    programming language'
  supervisors: Ken Arroyo Ohori
  year: 2022
  graduation_date: '2022-11-04'
  link: https://resolver.tudelft.nl/uuid:0ace357b-d07a-40a0-9167-6d8e775f5ba0
  image: 2022_Feenstra.jpg
  github: https://github.com/thegeofront/thegeofront.github.io
  abstract: 'In the field of Geographical Information Science (GIS), geodata
    transformation and analysis tools often take the shape of software libraries
    written in system level programming languages. However, the societal impact
    of these tools is often limited, as most end users only access these libraries
    via indirect means: Through bindings in other languages, through plugin
    in applications, or both. Additionally, the tools end users end up with
    are often not composable, and may contain other hurdles like installation
    or configuration. The goal of this study is to make core GIS libraries
    more directly available and composable to end users. This study presents
    and prototypes a novel method, centered around a visual programming language
    to host the functionalities of GIS libraries from within an application,
    and in a composable manner. Additionally, the visual language is used
    to connect these libraries to a user-definable Graphical User Interface
    (GUI). This prototype is implemented as a static web application, so that
    these libraries are directly accessible to end users without installation.
    GIS libraries are compiled to WebAssembly, making the library usable in
    any language, including this web based visual language by using a ’no
    boilerplate’ plugin system. Finally, both scalability to handle sizable
    datasets, and a rich GUI (3D viewers, file inputs, sliders), are primary
    design considerations and assessment criteria. The results show that this
    specific web based VPL appears to be a feasible method for providing direct
    access to some native GIS libraries, and does offer a unique set of features
    not found in comparable visual languages. The significance of this method,
    compared to other web based geometry VPLs, lies in the fact that it offers
    a lenient plugin system, in combination with a range of different GUI
    nodes, certain "dataflow VPL" properties, and a proposed zero cost abstraction
    runtime. All of these features combined lead to a VPL which is able to
    directly connect GUI components with native GIS libraries, all while remaining
    scalable in principle. On a practical level, more work remains to proof
    this feasibility. The methodology developed by this study is only theoretically
    accessible and composable, based on achieved features. User testing is
    required to confirm if this method indeed improves workflows, and actually
    saves time and energy of developers and end users. Moreover, the prototypical
    software implementation used is limited and not production ready. Both
    the fact that the ’no boilerplate’ plugin system cannot be used with C
    / C++ GIS libraries, and that backend execution is not possible yet, must
    be improved upon in future work. Despite this, visual programing, distribution
    using WebAssembly, and Rust based geocomputation, all proved to be valuable
    directions of future GIS research.'
  uuid: 0ace357b-d07a-40a0-9167-6d8e775f5ba0
- surname: Fratzeskou
  name: Christina
  title: From GIS to 3D flow simulations in urban environments
  supervisors: Clara García Sánchez
  year: 2022
  graduation_date: '2022-10-31'
  link: https://resolver.tudelft.nl/uuid:a603d34f-997c-4fa2-8538-db018f5b6fec
  image: 2022_Fratzeskou.jpg
  github: https://github.com/cfratz/set_nonUniform_z0
  abstract: Urban physics is a multi-scale and interdisciplinary field, that
    combines science and engineering for the study of physical processes in
    urban areas. Computational Fluid Dynamics (CFD) is considered a powerful
    tool for the study of these processes. In the context of microscale phenomena
    these processes refer to the transfer of heat and mass in the indoor and
    outdoor urban environment, and can be observed up to ≈1km above the surface
    of the Earth. Their development takes place inside the Atmospheric Boundary
    Layer (ABL), which for the case of urban areas is referred to as the Urban
    Boundary Layer (UBL), and is formed due to the interactions between the
    surface obstacles and the wind flows. In CFD simulations the surface of
    the Earth and the encountered obstacles are represented with the use of
    3D models, as well as estimated values that are used to implicitly represent
    their roughness. In this thesis the aim is to investigate relevant to
    CFD parameters that could be used as 3D model semantics. For this purpose,
    a list of parameters was identified. From this list roughness length was
    selected and a methodology was developed for the assignment of roughness
    values for the open-source software OpenFOAM. The developed methodology
    that was built using built-in functions of OpenFOAM, is based on an octree
    data structure that is used to store the input triangulated model in obj
    format. The roughness length landuse names are stored in an mtl file that
    complements the input obj and the roughness length values are specified
    as a user defined parameter using the landuse names. The process is semi-automated
    and it entails the assignment of non-uniform roughness at the bottom of
    the computational domain. Additionally, a methodology to assign non-uniform
    roughness at the inlet of the domain was developed. The results showed
    that the assignment of non-uniform roughness at the bottom of the domain
    was successful for cases of flat terrain, however, under the restriction
    that the input geometry model abided by certain geometry guidelines, such
    as no self-intersections, no gaps. For the case of non-uniform roughness
    at the inlet the process also produced satisfactory results in terms of
    the assignment process, however the impact of multiple roughness values
    at the inlet on the calculated flow parameters requires further investigation.
  uuid: a603d34f-997c-4fa2-8538-db018f5b6fec
- surname: Fu
  name: Runnan
  title: Modeling tree topology effects on wind
  supervisors: Clara García Sánchez; Ivan Pađen
  year: 2022
  graduation_date: '2022-06-24'
  link: https://resolver.tudelft.nl/uuid:557e824d-a088-4cf4-8fe5-c98f5b893057
  image: 2022_Fu.jpg
  github: https://github.com/furunnan/Tree_Topo_Effects_on_Wind
  abstract: 'Planting trees is widely considered an effective way to create
    a good urban wind environment, improve air quality, mitigate heat island
    effects, improve pedestrian wind comfort and reduce building energy consumption.
    To assess tree effects and find suitable tree setups in urban areas, Computational
    Fluid Dynamic (CFD) simulations can be used. To handle trees in CFD simulations,
    the implicit tree modeling approach, i.e, the porosity model, is widely
    used where finite volume cells that roughly account for trees are marked
    as porous zones. Some studies have also attempted to model trees as obstacles
    rather than porous zones, which can be referred to as an explicit tree
    modeling approach. The difference between these two approaches deserves
    further study. Also, for practical purposes and lack of information, the
    geometric features of trees are usually oversimplified or even ignored
    in CFD simulations. This thesis investigates the difference between implicit
    and explicit tree modeling approaches and analyzes the impact of tree
    Level of Detail (LoD) and shapes on the flow structure. For comparative
    analysis, several numerical test cases with different urban complexities,
    tree modeling approaches, tree LoDs, tree shapes, Leaf Area Density (LAD)
    values, and wind directions were used for CFD simulations. The results
    show: (a) the implicit models always allow some of the wind flow into
    the porous cells no matter how high the LAD values are, resulting in smaller
    wind acceleration on the lateral sides of implicit tree models; (b) for
    the idealized street canyon and realistic urban geometry test cases simulated
    in this thesis, the velocity magnitude differences between the LoD2 cases
    and the LoD3 cases are rather limited, with maximum differences in the
    order of 0.5 m/s; (c) differences in tree shapes, LAD values, and wind
    directions will change the effects of tree modeling approaches and tree
    LoDs on wind. For instance, the case using an isolated explicit LoD2 conifer
    tree model has a different wake flow pattern from other explicit cases.
    Also, with the inflow direction perpendicular to buildings, the higher
    the LAD values, the larger the velocity magnitude difference between cases
    using LoD2 tree models and those using LoD3 tree models.'
  uuid: 557e824d-a088-4cf4-8fe5-c98f5b893057
- surname: Hurkmans
  name: Robin
  title: 'Efficient Solar Potential Estimation of 3D Buildings: 3D BAG as
    use case'
  supervisors: Hugo Ledoux
  year: 2022
  graduation_date: '2022-11-11'
  link: https://resolver.tudelft.nl/uuid:0d6fe201-5676-48c0-850f-942d1ee9a353
  image: 2022_Hurkmans.jpg
  github: https://github.com/robinjo78/solarBAG
  abstract: Solar energy is an important renewable energy source that is already
    generated by millions of solar panels attached to building roofs throughout
    The Netherlands. Whether a roof is suitablefor solar panels relies on
    its type, orientation and whether it is put in shadow by a neighbouring
    object. This means, the higher the solar potential of a roof, the better.
    A solar radiation model is used to determine the solar potential of a
    roof. Well-known Geographical Information Systems, such as ArcGIS and
    GRASS GIS provide solar radiation models for raster data. However, raster
    data does not model the 3D urban environment accurate enough. Vector data
    is better capable of representing 3D buildings models, but solar radiation
    models for vector data are not widespread available and are computationally
    inefficient, because of the shadow casting step. This research aims at
    providing an efficient solar radiation model for processing large-scale
    3D city models. The 3D BAG data set, containing all the buildings in The
    Netherlands as vector data, is taken as use case. Their building models
    are stored in CityJSON format, subdivided into smaller tiles based on
    the spatial extent. The implemented model in this research, called SolarBAG,
    takes one or multiple tiles as input, processes the building geometries
    to compute the solar potential, and outputs an enriched CityJSON file
    where each building roof consists of yearly solar potential values. Within
    the process, the building geometries are stored in an Rtree to allow fast
    retrieval when filtering neighbouring buildings that potentially cast
    a shadow over another building. The roofs of buildings are sampled into
    a grid of points to account for the variable solar radiation values on
    a roof surface caused by shadows of neighbouring buildings. A ray-box
    intersection method is used to find the neighbouring buildings casting
    a shadow on another building. To assess the quality and scalability of
    the implemented solar radiation method, experiments are conducted. For
    the quality assessment, the solarpy module used to compute the beam solar
    radiation, is compared to ground truth values, and the solar radiation
    model is compared to the solar radiation tool in ArcGIS. For the scalability
    assessment, the solar radiation model is tested for an increasing number
    of tiles. Based on the assessments, it can be concluded that the implemented
    solar radiation model can successfully enrich building roofs with solar
    potential values for one or multiple CityJSON files. However, there are
    still some bugs and inconsistencies present in the solar radiation model,
    and performance gains could still be achieved by neighbour filtering improvements.
  uuid: 0d6fe201-5676-48c0-850f-942d1ee9a353
- surname: Jin
  name: Yuzhen
  title: Dynamic energy simulations based on the 3D BAG 2.0
  supervisors: Giorgio Agugiaro; Camilo León Sánchez; Jérôme Kämpf; Giuseppe
    Peronato
  year: 2022
  graduation_date: '2022-06-16'
  link: https://resolver.tudelft.nl/uuid:3ae123bd-cae4-45b2-be48-27ffe5cab980
  image: 2022_Jin.jpg
  github: https://github.com/yuzhenjin3000/Dynamic-energy-simulations-based-on-the-3D-BAG-2.0
  abstract: Issues such as climate change, ecological conservation and sustainable
    energy have received a great deal of attention in the last decade. Studies
    have shown that cities are responsible for major energy use and waste
    emissions. In dealing with the growing environmental problems, people
    have to look to the cities they live in. Today, urbanisation is still
    accelerating worldwide which heralds a potentially huge opportunity to
    improve the environment by increasing the energy sustainability of cities.
    To address the energy sustainability of cities, policymakers and urban
    planners are looking for ways to control energy consumption in buildings.
    Faced with a large number of urban buildings and complex climate factors,
    the measurement of building energy consumption has to be done with the
    help of relevant simulation software. Luckily, software and data formats
    associated with the calculation of building energy consumption have matured
    over the years through the efforts of academics and research institutions.
    This largely helps to solve the complex problem mentioned above. However,
    these elements still need to be optimized and improved. In this thesis,
    the research will focus on one of the urban energy simulation software
    CitySim, the 3D city database 3DCityDB and the 3D city model data format
    CityGML. Although it is currently possible to rely on these elements for
    urban energy simulation, the whole simulation process is complex. The
    main reason for this problem is the number of data extractions, data conversions
    and data storage required throughout the whole process. Also, the lack
    of proficiency in data formats, software usage and data storage can be
    a difficult problem for potential users. Therefore, this research will
    focus on developing a python-based interface to achieve the goal of well
    connecting the entire urban energy simulation process. This approach simplifies
    the process of urban energy simulation from the preparation of a complete
    database related to urban energy simulation, to the full process of data
    extraction, conversion and simulation in python, to the final storage
    of simulation results back to the database. In addition to this, several
    user-friendly customised operations are also developed in python. In this
    way, I hope to help more users to conduct urban energy simulation analysis
    conveniently.
  uuid: 3ae123bd-cae4-45b2-be48-27ffe5cab980
- surname: Kumar
  name: Pratyush
  title: An OGC 3D tiling technique based user-interactive platform for digital
    twins in a virtual reality environment
  supervisors: Azarakhsh Rafiee
  year: 2022
  graduation_date: '2022-06-16'
  link: https://resolver.tudelft.nl/uuid:629d3bd6-04d3-49b6-9f5c-13589f1c8ceb
  image: 2022_Kumar.jpg
  abstract: There has been an ever increasing focus on the development of
    smart cities, both by big corporate in the field of Information Communication
    and Technology as well as respective governments responsible for these
    cities worldwide. This in combination with the influx of easily accessible
    data owing to cheaper and efficient sensors has risen to the concept of
    digital twinning of urban spaces and cities. Urban digital twins require
    the city to be represented in 3-dimensional digitally, these datasets
    are oftentimes too large to be provided on as-is basis for most platforms.
    To tackle this problem of large 3D datasets, the OGC 3D tiling specifications
    were formed and accepted in 2019. This thesis attempts to develop a neighbourhood
    designing platform which would enable users to design neighbourhoods in
    3D while being able to experience the design in an immersive manner by
    utilizing virtual reality’s capability to observe 3D assets in scales
    which are not possible using a physical model or a 2 dimensional neighbourhood
    plan, employing the OGC 3D tiling technique to understand the extent to
    which a combination of existing 3D datasets can be made with a user-interactive
    neighbourhood designing platform in a VR environment. The results of the
    study reveal that using our methodology, it is possible to combine existing
    3D datasets with user made neighbourhood design with their own 3D assets
    of any level of detail and furthermore, it is possible to utilize instanced
    tiling format to disseminate the neighbourhood design as a standard 3D
    tiled design.
  uuid: 629d3bd6-04d3-49b6-9f5c-13589f1c8ceb
- surname: Langhorst
  name: Lars
  title: Predicting sedimentation in Lake Alajuela
  supervisors: Ken Arroyo Ohori
  year: 2022
  graduation_date: '2022-06-30'
  link: https://resolver.tudelft.nl/uuid:6421019c-50e0-42ab-ae43-3c20e1b2f3e2
  image: 2022_Langhorst.jpg
  github: https://github.com/LMarinusL/MorphologyPredictor
  abstract: To keep the Panama Canal operational year round, the water level
    in the canal is maintained above the minimum depth. As water is passed
    through the locks and into the oceans on either side, the canals main
    reservoir looses fresh water, and this water is then replaced by the canals
    secondary reservoir which is Lake Alajuela. The Lake Alajuela reservoir
    is supplied of water by two large rivers, bringing in a sediment flux
    and decreasing the reservoirs capacity over time. Sedimentation sets a
    time limit to the use of the reservoir, and understanding this process
    and predicting the future morphological changes to occur in the reservoir
    are key to ensure continuation of operations in the Panama Canal. To predict
    the quantities of local sedimentation in the reservoir, a machine learning
    model is trained with features extracted from bathymetric models covering
    various years. These features are computed values that correlate with
    morphological processes. As such, the adaptiveness of a machine learning
    model along with the ability to extract morphological features from any
    elevation model provides the possibility to predict future sedimentation
    where other methods with empirical and numerical methods do not suffice
    due to a lack of data and restrictive parameters. Three types of machine
    learning algorithms and 21 features were initially tested for the purpose
    of the morphological modelling, during which the SVR model was the most
    successful. The testing was done on the R´ıo Chagres basin as well as
    the R´ıo Pequen´ı basin, both located in Lake Alajuela. Extensive hyperparameter
    tests were done to optimize and further test the performance of the SVR.
    Depending on the study area and the scale of the morphological behavior
    occurring, slightly different sets of features were most effective. Nevertheless,
    in both study areas tested the runoff model has proven to be a key factor
    for predicting the sedimentation and achieved a 70 to 80% accuracy for
    predicting zones of low or high sedimentation. The same model trained
    with the data from 1997 to 2018 was then used to predict 6 years into
    the future where more dynamic morphological behavior will occur according
    to the model. A downstream moving sediment front in the R´ıo Chagres basin
    is recognized and predicted to have moved 500 meters between the years
    2018 and 2024. Such a sediment front travelling too far into the reservoir
    could have catastrophic consequences for all operations of the Panama
    Canal, making the awareness and anticipation of its progression highly
    important.
  uuid: 6421019c-50e0-42ab-ae43-3c20e1b2f3e2
- surname: Liu
  name: Zhenyu
  title: Dynamic Objects Detection and Removal in Mobile Laser Scanning Data
  supervisors: Peter van Oosterom
  year: 2022
  graduation_date: '2022-06-27'
  link: https://resolver.tudelft.nl/uuid:9b1ba72c-9c74-45e1-952a-58c0824c9a74
  image: 2022_Liu.jpg
  abstract: Many MLS point cloud application scenarios, such as navigation
    and localization algorithms, require only static environments, but the
    original MLS data usually inevitably includes many dynamic objects such
    as moving vehicles, bicycles, and pedestrians. Therefore, these dynamic
    objects need to be removed before using MLS point clouds. This thesis
    designs an efficient and memory-friendly Octomap-based dynamic object
    detection and removal method for MLS data. Firstly, the original MLS data
    is split into multiple data frames based on the timestamp of each capture
    point. Each data frame is inserted into a separate Octomap along with
    its neighboring data frames. The free points in all Octomaps are extracted
    by setting an occupancy probability threshold. Second, the region of interest
    (ROI) related to the dynamic object is delineated by the MLS sensor mounting
    height and the local large vehicle height limit. Only the free points
    located within the ROI are retained. Then the free-point rate and the
    multi-return rate are calculated for each free point using a fixed radius
    spatial search to denoise and detect vegetation points. Finally, the KNN
    spatial search is used to remove vegetation points and extract dynamic
    objects from the free points. The proposed method is tested in four case
    sites in Delft, the Netherlands and its producer’s and user’s weighted
    average dynamic object detection and extraction accuracies are 88.004%
    and 82.624%, respectively. The weighted average overall accuracy is 99.833%.
    Compared with the original Octomap, the proposed method is 35.472% more
    efficient on average and can be further accelerated by parallel computing,
    with a maximum memory consumption of only 42.437% of the original Octomap.
    The implementation results and accuracy assessment demonstrate that the
    proposed method can be effectively applied to dynamic object detection
    and extraction tasks in MLS data sets in a compute-friendly and memory-friendly
    way.
  uuid: 9b1ba72c-9c74-45e1-952a-58c0824c9a74
- surname: Mainelli
  name: Xenia Una
  title: Exploring Isovist Applications in Third-Person View Visualisations
    of Outdoor Space Boundaries Using Point Clouds
  supervisors: Edward Verbree; Martijn Meijers; Robert Voûte
  year: 2022
  graduation_date: '2022-08-30'
  link: https://resolver.tudelft.nl/uuid:922ad01c-0d36-494b-b499-2c0744f474dd
  image: 2022_Mainelli.jpg
  abstract: The kinds of physical spaces present in the real world are becoming
    ever more complex, and the locations defining the boundaries between these
    spaces are often arbitrary. Distinguishing between which spaces count
    as `outdoors,' and which count as `indoors,' becomes more difficult when
    `semi-outdoor' and `semi-indoor' spaces are considered. Integrating these
    different spaces within geovisualisations is difficult because data on
    the spaces are often collected and stored separately. Many existing navigational
    applications avoid the explicit differentiation between different types
    of spaces, or choose to only visualise one type of space. Additionally,
    these applications rarely identify which areas are visible to users at
    their present positions, and which areas are occluded. This thesis explores
    the potential of utilising point clouds directly in geovisualisations
    to communicate information about the types of spaces surrounding a hypothetical
    user in a real-world environment. Raw point cloud data is collected on
    three different transitional spaces, all of which contain an outdoor element.
    These point clouds are classified into four different `space-types' (outdoor,
    indoor, semi-indoor, and semi-outdoor), and visibility analysis is performed
    on them directly. The resulting information on space-type and visibility
    is combined within multiple different data visualisations, the concepts
    of which have been designed using a list of requirements based on existing
    literature. The visualisations show that there is potential for direct
    use of point clouds in communicating information about spaces to a user,
    and that discerning between visible and occluded spaces, has potential
    value to a user orienting themselves within their environment with aid
    of a geovisualisation.
  uuid: 922ad01c-0d36-494b-b499-2c0744f474dd
- surname: Pantelios
  name: Kostantinos
  title: Development of a QGIS plugin for the CityGML 3D City Database
  supervisors: Camilo León Sánchez
  year: 2022
  graduation_date: '2022-06-29'
  link: https://resolver.tudelft.nl/uuid:fb532bef-81b9-482b-921a-e7ce907cb544
  image: 2022_Pantelios.jpg
  github: https://github.com/Konstantinos-Pantelios/3DCityDB-QGIS-Loader
  abstract: Today, in the urban planning, energy modelling and other fields,
    semantic 3D city models are used in various applications like visualization,
    data exploration, analysis and more. As a result, standard data practices
    needed to be set in order to facilitate the storage and exchange of these
    city models. For this purpose, the Open Geospatial Consortium ( OGC )
    adopted CityGML as an international standard for effective use of 3D city
    models. Generally, the models are encoded in Extensible Markup Language
    ( XML ) files, however, other file encodings can also be used like JavaScript
    Object Notation ( JSON ) files with CityJSON. Moreover, CityGML can also
    be adapted for a database encoding like the 3D City Database ( 3DCityDB
    ), on which this thesis is based upon. The benefit of using a database
    encoding is that databases are built to handle and organize large amount
    of data, which 3D city models usually consist of. The 3DCityDB is an open
    source project developed for PostgreSQL and Oracle databases. It is supported
    by other software in the 3DCityDB suite that facilitate its use in different
    applications. The 3DCityDB tries to simplify the complexity of CityGML,
    however, its approach remains difficult for users to access data directly
    without technical knowledge of databases, Structured Query Language (
    SQL ), CityGML and/or 3DCityDB structure. Derived frm thios limitation,
    the primary objective of this research is to develop an approach that
    could simplify user interaction with the 3DCityDB from within a Q Geographical
    Information System ( QGIS ) environment. To achieve this, ”3DCityDB-Loader”,
    a QGIS plugin, is developed to handle complex server operations in the
    background, whilst providing a user-friendly workspace environment. The
    complete functionality of the plugin is segmented into client and server-side
    parts. This thesis focuses on the client-side development but both parts
    were jointly developed in a common iterative process of requirement identification,
    development, testing and assessment. The most important requirements for
    the plugin is to have layers that can interact with 3DCityDB data, be
    able to work with multiple users with different privileges, allow for
    multiple scenarios (database schemas), allow to edit attributes, handle
    different Levels Of Detail ( LOD ) and geometry representations and finally
    be able to operate from a Graphical User Interface ( GUI ) in QGIS . Regarding
    the client-side part of the plugin, it can manage database connections,
    manage the server-side installation, manage and create layers for multiple
    scenarios from a GUI , include CityGML generic attributes, enumerations
    and codelists and automatically set their relations, automatically structure
    a hierarchical QGIS Table Of Contents ( TOC ) and finally automatically
    apply standard colors on different features. At the time of writing this
    document, the plugin is at version 0.4. The limitations are mostly related
    to functionalities that are not yet supported, with future development
    being tracked from the project’s GitHub repository. All in all, ”3DCityDB-Loader”
    facilitates the use of 3DCityDB for users of different fields and expertise
    with the common denominator being the well-accustomed QGIS environment.
  uuid: fb532bef-81b9-482b-921a-e7ce907cb544
- surname: Papakostas
  name: Theodoros
  title: Modelling a military scene using a Discrete Global Grid System
  supervisors: Robert Voûte
  year: 2022
  graduation_date: '2022-06-28'
  link: https://resolver.tudelft.nl/uuid:aca1d742-9fbe-4577-a4fd-b8b0ba50f368
  image: 2022_Papakostas.jpg
  abstract: Nowadays, the military stakeholders take advantage of the various
    geospatial infrastructure and technology while exploiting the wide use
    and distribution of geographic data, to model military scenes and/or conduct
    geospatial analysis for military operational scenarios. While a host of
    technology is offered, in potential joint military operations or joint
    civil-military operations, several difficulties elapse in geospatial communication,
    due to different Coordinate Reference Systems (CRS), non-conforming resources,
    different data formats and different areas of responsibility perception
    between the stakeholders. The multidisciplinary geospatial communication,
    data integration and a common modelling geospatial framework is integral
    for the accurate and fruitful modelling of a military scene assisting
    in joint operations. Discrete Global Grid Systems (DGGS), while not being
    a new concept, recently emerged in the geospatial community with various
    distributed implementations, as a framework to integrate, analyze and
    manage geospatial data. This thesis attempts to apply a DGGS, using an
    existing distributed implementation, to integrate different format, two
    dimensional and elevation geospatial datasets, coming from military and
    civilian stakeholders, to identify the potential of this approach for
    military scene modelling. The different approaches of quantization of
    the datasets are explored for their efficiency, quality and the ability
    to assist in performing geospatial military analysis, while according
    APIs are developed for the DGGS conversion. Given the model of the military
    scene the research tackles the geovisualisation alternatives and a case
    study is also conducted for a military geospatial operation (ranging)
    using the DGGS approach. The results show the promising potential of the
    DGGS approach to model military scenes, providing a uniform area based
    framework, encapsulating the different qualitative and quantitative military
    information, offering strong connectivity and hierarchy relations and
    increasing the qualitative spatial perception and multidisciplinary geospatial
    communication. The datasets’ DGGS conversion showed advanced integration,
    segmentation, aggregation and visualization capabilities, also exploiting
    the 3rd dimension data. Uniform storage through the DGGS integration can
    be realized in a database, facilitating the distribution of military data.
    A DGGS can also support common military geospatial operations (i.e. ranging).
    However, the quality of the results is highly dependent of the original
    data accuracy/spatial uncertainty and the demanded precision requirements
    of the scene’s coverage. In parallel, due to the fact that this technology
    is still emerging and dynamically optimized, it is not mature yet to handle
    high precision requirements and be treated as a frame with high positioning
    accuracy for high scale military scene coverages.
  uuid: aca1d742-9fbe-4577-a4fd-b8b0ba50f368
- surname: Pavlidou
  name: Androniki
  title: Integrated modeling of utility networks in the urban environment
  supervisors: Giorgio Agugiaro; Jantien Stoter
  year: 2022
  graduation_date: '2022-06-16'
  link: https://resolver.tudelft.nl/uuid:81549126-bbb9-49d5-bc46-d050a2463c6d
  image: 2022_Pavlidou.jpg
  abstract: In recent years, there has been an exponential growth in the need
    for 3D spatial information, particularly 3D models representing the geographic
    information of the urban environment. The existence of a comprehensive
    integrated 3D model representing the condition of the underground utility
    networks in accordance with the above-ground city objects is crucial in
    the ever-increasing infrastructure demands. To acquire such models the
    related spatial information (geo-information) is required. This information
    and its quality determine the quality of the models since it describes
    the functionality, physical properties, semantic details of the urban
    features as well as the between them relationships (if exist) and interconnections.
    Currently, there are available various 3D models that, however, are limited
    in the representation of objects at a city level, with the corresponding
    underground information about the utility networks supporting cities’
    functionality being restricted and/or underdeveloped. Although the modeling
    of underground utility networks is under development, there are available
    models that allow for the mapping of the existing information to predefined
    schema. However, these models have some limitations that restrain the
    display of the integrated condition with the above-ground city objects
    as well as they do not support (completely) the interdependencies between
    networks of different uses. This thesis focuses on how to develop a three-dimensional
    model of underground utility networks integrated with above-ground objects,
    in order to utilize the model in real-world scenarios (disaster management,
    cost-effective routes). These networks concern sewage networks (and the
    stored sub-networks), while the objects are related to the buildings of
    the study area. For the research, vector datasets were used, related to
    the existing underground utility networks of a limited area of the Delft
    University of Technology campus, as well as network elements related to
    them. For the examination of the proposed model creation, a methodology
    was developed that could constitute a general approach for relevant applications,
    considering the condition of the available vector datasets of the similar
    and/or relevant content. This methodology is divided into seven stages
    that concern the preparation of the research and data collection process,
    the statistical and spatial analysis of their content, the integration
    and cleaning approaches to reconstruct invalid information, and the creation
    of a relational database to store them. Finally, based on the results
    from these steps model, routing analysis and functionality were implemented
    to examine the effectiveness of such model in real-world scenarios. According
    to the results and limitations that arose, suggestions for the harmonization
    of the data are addressed as well as future application proposals. Experimentation
    demonstrates that the developed methodology lead to the creation of a
    model that, although it represents a simplification of the existing geographical
    information, it can successfully be used for the implementation of the
    proposed case studies (disaster management, cost-effective routes). However,
    taking into account the poor quality of the input data, the model necessitates
    improvements in order to be used out of the box for other applications,
    as well as to verify its compliance with available standards supporting
    the mapping of the including information.
  uuid: 81549126-bbb9-49d5-bc46-d050a2463c6d
- surname: Prihanggo
  name: M. Maundri
  title: Funding Model for The Production of Large-Scale (1:5.000) Base Map
    in Indonesia
  supervisors: Frederika Welle Donker
  year: 2022
  graduation_date: '2022-11-09'
  link: https://resolver.tudelft.nl/uuid:339371b5-0c6a-4756-9266-461d87677e29
  image: 2022_Prihanggo.jpg
  abstract: The Indonesian government mentioned the urge to accelerate the
    process of providing detailed spatial plan maps. Moreover, to have one
    standard of reference, detailed spatial plan maps need to use large-scale
    (1:5.000) base maps as reference. Furthermore, the Indonesian government
    established the One Map Policy agenda as a legal basis for accelerating
    large-scale data. The Geospatial Information Act (2011) mentioned that
    the National Mapping of Agency (NMA) of Indonesia is responsible for providing
    nationwide large-scale (1:5.000) base maps. However, until now, only 2.7%
    of large-scale (1:5.000) base maps are available from all over Indonesia
    . One issue is the gap between the budget needed and received annually
    from the national government. Dependent on the national government, the
    NMA faces budget uncertainty between the budget requested and received
    during the annual process. Moreover, the budget was focused on supplying
    a national program of large-scale (1:5.000) base maps. Therefore, the
    NMA tend to innovate its funding model to accelerate the production of
    large-scale (1:5.000) base maps. Innovative funding models are assessed
    by using Analytical Hierarcy Process, one of the Multi-Criteria Analysis.
    Moreover, to achieve categorize the stakeholder, a stakeholder analysis
    is conducted. This project shows that sharing financial resources between
    local and national authority is a viable option. However, both national
    and local government needs to set several parameters and create a proper
    relationship among stakeholders.
  uuid: 339371b5-0c6a-4756-9266-461d87677e29
- surname: Prusti
  name: Maarit
  title: How could BIM support the digital building permit process in the
    Netherlands?
  supervisors: Jantien Stoter
  year: 2022
  graduation_date: '2022-06-29'
  link: https://resolver.tudelft.nl/uuid:33b125b5-d902-4432-9043-2ceb10f2e53e
  image: 2022_Prusti.jpg
  abstract: The building permit process in the Netherlands is mostly digitalized,
    however, there are still some issues. A downsize of information, the manual
    checking from the municipality, and the duration of the process are some
    of these issues. To overcome these issues information between 3D building
    design models, so-called Building Information Modeling (BIM)s, and 3D
    city models must be exchanged. To exchange interoperable information between
    BIMs and 3D city models is called integration. In this research, automatic
    rule checking is performed after the BIM encoded in Industry Foundation
    Classes (IFC) is converted to a 3D city model encoded in CityJSON. Integration,
    however, is not as straightforward as it seems. Other researches have
    been carried out to perform a full integration from 3D city models encoded
    in CityGML to BIMs encoded in IFC. This is rather complex and so use cases
    are utilized. In most other researches using the building permit process
    as a use case, the automatic rule checking is performed in the BIM domain.
    In this research, a conversion is performed from a BIM encoded in IFC
    to a 3D city model encoded in CityJSON. The first step in this research
    is to analyze land use plans and select the most often used rules. These
    rules are further analyzed on required information to check the rules.
    For both IFC and CityJSON, the required information for the rules representing
    the same information as entities in the standards are selected. In the
    next step, the input models are analyzed on the presence of the entities
    from the standards. Before the conversion is performed, it is determined
    which entity will be converted from which input model and whether or not
    additional information is needed. Finally, the conversion is performed.
    The 3D city model can be used for rule checking and satisfies the selected
    rules. The implications of this research are described for the digital
    building permit process as well as for the integration of the two domains.
    Guidelines to model correct BIMs for the digital building permit process
    and further integration are drafted. In conclusion, the tool created in
    this research works successfully. Automatic rule checking on all the rules
    in land use plans is technically possible. In practice, automatic rule
    checking will most likely not take over soon, since rules are still written
    ambiguously, builders work with 2D drawings mostly, and the Environmental
    and Planning Act is soon to be established.
  uuid: 33b125b5-d902-4432-9043-2ceb10f2e53e
- surname: Ramlakhan
  name: Rohit
  title: Modelling the legal spaces of 3D underground objects in a 3D LAS
  supervisors: Eftychia Kalogianni; Peter van Oosterom
  year: 2022
  graduation_date: '2022-06-17'
  link: https://resolver.tudelft.nl/uuid:92107ac8-4443-46da-97e5-335af4f52c2b
  image: 2022_Ramlakhan.jpg
  abstract: Urbanisation and a lack of available construction land has led
    to the increased development of underground space which can contribute
    to the development of the urban areas by providing space for the construction
    of (infra)structural objects and networks necessary for a city to function
    and provide services to its citizens. The main challenge in developing
    the underground space is registering the RRRs of the underground objects
    into Land Administration Systems (LASs). Registering the RRRs of these
    underground objects in 3D can facilitate a better understanding, as well
    as a more efficient registration and clear visualisation of the RRRs.
    To register the objects below the surface in a 3D LAS, 3D physical data
    as well as 3D legal data need to be registered and integrated into one
    model. BIM/IFC models can be (re)used as input data to register the 3D
    physical data. To register the 3D legal data in an efficient way, the
    ISO 19152:2012 Land Administration Domain Model (LADM) standard can be
    applied. The motivation for linking the BIM/IFC models with the LADM is
    that the geometry of the BIM/IFC models can be reused from design for
    the registration of the legal spaces in LASs or that BIM/IFC models can
    serve as a technical encoding for the exchange of data in LASs and thereby
    connect the workflows from the (AECOO) community. In this research the
    mapping of the basic classes of the LADM to IFC entities is presented
    to support the linkage of these two data models. Research to investigate
    the implementation of the LADM in a 3D LAS, with the use of BIM/IFC models
    as input for 3D objects on the surface such as apartment buildings and
    infrastructure objects has been carried out. The result of this research
    was that the RRRs of objects on the surface can easily be determined by
    applying the legal information from the enriched BIM/IFC model. No research
    has been done in implementing the LADM in a 3D LAS, with the use of BIM/IFC
    models as input for 3D objects below the surface. This research will therefore
    complement the earlier related work, thereby supporting the modelling
    of legal information of all 3D objects, below as well as on the surface.
    To solve the challenges that currently prevent the implementation of 3D
    objects below the surface in LASs and to harmonise the different (technical
    and semantic) requirements for LASs a standardised workflow was developed
    and is presented in this thesis. The standardised workflow shall provide
    more insight into the modelling of the legal spaces of 3D objects below
    the surface, stimulate the exchange of data across the AECOO community,
    and promote the use and development of 3D LASs. Two case studies were
    conducted, where objects (pipes) from the sewage system and a tunnel were
    used. The tunnel was a BIM/IFC model, while the sewage pipes were converted
    to an BIM/IFC model. The models from both cases were stored according
    to the LADM standard in a 3D LAS, represented by a 3D database and a 3D
    geospatial visualisation platform. The main results are that the technical
    part of the proposed workflow supports the registration of 3D underground
    objects in 3D LAS and that for underground objects the legal spaces from
    the 2D parcels that are extruded to 3D volumetric parcels, are sufficient
    enough to describe the RRRs of the objects.
  uuid: 92107ac8-4443-46da-97e5-335af4f52c2b
- surname: Roy
  name: Ellie
  title: Inferring the number of floors of building footprints in the Netherlands
  supervisors: Hugo Ledoux
  year: 2022
  graduation_date: '2022-01-13'
  link: https://resolver.tudelft.nl/uuid:6de4255c-ab2b-49c2-a282-ed779de092a1
  image: 2022_Roy.jpg
  github: https://github.com/ellieroy/no-floors-inference-NL
  paper: https://doi.org/10.1080/13658816.2022.2160454
  abstract: 'Data on the number of floors is required for a variety of applications,
    ranging from energy demand estimation to flood response plans. Despite
    this, open data on the number of floors is currently not available at
    a nationwide level in the Netherlands. This means that it must be inferred
    from other available data. Automatic methods usually involve dividing
    the estimated height of a building by an assumed storey height. In some
    cases, this simple approach limits the accuracy of the results. Therefore,
    the goal of this thesis is to develop an alternative method to automatically
    infer the number of floors. Three different machine learning algorithms
    are tested and compared: Random Forest, Gradient Boosting and Support
    Vector Regression. These algorithms are trained using data on the number
    of floors obtained from four municipalities in the Netherlands. In addition,
    25 features are derived from cadastral attributes, building geometry and
    neighbourhood census data. These features are tested in different combinations
    in order to determine whether a specific subset yielded better results.
    Furthermore, a comparison is made between features derived from 3D building
    models at different levels of detail. The results show that building height,
    particularly 70th percentile height, is most related to the number of
    floors. Other 3D geometric features are also found to be quite closely
    related to the number of floors, specifically roof area and volume. However,
    a higher level of detail did not improve the results. Cadastral features
    are also found to be relevant; mainly net internal area and, to a lesser
    extent, construction year. Furthermore, models based on a combination
    of different features performed better than models based on single categories
    of features. The best predictive model achieved an accuracy of 94.5% and
    a Mean Absolute Error (MAE) of 0.06 for buildings with 5 floors or less.
    This represented a substantial improvement on the results of the geometric
    approach, which had an accuracy of 69.9% and MAE of 0.31. However, above
    5 floors, model performance was substantially lower. Machine learning
    provided only a slight improvement on the geometric approach for these
    buildings. In this case, the best model had an accuracy of 52.3% and MAE
    of 0.62, whereas the geometric approach was 47.5% accurate and had a MAE
    of 0.70. A comparison of the cumulative error distributions showed that
    the best model mainly improved the fraction of buildings that were predicted
    with an error of less than 1 floor. Overall, these results show that machine
    learning partially provided a better estimate of the number of floors
    than a purely geometric approach.'
  uuid: 6de4255c-ab2b-49c2-a282-ed779de092a1
- surname: Smit
  name: Mels
  title: Deducing the Location of Glass Windows in 3D Indoor Environments
  supervisors: Edward Verbree; Martijn Meijers; Robert Voûte
  year: 2022
  graduation_date: '2022-01-13'
  link: https://resolver.tudelft.nl/uuid:b1e20016-5e1c-4610-a951-6631983b7511
  image: 2022_Smit.jpg
  abstract: 'Over the years, the pace at which data is generated keeps on
    increasing. As a consequence, the data itself no longer holds the highest
    value, but rather the information and context the data captures are. This
    principle also holds in the 3D environment modelling scene, as accurately
    depicting an environment holds more value than the number of models there
    are of it. One of the major problems in 3D environments, especially when
    the environment represents a building, is the presence of glass. A lot
    of the data captured to model these 3D environments is captured using
    LiDAR laser scanning. This is where glass becomes a problem as glass is
    almost completely transparent to laser beams at the typical wavelengths
    used when using LiDAR laser scanning. As a consequence, glass can lead
    to problems with navigational routes as it is invisible in the environment
    but still blocks the path. It can also create false spaces in the captured
    environment as it can also partially act as a mirror reflecting the laser
    beam and showing these reflections in space as if they were captured in
    a straight line. Alternative manners for capturing and identifying glass
    in environments captured with laser have been created over the years,
    but they often need a dedicated set-up, expensive equipment or a lot of
    data. These solutions are not always feasible for users of point cloud
    data. Therefore, in this thesis a focus is put on how can a low entry
    solution be created for this problem, which leads to the main research
    question: How can the location of glass be deduced using only information
    acquired from 3D point clouds and a reference position? To answer this
    question, this thesis focuses on the deduction of the locations of glass
    windows in the provided input. To find these a projection from 3D data
    to 2D is performed. In 2D image space, contours are then detected that
    match the criteria of window frames. These contours are then used to segregate
    parts of the 3D point cloud that should contain the window detected in
    the projection. After clustering these parts and the best matching cluster
    is deduced to be a window. In this thesis, it is shown that using the
    proposed methodology it is possible to deduce the location of glass in
    a LiDAR point cloud using only an additional reference position, but there
    are some flaws with the simplified input of the method.'
  uuid: b1e20016-5e1c-4610-a951-6631983b7511
- surname: Triantafyllou
  name: Georgios
  title: Isovist Fingerprinting as new way of Indoor Localisation
  supervisors: Edward Verbree
  year: 2022
  graduation_date: '2022-06-28'
  link: https://resolver.tudelft.nl/uuid:4c97f5e2-dfa1-403d-85e7-0fb43d98cc82
  image: 2022_Triantafyllou.jpg
  abstract: Nowadays, humans rely in technology more and more when it comes
    to navigation and localisation and in many aspects of life as well. While
    most concepts related to localisation and navigation of outdoors environments
    are already well derived from various researches and softwares, the indoor
    environment remains a significantly unexplored area. Nevertheless, lately
    there have been increased interest on Location Based Services (LBS) and
    Indoor Positioning Systems (IPS). There are already several methods available
    for indoor localisation such as Wi-Fi Fingerprinting and Bluetooth Beacons,
    but none of them is fully functional yet. It remains a field that requires
    more and further research and investigation in order to reach a satisfactory
    and complete Indoor Localisation-Navigation method. Therefore, this thesis's
    main objective is to investigate and explore a new method for Indoor Localisation
    based on Isovists. The exploration and evaluation of Isovist-Fingerprinting
    approach for Indoor Localisation can extend the fields of LBS and Geomatics.
    The main research question is “To what extent can isovist support Indoor
    Localisation” and through this and a series of sub-questions to analyse
    the Isovist concept in relation to the Indoor Localisation. This is achieved
    by forming a proof of concept and a methodology that investigates how
    the Isovists would benefit an LBS. To succeed that the methodology is
    divided into 4 main sections. The Data Acquisition for which the newly
    supported from smartphones Light Detection And Ranging (LiDAR) technology
    were used. The Space Syntax and Isovist Analysis Measures, where all the
    concepts related such as the Isovist Parameters were analysed in depth
    for better understanding of their effect. Then the Matching and Localisation
    Algorithms, where the possibilities and options on how to reach the localisation
    were investigated and analysed. And finally, the Tests and Experiments
    took place in order to evaluate all the prior stages of the methodology.
    The main conclusion of this research is that a method for Indoor Localisation
    based on Isovists is feasible and can indeed support an LBS. The analysis
    and evaluation of all related components has be done and if putting all
    the parts in the right order they can be of high value for LBS applications.
    Since is a new method of Indoor Localisation, there is plenty of future
    work to be done which mainly focuses on how to connect it with existing
    techniques and integrate all together into a user application.
  uuid: 4c97f5e2-dfa1-403d-85e7-0fb43d98cc82
- surname: Tufan
  name: Özge
  title: Development and testing of the CityJSON Energy Extension for space
    heating demand calculation
  year: 2022
  link: https://resolver.tudelft.nl/uuid:816735b7-4305-4f72-bbab-31f5e5491acf
  image: 2022_Tufan.jpg
  github: https://github.com/ozgetufan/cjenergy
  paper: https://doi.org/10.5194/isprs-archives-XLVIII-4-W4-2022-169-2022
  abstract: 3D city models are frequently used to acquire and store energy-related
    information of buildings for energy applications. In this context, CityGML
    is the most common data model, and the Energy ADE, one of its most complex
    extensions, provides a systematic way of storing detailed energy-related
    data in XML format. Contrarily, even though CityGML's JSON-based encoding,
    CityJSON, has an extension mechanism, an energy-related CityJSON Extension
    is missing. This paper, therefore, presents the first results of the development
    of a CityJSON Energy Extension and space heating demand calculation is
    utilized as the use case. The simplified version of the Energy ADE, called
    the Energy ADE KIT profile, is used to create a semi-direct translation
    to the CityJSON Energy Extension. This Extension is then validated through
    the official validator of CityJSON and the use case, and improvements
    are made considering the validation results. The space heating demand
    is calculated according to the Dutch standard NTA 8800 for a subset of
    Rijssen-Holten in the Netherlands although the solar gains calculation
    requires further review. The results show that the final CityJSON Energy
    Extension provides full support for space heating demand calculations
    based on the NTA 8800 and eliminates the deep hierarchical structure of
    the Energy ADE. A comparison on CityJSON file sizes shows a 25.2 MB increase
    after the required input data is stored in a CityJSON + Energy Extension
    file, which is not significant considering the high amount of data stored
    in the file. Overall, this paper shows that the CityJSON Energy Extension
    could provide an easy-to-use alternative to the CityGML Energy ADE.
  uuid: 816735b7-4305-4f72-bbab-31f5e5491acf
- surname: van der Horst
  name: Noortje
  title: Procedural Modelling of Tree Growth Using Multi-temporal Point Clouds
  supervisors: Liangliang Nan; Jantien Stoter
  year: 2022
  graduation_date: '2022-06-23'
  link: https://resolver.tudelft.nl/uuid:d284c33a-7297-4509-81e1-e183ed6cca3c
  image: 2022_van-der-Horst.jpg
  github: https://github.com/NoortjevanderHorst/treegrowthmodelling
  abstract: A digital reconstruction of real-life trees could provide many
    benefits in fields such as botany, forestry management, biology, and urban
    planning. Plant growth modelling in particular would enable the analysis
    of plant structure and behaviour in a customizable, widely applicable
    and non-destructive manner. Although many data-driven plant reconstruction
    methods exist, it remains a complex problem due to the intricate branching
    systems of trees and the need for balancing model soundness with adherence
    to the often incomplete input data. Modelling plant growth currently proves
    difficult as well due to the large number of factors involved in the growth
    process and the level of prior botanical knowledge and/or detailed field
    data that is often required. This work uses an automatic MST (Minimum
    Spanning Tree)-based reconstruction method to obtain tree skeleton models
    from LiDAR input data. Multiple scans of the same tree, gathered at different
    years, are related to each other to improve and expand upon the reconstruction.
    A procedural model is used to simulate the growth in the tree tips using
    a lobe-based approach and a region-growing algorithm. The growth-based
    models provide a temporally informed reconstruction that is visually,
    geometrically and topologically sound. Establishing correspondences in
    the main structure between timestamps can assist the reconstruction of
    the tree at a time for which the input data was noisier or incomplete,
    as well as provide an estimate of the tree's structure in between known
    data points. This type of reconstruction can be used to both model and
    study the growth behaviour of trees, for multi-temporal visualisations,
    and to provide more informed tree models for reconstruction purposes.
  uuid: d284c33a-7297-4509-81e1-e183ed6cca3c
- surname: van der Vaart
  name: Jasper
  title: Automatic building feature detection and reconstruction in IFC models
  supervisors: Ken Arroyo Ohori
  year: 2022
  graduation_date: '2022-06-22'
  link: https://resolver.tudelft.nl/uuid:db6edbfc-5310-47db-b2c7-3d8e2b62de0f
  image: 2022_van-der-Vaart.jpg
  github: https://github.com/jaspervdv/IFC_ApartmentDetection
  abstract: The flexibility of the Industry Foundation Classes (IFC) format
    makes it challenging to blindly rely on the data it stores. This is because,
    to allow its flexibility, the stored data in an IFC file can be missing,
    incorrect, redundant, or stored in vague ways while the file can still
    be considered format compliant. This missing reliability is an issue for
    a format that is so central to the Architecture, Engineering and Construction
    (AEC) industry. This also severely hampers the chances for automated processes
    to be applied in the AEC industry. Chances that could reduce the time
    and cost spend on a construction while enlarging its quality. Prior done
    research on this subject is sparse. The small subset of this research
    that covers the ”repair” or reliable extraction of IFC data primarily
    focuses on idealized situations that do not often occur in practice. Due
    to the combination of these factors, this master thesis attempts to discover
    if it is possible to extract reliable data from the unreliable IFC files
    with an automated method. Because of the large flexibility and broadness
    of the IFC format, the scope of the thesis had to be limited. This was
    done by focusing on the extraction/reconstruction of storeys (and their
    elevations), rooms, and apartments. For these three subjects not only
    extraction/reconstruction methods have been created, but they have also
    been implemented in an open source software tool1. To develop reliable
    processes, the processes have to be based upon reliable data. From the
    data available in the IFC format, the tangible geometry is considered
    to be the most reliable. However, not all the other data can be discarded.
    Only the data that is implicitly stored in the tangible geometry can be
    ignored without losing information. In practice this means that most,
    if not all, topologic data and a subset of the semantic data can be ignored.
    It was found that for the extraction/reconstruction of storeys (and their
    elevations), a z-value extraction based on created IfcSlab/IfcRoof groups
    was fairly effective. These groups were made based on their size, height,
    and location. This process does show a lowered reliability in buildings
    with complex storey structures. It was found that for the extraction/reconstruction
    of rooms, a voxelization approach functioned very well. The boolean refinement
    that followed, which took the shape from a rough voxelization to the precise
    room shape, showed some reliability issues. Finally, it was found that
    for the extraction/reconstruction of apartments that rules applied to
    a created space syntax graph showed promise. The rules that were used
    were simple, resulting in lower reliability in structures that had more
    complex room relationships. In conclusion, this research has been unable
    to give a definite answer to the issues at hand. However, all three the
    subjects that have been covered showed promising results and can be considered
    steps towards a solution.
  uuid: db6edbfc-5310-47db-b2c7-3d8e2b62de0f
- surname: van Rijssel
  name: Laurens
  title: Generating consistent triangular terrain elevation data for noise
    modelling
  supervisors: Balázs Dukai
  year: 2022
  graduation_date: '2022-01-13'
  link: https://resolver.tudelft.nl/uuid:f77cd8e1-682b-4812-9652-25b23b5319a4
  image: 2022_van-Rijssel.jpg
  abstract: In 2016, a collaboration between the TU Delft, RIVM and a few
    other companies started to automate the generation of environmental input
    data for noise modelling. As a part of that cooperation a promising triangle
    based data structure is researched to represent terrain elevation. Due
    to the properties of its generation it can provide certainty over the
    presence of objects while the format allows for efficient cross sections
    extraction. Yet a persistent challenge remains, the large file size makes
    exchange and processing of terrain data troublesome. This research aims
    to optimize the terrain elevation data to decrease the file size while
    ensuring accurate noise calculations. Using an in-depth analysis of the
    usage of terrain elevation in noise modelling in a Dutch and European
    context, a environmental based approach for a triangulated terrain generation
    is developed. This approach is conceptually implemented to facilitate
    the calculation of noise values using terrain generated with the provided
    approach. Empirical tests have been conducted to measure the influence
    of different terrain elevation settings over a variety of terrains. The
    study concludes by providing an advice on an approach for elevation model
    generation. Several insights are discovered regarding the impact of terrain
    elevation accuracy on noise propagation calculations. Compared to a currently
    publicly available terrain data set a size reduction of 50 to 90% can
    be obtained without quality reduction.
  uuid: f77cd8e1-682b-4812-9652-25b23b5319a4
- surname: van Schendel
  name: Maximiliaan
  title: Merging of Topometric Maps of Indoor Environments -- Extraction
  supervisors: Edward Verbree
  year: 2022
  graduation_date: '2022-10-31'
  link: https://resolver.tudelft.nl/uuid:92e1ea3a-3a34-449c-b0b4-731d6480266a
  image: 2022_van-Schendel.jpg
  abstract: The merging of multiple partial maps of indoor environments created
    by teams of human or robot agents into a single global map is a key problem
    that, when solved, can improve mapping speed and quality. Existing map
    merging approaches generally depend on external signals which are not
    available indoors or only use the geometric properties of an environment.
    Inspired by the human understanding of environments in relationship to
    their context we propose a map merging system that extracts and uses topometric
    maps, a map representation containing both the geometric and topological
    characteristics of an environments, to solve the map merging problem in
    indoor spaces. In this research we demonstrate an intuitive approach to
    extracting topometric maps of 3D, multi-floor, indoor environments and
    use both the topological and geometric characteristics contained in the
    topometric maps to perform context-aware map matching and fusion.
  uuid: 92e1ea3a-3a34-449c-b0b4-731d6480266a
- surname: Veselý
  name: Ondrej
  title: Building massing generation using GAN trained on Dutch 3D city models
  supervisors: Giorgio Agugiaro; Roberto Cavallo
  year: 2022
  graduation_date: '2022-06-27'
  link: https://resolver.tudelft.nl/uuid:27085fd4-654a-4748-92d0-61563fe6040c
  image: 2022_Vesely.jpg
  github: https://github.com/ondrej-vesely/massingGAN
  abstract: Despite being relatively novel, generative adversarial networks
    (GAN) have already been appropriated for application to several problems
    within the field of architectural and urban generative design. However,
    the preceding GAN based models for building massing generation make use
    of only simplified and two dimensional representation of the built environment.
    This work improves upon the existing deep-learning-based methods for generation
    of building massings and building group layouts, by fusing high accuracy
    three-dimensional building models with site context derived from cadastral
    and topographic data, sourced from openly available datasets in the Netherlands.
    Pix2pixGAN implementation in PyTorch, trained on existing massing data
    encoded into images as heightmaps, is used to generate building massing
    geometry. Two methods for geometry extraction from heightmaps are introduced,
    voxelization and vectorization. The goal for the model is to maximize
    similarity of morphological traits of configurations generated by the
    model to the ground truth training data. The effects of multiple proposed
    training configurations on the resulting massings generated by the model
    are evaluated, together with visual assessment, using their Spacematrix
    mappings. Three distinct models with specific goals are presented - parcel
    infill model, street block infill model, and urban fabric infill model.
    All three models show a capability to learn spatial traits of existing
    building configurations and transfer them into new situations not encountered
    in the training data, which is confirmed by the distribution of Spacematrix
    mapping of the generated results being similar to the distributions of
    the ground truth data. The proposed methodology represents a novel approach
    to generating building massing configurations by autonomously inferring
    the rules of their composition from existing urban areas. The resulting
    models could be used to provide initial states in optimization-driven
    design approaches, or as smart massing suggestion engines, assisting architects
    and city planners during the early building design process.
  uuid: 27085fd4-654a-4748-92d0-61563fe6040c
- surname: Wang
  name: Linjun
  title: Detailed Facade Reconstruction for Mahattan-world Buildings
  supervisors: Liangliang Nan
  year: 2022
  graduation_date: '2022-06-23'
  link: https://resolver.tudelft.nl/uuid:1581231d-6109-44b2-ab57-bbbea3e08642
  image: 2022_Wang.jpg
  github: https://github.com/fiodccobw/3DFacade
  abstract: '3D building models play an important role in many real-world
    applications. Different models are suitable for different application
    scenarios based on their levels of detail. LOD3 models with facade details
    are crucial for many applications, such as virtual reality and urban simulation.
    Currently, 3D building models with lower LOD are largely available, but
    the number of LOD3 models is very limited. Most LOD3 reconstruction methods
    depend on manual operation, which is very time-consuming. How to automatically
    reconstruct the detailed facade for building models has remained a problem
    in computer vision. The problem can be seen as an image processing problem,
    but how to convert the 2D results into 3D smoothly should also be considered.
    In this project, we proposed a method to automatically reconstruct the
    detailed building models based on the Faster R-CNN. The method starts
    from a set of street view images, and the results are models with facade
    elements. A 3D point cloud can be extracted from the images using SfM
    and MVS, and the camera parameters can also be recovered. We take advantage
    of the high-quality facade images and parse the facades to detect their
    bounding boxes. The bounding boxes can match pretty well with the rectangular
    shape of the facade elements. The 2D facade elements can be added to the
    3D building model based on the camera parameters. The process is very
    efficient and automatic. The regularity of the facade elements will be
    reserved, making the result more convincing. Our method includes four
    main steps: (1) coarse model reconstruction, (2) facade image selection
    and rectification, (3) facade element detection and regularization, and
    (4) detailed facade reconstruction. Experiment results show that our method
    can produce reliable building models with facade details for many different
    situations. It can work for both the multi-face building blocks and the
    street side buildings. Our test shows that the window detection performance
    is pretty good. The object detection is extremely fast, and the whole
    pipeline is lightweight and efficient. In theory, the method can also
    be extended to reconstruct large-scale city models, which means it has
    broad application prospects.'
  uuid: 1581231d-6109-44b2-ab57-bbbea3e08642
- surname: Wu
  name: Ziyan
  title: 'Estimating building height from ICESat-2 data: The case of the Netherlands'
  supervisors: Hugo Ledoux
  year: 2022
  graduation_date: '2022-06-29'
  link: https://resolver.tudelft.nl/uuid:bb13b322-1ad8-48d1-9baf-89f539e18adf
  image: 2022_Wu.jpg
  github: https://github.com/Ziyan-Wu/master_thesis2022
  abstract: Building height information has been more used in a variety of
    industries in recent years. This information can be used in sustainable
    urban planning, urban climate research, population estimation, and three-dimensional
    (3D) building reconstruction, etc. Nowadays, building height information
    is obtained mostly by photogrammetry, high-resolution photos, and aerial
    Light Detection and Ranging (LiDAR) data. However, the existing technique
    is constrained by issues of scale, cost, and quality. The Ice, Cloud and
    land Elevation Satellite-2 (ICESat-2) was launched in 2018, using photoncounting
    LiDAR technology to gather Earth’s surface elevation data globally. It
    represents the highest level in space-borne laser altimeters and has been
    proved can estimate building height. In this thesis, a method is proposed
    to estimate the height of all buildings in the Netherlands. To estimate
    the building height, elevation data from ICESat-2 and footprints from
    Basisregistratie Adressen en Gebouwen (BAG) are two used datasets. Spatial
    interpolation methods and percentile methods are used to get ground and
    roof elevation for each footprint, respectively. Random Forest Regression
    (RFR) method is used to deal with the low coverage of ICESat-2. The result
    shows that less 3% of buildings could obtain their height from ICESat-2
    data. Among these buildings, 90% of them are lower than 10 meters and
    half of them are between 5 - 10 meters. This caused a low performance
    of the prediction model with Mean Absolute Error (MAE) of 2.1m. The building
    between 5 - 10 meters has the smallest MAE of 1.1267m. Small amount of
    available of ICESat-2 data is the key reason, which leads to the training
    data of building over 10 meters is not enough. The results reveal it is
    impossible to get the height of all buildings in the Netherlands with
    ICESat-2 data. But the proposed method is a feasible option for buildings
    between 5 and 10 meters in height.
  uuid: bb13b322-1ad8-48d1-9baf-89f539e18adf
- surname: Alhoz
  name: Khaled
  title: ISO 19650 standards in Web GIS for project's information management
    including GIS & BIM
  supervisors: Stelios Vitalis
  year: 2021
  graduation_date: '2021-11-03'
  link: https://resolver.tudelft.nl/uuid:306f0b94-2827-4aa0-90df-66110ee5a484
  image: 2021_Alhoz.jpg
  abstract: In large and complex civil engineering projects, well-managed
    information enables easier and faster access to the required data when
    available. In the Architecture, Engineering and Construction (AEC) industry,
    professionals and data managers constantly seek to optimize the information
    management process to better collaborate in projects that include GIS
    & BIM integrated workflows. The publication of ISO 19650-1:2018 & ISO
    19650-2:2018 (ISO 19650-1&2:2018) standards on best practices for information
    management, including BIM, was recognized as an opportunity to the digital
    organization of these processes. As a result, main BIM software vendors
    have started supporting ISO 19650-1&2:2018 in their platforms, and (non)-governmental
    organizations have started adopting them in their projects. However, the
    advancement in the field of GIS BIM integration and the tightly integrated
    workflows drew the attention towards the need for supporting ISO 19650-1&2:2018in
    Web GIS for web services. I3S web service is an example of an open OGC
    Community standard that allows the consumption of 3D GIS data and 3D GIS
    data converted from 3D BIM data in Web GIS. In this thesis, field analysis
    addresses the challenges and the role of the Web GIS platform in projects
    information management processes of the Hoogwaterbeschermingprogramma
    (HWBP) as a case study. Then, literature studies review ISO 19650-1&2:2018
    in the context of the HWBP to highlight the need for a Common Data Environment
    (CDE) in the Web GIS platform to support ISO 19650-1&2:2018. Moreover,
    the review tackles the CDE components specified in Part-2 of ISO 19650-1&2:2018,
    such as metadata allocation. Finally, this thesis discussed the implementation
    of the CDE components for I3S web services in ArcGIS Online as a Web GIS
    platform. The novel contribution of this thesis is providing a contextual
    overview of ISO 19650-1&2:2018 standards in the project information management
    processes that include working with GIS & BIM data. Moreover, using the
    British national annex (BS EN ISO 19650-1&2), a flowchart was developed
    for the metadata allocation systems of information container workflows.
    Furthermore, the reference implementation discussed a variety of options
    to implement the metadata allocation components in Web GIS. The discussion
    provided a solution and PoC functionalities of the CDE components for
    managing I3S web services. The resulting solution on the CDE components
    can be utilized to configure CDE workflows and technical solutions to
    enable ISO 19650-1&2:2018 compliant workflowsin Web GIS.
  uuid: 306f0b94-2827-4aa0-90df-66110ee5a484
- surname: Chatzidiakos
  name: Charalampos
  title: Safety-driven road width estimations from vector data
  supervisors: Anna Labetski; Ken Arroyo Ohori; Stelios Vitalis
  year: 2021
  graduation_date: '2021-11-05'
  link: https://resolver.tudelft.nl/uuid:86c86f99-eaf3-4de6-b4e0-aef06ba158a8
  image: 2021_Chatzidiakos.jpg
  github: https://github.com/chchatzi/Thesis_Master
  abstract: In recent decades, it is well known that transportation systems
    have a crucial role in the economic development and social prosperity
    of modern societies. While road width can be considered as one of the
    most important factors of the road environments, there is no clear definition
    of it. To better understand this, we need to reconsider the width of a
    road not as a single numerical value but as a complex concept that can
    be interpreted in different ways. Different road users may refer to different
    width values for the same road. Thus, while estimating road width seems
    to come with great benefits for different real-world cases, a fundamental
    rethinking of the purpose of this entire process is necessary. Road safety
    management is an application whose overall process is strongly affected
    by the width of the road. While there are conflicting theories about the
    effect that road width can have on road safety, we may need to reconsider
    a few things before exploring their relation. In this thesis, we introduce
    a novel approach for estimating road width and linking it with roads in
    such a way that the overall process of road safety management application
    could benefit. Moreover, even road width estimation is not a new topic
    most of the studies so far use LiDAR point cloud or satellite images as
    input. In our approach, vector data coming from open-sources are used.
    Different inputs come with different limitations. The advantages, as well
    as the drawbacks of the different inputs, will be discussed. Finally,
    one of the main objectives of this project is to develop a methodology
    that will be generally applicable. Vector data that can be found in different
    datasets would be used. Some additional deliverables will result from
    our efforts to overcome some of the challenges that have arisen in achieving
    this goal. A methodology that standardizes road vector data and a methodology
    that identifies the location and the type of the different intersections
    will be developed
  uuid: 86c86f99-eaf3-4de6-b4e0-aef06ba158a8
- surname: Chen
  name: Zhaiyu
  title: Learning to Reconstruct Compact Building Models from Point Clouds
  supervisors: Liangliang Nan; Seyran Khademi
  year: 2021
  graduation_date: '2021-06-29'
  link: https://resolver.tudelft.nl/uuid:e33e7fa1-118e-41d8-904f-5f03eb36e887
  image: 2021_Chen.jpg
  github: https://github.com/chenzhaiyu/points2poly
  paper: https://doi.org/10.1016/j.isprsjprs.2022.09.017
  abstract: 'Three-dimensional building models play a pivotal role in shaping
    the digital twin of our world. With the advance of sensing technologies,
    unprecedented data acquisition capabilities on capturing the built environment
    have surfaced, with photogrammetry and light detection and ranging being
    the two important sources, both of which can acquire point clouds of buildings.
    A point cloud is anisotropically distributed in space, which---though
    conveying spatial information itself---has to be converted into a surface
    model for a wider spectrum of usage. This conversion is often referred
    to as reconstruction. Despite the enhanced availability of point cloud
    data in the built environment, how to reconstruct high-quality building
    surface models remains non-trivial in remote sensing, computer vision,
    and computer graphics. Most reconstruction methods are dedicated to smooth
    surfaces represented by dense triangles, irrespective of the piecewise
    planarity that dominates the geometry of real-world buildings. Although
    some works claim the possibility of reconstructing piecewise-planar shapes
    from point clouds, they either struggle to comply with specific geometric
    constraints, or suffer from serious scalability issues. There is no versatile
    solution yet for building reconstruction. In this thesis, we propose a
    novel framework for reconstructing compact, watertight, polygonal building
    models from point clouds. Our approach comprises three functional blocks:
    (a) a cell complex is generated via adaptive space partitioning that provides
    a polyhedral embedding as the candidate set; (b) an implicit field is
    learnt by a deep neural network that facilitates building occupancy estimation;
    (c) a Markov random field is formulated for surface extraction via combinatorial
    optimisation, where an efficient graph-cut solver is applied. We extensively
    evaluate the proposed method in comparison with state-of-the-art methods
    in shape reconstruction, surface approximation and geometry simplification.
    Experimental results reveal that, with our neural-guided strategy, high-quality
    building models can be obtained with significant advantages over fidelity,
    compactness and computational efficiency. The method shows robustness
    to noise and insufficient measurements due to occlusions, and generalise
    reasonably well from synthetic scans to real-world measurements. Moreover,
    our method remains generic to not only buildings, but any piecewise-planar
    objects.'
  uuid: e33e7fa1-118e-41d8-904f-5f03eb36e887
- surname: de Jong
  name: Maarten
  title: Simplification of massive TINs with the streaming geometries paradigm
  supervisors: Hugo Ledoux; Ravi Peters
  year: 2021
  graduation_date: '2021-07-02'
  link: https://resolver.tudelft.nl/uuid:e7df1d5a-8819-40aa-a3d1-1f6d50b8a39e
  image: 2021_de-Jong.jpg
  github: https://github.com/mdjong1/simpliPy/
  abstract: 'The volume and density of geospatial data is constantly increasing
    as newer acquisition techniques are developed to create higher-resolution
    datasets and more countries are creating country-wide datasets such as
    point clouds. However, methods to deal with this increase in the amount
    of data are lagging behind and the developments in computer hardware are
    no longer moving fast enough to compensate. Especially the ability to
    load and process datasets into the main memory of a computer is becoming
    more difficult. Therefore, to work with these massive datasets more modern
    techniques need to be used. In this thesis on one such method for dealing
    with these massive datasets is explored; streaming simplification of geometries.
    Streaming of geometries relies on processing small portions of a geometric
    dataset at a time, only keeping as much information in memory as is necessary,
    instead of the whole dataset. This method ensures that memory bottlenecks
    are prevented and ever-increasingly large datasets can be processed. Processing
    done on a LIDAR dataset can range from creating rasterized surface or
    terrain models, to creating a triangulation. Triangulations are an imporant
    starting point for other analysis techniques such as watershed calculations,
    line of sight, or noise propagation. However, large datasets of high density
    lead to large triangulations which are still too complex for these techniques
    to work with. To create more manageable triangulations it is necessary
    to simplify them, which means finding a subset of the vertices that best
    approximates the original surface. This can be done randomly, or feature-aware
    by taking into account the shape of the dataset that is being simplified
    and ensuring data is kept where it is relevant. The AHN3 dataset is so
    large that simplification cannot be done using traditional techniques.
    Therefore, to achieve simplification of the AHN3 dataset, this thesis
    focuses on the modification of an existing methodology for creating streaming
    triangulations by incorporating a simplification step. The methodology
    implemented in this thesis consists of determining where a simplification
    algorithm can be introduced within the existing streaming pipeline, as
    well as determining which existing simplification techniques are applicable.
    After defining possible locations for a simplification module within the
    streaming pipeline, various methods are created and tested on different
    sizes of dataset. These methods are: random simplification, decimation,
    refinement, and a novel medial axis transform based approach. For the
    refinement method a number of different implementations are investigated.
    After the initial results are analyzed, the decimation and medial axis
    transform algorithms are rejected due to extremely long processing times
    or a lack of accurate results, respectively. The refinement implementations
    are able to produce accurate simplified triangulations in a reasonable
    amount of time, where the best performing method hardly introduces a slowdown
    in processing at all. Using the fastest algorithm (FCFS) 4 billion points
    are processed in less than 11 hours, against 13 hours without simplification.
    Compared to other methods the accuracy of the methodology is similar for
    all of the approaches. However, the number of points that can be processed
    per second is less when compared to existing research. The best performing
    algorithm is a novel method defined as First-Come-First-Serve (FCFS),
    as it has the best ratio between vertex error and computation time. The
    results of this research show that creation and simplification of a massive
    Delaunay TIN is possible and produces acceptable results, achieving RMSE''s
    below 0.2m consistently. Despite simplification, the size of the resulting
    datasets is still often too large to fit within the main memory of a computer
    and will still require streaming processing to perform further calculations
    on larger areas. This suggests that with the current ever-growing datasets
    it is relevant to explore how all different types of calculations can
    be performed in a streaming pipeline, possibly allowing these to be chained
    one after another. All methods created for this thesis are found here:
    \url{https://github.com/mdjong1/simpliPy}'
  uuid: e7df1d5a-8819-40aa-a3d1-1f6d50b8a39e
- surname: de Jongh
  name: Wessel
  title: Urban morphological analysis for wind potential
  supervisors: Clara García Sánchez; Balázs Dukai
  year: 2021
  graduation_date: '2021-07-02'
  link: https://resolver.tudelft.nl/uuid:fdbff288-fede-4796-9972-54627af0db77
  image: 2021_de-Jongh.jpg
  github: https://github.com/CodeWessel/windystreet
  abstract: 'Wind has a profound impact on the meteorological and environmental
    conditions in cities. And so, by understanding wind flow behaviour within
    the urban environment, we can use the increasingly available open data
    to contribute to the design of healthy cities. This Master’s thesis presents
    a methodology to compute urban morphological parameters and its effect
    on potential wind velocity. The proposed method may serve as an complementary
    method to Computational Fluid Dynamics (CFD) simulation or scaled wind
    tunnel tests. The research question in this thesis is: Can we use urban
    morphology to automatically calculate potential increase in wind velocity?
    To answer this, first an introduction to wind flows in the urban environment
    is presented. Then, several methodologies are presented to compute the
    urban morphological parameters, such as the Urban Canyon, wind- or leeward
    facade, Angle of Attack and terrain roughness length. The method relies
    on the use of a Voronoidiagram, with cells describing the morphology.
    After, the urban morphological parameters are related to potential wind
    velocity through a scoring method. Using two meteorological stations inside
    the area of interest, the mean wind velocity is compared to the scores.
    The result show that both stations show a higher mean wind velocity for
    higher scores. However, more research is necessary to validate this outcome
    and a recommendation is given to compare the result of this thesis to
    a CFD simulation.'
  uuid: fdbff288-fede-4796-9972-54627af0db77
- surname: Doan
  name: Truc Quynh
  title: 'Testing and extension of a GIS-supported design tool for new urban
    development areas: Case study: Sloterdijk I, Amsterdam'
  supervisors: Giorgio Agugiaro
  year: 2021
  graduation_date: '2021-06-22'
  link: https://resolver.tudelft.nl/uuid:b38588b1-1854-4ffa-976e-d87db3036b71
  image: 2021_Doan.jpg
  paper: https://doi.org/10.5194/isprs-annals-V-4-2021-169-2021
  abstract: The emergence of spatial data, GIS-supported tools, web mapping
    technologies has opened up many applications for more inclusive spatial
    planning and spatial decision support approaches. Site analysis is strongly
    supported by spatial data analysis in both 2D and 3D, which offers a more
    comprehensive understanding of urban settings. Furthermore, 3D city modeling
    and 3D web technologies not only help visualize design scenarios but also
    promote communication among the stakeholders for better decision-making.
    The first version of a GIS-supported design tool for new urban development
    areas was developed in a previous study (which we refer to in this thesis
    as the “Buurt Generator”). The tool works with the Netherlands’ data context
    to assist the realization of the 3D models of urban development projects
    in an interactive computer environment. The pre-design stage of the tool
    was based on the semantic 3D city model with different urban KPIs stored
    in the 3D City Database. Template neighborhoods that match the development
    goals of the project were then selected to extract design KPIs. The design
    KPIs, together with the development goals of the sites, form the basis
    and guidelines for generating different scenarios in the design stage.
    The scenarios are then integrated back into the 3D city model and visualized
    in 3D and are disseminated via web platforms. This thesis aims to test,
    critically review, and propose extensions and improvements for the “Buurt
    Generator”. It starts with a general review of the tool and literature
    reviews on related concepts and technologies. Then, the thesis investigates
    the accuracy of the generated 3D City model in estimating buildings’ volumes.
    Since volumetric measurements play a critical role in deriving urban KPIs
    and design KPIs, their accuracy is highly concerned. Hence, a volumetric
    comparison approach with other existing 3D city models is employed. The
    second focus is on the expansion of urban KPIs and design KPIs. The work
    bases on a data-driven approach that considers spatial and non-spatial,
    volumetric, and non-volumetric urban parameters. Moreover, the thesis
    proposes a comprehensive understanding of the city context and the project
    site based on available data. Then, it would be the task of the urban
    practitioners to reason the design KPIs for the new urban development
    project. The third focus is to develop a framework to study the impacts
    of the design solutions on the urban tissue. The framework is developed
    chiefly based on integrating the design into the 3D city model to perform
    (spatial) analysis. One of the energy-related criteria – the solar radiation
    factor - is chosen for further elaboration. The thesis contributes to
    the further integration of 3D city models into the urban planning process
    and explores its possibilities in assisting urban practices. It confirms
    the usability of the generated 3D model in estimating buildings’ volumes.
    It expands the list of urban KPIs and assists the information query to
    understand the city context and extract specific information. It bridges
    3D City Database and Grasshopper for post-assessment of designs regarding
    solar radiation and opens the way for other urban simulations.
  uuid: b38588b1-1854-4ffa-976e-d87db3036b71
- surname: Giannelli
  name: Denis
  title: Solar Analysis on Buildings of Favelas in São Paulo to Estimate PV
    Potential
  supervisors: Giorgio Agugiaro
  year: 2021
  graduation_date: '2021-11-04'
  link: https://resolver.tudelft.nl/uuid:05ff635a-8113-4d65-aae1-bc0c727831d8
  image: 2021_Giannelli.jpg
  paper: https://doi.org/10.5194/isprs-annals-V-4-2022-275-2022
  abstract: 'In the Global South, large urban spaces resulted in the duality
    between the so-called ‘formal’ and ‘informal’ cities. It is the case of
    São Paulo, a twenty-two-million people metropolis and a financial hub
    in Latin America. Albeit a vast literature addresses the social-spatial
    segregation emerging from this dual built environment, the scarcity of
    spatial datasets regarding informal settlements also enforces a geo-information
    segregation, resulting in a terra incognita. This is exemplar in favelas,
    defined as precarious, spontaneous, and unorganised land occupation built
    on third-party property, most of which lack cadastral data. Since favelas
    are often not mapped, assessing urban phenomena becomes a technical challenge
    for several application domains, e.g., the energy one. A recent public
    initiative in Brazil estimates solar irradiation and photovoltaic potential
    for buildings at city scale, but favelas are intentionally excluded from
    the resulting web-based solar maps. Technicians believe that the absence
    of a spatial pattern in favelas calls for investigation on how to refine
    a roof mapping methodology. The main research question becomes: “How far
    is it possible to perform solar analysis on buildings of favelas in São
    Paulo, with the goal of estimating PV Potential?”. The research is structured
    into two topics: 1) Roof Mapping, which investigates the data pipeline
    that leads to a digital reconstruction of favelas; 2) Solar Irradiation,
    which investigates how existing solar irradiation modules – GRASS GIS,
    ArcGIS, CitySim, SimStadt, Ladybug and the one developed by Virtual City
    Systems – perform when assessing buildings of favelas. From a roof mapping
    perspective, the experiments reveal that the absence of cadastral datasets
    represents a complex technical challenge. Nevertheless, the reconstructed
    and post-processed building footprints cover the extension of the cadastral
    footprints that are available for the study area, with building shapes
    that are satisfactory as a first approximation. Regarding the solar irradiation
    perspective, qualitative and quantitative analyses are carried out to
    compare the results coming from the six solar modules. The qualitative
    analysis indicates that each solar module offers potentialities but also
    limitations. Therefore, a straightforward choice is not possible, since
    the optimal solution will be derived from a data-driven approach that
    considers, among other factors: the scale of the favela, its topographical
    characteristics, the presence/absence of urban features other than buildings
    (such as vegetation), a possible pre-selection of buildings of interest,
    etc.; The quantitative analysis reveals that ArcGIS outputs an annual
    summation of irradiation values that is the closest to the one offered
    by the meteorological station of São Paulo, adopted as ground truth. Nevertheless,
    from an accuracy perspective, CitySim outputs a daily curve that best
    corresponds to the ground truth one. In conclusion, based on the geometrical
    model and the weather dataset criteria, the author expresses his preference
    for a raster-based solar module – GRASS GIS or ArcGIS – if, on the one
    hand, the reconstructed building footprints result in an unrealistic or
    excessively complex vector-based model. On the other hand, if the resulting
    vector-based model is simple enough and representative of the built environment
    of the favela, the author suggests the adoption of CitySim.'
  uuid: 05ff635a-8113-4d65-aae1-bc0c727831d8
- surname: Hobeika
  name: Nadine
  title: CFD, sensitivity analysis and optimisation to promote the formation
    of dunes
  supervisors: Clara García Sánchez; Ivan Pađen
  year: 2021
  graduation_date: '2021-07-02'
  link: https://resolver.tudelft.nl/uuid:40a081bc-e32c-4c01-ab4b-ad71a1057c70
  image: 2021_Hobeika.jpg
  github: https://github.com/NadHobeika/dace_sensitivity_analysis
  abstract: In 2017, the ‘Kustpact’, a Dutch national agreement, was signed
    to develop the Dutch coast without damaging its ecosystem nor its aesthetics.
    Consequently, the formation and protection of coastal dunes have become
    a focal point for research and development. For this reason, based on
    the idea of Performance-Based Design (PBD), this Master thesis aims to
    investigate the impact of certain geometric design parameters of beach
    house configurations on wind turbulence for the purpose of widening the
    dunes. A parametric design space was set up to easily automate Computational
    Fluid Dynamics (CFD) simulations for different purposes throughout this
    study. The sediment mobility estimation was the objective function for
    all simulations conducted. It is based on the difference of transport
    rate between two lines from the beginning of the plateau to the foot of
    the dunes. To simplify the parametric model, a Sensitivity Analysis (SA)
    was conducted to statistically identify the most influential parameters
    in the model. Afterward, the filtered parameters from the SA are used
    to build a surrogate model to detect the trends that result from combining
    the most influential parameters. Finally, a Surrogate-Based Optimisation
    (SBO) is conducted based on the former surrogate and using a Genetic Algorithm
    (GA). Three generations were run and used to increase the accuracy of
    the surrogate and predict an optimum solution for widening the dunes.
    The study concludes on a list of design criteria to respect in order to
    widen the dunes mainly pertaining to the consistent position of the configuration
    relative to the dunes, the important overlap between houses and the larger
    wind-facing direction of the configuration.
  uuid: 40a081bc-e32c-4c01-ab4b-ad71a1057c70
- surname: Kenesei
  name: Kristof
  title: Constructing a digital 3D road network for The Netherlands
  supervisors: Ravi Peters
  year: 2021
  graduation_date: '2021-06-22'
  link: https://resolver.tudelft.nl/uuid:2a987bdc-82e1-4d82-92ea-fecd17e6c567
  image: 2021_Kenesei.jpg
  github: https://github.com/kriskenesei/geo2020-modules
  abstract: This research concerned the design and implementation of a system
    to perform the 3D conversion of a national road network using airborne
    Lidar data and land-based road elevation measurements, preserving its
    topology and quantifying output elevation accuracy. While the system was
    designed with generality in mind, specific Dutch open data datasets were
    used as input which were also used in a commercial project with the same
    goals. In addition to designing a scientifically sound equivalent of the
    commercial implementation, this research also explored purely academic
    goals, such as selecting road surface laser reflections accurately and
    using them for 2.5D road surface modelling purposes. Our system was based
    on decomposing the 3D conversion task into individually solvable 2.5D
    sub-problems to enable the use of efficient terrain modelling methods,
    and to prove that scaling via multiprocessing would be possible. At the
    10-30 points per m 2 sampling density we worked with, the road surfaces
    are oversampled. We found that because our elevation estimates are based
    on road reflections only, and because road surfaces are smooth and relatively
    flat, the output quality and accuracy depends only on the specific technique
    used to extract the elevations from the Lidar data. Using our methods,
    the output elevation accuracy represents a 30% increase relative to the
    Lidar input data, amounting to 10.6 cm at 95% certainty with our specific
    datasets. This is assumed to be violated only where local density drops
    below 3 points per m 2 , which occurs where roads are occluded by opaque
    objects, unless the land-based road surface measurements can provide enough
    additional data. Elsewhere, more than 98% of the road network conforms
    with the minimum point density. The 2.5D-based decomposition was found
    to be an effective means of simplifying the problem and terrain modelling
    methods were successfully used in the procedure. More than 90% of the
    traffic-occupied road surfaces are included in the resulting surface models,
    and about 75% of the total paved surfaces. We extracted the output elevations
    from them, using linear interpolation where they were unavailable. Our
    3D conversion quality and accuracy represents an improvement relative
    to the commercial results, mostly due to the better prioritising of the
    input elevation sources, in addition to our solution's capacity to handle
    complex small to medium-scale occlusion better, including complex relationships
    between roads such as multi-level motorway junctions.
  uuid: 2a987bdc-82e1-4d82-92ea-fecd17e6c567
- surname: Li
  name: Xiaoai
  title: 'CityREST: CityJSON in a database + RESTful access'
  supervisors: Hugo Ledoux; Jordi van Liempt
  year: 2021
  graduation_date: '2021-07-01'
  link: https://resolver.tudelft.nl/uuid:e6bb2142-c113-4add-a466-41bf0fea3b11
  image: 2021_Li.jpg
  github: https://github.com/xiaoai-li/api_cityjson
  abstract: 'With the increasing demand for 3D city models in various applications,
    providing efﬁcient access to 3D city models on the web has become very
    important and valuable. However, there is a lack of web services in which
    users can directly and effectively access the city objects contained in
    the 3D city models on the web. Another problem with web services related
    to 3D city models is that the size of 3D city models can become very large.
    As a consequence, the browser will not respond immediately until all city
    objects in the requested 3D city model have arrived. Addi-tionally, although
    ﬁle-based systems are the easiest way of data storage, they have deﬁciencies
    in web services that require scalability, efﬁciency, and ﬂexibility in
    data access. To ﬁx these is-sues, the goal of this research is to develop
    the an efﬁcient way of disseminating 3D city models on the web, to discover
    the method of enabling 3D city models to be parsed incrementally and efﬁciently
    by the browser, and to explore a proper database solution for storing
    3D city models to support the fast data access. CityJSON has advantages
    in web applications over the CityGML data format, thus being chosen as
    the main datasets used in this research. Inspired by OGC API – Feature,
    a RESTful API for fast access to geospatial features in CityJSON has been
    developed. The second part of my research is related to the data streaming.
    CityJSONFeature has been proposed to enable CityJSON to be parsed incrementally
    on the web. To improve the overall data streaming perfor-mance, I proposed
    two methods to stream the data from the database to the RESTful API so
    that the RESTful API can immediately start constructing the ﬁrst CityJSONFeature
    and sending it to the user. The third part of my research is to explore
    a proper database solution for CityJSON datasets to best support the fast
    data access in the RESTful API. In addition, some auxiliary data is added
    into the database to improve the RESTful API’s capabilities with efﬁcient
    data ﬁltering and streaming. To evaluate the efﬁciency of the implemented
    methodology, a systematic benchmarking has been performed on three aspects:
    1) the database schema, 2) the two streaming methods, and 3) the performance
    difference between the DBMS and the ﬁle system. The results show that
    in most use cases the DBMS can better support the RESTful API than the
    ﬁle system with the help of the built-in query and index mechanism. In
    addition, the overall streaming performance is largely improved when adding
    data streaming from the DBMS to the RESTful API. Lastly, based on the
    benchmarks, an optimal database schema has been chosen to support the
    RESTful API with fast data access, efﬁcient data ﬁltering and streaming.'
  uuid: e6bb2142-c113-4add-a466-41bf0fea3b11
- surname: Lumban Gaol
  name: Yustisi Ardhitasari
  title: Convolutional neural networks for satellite-derived bathymetry
  supervisors: Ken Arroyo Ohori
  year: 2021
  graduation_date: '2021-07-01'
  link: https://resolver.tudelft.nl/uuid:662ac71f-6373-4128-8eeb-163b8e727b72
  image: 2021_Lumban-Gaol.jpg
  github: https://github.com/yustisiardhitasari/sdbcnn
  paper: https://doi.org/10.1080/01490419.2022.2091696
  abstract: 'Bathymetric depth for shallow water regions is essential for
    coastal management and research. The measurements using echo sounding
    and LiDAR leave data gaps because vessels cannot reach nearshore waters
    or the green laser unable to penetrate specific areas. Satellite-Derived
    Bathymetry (SDB) is an alternative to extract shallow water depths that
    is able to overcome these problems using multispectral imagery. There
    are two approaches of SDB: analytical and empirical. The analytical method
    requires several water properties, which might not be known. The empirical
    method relies on the linear relationship between reflectances and depths,
    but the relationship may not be entirely linear due to bottom types variation,
    water column, and noise. Machine learning approaches have been used to
    address nonlinearity, but it treats pixels independently, whereas there
    is a spatial correlation that influences SDB computations since adjacent
    pixels are correlated to depth. This characteristic of the local connectivity
    can be captured by Convolution Neural Networks (CNN). Therefore, this
    thesis conducts a study of SDB using CNN. This research focuses on the
    following questions: (i) what kind of preprocessing is needed for the
    data sets; (ii) what kind of CNN architecture can be used; (iii) what
    is the accuracy of the method; and (iv) to what extent the pretrained
    model in certain areas can be reused in other areas. In order to represent
    a variety of depth, bottom type, turbidity, and water column properties,
    this study chooses six areas of interest in three different coastal regions:
    Puerto Rico, Key West, and Hawaii. With several CNN configurations, the
    optimum accuracy is obtained using three convolutional layers, a window
    size of 9x9, and the RGBNSS bands. Based on the experiment and comparison
    to the previous studies, the accuracy of SDB using the CNN approach outperforms
    the linear transform, the ratio transform, Random Forest, and the radiative
    transfer model. The results show that the accuracy decreases as the depth
    increases and in more turbid water. Comparison between different image
    preprocessing indicates another benefit of CNN: removing the need to preprocess
    images since suitable corrections can be automatically performed by CNN
    given adequate training. The use of multi-temporal images enhances the
    variety of training data and thus improves SDB accuracy. However, data
    variation should be equally distributed to avoid abnormality in the result.
    Transfer model analysis indicates several limitations of SDB results at
    particular depths or when implemented to a different water condition,
    making the coastal water characteristics considered when reusing a pretrained
    model from one area to another. In summary, CNN does not require additional
    image preprocessing and features specifications for training. CNN can
    produce better SDB accuracy than several other methods. The accuracy improves
    by increasing the variety of training data. However, SDB using the transfer
    model still need to be further investigated. A thorough identification
    of the proportion of sample data is needed to obtain balanced training
    data. In this way, it is more likely to produce a more reliable and more
    stable CNN model for extracting shallow water depths in the new data.'
  uuid: 662ac71f-6373-4128-8eeb-163b8e727b72
- surname: Milyana
  name: N.A. Nur An Nisa
  title: 'Designing User Experience (UX) to Support Public Participation in
    Spatial Planning: Case study: Indonesia'
  supervisors: Hendrik Ploeger; Bastiaan van Loenen
  year: 2021
  graduation_date: '2021-07-05'
  link: https://resolver.tudelft.nl/uuid:b0876cc2-d8b8-4286-8b3f-1888a5f45d97
  image: 2021_Milyana.jpg
  abstract: 'In modern-day spatial planning, the implementation of public
    participation has increased to ﬁnd a balance between two major actors:
    the government as the powerholder and citizens as the individual affected
    by planning decisions. Cities are required to redeﬁne their public participation
    strategies by adopting modern tools to increase their citizen’s satisfaction
    regarding the spatial planning process. This challenge has made geographic
    information system (GIS) technologies invaluable to enhance the place-making
    process by allowing citizens to express their needs and preferences. On
    the other hand, developing GIS technology with design or hierarchy left
    unchecked, could cause usability problem to the user. GIS technology would
    end up running into an unnavigable ocean of buttons and maps, resulting
    in users can easily get lost and become frustrated. Therefore, User Experience
    (UX) can become integral for engaging users with spatial planning products
    and effectively meeting their aspirations. This thesis aims to develop
    a User Experience (UX) design guideline together with a mockup design
    and apply it as a web-based GIS prototype. The focus of the study will
    be on spatial planning practice in Indonesia. The User Experience (UX)
    design guideline named ’4PHASE toolkit’ was made with several design phases:
    Phase 1: Deﬁne, Phase 2: Design, Phase 3: Build, Phase 4: Test. The ﬁrst
    phase is related to top-down studies about participation in spatial planning
    process both in general and case study, resulting with the Actor-Network
    (ANT) diagram for conceptualizing user roles, participation tasks, and
    space-time setting during the participation. The second phase is related
    to the design process of the UX starting from building persona, creating
    user ﬂow, sketching wireframes, and designing interfaces - resulting with
    the proposed mockup of 4D Musrenbang. The third phase is the development
    of the prototype based on the mockup design using HTML, CSS, and Javascript
    to add functionalities to the web. At last, Phase 4 is testing the prototype
    with real actors who share similar traits with the Persona. Based on the
    user tests, the prototype itself is considered as good, with usability
    score of 71%. Overall, this thesis project has successfully created three
    main products: The 4PHASE toolkit, a mockup, and a geo-web prototype.'
  uuid: b0876cc2-d8b8-4286-8b3f-1888a5f45d97
- surname: Morlighem
  name: Camille
  title: Automatic reconstruction of 3D city models from historical maps
  supervisors: Hugo Ledoux
  year: 2021
  graduation_date: '2021-06-21'
  link: https://resolver.tudelft.nl/uuid:0889e498-cdd6-4a19-bbcb-d3fb189560e1
  image: 2021_Morlighem.jpg
  github: https://github.com/CamilleMorlighem/histo3d
  paper: https://doi.org/10.1007/s44212-022-00011-3
  abstract: 'Historical 3D city models have been increasingly used for the
    preservation and communication of the cultural heritage to a wider and
    more diversified public. In the recent years, they have also been of a
    growing interest in other domains such as in urbanism or in economy. However,
    their potential for supporting new use cases has been restricted by the
    difficulty to generate these models. Historical 3D city models can only
    be reconstructed from historical sources, such as historical maps, and
    this means dealing with all sorts of constraints and inaccuracies. As
    a result, reconstructing historical 3D city models is a challenging process
    that is to date still essentially manual and time-consuming. This thesis
    investigates to what extent the reconstruction of historical 3D city models
    can be automated. Several existing methods for extracting building footprints
    from historical maps have been tested and compared so as to identify the
    pros, cons and use cases of each method and all the challenges of working
    with historical maps. Based on these experiments a fully automated methodology
    was developed. It relies on three main stages: (1) the processing of the
    historical maps to extract the building plots, (2) the subdivision of
    these building plots into individual building footprints and (3) the reconstruction
    of a LoD2 historical 3D city model using 3D procedural modelling. This
    methodology was implemented with historical maps from two different study
    areas, Delft and Brussels, and for different epochs in order to reconstruct
    a dynamic historical 3D city model for these cities. The results show
    that the methodology workflow developed in this thesis allows to reconstruct
    automatically historical 3D city models for different historical maps
    collections and for different study areas. The main differences between
    the two case studies, Delft and Brussels, regard the implementation details
    (i.e. data availability, running time and user-defined parameters) but
    similar results are obtained, which show the suitability of the methodology
    to be applied for other study areas. Two elements are identified as main
    factors influencing the quality of the results obtained: the quality of
    the scanning process and the symbology of the historical maps. For historical
    maps that were properly scanned, with sufficient spatial resolution and
    strict symbology rules, the methodology provides accurate results by identifying
    more than 84% of the building plots in the ground truth and classifying
    properly more than 89% of the building plots. In addition, all historical
    3D city models reconstructed have their geometries valid at more than
    99%. Overall, this thesis provides a methodology for reconstructing automatically
    historical 3D city models from historical maps along with guidance and
    hints about this process and about a series of other methods, so that
    any user can find the most suitable method for their needs. All source
    codes and data of this thesis are available at https://github.com/camilleMorlighem/histo3d.'
  uuid: 0889e498-cdd6-4a19-bbcb-d3fb189560e1
- surname: Papageorgiou
  name: Manos
  title: Semantic segmentation of the AHN dataset with the Random Forest Classifier
  supervisors: Ravi Peters
  year: 2021
  graduation_date: '2021-09-14'
  link: https://resolver.tudelft.nl/uuid:699fb934-4d4b-4cf1-a115-75dcb79fbebb
  image: 2021_Papageorgiou.jpg
  github: https://github.com/MPa-TUDelft/Semantic-segmentation-of-the-AHN-dataset-with-the-Random-Forest-Classifier
  abstract: Three-dimensional (3D) city models are of great significance and
    are high in demand. They can be used for various useful applications such
    as urban planning, visibility analysis and estimating the solar irradiation
    and energy demand of buildings throughout the day. Nowadays, Light Detection
    And Ranging (LiDAR) sensors are one of the most commonly used technologies
    for the acquisition of cheap, fast, dense, and reliable 3D point cloud
    datasets. At the same time, increasing attention has been focused lately
    on the utilization of these 3D point cloud datasets for the reconstruction
    of 3D city models. The 3D representation of a scene in the form of a 3D
    point cloud facilitates a variety of analysis tasks like object recognition,
    segmentation, and classification, which are an important prerequisite
    for many building reconstruction methods. Thus, having an accurate classifier
    that can automatically assign 3D points a respective semantic class label
    is of utmost importance as it can significantly reduce the time and cost
    required to analyse 3D scenes. Training machine learning and deep learning
    algorithms to perform this task has been the focus of many recent scientific
    works that provide promising results and insights for future work. This
    thesis attempted to create an accurate Random Forest Classifier for LiDAR
    point cloud datasets using the Actueel Hoogtebestand Nederland 3 (AHN3)
    dataset as training data. The aim was to assist building reconstruction
    methods, and for this reason, only three semantic class labels are assigned
    to the points by the classifier, namely ground, building and other. Multiple
    experiments were conducted to test how large the training dataset needs
    to be, what features should be included and what point density the input
    point cloud needs to have for the classifier to perform well. Tests were
    also made using the DALES dataset to evaluate the performance of the classifier
    for different datasets and environments. Moreover, the time and memory
    required to train and test the various Random Forests models and the evaluation
    metrics of the results were stored as benchmarking research to provide
    insights and guide future work. The classification approach that was used
    consists of five major steps. First, the input point cloud is uniformly
    sampled and then spherical local neighbourhoods of the points are computed
    in multiple scales. Height and eigen-based features are then extracted
    for each local neighbourhood, and the best subset of features is then
    used to train the Random Forest Classifier. Finally, each point of the
    input point cloud is assigned to the same class as its nearest neighbour
    in the sampled point cloud. A comparative analysis shows that the performance
    of our final Random Forest model stands in parallel with that of other
    available, more complex, deep learning algorithms if we take into consideration
    its simplicity and efficiency.
  uuid: 699fb934-4d4b-4cf1-a115-75dcb79fbebb
- surname: Stevers
  name: Anna Vera
  title: The effects of beach house configurations on dune-ward sediment transport
  supervisors: Clara García Sánchez; Giorgio Agugiaro; Ivan Pađen
  year: 2021
  graduation_date: '2021-06-30'
  link: https://resolver.tudelft.nl/uuid:d85b5773-f511-4bdf-91a8-496107c8faba
  image: 2021_Stevers.jpg
  abstract: In the Netherlands, the coastal dunes are essential to protect
    the country against flooding. However, the rising sea levels increase
    the risk of flooding along these sandy shores. Moreover, due to a combination
    of human and natural activities, dune erosion has increased and will continue
    to do so in the coming decades. Besides flood protection, the Dutch shoreline
    is important for preserving biodiversity, the generation of drinking water
    and recreation. In recent year, the number of recreational buildings on
    the beach, such as bars and holiday homes has increased. This is relevant
    because previous studies show that such beach buildings affect the wind
    flow and limit aeolian transport of sediment towards the dunes. This research
    studies the impact of beach house configurations on dune-ward sediment
    transport to limit the adverse effects on dune development. We use CFD
    simulations to study the wind flow around a 3D model of a beach with holiday
    houses, based on a section of the Noordwijk beach in the Netherlands.
    We implement the CFD software OpenFOAM to solve the RANS equations for
    turbulent, steady-state flow. The sediment transport that occurs is calculated
    using the wind direction and speed near the ground surface of the solution.
    The study consists of multiple 3D models in which the placement of the
    houses is varied systematically, to study the effects of beach house configurations.
    Variations are made by rotating houses, individually or within a row,
    and changing the distance between the houses and dunes. We determine the
    annual effect on sediment transport by applying varying wind conditions
    based on historical wind data from Noordwijk. As we have many simulations
    to run, and all need different parameters and settings, we automated the
    process. First, a PostgreSQL database is used to store all requirements
    for the CFD simulations, the metadata and the results the simulations
    give. Then, a Python script links the information stored in the database
    to the correct settings in OpenFOAM. This way, many simulations are run
    in a row, and the results area to compare. The results show that rotating
    the houses individually towards the prevailing wind direction appears
    to improve the amount of dune-ward sediment that takes place, compared
    to beach houses placed perpendicular to the shore. Rotating a row of houses
    as a whole has a limited effect on the amount of sediment transport. However,
    combining the rotation of the row of houses and the houses individually
    towards the prevailing wind direction shows the best improvement in sediment
    transport. Changing the distance between the houses and the dune foot
    so that a row of houses forms a funnel shape pointing towards the dunes
    also yields promising results. Because we use a simplified model and do
    not take factors such as moisture levels or fetch distance into account,
    the results of this study overestimate the amount of sediment transport
    that takes place and might not quite resemble the reality. Further research
    using scale models or wind tunnels is necessary to confirm the suggestions
    made in this thesis.
  uuid: d85b5773-f511-4bdf-91a8-496107c8faba
- surname: van Heerden
  name: Natasja
  title: BIM and 3D City Models as Input for Microclimate Simulation
  supervisors: Francesca Noardo; Marjolein van Esch
  year: 2021
  graduation_date: '2021-07-02'
  link: https://resolver.tudelft.nl/uuid:630d57be-5660-4971-84c2-83bf12b1d204
  image: 2021_van-Heerden.jpg
  github: https://github.com/Natasja1992/ifc-citygml-2-envi
  abstract: Climate change, and the effect it has on our lives and the world,
    has been at the centre of debate in the past decades. Also in architecture
    and urban planning fields, the effect of climate on buildings and cities
    has always had a role in the design process, nowadays especially when
    it comes to sustainability related topics. An interesting element within
    climate is the microclimate, which is a small area where climate circumstances
    are different then in the surrounding area. For example in an urban area
    the temperature difference between an area in a big city and the rural
    area around it can be up to 10°C, due to influences of surrounding buildings
    and materials. In the design process often more general weather data is
    used in calculation, this while they can differ a lot from reality. Modern
    tools make it possible to simulate the microclimate. One of these tools
    is ENVI-met. However, inputting 3D models into this software is mostly
    a manual process. This while a lot of information that is necessary is
    already available in existing architectural and urban design models. There
    is just no way to input this information into the software. In this research
    a method is developed for combining detailed information from BIM models
    (IFC), with information about the surroundings from 3D City models (CityGML),
    and translating them to the ENVI-met format, so that these models can
    be used as input models for microclimate simulation in ENVI-met. This
    is done by creating a command line tool that extracts the necessary data
    from both input files, combining and converting it, and then writing it
    to a file in the ENVI-met format. Also guidelines and requirements for
    the input files will be established. This is done by first establishing
    what information is necessary for microclimate simulation in ENVI-met
    and how this information needs to be represented, and then finding out
    where this information can be found in the intended input files, and how
    it is represented in there. From this can be concluded what information
    can be taken from which input file and the characteristics that are necessary
    for their correct use in the process can be established. Then the conversion
    tool itself can be developed, where the data is transformed to the same
    coordinate system and format, so that it can be combined and written to
    the ENVI-met format. In the last step the results are checked by doing
    a small case study and running the microclimate simulation. This way,
    IFC and CityGML models can be used as input for microclimate simulation
    software ENVI-met, by using the conversion tool developed for this research
    and the provided guidelines.
  uuid: 630d57be-5660-4971-84c2-83bf12b1d204
- surname: Wu
  name: Jialun
  title: Automatic building permits checks by means of 3D city models
  supervisors: Francesca Noardo
  year: 2021
  graduation_date: '2021-09-14'
  link: https://resolver.tudelft.nl/uuid:d6d23631-281a-4107-9f05-7e4942f2dabf
  image: 2021_Wu.jpg
  github: https://github.com/Gallon229/Building-permit
  abstract: Most construction work requires building permit checks. Therefore,
    to promote sustainable and high-quality urban development, it is necessary
    to improve the building permit application process and accelerate the
    digital process of building permit checks. Many studies about the digitalization
    of building permitting use the BIM, mainly coded in its reference open
    standard IFC by buildingSMART, to check compliance. However, many regulations
    need to consider some building context that is not supported by the current
    buildingSMART. This will affect the permit checks of these building contexts.
    The use of 3D city models for building permit checks is an alternative
    to BIM. 3D city models are powerful tools for city-level analysis and
    they can do extensions on different City Objects which able to cover the
    building context in the regulation, therefore it has good applicability
    to problems related to urban planning. At present, there are little researches
    on building permit inspection based on 3D city models, so this study aims
    to provide an approach to use 3D city models and its extensions to support
    digital building permit checks. CityJSON has advantages over the CityGML
    data format in the development process, so it was selected as the 3D city
    model used in this study. The first step is to choose the regulations
    for building permit checks. This involves the interpretation of the regulations,
    formalization process. In this study, the use case research method was
    selected, and the parking standards for cars and bicycles in Rotterdam
    were selected as the research object. We built a logic-based mechanism
    to map the content of the law to the corresponding 3D model. Next, we
    built the CityJSON conceptual model, which included four types of urban
    objects and expanded them. Then, the data we obtained and the data model
    will be stored and extended in a CityJSON model and then used for calculation
    and analysis in the developed tool. Finally, through the tools developed,
    we successfully carried out a parking legal building permit inspection
    on the new building test data and stored and visualized the results. By
    using the framework and tool developed in this research, we can replicated
    the process to different places and regulations.
  uuid: d6d23631-281a-4107-9f05-7e4942f2dabf
- surname: Alexandridis
  name: Vasileios
  title: Automatic detection of waterbeds in shallow muddy water bodies in
    the Netherlands using green LiDAR
  supervisors: Ravi Peters
  year: 2020
  graduation_date: '2020-08-27'
  link: https://resolver.tudelft.nl/uuid:acbd73bf-3547-456b-8f9d-4b72d5b7b54a
  image: 2020_Alexandridis.jpg
  github: https://github.com/VasilisAle/Bathymetric_Pointcloud
  abstract: 'Bathymetric Airborne LiDAR technology is used to map the depth
    of water bodies. It uses a green light sensor which is able to penetrate
    the water surface and reach the bottom part of the interesting water areas.
    However, water conditions affect the capability of the green laser penetration.
    Factors such as the water clarity, the water turbidity (waves) and the
    vegetation are some of the crucial restrictions for green light to penetrate
    the water; particularly in shallow inland water areas. This research examined
    the capability of green LiDAR data to improve the bathymetric surveys
    in case of muddy and shallow inland Dutch water bodies. The potential
    of green LiDAR increases as the monitoring of water depths is getting
    easier, faster and more efficiently in terms of cost than manual GPS measurements.
    The main challenges of this thesis are concentrated both on the existence
    of various sparse and dense parts in the point-cloud and on the limitations
    of the data in terms of quality due to the not ideal water conditions.
    Specifically, this thesis presents a workflow with required procedures
    that aim to process a raw green LiDAR point clouds of water bodies and
    then classify them into three classes: water surface, underwater and bottom
    points. Pulse and Neighbourhood based algorithms were implemented in order
    to perform a classification process with high level of automation. Point
    characteristics such as intensity, number of returns, return number were
    analysed per pulse. Voxelization was used as a spatial method to divide
    the 3D space into water columns (3D Voxels). The spatial distribution
    of the water points into the water columns was examined based on different
    factors such as elevation, density, intensity. By comparing and partially
    combining those methods the detection process was improved to deal with
    shallow and muddy water bodies. A classification confidence value was
    calculated and stored for each potential bottom point. The resulting output
    is a classified green LiDAR point cloud based on the confidence values.
    Using elevation, density and confidence values, raster DTMs with multiple
    bands were created for each water body. To sum up, this thesis proposed
    an efficient workflow to process and automatically classify green LiDAR
    water-body data using both voxel and pulse based methods.'
  uuid: acbd73bf-3547-456b-8f9d-4b72d5b7b54a
- surname: Ceccarelli
  name: Giulia
  title: Semantic segmentation of point clouds with the 3D medial axis transform
  supervisors: Ravi Peters; Weixiao Gao
  year: 2020
  graduation_date: '2020-07-03'
  link: https://resolver.tudelft.nl/uuid:85973c1e-1798-4fae-9790-3d1bab9476e1
  image: 2020_Ceccarelli.jpg
  abstract: A point cloud is a representation of shapes, organized in a 3D
    irregular structure. Point clouds are increasingly used in different applications,
    ranging from architectural preservation to computer vision. The 3D medial
    axis transform is a topology preserving, skeleton representation of shapes.
    It can be used to decompose an object in meaningful parts and to describe
    local and long range information of points in a point cloud. In the past
    years, many deep learning methods for point clouds emerged. These are
    used for different applications, such as shape classification, object
    detection or semantic segmentation. In particular, the latter aim to classify
    each point in the input point cloud in subsets, based on their semantics.
    This research investigates the integration of the 3D MAT in two deep learning
    methods for point clouds' semantic segmentation, PointNet++ and Superpoint
    Graph. In particular, the 3D MAT was used in PointNet++ as a point feature,
    to give context to local points. Then, it was used in Superpoint Graph
    as a geometric descriptor to partition a point cloud and as a edge feature
    in the SPG. The major findings of this research outline that the 3D MAT
    can be successfully used in PointNet++ as a point feature, improving the
    overall accuracy and loss values of the algorithm. Particularly two MAT
    derived properties used in this research output positive results, radii
    and separation angles. These can be combined with point coordinates and
    RGB information to bring additional knowledge on the geometry of the shape,
    representing its curvature and thickness. Furthermore, they can be integrated
    in a simple and effective way, without increasing computational or time
    effort in the algorithm. The analysis carried out in Superpoint Graph
    depicts that the 3D MAT does not improve the initial geometric partition.
    In fact, adding geometric descriptors to the algorithm increases the difficulty
    in dividing the point cloud into simple shapes, creating artifacts. Furthermore,
    adding MAT information on superedges does not give added value to the
    SPG graph. The reason is that the SPG graph and the structured MAT are
    different than each other, in practice, as nodes represent diverse parts
    in the point cloud.
  uuid: 85973c1e-1798-4fae-9790-3d1bab9476e1
- surname: Dahle
  name: Felix
  title: Automatic change detection in digital maps using aerial images and
    point clouds
  supervisors: Ken Arroyo Ohori
  year: 2020
  graduation_date: '2020-06-30'
  link: https://resolver.tudelft.nl/uuid:9a84292f-ae1c-4d39-8a8e-a0cd0c133130
  image: 2020_Dahle.jpg
  paper: https://isprs-archives.copernicus.org/articles/XLIII-B2-2021/457/2021/
  abstract: 'In many countries digital maps are created and provided by the
    national cadastres: Usually they consist of multiple polygons, each with
    an exact location and shape, describing which kind of surface can be found
    at the position of the polygon (e. g. building, street, vegetation). They
    must be accurate and well maintained, as they are used by companies or
    authorities for purposes like urban planning or demographic statistics.
    However, especially cities are in a constant change. Old buildings are
    torn down, new buildings are built, and complete streets and neighbourhoods
    are changed. Monitoring these changes is difﬁcult and identifying and
    updating the virtual maps is still done mostly manually today. A method
    is developed to detect changes on the ground and identify changes for
    the virtual maps automatically using machine learning approaches. As input
    data the virtual map, their corresponding aerial images and point clouds
    from different years are needed. As a case study for this thesis, this
    method is developed and applied to the BGT, the Dutch virtual map with
    a resolution of 20cm. The research area is the city of Haarlem for 2017
    and 2018. High resolution aerial images are used in combination with point
    clouds created by Photogrammetry. The output is again a digital map of
    the area where every polygon has a probability score of how likely its
    category (for example building, street, etc..) changed. This can support
    the manual updating process eminently, as a minor percentage of polygons
    (for which the algorithm was unsure) must be checked manually. The research
    question of this thesis is to check whether this change detection is feasible
    even for highly heterogeneous structures like cities. Many visual changes
    in the aerial images are happening that are not relevant for the virtual
    map. In the one year, a street can be full of colourful cars, in the other
    year, the street is empty and completely grey. Many scenes are easy for
    humans to distinguish but are challenging for an algorithm. The goal is
    to detect a high amount of true changes while keeping the number of false
    positives low to reduce the manual work as much as possible. To achieve
    good change detection and answer the research questions, the machine learning
    library of XGBoost is used. It provides a gradient boosting framework
    for many different environments, including Python. Many weak learners,
    each classifying a change only with a very low detection rate (for example
    minimum height of all points inside the polygon), are combined to get
    a strong learner. This learner should be able to classify polygons with
    a high accuracy into polygons that change and polygons that do not change.
    With this method it is possible to detect a high amount of changes. 80%
    of all changes can be found within a reasonable number of False positives.
    Especially for buildings almost all changes can be identiﬁed. It is furthermore
    possible to localize the changes in larger polygons. However, not all
    changes can be identiﬁed, so that this approach should be seen as an aid
    for manual change detection and not to replace it.'
  uuid: 9a84292f-ae1c-4d39-8a8e-a0cd0c133130
- surname: de Groot
  name: Rob
  title: Automatic construction of 3D tree models in multiple levels of detail
    from airborne LiDAR data
  supervisors: Hugo Ledoux
  year: 2020
  graduation_date: '2020-04-15'
  link: https://resolver.tudelft.nl/uuid:3e169fc7-5336-4742-ab9b-18c158637cfe
  image: 2020_de-Groot.jpg
  github: https://github.com/RobbieG91/TreeConstruction
  abstract: Automatically generated 3D city models are becoming less of a
    futuristic, demanding or even impossible to attain goal, and more of a
    necessary, or vastly sought after, means for a multitude of applications.
    The current prevalence of open geographic information, such as nationwide-covering
    LiDAR datasets in the Netherlands, opens up opportunities for different
    parties to experiment in a search for solutions based on LiDAR data. A
    current approach in answering this demand for 3D city models is 3dfier,
    which is an ongoing project to automatically generate, disseminate and
    maintain a 3D city model based on open source airborne LiDAR datasets
    as a main source. Trees are currently not included in the 3D city models
    generated by 3dfier, while trees are an integral part of any city landscape.
    In this thesis, an implementation is developed that goes through multiple
    stages of the construction of 3D tree models. First, an initial classification
    method of the available LiDAR point cloud data is done. This results in
    a new intermediate point cloud that consists of mostly points belonging
    to trees. These classified tree points need to be segmented, such that
    each segment consists of a group of points that represent a single tree.
    A second classification is constructed after the segmentation, which is
    called data cleaning. This step ensures that every segment that consists
    of tree points, is checked for misclassifications and outliers and that
    these are removed. After cleaning every segment, tree models can be constructed
    in various LODs and additionally, the types of trees are classified based
    on identifying features of these trees. The conclusions of this research
    are that it is possible to construct 3D tree models based on airborne
    LiDAR point cloud data and that these can be made to fit in an existing
    3D city model. This is demonstrated by creating a 3D city tree model for
    an existing 3D city model and merging them into one dataset. While further
    work is required to achieve a seamless fit, the integrated results show
    that the datasets complement each other well.
  uuid: 3e169fc7-5336-4742-ab9b-18c158637cfe
- surname: Deng
  name: Mutian
  title: Using Foreign Data Wrapper in PostgreSQL to Expose Point Clouds on
    File System
  supervisors: Martijn Meijers; Peter van Oosterom
  year: 2020
  graduation_date: '2020-11-09'
  link: https://resolver.tudelft.nl/uuid:0182ce77-96e3-493b-a933-e91910b6302b
  image: 2020_Deng.jpg
  abstract: 'This research is aimed to answer the main research question:
    to what extent we can use LiDAR point clouds directly in the PostgreSQL
    by means of FDW, and thus a FDW supporting the Point Cloud Data Management
    System is implemented. Then, the range and performance of its functionality
    are evaluated. The results shows this FDW solution is feasible while the
    querying time is relevant to the number of returned points. The benefit
    and problem of this FDW are analyzed.'
  uuid: 0182ce77-96e3-493b-a933-e91910b6302b
- surname: Duynstee
  name: Charlotte
  title: Data driven sustainable mobility analysis in the city of Amsterdam
  supervisors: Wilko Quak
  year: 2020
  graduation_date: '2020-07-08'
  link: https://resolver.tudelft.nl/uuid:1db0ce92-b034-474a-9fc3-e6845a85c4c0
  image: 2020_Duynstee.jpg
  abstract: 'This research focuses on the analysis of Floating Car Data (FCD)
    data to understand sustainable transportation behavior in the area of
    Amsterdam. Using data collected by mobile devices, trips are analyzed
    by their distance and transportation method. Sustainability is a relevant
    factor to the social and scientific community. With increasing population
    and growing cities, the impact of travel on the environment is also increasing.
    New policies are required to stimulate a more sustainable approach to
    transportation. Research on sustainable travel behavior provides input
    for the policy makers. The main research question is defined by what extent
    FCD can be used to provide insights in the sustainable mobility behavior
    in Amsterdam. In the existing literature, there are four objectives for
    sustainable mobility: hazards reduction, travel reduction, modal shift
    and accessibility. The modal shift (e.g. replacing care usage by public
    transport) is one of the key drivers for this research. To quantify the
    behavior, different sustainable mobility indicators are identified to
    determine the sustainable direction related to the mode of transportation.
    In the literature there are many methods to quantify sustainable transportation
    behavior ranging from the traditional methods like counting and surveys
    to modern approaches including smartphone and sensor data. The methodology
    used starts with the problem statement and literature review. The data
    sets are selected and analyzed, providing the results and conclusions.
    A decision tree is used for categorizing different trips people make,
    where a difference between short and longer distance trips is made. This
    research makes use of a wide range of tools ranging from PostgreSQL databases
    to advanced features of ESRI to visualize data. Five different available
    data sets are analyzed for their suitability for this research. Based
    on several requirements like availability, having Origin and Destination
    (OD) information, usability and documentation, the data sets are assessed
    and two data sets (Google OD and LMS) are chosen to be analyzed in more
    detail. The data is filtered and cleaned to make sure it fits the scope
    (Amsterdam) and the two sets are compared to each other. The trips are
    split into short and long distance trips, where for both a detailed analysis
    is performed on the trips which can be easily replaced by more sustainable
    trips. Regarding the short distance trips, analysis shows that walking
    and biking are the most common option in busy areas as the city center
    and the business district. The less sustainable car trips for short distances
    show several patterns in the city. Using interactive maps, these patterns
    are identified and both data sets are compared. For longer distance car
    trips, train transportation is the more sustainable option. There is however
    a tradeoff between the most sustainable and least time-consuming transportation
    option. This makes that train trips are not always the most logical or
    even sustainable choice for transportation. A method is developed and
    applied to the data set to test if a train trip is a realistic alternative.
    The results show for both data sets that there is a significant amount
    of car trips which could easily be replaced by the train. During the analysis
    of the data for long distances, a problem has been found with the Google
    data set. It seems that this data set is showing most of the time the
    same noise. This phenomenon was found by comparing the different modes
    of transportation available in the Google data set. The error is not in
    all the data, but it seems to have an impact on the data set. Conclusion
    is that the data provides many insights on travel behavior and different
    available data sets can be linked together to provide deeper insights.
    The Google data set shows interesting results for shorter distances but
    gives less reliable results for longer distances. The LMS data set is
    used to compare the results for both short and long distances. The use
    of FCD data to study and stimulate sustainable mobility behavior seems
    very promising, but the quality of the available data sets has a large
    influence on the usability.'
  uuid: 1db0ce92-b034-474a-9fc3-e6845a85c4c0
- surname: Garg
  name: Chirag
  title: Indoor 3D reconstruction from a single image
  supervisors: Liangliang Nan; Jan van Gemert
  year: 2020
  graduation_date: '2020-07-02'
  link: https://resolver.tudelft.nl/uuid:70f42eb0-241a-46a2-8bf8-87d89bea26b0
  image: 2020_Garg.jpg
  github: https://github.com/cgarg-tud/GeomAwareLoss
  abstract: 3D indoor reconstruction has been an important research area in
    the field of computer vision and photogrammetry. While the initial techniques
    developed for this purpose use sensor devices and multiple images for
    data acquisition and extracting 3D information and representation of the
    scene, with the advent of deep learning techniques, there has been good
    progress in extracting 3D information of an indoor scene reconstruction
    using a single image. This has potential in minimizing user efforts and
    cost for data acquisition. The current state-of-the-art method involves
    two main components, the global depth map and plane instances. After investigating
    the current state-of-the-art methods, it is observed that there is inconsistency
    in reconstructed surface boundaries and depth estimation over the curvature
    and edges of the objects present in the scene, despite having good 3D
    representation in the surrounding regions. We devise a loss function for
    optimizing depth estimation during supervision of the neural network by
    providing geometric awareness to the pixels at local level based on its
    neighborhood properties defined by spatial compatibility and color similarity.
    A similar function is used during 3D reconstruction for orientation consistency
    in the point cloud. Based on the quantitative and qualitative analysis,
    it is observed that the proposed approach helps in improving the 3D reconstruction
    from a single image in an indoor environment.
  uuid: 70f42eb0-241a-46a2-8bf8-87d89bea26b0
- surname: Jansen
  name: Celine
  title: 'A change of view: Usable interface design propositions for geoportals'
  supervisors: Bastiaan van Loenen
  year: 2020
  graduation_date: '2020-07-01'
  link: https://resolver.tudelft.nl/uuid:d46a034b-f305-4304-bf05-ecb8421a2d9e
  image: 2020_Jansen.jpg
  abstract: 'Nowadays, lots of geo-information (GI) is openly available. The
    value of this information lies in its use. Geoportals play an important
    part in allowing users to discover and access suitable data for their
    use cases. However, the user-friendliness of these geoportals is not as
    it should be. As the communicational layer between a system and its users,
    a more user-friendly UI can result in a more user-friendly geoportal.
    In an explorative research methodology involving a literature study into
    UIs and geoportals, assessing existing geoportals, and a user requirements
    session, I developed a guideline for user-friendly geoportal UIs: the
    Geoportal User-Interface Design Evaluator (GUIDE). The elements captured
    in the GUIDE cover the different parts of the UI: the content presentation,
    the interaction with available services (system interaction, navigation,
    search mechanisms, access mechanisms, and communication mechanisms) and
    the enabling information (metadata and help mechanisms). Concrete implementation
    examples of these design elements are provided by implementing a mock-up
    in accordance to the GUIDE. To assess whether or not the elements of the
    GUIDE result in an increase in user-friendliness, the results of a benchmark
    usability session are compared to the results achieved during a follow-up
    usability session with the mock-up. The tasks participants perform during
    these sessions are all related to the most important reasons why users
    would visit a geoportal: discovering data, assessing whether the discovered
    data is suitable for a specific use case, and accessing the data. The
    comparison of the results of the two usability studies suggests that the
    elements listed in the GUIDE as implemented in the mock-up indeed result
    in a more user-friendly geoportal UI. In the adopted usability metric
    that covered 128 fields related to performance and self-reported metrics,
    the mock-up outperformed the benchmark in 95 fields. This improvement
    is confirmed by qualitative comments of the six participants of the usability
    sessions and by experts of the Dutch geo-platform PDOK. Especially the
    increase in efficiency is appreciated. Based on the foundation the GUIDE
    and the corresponding mock-up provide, there is room for more in-depth
    research to further improve the user-friendliness of the UIs of geoportals.
    This, for example, involves looking into what communication mechanisms
    and help mechanisms, icons, terminology, or controls users prefer. Furthermore,
    additional research into the possibilities of adaptive UIs for geoportals
    can be valuable to suit possible differences in the needs and preferences
    of the different individual users.'
  uuid: d46a034b-f305-4304-bf05-ecb8421a2d9e
- surname: Jarocki
  name: Konrad
  title: Parallel step assignment for continuous generalization constrained
    with target map
  supervisors: Martijn Meijers
  year: 2020
  graduation_date: '2020-07-09'
  link: https://resolver.tudelft.nl/uuid:77153f80-c529-477c-98d3-e3d120966bd6
  image: 2020_Jarocki.jpg
  abstract: 'In this thesis a new method to show the generalization process
    is proposed and assessed - parallel step assignment. It investigates the
    feasibility and applicability of this method with respect to three proposed
    generalization approaches and tries to evaluate the possibility of vario-scale
    map representation. First, the generalization sequence is created for
    each of these approaches. It is then processed with a greedy algorithm
    in order to decide which generalization operations can be shown at the
    same time. After that, two aspects are assessed: the generalization of
    the map quality and the assignment itself. The results show that the method
    is feasible for the vario-scale maps, however, the proposed generalization
    techniques need to be improved and none of them can be considered as suitable
    at its current state of development. Nevertheless, the main aspect of
    the interaction is significantly improved and the solution can be considered
    feasible. At last, based on various observations and conclusions from
    the project, some ideas for future work are proposed together with an
    evaluation of the chosen methodology with underlined drawbacks.'
  uuid: 77153f80-c529-477c-98d3-e3d120966bd6
- surname: Kaniouras
  name: Pantelis
  title: Road detection from remote sensing imagery
  supervisors: Liangliang Nan
  year: 2020
  graduation_date: '2020-06-29'
  link: https://resolver.tudelft.nl/uuid:21fc20a8-455d-4583-9698-4fea04516f03
  image: 2020_Kaniouras.jpg
  github: https://github.com/ntelo007/road_detection_mtl
  abstract: Road network maps facilitate a great number of applications in
    our everyday life. However, their automatic creation is a difficult task,
    and so far, published methodologies cannot provide reliable solutions.
    The common and most recent approach is to design a road detection algorithm
    from remote sensing imagery based on a Convolutional Neural Network, followed
    by a result refinement post-processing step. In this project I proposed
    a deep learning model that utilized the Multi-Task Learning technique
    to improve the performance of the road detection task by incorporating
    prior knowledge constraints. Multi-Task Learning is a mechanism whose
    objective is to improve a model's generalization performance by exploiting
    information retrieved from the training signals of related tasks as an
    inductive bias, and, as its name suggests, solve multiple tasks simultaneously.
    Carefully selecting which tasks will be jointly solved favors the preservation
    of specific properties of the target object, in this case, the road network.
    My proposed model is a Multi-Task Learning U-Net with a ResNet34 encoder,
    pre-trained on the ImageNet dataset, that solves for the tasks of Road
    Detection Learning, Road Orientation Learning, and Road Intersection Learning.
    Combining the capabilities of the U-Net model, the ResNet encoder and
    the constrained Multi-Task Learning mechanism, my model achieved better
    performance both in terms of image segmentation and topology preservation
    against the baseline single-task solving model. The project was based
    on the publicly available SpaceNet Roads Dataset.
  uuid: 21fc20a8-455d-4583-9698-4fea04516f03
- surname: Lánský
  name: Imke
  title: Height inference for all USA building footprints in the absence of
    height data
  supervisors: Hugo Ledoux
  year: 2020
  graduation_date: '2020-06-24'
  link: https://resolver.tudelft.nl/uuid:ddcae7d1-6cc8-42a7-8c1d-a922ec7551f0
  image: 2020_Lansky.jpg
  github: https://github.com/ImkeLansky/USA-BuildingHeightInference
  abstract: 'In recent years, the demand for 3D spatial information and 3D
    city models has increased, as they support and allow many different applications,
    e.g. noise simulations, energy demand estimations, and shadow analysis.
    Constructing a city model with 3D buildings requires elevation data (such
    as LiDAR or Digital Terrain Models), but unfortunately, data of sufficient
    quality is often unavailable. This thesis focuses on the use of machine
    learning methods to estimate the height of building footprints and thus
    bypassing the use of elevation data completely. Three different methods
    are tested and compared: Random Forest Regression (RFR), Multiple Linear
    Regression (MLR), and Support Vector Regression (SVR). A case study is
    performed for the conterminous United States of America (USA) because
    of its availability of a nation-wide building dataset, containing roughly
    125 million building footprints. The high diversity in urban layouts is
    considered, where a distinction is made between Central Business Districts
    (CBDs) in cities and all other regions (e.g. suburbs and rural areas).
    All building footprints are characterised by nine features derived from
    their geometry, which are then used (in several combinations) in the model
    training and predicting stages. Furthermore, the influence of additional
    features – including census and cadastral data – on the results of the
    building height predictions is analysed for the city of Denver, Colorado.
    The experiments show that it is feasible to predict the height for all
    buildings in the conterminous USA in under 6 minutes. Both the MLR and
    SVR method even accomplish it in under 30 seconds. The height prediction
    results show that the different prediction models struggle to accurately
    estimate the height for buildings in CBDs. The lowest achieved Mean Absolute
    Error (MAE) is 31.81m, whereas for the suburban and rural areas it is
    1.41m. Adding additional, non-geometric features (e.g. census data) to
    the prediction models for one city (Denver) proved to be successful; the
    RFR method reduced its MAE from 1.35m to 0.96m for the suburbs, achieving
    sub-metre accuracy. The CBDs, however, are still problematic with an MAE
    of 16.87m. These results show that for the suburban and rural areas, the
    accuracy recommendations from the CityGML specifications for LOD1 models
    can be met (5m limit). For the CBDs, improvement is required. The experiments
    also proved that the proposed methodology can be used to generate 3D city
    models of very large datasets if no elevation data is available. Moreover,
    the method is, in theory, generic enough to be applied outside the USA.'
  uuid: ddcae7d1-6cc8-42a7-8c1d-a922ec7551f0
- surname: Li
  name: Jinglan
  title: Manage 4D historical AIS data by space filling curve
  supervisors: Martijn Meijers; Haicheng Liu
  year: 2020
  graduation_date: '2020-07-07'
  link: https://resolver.tudelft.nl/uuid:aa4dfaa6-4793-4996-b6f8-a3ac72d978ef
  image: 2020_Li.jpg
  abstract: This MSc thesis aims to research how to efficiently manage 4D
    AIS data (Longitude, Latitude, Time, and MMSI (the ID of the vessel))
    to do the fast query by using the Space Filling curve in PostgreSQL. The
    AIS is the Automatic Identification System which is born because the frequent
    occurrence of maritime accidents has caused casualties and economic losses.
    AIS is intended to assist a vessel’s watchstanding officers and allow
    maritime authorities to track and monitor the vessels’ movement. For now,
    the AIS has been used in various kinds of fields because the AIS data
    is really important and useful. The AIS data contains lots of useful information
    such as the dynamic information (including ship location, speed, heading,
    and so on), the static information (including ship name, ship type...),
    and some other types of data. Because of the useful information that AIS
    includes, there a great many useful applications based on the AIS data.
    For example, the AIS data is used for detecting the vessels’ anomalies
    motions or tracking the vessels. While the studies mainly focus on the
    applications of the AIS data, The efficient management of the AIS data
    is neglected. Hence, I am going to study how to efficiently manage the
    multidimensional AIS data. Space Filling Curve (SFC) will be used to manage
    the multidimensional AIS data. The SFC is a great method for indexing
    the multidimensional data. The SFC can map data in multidimensional space
    to 1D space. There are lots of kinds of SFC, such as Morton curve, Hilbert
    curve, Gray curve, and so on. And the Morton curve and Hilbert curve are
    used in this thesis because of the property of the locality form the nD
    space is preserved in the location on the curve [Dai and Su, 2003] and
    both are so-called quadrant recursive curves [Meijers and van Oosterom,
    2018] which is the very significant property. In my research, I proposed
    two kinds of methods to manage 4D AIS data. One is the 4D integrated approach
    that the 4D AIS data is encoded to SFC together. The other is the 3D integrated
    approach, only 3D AIS (Longitude, Latitude, and Time) data is encoded.
    To test the two approaches, bounding box query (to find the vessels in
    a given space and time range) and trajectory query (to find the position
    information of a specific vessel in a give time range) will be implemented
    in the database. To verify the usability and superiority of my approach,
    the benchmark is set. The comparison between the two approaches I proposed
    will be done. And results prove that the SFC approach I used to manage
    the 4D AIS data is great after comparing it with the benchmark I put forward.
  uuid: aa4dfaa6-4793-4996-b6f8-a3ac72d978ef
- surname: Mastorakis
  name: Konstantinos
  title: An integrative workflow for 3D city model versioning
  supervisors: Hugo Ledoux; Stelios Vitalis
  year: 2020
  graduation_date: '2020-11-04'
  link: https://resolver.tudelft.nl/uuid:a7f7f0c8-7a34-454e-973a-d55f5b8b0dfe
  image: 2020_Mastorakis.jpg
  github: https://github.com/cityjson/Up3date
  abstract: '3D city models are continuously becoming more popular among practitioners
    due to the volume and versatility of information they contain, which makes
    them suitable to be used in various applications. However, there is no
    mechanism to allow maintaining them updated at the same pace that cities
    evolve, or when error correction is necessary, eventually diminishing
    their value. Many cities around the world already possess such models
    which are mostly used for experimentation and research purposes. Such
    an example is also the city of Rotterdam, whose 3D city model is not regularly
    updated and has to be outsourced for that purpose. This thesis investigates
    into addressing this issue by proposing and implementing an integrative
    maintenance workflow. The workflow is designed to fulfill what the maintenance
    needs of a typical municipality are expected to be. Those needs were identified
    after conducting an analysis of the current situation and collecting information
    from practitioners within the municipality through interviews. The workflow
    is a combination of 3D city model versioning and visual editing capabilities
    with the aim to effectively maintain CityJSON encoded models in an intuitive
    way. Its implementation includes two prototype software implementations:
    a versioning component, which is utilized to create a workflow inspired
    by git flow and allows concurrent maintenance and alternative scenario
    testing in a non-linear and distributed way, and a visual editing component
    capable of editing CityJSON encoded 3D city models by extending Blender’s
    functionality. Following the implementation, the workflow was tested by
    simulating real world maintenance scenarios. The tests demonstrate the
    feasibility of maintaining 3D city models with such a workflow and more
    specifically the suitability of git based workflows. At the same time
    some key parameters of the versioning mechanism are identified which if
    tuned properly they can optimize the performance, behavior and robustness
    of 3D city model versioning. With both components being prototype solutions
    the workflow is far from operational and there is certainly a lot of space
    for improvement regarding both components. Utilizing the workflow in practice
    would be the ideal way for collecting useful feedback. Besides that, there
    are already extensions of Blender that combined with the visual updating
    component of the workflow can offer advanced integration of editing and
    analysis capabilities.'
  uuid: a7f7f0c8-7a34-454e-973a-d55f5b8b0dfe
- surname: Moscholaki
  name: Maria
  title: Comparison of Remotely Sensed and Volunteered Geographic Information
    for water reservoirs
  supervisors: Clara García Sánchez
  year: 2020
  graduation_date: '2020-11-09'
  link: https://resolver.tudelft.nl/uuid:03bd4cce-6852-4784-b192-05cd02bd2106
  image: 2020_Moscholaki.jpg
  abstract: 'The surface water extent around the world is constantly changing
    due to natural factors (e.g. geology and over-abstraction of water), climate
    change (e.g. higher water evaporation due to warmer climate) or human
    activities (e.g. reservoir construction). Water reservoirs are important
    for the management of the ecosystem, as both humans and the natural environment
    depend highly on them for their existence and well being. Flood control,
    agricultural irrigation, electricity generation, drinking and municipal
    water supply are only some of their main uses. Considering this, it is
    of high importance to have accurate maps that depict the reservoir outlines
    to determine their surface extend and storage capacity. However, their
    extend is not always well defined or there are discrepancies between various
    surface water datasets. This dissertation aims to provide an answer about
    which datasets match better as well as identifying the problematic areas
    by performing a quality control analysis. The main challenge of this thesis
    is that all available datasets have certain limitations regarding their
    coverage and quality. The waterbody delineation from satellite images
    is affected by the atmospheric conditions (e.g cloud obstructions) or
    topographic elements that create artifacts and influence the correct classification
    of water pixels. OpenStreetmap (OSM) on the other hand, has uncertain
    quality over locations, as the data is freely supplied by volunteers.
    Moreover, HydroLAKES which was created based, amongst others, on the Global
    Reservoir and Dam Dataset (GRanD), is still incomplete. In this thesis,
    an intercomparison of accuracy algorithm that can perform large scale
    analysis is created, by using the country of Angola as a use case, five
    datasets as input (Global Surface Water, Sentinel 2, OSM, HydroLAKES,
    GRaND) in both raster and vector format and the cloud processing platform
    of Google Earth engine. The identification of similarities or mismatches
    between the datasets is performed in terms of positional accuracy. Two
    quality measures have been considered for the pairwise comparison of features:
    percentage of overlap and Hausdorff distance. In addition the completeness
    of the datasets respectively to the total common water area of the water
    reservoir datasets is reviewed. The results of this research shows that
    large scale analysis for the comparison of accuracy between water reservoir
    datasets of different formats is possible. The pre-processing of the input
    Satellite data is semi-automated. The created automated algorithm for
    the main analysis offers information for all corresponding features between
    datasets. More specifically, statistics about the shape similarity, the
    percentage of overlap and the water area completeness of the datasets
    are being presented.'
  uuid: 03bd4cce-6852-4784-b192-05cd02bd2106
- surname: Mulder
  name: Amber
  title: Semantic segmentation of RGB-Z aerial imagery using convolutional
    neural networks
  supervisors: Balázs Dukai
  year: 2020
  graduation_date: '2020-06-24'
  link: https://resolver.tudelft.nl/uuid:b936953b-4c73-4ce1-a897-7da4287ff79a
  image: 2020_Mulder.jpg
  abstract: 'Semantic segmentation (or pixel-level classification) of remotely
    sensed imagery has shown to be useful for applications in fields as mapping
    of land cover, object detection, change detection and land-use analysis.
    Deep learning algorithms called convolutional neural networks (CNNs) have
    shown to outperform traditional computer vision and machine learning approaches
    in tackling semantic segmentation tasks. Furthermore, addition of height
    information (Z) to aerial imagery (RGB) is believed to improve segmentation
    results. However, discussion remains on the following: to what extent
    height information adds value; the best way to combine RGB information
    with height information; and what type of height information can best
    be used. This study aims to answer these questions. In this research work,
    the CNN architectures FCN-8s, SegNet, U-Net and FuseNet-SF5 are trained
    to semantically segment 10 cm resolution true ortho imagery of Haarlem,
    potentially augmented with height information. The outputted topographic
    maps contain the classes building, road, water and other. Experiments
    are conducted that allow for the comparison of 1) models trained on RGB
    and on RGB-Z, 2) models combining RGB and height information through data
    fusion and through data stacking, and 3) models trained using different
    types of absolute and relative height approaches. Performances are compared
    based on scores on the performance measure (mean) intersection over union
    (IoU) and through visual assessment of outputted prediction maps. The
    results indicated that on average segmentation performance improves by
    approximately 1 percent when absolute height information is added. The
    class building showed to benefit the most from the addition of height
    information. Furthermore, extracting features from height information
    in a separate encoder and fusing these into RGB feature maps, led to a
    higher overall segmentation quality than when height information is provided
    as a stacked extra band and processed in the same encoder as the RGB information.
    Finally, models using relative height delivered a higher quality segmentation
    than when absolute height approaches were used, especially for large objects.
    The best performing model; FuseNet-SF5 trained on RGB imagery and pixel-level,
    relative height, retrieved a mean IoU of 0.8427 and IoUs of 0.8744, 0.7865,
    0.9131 and 0.7966 for the classes building, road, water and other respectively.
    This model was able to correctly classify over 90% of the pixels of 67%
    of all the objects present in the ground truth. Overall, this study showed
    that, when considering semantic segmentation of aerial RGB imagery, 1)
    height information can improve segmentation results, 2) adding height
    information through data fusion can result in a higher segmentation quality
    than when data stacking is used, and 3) providing relative height to a
    network, rather than absolute height, can improve semantic segmentation
    quality.'
  uuid: b936953b-4c73-4ce1-a897-7da4287ff79a
- surname: Oostwegel
  name: Laurens
  title: Indoor positioning using augmented reality
  supervisors: Stelios Vitalis
  year: 2020
  graduation_date: '2020-07-01'
  link: https://resolver.tudelft.nl/uuid:b50e234d-3fe0-44a4-9ec0-f5664ca79844
  image: 2020_Oostwegel.jpg
  abstract: 'Unlike outdoor environments, there is no wide-spread solution
    to positioning inside a building. Indoorsolutions rely on pre-installation
    of infrastructure, such as Bluetooth beacons or ultra-wide bandtechnology.
    Recently, there has been growing interest in the use of Augmented Reality
    (AR) for indoorpositioning. AR devices use an algorithm known as Simultaneously
    Localisation and Mapping (SLAM)to scan an environment and find a position
    inside. This make it possible to estimate a position on-theflywithout
    any pre-installations. The Microsoft Hololens (MH) is a head-mounted display
    AR devicethat is able to perform SLAM. The use of SLAM for indoor positioning
    can be beneficial in the case ofEmergency Response (ER). The place of
    impact in ER is unknown and there is no time to install anyinfrastructure
    beforehand.Two problems arise with the use of SLAM for indoor positioning.
    (1) A position is a pin point in spacethat is defined by a reference frame.
    In the case of SLAM, the frame is the scanned object. In mostsituations,
    a map or floor plan is more appropriate as reference frame, in order to
    give a full context.(2) The SLAM algorithm suffers from drift, a growing
    error over time. This research tries to solve theseproblems using shape
    registration. The SLAM output can be aligned to a reference floor plan,
    by use ofa spatial matching technique. This alignment is a continuous
    process to account for the drift errors ofthe SLAM algorithm.Three spatial
    matching techniques are compared: Iterative Closest Points (ICP) iteratively
    tries to minimizethe distance between two shapes using least squares;
    Instantaneous Kinematics (IK) is a varianton ICP that makes use of a velocity
    vector; and Hough Transform makes use of the Hough domainproperties, where
    rotation is invariant to translation and scale. These algorithms are compared
    on theiraccuracy, computation time and robustness.It is concluded that
    the Hough Transform algorithm gives the most accurate results and is fastest.
    In thisresearch it was found that an average accuracy of < 1m can be maintained
    over 80% of the experiments,with maximum errors up to 5 meter. In 20%
    of the experiments, the error can extremely diverge upto >100 meter. It
    is suggested that the quality of the scan and the existence of artefacts
    (e.g.furniture,people) are the cause of these errors. That makes the method
    unsuitable for indoor positioning in thecase of Emergency Response, that
    needs extremely reliable systems. Research is needed to create a morerobust
    method, that uses better outlier detection methods. However, the results
    are promising and doopen the door for indoor navigation using Augmented
    Reality.'
  uuid: b50e234d-3fe0-44a4-9ec0-f5664ca79844
- surname: Staring
  name: Karin
  title: CityJSON in combination with MongoDB, PostgreSQL and GraphQL
  supervisors: Stelios Vitalis; Linda van den Brink
  year: 2020
  graduation_date: '2020-11-13'
  link: https://resolver.tudelft.nl/uuid:7f9209f7-248f-4c93-9ba3-5866655e6040
  image: 2020_Staring.jpg
  abstract: 'CityJSON is a JSON-based encoding for a subset of the CityGML
    data model and an alternative to the CityGML exchange-format. This new
    encoding reduces the data size and simplifies the usage. These files can
    be stored in relational and NoSQL databases. Relational and NoSQL databases
    have integrated JSON. CityJSON has therefore the potential to be stored
    and perform efficiently in relational and NoSQL databases. The databases
    are tested as part of a client-server architecture, because JSON is used
    in web applications and the 3D city models can not entirely be stored
    on mobile devices. GraphQL is used as the API layer between the database
    and the client, because it has the ability to optimise the usage of the
    network. This is necessary for location-based web applications on mobile
    devices to stay functional. This research attempts based on this use case
    to answer the following question: How suitable are MongoDB and PostgreSQL
    for the storage and querying of CityJSON using GraphQL? CityJSON has first
    been mapped to the relational database PostgreSQL and the NoSQL database
    MongoDB. CityGML has also been mapped to PostgreSQL with 3DCityDB to clarify
    the impact of different exchange formats. The databases are after that
    accessed and queried through GraphQL. The queries are based on the selection
    process of an AR application. The architecture is tested based on the
    number of queries between the databases and GraphQL, the request sizes,
    the response sizes and the retrieval times. The results show that the
    usage of JSON maps attributes more flexibly than the mapping of 3DCityDB,
    which can result in less tables and therefore less joins or queries. On
    the other hand, querying on a JSON attribute might result in higher retrieval
    times than querying an attribute with a predefined data type, but this
    is not investigated. Additionally, the usage of JSON makes it possible
    to store fields with varying data types such as the hierarchy of arrays.
    A difficulty can be that software such as GraphQL does not support fields
    with varying data types and is therefore less flexible. The developer
    has to work around that. In general, there are no real signs yet that
    MongoDB and PostgreSQL are not suitable for the storage and querying of
    CityJSON using GraphQL. Possible signs are that the indexing mechanism
    with the vertices list can not be stored in MongoDB and only to some extent
    in PostgresQL, but this might not be a problem since the indexes can be
    resolved to integer or real coordinates. The attribute presentLoDs can
    not be stored in MongoDB as well, but this might be solved with a small
    adjustment. The main recommendations of this research are that the SQL/MQL
    queries should be implemented as efficiently as possible without being
    connected to GraphQL first. This should be done to understand the performance
    of the databases and to understand the impact of GraphQL better. Besides
    this, a more general understanding of the suitability for all use cases
    could be provided with a framework that tests more types of queries.'
  uuid: 7f9209f7-248f-4c93-9ba3-5866655e6040
- surname: van der Wal
  name: Erik
  title: Examining the influence of urban design on cyclist route choice in
    different weather conditions
  supervisors: Kees Maat
  year: 2020
  graduation_date: '2020-01-24'
  link: https://resolver.tudelft.nl/uuid:637abf2b-61ec-4c9d-a9af-8d2f200d09ee
  image: 2020_van-der-Wal.jpg
  abstract: With regard to climate change and air pollution within cities,
    interest in sustainable modes of transportation for regular use has taken
    a rise. Utilitarian cycling is being seen as a frontrunner for replacing
    everyday motorized travels within and between cities, supported by the
    rapid emergence of the electric bicycle. Governments are trying to use
    the increasing opportunities involving bicycle transportation to reduce
    car traffic and the related air polution, by stimulating the use of bicycles.
    In this light, interest is drawn to cyclist travel behavior to uncover
    preferences of cyclists. Existing literature shows a significant impact
    of weather conditions on cyclist travel behavior in terms of tranportation
    mode choices. Especially adverse weather condtions leave their mark on
    the use of bicycles as a means of transportation, as it is recognized
    by many studies as a main deterrent for cycling. On the other hand, the
    relation between weather conditions and cyclist route choice is an underexplored
    topic in existing literature. Consequently, it has remained unclear to
    what extent cyclists attempt to mitigate the influence of weather condtions
    through choice of route, and based on which determinants. Insights in
    ways to mitigate unchangeable external circumstances like weather conditions
    could be another step forward in stimulating utilitarian use of bicycles
    in the search for transportation modes that can replace motorized trips.
    This thesis made an attempt to partially address the research gap in existing
    literature, by departing from findings in the field of pedestrian mobility.
    In these studies, pedestrians have been found to adapt their choice of
    route to the degree of shelter that is offered by the built environment
    as a measure to change level of weather exposure. These findings were
    projected on cyclist route choice, to evaluate to what extent cyclist
    alter their choice of route based on weather conditions and the degree
    of shelter that can be found within a built environment. An elaborate
    methodology was proposed in which observed routes throughout the study
    area of Tilburg (the Netherlands), comprising trips made with conventional
    and electric bicycles, were compared with shortest and fastest alternatives.
    The weather conditions under which a route was conducted were modelled
    through a set of individual meteorological factors, spatially related
    to the location of an observed route. To operationalize the degree of
    shelter provided by the built environment, a new method was developed
    using aspects from existing theories on street climate design and spatial
    openness in order to provide a detailed description of the potential shelter
    along a route. Three different shelter factors were established, describing
    the degree of mean building shelter, maximum building shelter, and vegetational
    shelter in the form of tree density along a route. Through estimation
    of a set of linear regression models, independent and combined effects
    of the meteorological and shelter factors on cyclist route choice were
    modelled. Initial moderate influences of windspeed, temperature, and cycling
    under twilight conditions on the choice of route were found, while cyclists
    generally chose routes with a lower degree of building and vegetational
    shelter compared to alternative shortest and fastest routes. Interactions
    between the effects of meteorological and shelter factors showed very
    limited additional effects, suggesting that utilitarian cyclists in the
    study area did not value the degree of built environment shelter along
    a route sufficiently as a mitigator of weather conditions to diverge from
    the shortest or fastest route. These findings imply that built environment
    shelter does not have to be accounted for in policy design to stimulate
    utilitarian cycling.
  uuid: 637abf2b-61ec-4c9d-a9af-8d2f200d09ee
- surname: van Liempt
  name: Jordi
  title: 'CityJSON: does (file) size matter?'
  supervisors: Hugo Ledoux; Balázs Dukai
  year: 2020
  graduation_date: '2020-07-02'
  link: https://resolver.tudelft.nl/uuid:4aad07f4-8f64-46b1-aad3-3d4abe36c5bf
  image: 2020_van-Liempt.jpg
  github: https://github.com/jliempt/CityJSON-does-file-size-matter-
  abstract: 'The possibilities of 3D city models for the analysis of the built
    environment are increasingly explored, and there is a continuous development
    in improvements on their inner workings. They are also used more often
    on the web, for example for visualisation but it is also possible to query,
    analyse, and edit data in this way. In this case, the network becomes
    a potential new bottleneck in time performance. Especially when a 3D city
    model contains a lot of attributes, there is a rapid increase in file
    size when the area of study is expanded. This presents challenges in efficiency
    and in this thesis I focus on the improvement of the inner workings of
    3D city models to attempt to relieve this problem, in specific for spreading
    and using them more efficiently on the web. By investigating and testing
    different compression techniques on 3D city models stored in the CityJSON
    format, I have attempted to relieve this problem. CityJSON is already
    more compact than CityGML and these techniques decrease the file sizes
    of datasets even further, allowing for faster transmission over a network.
    But on the other hand, additional steps are needed to process compressed
    files. The goal of using a compression technique is to result in a net
    speed gain, meaning that the time that is saved on download time should
    be larger than the additional time that it costs to process the file before
    transmission (compressing the data on the server) and after receival (decompressing
    the data in the client). There are compression techniques for both general
    and specific purposes, and I have used combinations of them. Amongst these
    are Draco compression, zlib, CBOR, and a self-created technique. Specific
    ones are used for the main characteristics that CityJSON datasets have,
    which are the JSON structure, feature attributes, and feature geometries.
    To assess the impact that different combinations of compression techniques
    have, I take uncompressed CityJSON performance as the baseline and have
    come up with different performance indicators that include several use
    cases such as visualisation, querying, analysis, and editing. I have benchmarked
    all combinations of compression techniques on the use cases of these performance
    indicators. For this I have created two types of server implementations:
    one with which datasets are compressed beforehand and are processed in
    the client based on the request made by the user, and one where the data
    is processed first and only then compressed and transmitted to the server.
    In the results, you can see the best-performing compression type per use
    case. The benchmarking is performed on a variety of datasets that are
    split into four categories: larger datasets, larger datasets without attributes,
    smaller datasets, and smaller datasets without attributes. This ultimately
    makes for use cases that are very specific and choosing suitable compression
    types requires finding out which ones perform relatively well in most
    cases, and are not difficult to implement in order to keep CityJSON a
    simple file format. It turns out that Draco compression can give good
    results in specifc situations, but in general is not good to use. Not
    only regarding performance, but also from a developer point of view. CBOR,
    zlib, and a combination of these two are easy to use and generally affect
    the performance of CityJSON on the web in a good way.'
  uuid: 4aad07f4-8f64-46b1-aad3-3d4abe36c5bf
- surname: van Opstal
  name: Willem
  title: Automatic isobath generalisation for navigational charts
  supervisors: Martijn Meijers
  year: 2020
  graduation_date: '2020-07-09'
  link: https://resolver.tudelft.nl/uuid:2e95de28-c9ce-4d07-8131-ae3c4c5b9d86
  image: 2020_van-Opstal.jpg
  abstract: 'Navigational charts play a vital role in a ship''s safety while
    navigating the seas, rivers or lakes. With most of the features and obstructions
    being out of sight -below sea-level - these charts are more critical than
    e.g. topographic maps. For routing but also positioning, depth information
    is a key aspect on these charts. This depth information is available in
    either depth contours, coloured depth areas and individual soundings.
    However with the data originating from accurate but usually erratic survey
    data, a visualisation of raw data is not sufficient for use in a navigational
    chart directly. It would not clearly convey the information to a human
    operator in one sight, and thus this visualisation is in need of generalisation:
    a simplified representation of the same data with irrelevant details being
    omitted. This thesis gives new insights in the generalisation process
    for isobaths only and proposes a new framework to deal with those. We
    propose a framework based on a novel auxiliary data structure to link
    a triangulation to the resulting isobaths: the triangle region graph.
    It links the position of isobaths directly to individual triangles, as
    well as establishes relations between the isobaths themselves. With this
    structure we ultimately link the survey data to the final cartographic
    product and thus in theory we could integrate all information across the
    generalisation pipeline in one and the same process. We have successfully
    used this framework with a basic rule-based evaluation model: we isolate
    conflicting isobaths, triangles and vertices based on legibility requirements
    and target generalisation operators on those. With this approach we can
    successfully maintain more of the morphology while still yielding a finely
    legible chart. Especially at large scale charts the results are promising:
    narrow channels, pits and bends remain if legibility permits. With smaller
    scale charts the challenge now is to generalise beyond smoothness. More
    radical generalisation operators are needed to omit all irrelevant details.
    However the overall framework using the triangle region graph as integrating
    mechanism has potential to do so. It is easily extensible due to its modular
    approach and can incorporate most depth information: from survey accuracy
    to size of isobaths and even golden sounding selection in the future.'
  uuid: 2e95de28-c9ce-4d07-8131-ae3c4c5b9d86
- surname: Wang
  name: Xin
  title: Using CityGML EnergyADE Data in Honeybee
  supervisors: Giorgio Agugiaro
  year: 2020
  graduation_date: '2020-01-28'
  link: https://resolver.tudelft.nl/uuid:fb35db7c-9af8-488c-8d0b-263b138d8fd3
  image: 2020_Wang.jpg
  abstract: 'Urban energy simulation is becoming more and more important in
    various areas like urban planning, architecture design and city management.
    It provides quantified insights for architects and governors to deliver
    energy-efficient approaches. There are already quite a few energy simulation
    software or engines on the market. Among these tools, Ladybug family,
    a series of open-source python packages have its advantages: easy to use,
    high level of customization and low cost of adoption. It could be run
    in Rhino Grasshopper, a visual programming interface widely used by architecture
    industry. Taking 3D geometry created in Rhino and local weather data,
    Ladybug tools (Ladybug and Honeybee) prepare simulation recipes to run
    energy simulation with validated software engines like EnergyPlus and
    OpenStudio. With all these advantages, when using Ladybug and Honeybee
    for urban energy simulation, there are two major flaws: it is tedious
    to build 3D models of all building blocks in Rhino one by one and many
    key parameters required by energy simulation have to be entered manually.
    This geometry creation and parameters entering process could be avoided
    when using CityGML data as input, as CityGML with EnergyADE data already
    has 3D geometry and energy-related attributes of city within its data
    model. In this research, a mapping table between required simulation parameters
    of Ladybug tool - Honeybee and CityGML with EnergyADE data model is created.
    Based on this mapping relationship, by following a database approach,
    all information stored in CityGML with EnergyADE data is retrieved and
    stored in tables of 3DCityDB and later queried in Rhino Grasshopper and
    used in data mapping and processing workflow. Energy simulation results
    could be saved back to database too. It is concluded that using CityGML
    with EnergyADE data as input for Honeybee tools is applicable as there
    is a sufficient mapping relationship between their data models. However,
    as Honeybee has certain restrictions on input geometry (shared surface
    areas should be independent surfaces and surfaces should be convex etc.)
    and it runs energy simulation of buildings not simultaneously but one
    by one, it is not efficient to use Honeybee for large scale urban energy
    simulation.'
  uuid: fb35db7c-9af8-488c-8d0b-263b138d8fd3
- surname: Wiersma
  name: Gabriella
  title: 'Towards the linking of geospatial government data: A study on the
    semantic harmonisation between data from Dutch geo-registries'
  supervisors: Linda van den Brink; Jantien Stoter
  year: 2020
  graduation_date: '2020-07-09'
  link: https://resolver.tudelft.nl/uuid:f02e513c-bbb4-4b19-813b-4b5a062725d0
  image: 2020_Wiersma.jpg
  abstract: The growing complexity of many projects and applications require
    methods that help integrate vasts amounts of data coming from different
    sources. In all cases, semantic interoperability plays an important role
    - the meaning of content should be organized logically, as to allow machines
    to interpret it. The Semantic Web vision has been developing standards
    to support this idea, with the goal of creating a 'web of data', were
    pieces information can be accessed and linked to one another consistently.
    The ideas behind Linked Data have been explored in different areas of
    study. The geospatial domain presents an interesting challenge, as geospatial
    data offers many different views on the same physical universe. This is
    especially the case with geo-registries - collections of official geospatial
    data used by governments. This data already contains links in the form
    of spatial relations. However, there is no consensus on how these links
    should take form. Thus, this research will explore how linkable geospatial
    data from registries actually is by answering the following question:"To
    what extent can ontology-based solutions using semantic web technologies
    contribute to the integration and use of data from geo-spatial registries?".
    This question is broken down in three sub-questions that address ontology-based
    integration techniques (including tools and languages), the impact of
    dataset characteristics and the added value of semantic relations. The
    research includes a literature study to provide a theoretical background,
    a case study of two Dutch geo-registries (Basisregistratie Grootschalige
    Topografie and Basisregistrie Topografie) and a conceptual framework that
    is applied to the case study as a way to explore the main question. The
    results of this framework reinforce the importance of using instance-level
    data to understand the connections between different conceptual models
    and show the unavoidable subjectivity that is involved in the process
    - from the conceptualization of the data (model) to the creation of query
    rules. The findings indicate that the capabilities of ontology languages
    (such as OWL) are not necessarily practical for data from registries,
    and that custom processes might be necessary depending on the application
    envisioned by data users. Country-wide registries managed by different
    data owners and different interpretations of data acquisition rules will
    lead to inevitable variations in the registration of objects in datasets.
    And more efforts could be invested in providing quality indicators for
    alignments.
  uuid: f02e513c-bbb4-4b19-813b-4b5a062725d0
- surname: Zhang
  name: Liyao
  title: Visualization of Point Clouds in Mobile Augmented Reality using Continuous
    Level of Detail Method
  supervisors: Peter van Oosterom
  year: 2020
  graduation_date: '2020-11-04'
  link: https://resolver.tudelft.nl/uuid:d465b8e7-4022-4e33-94b0-3a996fec2ec3
  image: 2020_Zhang.jpg
  paper: https://isprs-archives.copernicus.org/articles/XLIV-4-W1-2020/167/2020/
  abstract: 'Visualizing the point clouds is an integral part of processing
    the data, which enables users to explore and interact with the point clouds
    more intuitively. However, most of the current point cloud renderers are
    developed in non-immersive environments. In the last few years, some new
    technologies, such as Augmented Reality (AR), Virtual Reality (VR) and
    Mixed Reality (MR), have emerged and introduced new ways of presenting
    the 3D content. Among them, AR is the most commonly used technology, since
    AR applications can be used on mobile devices without specific equipment
    like helmet and handles. There are already plenty of existed applications
    for mobile AR environment. These mobile AR applications play important
    roles in fields like architecture, industrial design, navigation, advertisement,
    medicine and gaming. However, the use of point clouds in mobile AR environment
    is still waiting to be explored. Like rendering point clouds on other
    platforms, the biggest issue of showing point clouds in the mobile AR
    environment is that point cloud datasets usually have a massive amount
    of data. Moreover, the mobile devices have relatively limited CPU and
    GPU resources, reaching ideal performance, and the visual quality requirement
    is quite challenging. Also, the current \ac{clod} methods are developed
    for desktop, VR, and web-based viewers. The cLoD method has to be improved
    and revised in order to fit the mobile AR environment. In this paper,
    an interactive visualization of point clouds using cLoD method in the
    mobile AR environment will be realized. The main idea of this method is
    to reduce the number of points to be rendered considerably. A cLoD model
    that has an ideal distribution over LoDs is used in the method, with which
    can remove unnecessary points without sudden changes in density as present
    in the commonly used discrete level-of-detail approaches. Camera position,
    orientation and distance from the camera to point cloud model are taken
    into consideration while filtering the points as well. In order to further
    improve the visual quality, an adaptive point size rendering strategy
    is applied. What is more, for user''s convenience, in the \ac{gui} some
    setting options are provided to the rendering system to change the value
    of parameters required in the rendering. The performance of the rendering
    system is evaluated with multiple quantity indicators and examined by
    different types of datasets. The result shows that our method can significantly
    improve rendering performance and meanwhile achieve good visual quality.
    The finalized rendering system is suitable for most of the indoor applications
    and some of the outdoor applications. What''s more, a comparison between
    our cLoD method and the traditional mesh-based approaches will be presented
    to show that our cLoD method has the potential to replace mesh models
    in some cases. The resource code and the installation package are available
    at: https://github.com/LiyaoZhang0702/AR_PointCloud}.'
  uuid: d465b8e7-4022-4e33-94b0-3a996fec2ec3
- surname: Zhao
  name: Yifang
  title: Outer surface extraction for complex 3D building models
  supervisors: Liangliang Nan; Hugo Ledoux
  year: 2020
  graduation_date: '2020-07-06'
  link: https://resolver.tudelft.nl/uuid:b0dac42c-6d7a-4dbf-a11b-ce851d573862
  image: 2020_Zhao.jpg
  abstract: 'In recent years, 3D building models have become increasingly
    widespread and are intensively exploited in fields of computer graphics
    and geometry processing. One of the common surface representations of
    3D building models is polygon mesh, which is both compact and efficient
    in terms of exchange format and data processing respectively. Downstream
    applications of polygon meshes can be found in the fields of urban planning,
    digital mapping, and fluid simulation. However, the aforementioned applications
    usually require the input to be watertight and manifold, which is not
    always fulfilled by existing building models. Moreover, the interior structures
    of a building model are also considered redundant in certain applications.
    From such practical demands comes our graduation project, i.e. trying
    to recover watertight and manifold outer surface from error-ridden 3D
    building models. Existing methods with respect to outer surface extraction
    can be categorized into two types: surfaceoriented methods and volumetric
    methods. The former focuses on one particular type of artifacts and operates
    directly on the surfaces of the defective model. Since surface-oriented
    methods mainly introduce local operations where needed, unnecessary changes
    of the original model can be avoided and the result is of high fidelity.
    Whilst, the latter generates an intermediate representation of the original
    model, based on which the outer surface is extracted. The volumetric methods
    are more heuristic for our project since they are designed especially
    for multiple artifacts and the results are gauranteed with some desired
    properties. In this thesis, we propose a hybrid approach for the extraction
    of outer surface from error-ridden 3D building models, which aims at recovering
    a watertight and manifold outer shell of the original model. The advantage
    of our method is that it is non-parametric, fully automatic, and have
    no assumptions for the input. Moreover, the small features of original
    model are kept to the greatest extent after processing. Our method can
    be divided into four steps: 1) pre-processing, 2) constrained tetrahedralization,
    3) classification, and 4) outer surface extraction. All six types of artifacts
    listed in this paper are gradually resolved during these steps, resulting
    in a watertight and manifold representation. The results from our experiments
    turn out that our methodology can generate valid results in most cases,
    while preserving input faces and small features at the same time. Comparing
    with several stateof-the-art methods, our results still possess superior
    properties in terms of validity and integrity.'
  uuid: b0dac42c-6d7a-4dbf-a11b-ce851d573862
- surname: Anastasiadou
  name: Anastasia
  title: A probabilistic analysis of results of co-registration of aerial
    and mobile laser-scanned point clouds
  supervisors: Peter van Oosterom; Peter Joosten
  year: 2019
  graduation_date: '2019-07-10'
  link: https://resolver.tudelft.nl/uuid:f5429395-475a-4c94-a049-f6038f476805
  image: 2019_Anastasiadou.jpg
  abstract: Over the last decades, laser scanners are becoming more and more
    established for the acquisition of geo-information. Depending on the sensor
    platform where the laser scanners are mounted, there are MLS, ALS and
    TLS techniques for both indoor and outdoor environments. The high-quality
    3D point clouds produced from laser scanners is an important source of
    3D spatial information and it is increasingly used in a wide field of
    applications from engineering to medical modeling, gaming and agriculture.
    Although laser scanners provide dense and accurate point clouds, a scene
    coverage and the creation of a complete 3D representation requires multiple
    scans of the same area. The procedure integrating multiple scans does
    not always result to a perfect match. Errors that exist in the datasets
    or errors in the transformation of datasets create difficulties during
    the matching procedure. Matching data-sets with the best alignment is
    a topic that has been researched in many fields and a variety of methods
    have been analyzed for registering point clouds. A co-registration can
    be compared to a mathematical model and hence it is important to present
    not only the functional model and the set of functional relationships
    between the variables but also the stochastic model that describes the
    variability among the values and gives insights about the level of satisfying
    predefined demands. As a result, it becomes necessary to establish an
    evaluation of the output of a procedure and each result to be accompanied
    by its quality description. The aim of this graduation thesis is about
    presenting the stochastic model of a co-registration with a quality description
    of the result of co-registration between point clouds. The approach will
    be applicable to results acquired from an image-based registration and
    the goal is to implement a method in order to quantify the quality of
    the co-registered result of two different point clouds. A probabilistic
    analysis of the results of an image-based method results to a quantification
    of the quality of the output. Response images acquired from an image-based
    co-registration are tested and the quality indicators of precision and
    reliability are determined. Moreover, the shift parameter is also defined,
    fact that enhances the applicability of this research to co-registrations
    referring to big areas where multiple local registrations have to be combined
    in a globally consistent manner and each local result contributes to the
    global registration according to its quality indicators. Particularly,
    response images that have clearly defined peak areas and pass the tested
    criteria, are considered more reliable and contribute to the global registration
    with a greater weight. On the contrary, blurry response images, fail to
    satisfy the tests, are considered less reliable results and contribute
    with a smaller weight. The analysis of the images performed by testing
    the distribution of pixel values in both directions of the images. The
    implemented approach provides information about the precision and reliability
    of the images that have normally distributed values. Furthermore, by fitting
    a Gaussian line to the discrete pixel values, a sub-pixel accuracy of
    the result is achieved as values are generated in between the discrete
    pixels. The developed method quantifies the quality of an image-based
    registration but further improvements and investigation of the recommendations
    can also attach additional value.
  uuid: f5429395-475a-4c94-a049-f6038f476805
- surname: Arapakis
  name: Panagiotis
  title: 'The use of digital models in microclimatic studies : First steps
    in coupling CityGML with ENVI-met'
  supervisors: Giorgio Agugiaro
  year: 2019
  graduation_date: '2019-10-30'
  link: https://resolver.tudelft.nl/uuid:03ab695a-dc68-403a-b934-c810f087df42
  image: 2019_Arapakis.jpg
  abstract: 'In recent years, the need to reduce the global warming of the
    planet has become more imperative than ever. Global warming and, at local
    scale, Urban Heat Island phenomena are among the primary effects of the
    increased building carbon emissions. Nevertheless, understanding and controlling
    the parameters which intensify, or mitigate, the increasing in temperatures
    in the surroundings of a building are pivotal, as sustainable design can
    significantly reduce the buildings’ energy demand. Micro-climate simulations
    can provide more accurate input for building energy simulations since
    they can accurately simulate the interactions between those parameters
    to calculate detailed weather data. Despite the increasing knowledge about
    the significance of the microclimate, energy simulation users still rely
    on derived, or interpolated weather data from sparsely located weather
    stations, located generally outside the urban environment. The reason
    behind this commonly adopted approach is that the generation of microclimate
    data is costly in terms of time, and currently standards for storing this
    generated data have not been developed. ENVI-met is a microclimatic simulation
    software that requires a model of an urban area and weather parameters
    on its boundaries to generate a large extent of data like air, temperature,
    relative humidity, wind speed etc. Constructing this model manually contains
    a number of significant limitations, such as high design cost in time
    and need for data collection from different sources – thus the chance
    of design errors is high. In this thesis a novel approach is introduced
    where the ENVI-met software is used for microclimatic simulations at district
    scale. However, the input model in this case is created by data extracted
    from a CityGML-based 3D city model. In addition, the generated microclimatic
    data is stored back to CityGML, where it can be re-used. The proposed
    methodology is implemented via a Graphics User Interface, divided in two
    main phases, serving the required bi-directional data flow. It was designed
    and implemented based on the following specifications: i) the user involvement
    in the whole process needs to be minimum, ii) the interface should create
    simulation-ready input models of various resolutions and iii) it must
    work with different CityGML datasets. A data requirement analysis indicated
    that a CityGML-based city model can feed its data to ENVI-met by the interface,
    so that the input model required by ENVI-met can be constructed fully
    automatically. In return, the storage of the generated results data is
    also possible. Therefore, an automated data flow between a CityGML-based
    city model and ENVI-met can be achieved, offering the following advantages:
    i) the ENVI-met input model can be constructed fast and automatically
    and ii) ENVI-met outputs can be translated to real world coordinates –
    thus can be visualized and processed in GIS software and ultimately stored
    back into the CityGML-based 3d city model.'
  uuid: 03ab695a-dc68-403a-b934-c810f087df42
- surname: Bebelaar
  name: Niek
  title: Correction Model for Particulate Matter Measurements with a Low-Cost
    Sensor Network in Rotterdam
  supervisors: Mathias Lemmens; Alexander Wandl
  year: 2019
  graduation_date: '2019-04-10'
  link: https://resolver.tudelft.nl/uuid:5787851d-9f68-49a6-860f-eae58426151a
  image: 2019_Bebelaar.jpg
  abstract: 'Low-cost air quality sensors can fill gaps between the sparse
    measurements done with high-quality national monitoring grids and might
    contribute to creating a more complete understanding of air pollution
    in an urban area. However, until there is no agreement on what degree
    of sensor accuracy is acceptable, the sensor data quality should be validated
    before governmental bodies use it as input for decision-making (Lewis2017).
    This research proposes a method to assess and improve the data quality
    of low-cost air quality sensors measuring Particulate Matter (PM). To
    answer the research question "How can accuracy and precision of Particulate
    Matter measurement results from a low-cost outdoor sensor network be improved
    by using a correction model, using data from reference sensors and additional
    sensors measuring inferencing phenomena?" an experiment setup with sensors
    operating under real-world conditions is applied. Two low-cost sensor
    nodes, both containing a microcontroller, two low-cost PM sensors, and
    a temperature and humidity sensor, are placed at two locations in the
    city of Rotterdam. At those two locations, they are placed next to a high-quality
    air quality monitoring station from the environmental agency of Rotterdam.
    These monitoring stations provide benchmark data for the low-cost sensor
    nodes. A third data source provides data on air pressure and wind speed
    for the whole city of Rotterdam. The data that originates from both sensor
    nodes and monitoring stations are matched and correlated with each other.
    Subsequently, the measurements from the low-cost sensor nodes are evaluated.
    Correlations and cross inferences of PM with other independent variables
    such as humidity, ambient temperature, wind speed and air pressure are
    investigated. Thereafter, utilizing the Stepwise Multiple Linear Regression
    method, various correction models are created that take various combinations
    of external variables into account. The correction models vary with respect
    to the amount of included external environmental variables and the polynomial
    degree. From all those possible correction models, the best correction
    model per location is selected by evaluating the Root Mean Square Error
    (RMSE) of the corrected dataset. Consequently, the results of the chosen
    correction model are validated. It is found that the best performing correction
    models are those that include only the original PM data and the effect
    of adding more independent variables is limited. The best correction models
    for the four low-cost PM sensors are able to decrease the RMSE of the
    observations: the original normalized RMSE ranged from 0.0918 to 0.1249,
    while the corrected normalized RMSE range from 0.03110 to 0.03759. So,
    it is possible to improve the data quality of low-cost PM sensors with
    the stepwise MLR method and setup as shown in this research. However,
    including parameters for independent variables humidity, temperature,
    air pressure or wind speed does not improve the data quality significantly.
    Besides, when an extra sensor node is placed in an air quality monitoring
    network as described in this research, it is necessary to create a correction
    model for that specific sensor. Like Castell (2017) and Mukherjee (2017)
    also found, it is necessary to calibrate each individual low-cost sensor
    before adding it to an air quality measuring network of the type as described
    in this research. Namely, it is found that for each low-cost PM sensor
    in the network different correction models are created.'
  uuid: 5787851d-9f68-49a6-860f-eae58426151a
- surname: Boersma
  name: Freek
  title: Modelling different levels of detail of roads and intersections in
    3D city models
  supervisors: Anna Labetski
  year: 2019
  graduation_date: '2019-07-12'
  link: https://resolver.tudelft.nl/uuid:ebfc48f8-4704-47d3-9654-cd00c765e0af
  image: 2019_Boersma.jpg
  github: https://github.com/fhb1990/cityjson
  abstract: 'In the last two decades there has been a steady rise in the gathering
    and use of 3D geo-information. A common way to store and use 3D data is
    by using 3D city models. In 3D city models, geo-information can be stored
    at different levels of detail. CityGML, the most commonly used data model
    and encoding for 3D city models, uses five levels of detail in order to
    model increasing geometric and semantic complexity. These levels of detail
    may be interpreted as a model quality measure, and as a guideline for
    users that need data for a certain application. CityGML consists of several
    thematic modules, each with their own level of detail specification. Some
    of these modules have a more further developed level of detail specification
    than others. Recently, several authors have proposed improvements to the
    Transportation module. This has led to proposals for various changes,
    especially concerning road data. However, these proposed changes have
    not been encoded yet. The main critiques are the lack of a level of detail
    specification for linear representations of roads, no ability to model
    networks, no representation of intersections and general ambiguity in
    the level of detail specification. Many road data use cases might potentially
    benefit from improvements on these points. In this thesis I attempt to
    improve the current level of detail specification of roads in the CityGML
    data model. The improvements are encoded in CityJSON, a JSON encoding
    of this data model. I assess the shortcomings in the current CityGML transportation
    module. After, a road data needs analysis is performed on three use cases:
    transport modelling, navigation and road maintenance. The data needs are
    compared to modelling approaches of other road data standards. This has
    resulted in several encoded improvements. A topological structure has
    been added to CityJSON. This includes the addition of two new modelling
    classes: Nodes and Edges. This structure is general such that it can be
    used by other thematic modules as well. Moreover, the level of detail
    specification for roads has been further developed to include both the
    linear representations and less ambiguous areal representations. This
    includes a prescription on how to model intersections and roundabouts
    at different levels of detail. Finally, I provide a structure which enables
    one to link the linear and areal road data together. This link is made
    at the scale level of the object, which data providers may choose themselves.
    This way one object can be modelled in two representation types without
    needing a one-to-one mapping between linear road segments and areal triangulated
    surfaces. These concepts are then tested by creating a CityJSON road data
    file for all new levels of detail.'
  uuid: ebfc48f8-4704-47d3-9654-cd00c765e0af
- surname: Bot
  name: Fanny
  title: 'A graph-matching approach to indoor localization: Using a mobile
    device and a reference BIM'
  supervisors: Edward Verbree; Pirouz Nourian
  year: 2019
  graduation_date: '2019-03-13'
  link: https://resolver.tudelft.nl/uuid:08073599-0267-4d85-b7c4-490c297df000
  image: 2019_Bot.jpg
  abstract: Indoor localization provides for a much researched subject, as
    the complexity and size of many public buildings require extensive and
    properly designed methods to facilitate location specific processes. Indoor
    localization entails finding a qualitative description of the occupied
    area, that is human interpretable, rather than a quantitative position
    in Euclidean space. In other words, the context of an indoor environment
    has to be understood, such that a position can be transcended to a meaningful
    location. A space is defined as a mathematical structure with relational
    properties, to which all its members adhere. As a subset of space, topological
    space describes the relationships between (parts of) objects that do not
    change under continuous transformation. It further defines metric space,
    as a set where distances and angles between all of its elements are defined.
    Indoor space is then interpreted as a structure bounded by physical or
    functional elements, enabling human activities. It should entail the geometric
    place an actor is in, the topological structure that place is a part of,
    and the semantics giving the place meaning. Many indoor positioning methods
    have been developed, which can provide an actor with a relative geometric
    place. Most preferred are positioning systems not relying on a contingent
    system, which can be performed using a hybrid fusion of sensors embedded
    into a mobile device. Such a system found to perform sufficiently is VI-SLAM,
    simultaneously building a geometric place and tracking each pose and heading
    relatively. Its output is a mesh model, in which a viewshed of the indoor
    environment is built. From a mesh model, a topological structure can be
    derived in the form of its dual graph. Now to finalize this representation
    of indoor space which can be captured using a mobile device, it has to
    be enriched with a meaningful context. These semantics are generally stored
    in BIM models. Thus to transcend the position retrieved using SLAM to
    a location, is has to be matched with a BIM model, so that the appertaining
    semantics can be connected. The method proposed provides for a possibility
    to perform graph-based indoor localization, by extracting a graph from
    both input sources and comparing them, in order to find a match. However
    different in nature and structure, both input sources can be converted
    to a graph of similar calibre, such that they can be tested for a match.
    All operations performed on the graphs are derived from spectral graph
    theory. The graph simplification and analysis is performed using the eigen
    spectrum of the graph Laplacian, and the match is performed by remapping
    the spectral graphs into a vector sub space using the eigen spectrum of
    the data covariance matrix. After a match between both graphs is found,
    the current position of the actor within the mesh model can be translated
    to the room found in the graph. This room is now connected to a room within
    the reference graph, for which the semantics are stored in the BIM. Returning
    these to the actor, a location description is formed.
  uuid: 08073599-0267-4d85-b7c4-490c297df000
- surname: Bouzas
  name: Vasileios
  title: Structure-aware building mesh simplification
  supervisors: Liangliang Nan
  year: 2019
  graduation_date: '2019-06-27'
  link: https://resolver.tudelft.nl/uuid:a0faf1a6-9815-4828-9186-a4a16119c71c
  image: 2019_Bouzas.jpg
  github: https://github.com/VasileiosBouzas/MeshPolygonization
  paper: https://doi.org/10.1016/j.isprsjprs.2020.07.010
  abstract: 'In recent years, there is an ever-increasing demand — both by
    industry and academia — for 3D spatial information and especially, for
    3D building models. One of the ways to acquire such models derives from
    the combination of massive point clouds with reconstruction techniques,
    such as Ball Pivoting and Poisson Reconstruction. The result of these
    techniques is the representation of individual buildings or entire urban
    scenes in the form of surface meshes — data structures consisting of vertices,
    edges and faces. Despite their usefulness for visualization purposes,
    the high complexity of these meshes, along with various geometric and
    topological flaws, stands as an obstacle to their usage in further applications,
    such as simulations and urban planning. To address the issue of complexity,
    the production of lightweight building meshes can be achieved through
    mesh simplification, which reduces the amount of faces used in the original
    representations. Moreover, simplification methods focus on conforming
    the resulting mesh to the original one, in order to minimize the differences
    between the two of them. As a consequence, simple and accurate building
    models are possible to be acquired, whose geometric and topological validity
    is yet questionable. In this thesis, we introduce a novel approach for
    the simplification of building models, which results into a more compact
    representation, free of topological defects. The main characteristic of
    our method is structure awareness — namely, the recovery and preservation,
    for the input mesh, of both its primitives and the interrelationships
    between them (their configuration in 3D space). This awareness asserts
    that the resulting mesh closely follows the original and at the same time,
    dictates the geometric operations needed for its construction in the first
    place — thus providing accuracy, along with computational efficiency.
    Our proposed methodology is divided into three main stages: (a) primitive
    detection via mesh segmentation, (b) storage of primitive interrelationships
    in a structure graph and (c) simplification. In particular, simplification
    is accomplished here by approximating the primitive borders with a building
    scaffold, out of which a set of candidate faces is defined. The selection
    of faces from the candidate set to form the simplified mesh is achieved
    through the formulation of a linear binary programming problem, along
    with certain hard constraints to ensure that this mesh is both manifold
    and watertight. Experimentation reveals that our simplification method
    is able to produce simpler representations for both closed and open building
    meshes, which highly conform to the initial structure and are ready to
    be used for spatial analysis. Additionally, a fairly good approximation
    of a given mesh is possible to be obtained within reasonable execution
    times, regardless of the initial noise level or topological invalidity.
    Finally, a comparative analysis shows that the accuracy of our method
    stands in parallel with that of other available simplification techniques.'
  uuid: a0faf1a6-9815-4828-9186-a4a16119c71c
- surname: Dimopoulos
  name: Giorgos
  title: From static to dynamic visualization of the sea surface height on
    a web GIS application
  supervisors: Peter van Oosterom; Fedor Baart
  year: 2019
  graduation_date: '2019-11-01'
  link: https://resolver.tudelft.nl/uuid:6fd75a74-8ddf-44ed-a641-4aab228aa028
  image: 2019_Dimopoulos.jpg
  abstract: 'During the last three decades, the Earth’s climate is changing
    rapidly, with higher average temperatures every year that leads not only
    to the melting of the ice sheet in the arctic and on most of the glaciers
    all over the world but also to extreme weather phenomena. The rise of
    the temperature can affect the Sea Surface Height (SSH) in more than one
    way, and since 70% of the Earth’s surface is covered by the oceans, if
    the oceans are being affected then the whole Earth also is. The monitoring
    of the SSH can help the scientist predict the changes that will take place
    in the future. The SSH is a dynamic phenomenon that constantly changes
    not only within different decades but also from year to year, month to
    month even within the same day. These changes are the result of various
    phenomena and are called anomalies. When the SSH is monitored different
    phenomena are represented in different time scales and it is important
    to be taken into consideration if there is the need for a proper understanding
    of the SSH phenomenon. Many spatial data vendors are providing a large
    number of data-sets related to the monitoring of SSH and its anomalies
    and as a result, there is the need to find the most effective way to extract
    information from the data. Over the years has been established that one
    of the most effective ways to extract information from data is through
    the various visualization techniques and since the data of SSH is mainly
    spatial the main visualization technique is cartography. The advancements
    of the technology over the last couple of decades have led to a reality
    that the ”online” application is the norm and consequently the web mapping
    and web geographical information system (GIS). The goal of this thesis
    is to propose an architecture for a web GIS application that will be able
    to visualize dynamic data while adding elements of interactivity to improve
    the chances of the Sea Surface Height Anomaly (SSHA). IN order to achieve
    the goal of this thesis three main research questions need to be answered:
    What type of animation should be used (in order to visualize the passing
    of time), what interactivity elements should be added (e.g. zooming/panning
    in space and time) and what system’s architecture is optimal for such
    application (server-side/client-side etc.). This document is providing
    guidelines on how to create such an application and is resulting in the
    production of a prototype. The first part of this thesis is the review
    of the main ideas that are introduced in this project and how they were
    implemented by other researchers. Then, a comparison between the different
    implementation techniques (for every research question) is taking place
    to determine the main characteristics of the application. The final part
    is related to the implementation of the chosen techniques that lead to
    the development of the prototype application. The resulted prototype even
    though it is not perfect, due to technical limitations that were a consequence
    of implementing some of the most recent concepts in web development, is
    functional and paves the way for the development of new improved dynamic/interactive
    web GIS applications (https://giorgosdimo.github.io/MSc-Thesis/).'
  uuid: 6fd75a74-8ddf-44ed-a641-4aab228aa028
- surname: Du
  name: Shenglan
  title: Accurate, Detailed and Automatic Tree Modelling from Point Clouds
  supervisors: Liangliang Nan; Roderik Lindenbergh
  year: 2019
  graduation_date: '2019-06-27'
  link: https://resolver.tudelft.nl/uuid:675ee438-3dc9-43c8-a7a7-f3b8807c583f
  image: 2019_Du.jpg
  github: https://github.com/tudelft3d/adtree
  paper: https://doi.org/10.3390/rs11182074
  abstract: Trees are of great significance throughout the world, both in
    urban scenes and in natural environments. Models of trees can be widely
    applied in various fields, for instance, landscape design, geo-simulation,
    environment modelling, and forestry inventories. Recently, laser scanning
    technology has been rapidly developed, making it possible to effectively
    acquire geometric attributes of trees and achieve accurate 3-dimensional
    tree modelling. Existing studies on tree modelling from laser scanning
    data are vast. Nevertheless, some works don’t ensure sufficient modelling
    accuracy, while some other works are mainly rule-based and therefore highly
    depend on user interactions. In this thesis, we propose a novel method
    to accurately and automatically reconstruct tree branches from laser scanned
    points. We first employ the Minimum Spanning Tree (MST) algorithm to extract
    an initial tree skeleton over the single tree point cloud, then simplify
    the skeleton through iterative removal of redundant components. A global-optimization
    approach is performed to fit a sequence of cylinders to approximate the
    geometry of the tree branches. The results show that our approach is adaptable
    to various trees with different data qualities. We also demonstrate both
    the topological fidelity and geometrical accuracy of our approach without
    significant user interactions. The resulted tree models can be further
    applied in the precise estimation of tree attributes, urban landscape
    visualization, etc.
  uuid: 675ee438-3dc9-43c8-a7a7-f3b8807c583f
- surname: Flikweert
  name: Puck
  title: Automatic Extraction of an IndoorGML Navigation Graph from an Indoor
    Point Cloud
  supervisors: Ravi Peters
  year: 2019
  graduation_date: '2019-01-30'
  link: https://resolver.tudelft.nl/uuid:b11f5b57-5362-4b45-bed6-d5bc154d86aa
  image: 2019_Flikweert.jpg
  paper: https://isprs-annals.copernicus.org/articles/IV-2-W5/271/2019/
  abstract: 'Because of urbanisation, more than 50% of the global population
    now lives in cities, a number that is ever-increasing. This leads to a
    need for more dense and complex building constructions, driven by the
    fact that people are living increasingly close to one another. These structures
    are often so large that it becomes difficult to navigate in the environment
    without any assistance. Especially for people with restricted mobility,
    such as wheelchair users, or the blind or partially sighted, it can pose
    a challenge to find the best path in a building. Consequently there is
    a need for navigation graphs that provide a way to structure connectivity
    information and routes in an indoor environment. Existing methods generally
    obtain information on the location of various rooms, corridors and their
    interconnectivity from 2D floor plans or 3D building models. However,
    these plans and models often were created by the architect when the building
    was planned, but never updated with new information after the building
    was built and came into use. Manually updating them is very labour-intensive.
    Therefore, in this research a method is developed for obtaining a navigation
    graph from an indoor environment by automatically extracting the information
    needed from a point cloud. The navigation graph is modelled according
    to the Open Geospatial Consortium (OGC) standard IndoorGML, which provides
    a basic structure for indoor navigation. The point clouds used in this
    research are gathered with a hand-held Mobile Laser Scanner (MLS), which
    also saves the path (trajectory) taken in the building. This all leads
    to the main research question: How can a navigation network in IndoorGML
    format automatically be extracted from a cluttered indoor point cloud
    and its trajectory? In order to answer this question this research focuses
    on the detection of doorways, and how they connect indoor spaces, such
    as rooms and corridors. A new way of door detection is proposed, which
    is based on the identification of walls using the 3D Medial Axis Transform
    (MAT) of the point cloud. After this it is explored how the established
    connectivity relationships can be extended with accessibility information,
    such as the location of stairs, and the dimensions of doors. Additionally
    it is researched how a more detailed navigation graph can be created by
    subdividing large spaces that have multiple connections. In this thesis
    it is proven that geometric input for a navigation graph can automatically
    be obtained from a point cloud. 100% of doors could be detected in the
    dataset that the methods were developed on, and when testing the methods
    on another point cloud, this number decreased to 70% , due to unforeseen
    situations. All spaces connected by detected doors, stairways and sloped
    surfaces were included in the graph, from which a more extensive navigation
    graph could be produced by subdividing corridors. This final product was
    compared to networks drawn by humans on a corresponding floor plan, from
    which it can be concluded that the graph produced by the methodology of
    this thesis is a good basis for a navigation.'
  uuid: b11f5b57-5362-4b45-bed6-d5bc154d86aa
- surname: Garcia Gonzalez
  name: Francisco Gabriel
  title: An interactive design tool for urban planning using the size of the
    living space as unit of measurement
  supervisors: Giorgio Agugiaro
  year: 2019
  graduation_date: '2019-07-11'
  link: https://resolver.tudelft.nl/uuid:844b92d4-aa22-4ae7-b6c3-3b563dd3318e
  image: 2019_Garcia-Gonzalez.jpg
  abstract: In urban planning, one of the common units of measurement for
    population density is the amount of households per hectare. However, the
    actual size of the households is seldom considered, neither in 2D nor
    in 3D. This thesis proposes a method to calculate the average size of
    the households from existing urban areas based on available open data
    and to use it as a design parameter for new urban developments. The proposed
    unit of measurement is comprehensive of outdoor and indoor spaces, the
    latter comprising both residential and non-residential space. As a test
    case, the Haven-Stad project in Amsterdam was chosen, specifically its
    second phase, Sloterdijk One, envisioned by the municipality of Amsterdam
    to host 11220 households and 7480 working places by 2040. The sizes of
    typical households, as well as a series of other KPI’s (Key Performance
    Indicators) were computed in different neighbourhoods of Amsterdam based
    on their similarities with the vision of Sloterdijk One. In the second
    part of this thesis, the resulting size of the households were used as
    a design parameter in a custom-made prototype tool to generate semi-automatically
    several design proposals (called scenarios) for urban developments. Additionally,
    each scenario can be converted into a Geo format to visualize it in web-based
    virtual platforms such as Google Earth and Cesium JS. Significant differences
    among the resulting design proposals based on this new unit of measurement
    were encountered, meaning that the average size of a household plays indeed
    a major role.
  uuid: 844b92d4-aa22-4ae7-b6c3-3b563dd3318e
