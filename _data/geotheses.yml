- surname: Oudman
  name: Erna
  title: The transformation of GPS into NAP heights
  supervisors: Roland Klees
  year: 2006
  link: https://resolver.tudelft.nl/uuid:e661fcdd-6fe8-46e9-b5ea-51dabbd89175
  image: 2006_Oudman.jpg
  abstract: 'GPS is used more and more for height determination. Resulting
    ellipsoidal heights don''t give information about how the water flows.
    Therefore traditional height systems are used. In the Netherlands this
    is the NAP. To perform a transformation between both height system a geoid
    model is needed. This theses looks at the following issues, regarding
    the determination of this geoid model: - Comparison between EGM96 and
    EIGEN-CG03C for the Dutch geoid - Computation of a height reference surface
    out of GPS/levelling data only - The use of variance component estimation
    for computation of a height reference surface out of NAP, GPS and geoid
    heights'
  uuid: e661fcdd-6fe8-46e9-b5ea-51dabbd89175
