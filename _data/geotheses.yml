- surname: Bont
  name: Tirza
  title: Geographic data integration for telecommunication purposes
  supervisors: Peter van Oosterom; Edward Verbree; A.L.J.M. Wiegerinck
  year: 2006
  link: https://resolver.tudelft.nl/uuid:ac4e2424-be72-4481-9b18-699172d045eb
  image: 2006_Bont.jpg
  abstract: Planning and designing mobile telephone networks is a complicated
    process, which involves large amounts of money. The TIGER tool is under
    development at TNO ICT. The tool calculates the spatial traffic grids,
    which are one of the input data sets for mobile telephone network planning
    tools. The input data for the TIGER tool consists of the distribution
    of the potential users of the mobile telephone network. The distribution
    of the traveling users is only available at low detail and this data set
    has to be matched with the detailed road and railroad data set. The match
    of both data sets should be optimized and an indication of the reliability
    and accuracy of the matches has to be given. In order to perform this
    task properly the follwing research question has been formulated. Find
    the best match between generalized, low detailed schematic links and the
    more detailed road and railroad network and give an indication of reliability
    and accuracy of the results. This graduation project has been executed
    in two ways. First an eximanation of related researchers on the topic
    of matching multiple representations of street data sets has been performed.
    Second, different variants of solution definitions have been implemented.
    The results have finally been compared in order to give an indicaation
    of the reliability and accuracy. This best variant has the highest matching
    rate of all of the implemented variants, determined by comparing the results
    of the variants mutually. The variant generalizes the matching route of
    the travelers with the Douglas-Peucker line simplificatin algorithm. The
    number of vertices that are left gives an indication of the smoothness
    of the route, which i sone of the characteristics of the input data set
    containing the distribution of the travelers.
