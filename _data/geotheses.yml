- surname: van der Ham
  name: Martijn
  title: Real Time Localization of Assets in Hospitals using Quuppa Indoor
    Positioning Technology
  supervisors: Sisi Zlatanova; Edward Verbree
  year: 2015
  link: https://resolver.tudelft.nl/uuid:31da4059-5dac-4e60-93d7-36cad2d8ab46
  image: 2015_van-der-Ham.jpg
  paper: http://doi.org/10.5194/isprs-annals-IV-4-W1-105-2016
  abstract: Indoor positioning is becoming a hot topic in public areas that
    are used by large numbers of people. Finding people and assets in buildings
    has become more difficult because of the complexity and scale of today’s
    public space. On the subject of locating assets in the hospital the following
    use case is defined for this project. Positioning and localization of
    assets in a hospital is useful to do for several reasons. Loss and theft
    of equipment takes a large expense of the hospital’s budget. When it is
    possible to have the position of a device in real time, a system could
    be developed that locates the assets through the hospital building. The
    main goal of this project is to develop a model for an indoor positioning
    system for localization of assets in a hospital. The indoor positioning
    technology developed by Quuppa forms the basis for this. Their indoor
    positioning solution consists of Bluetooth powered tags measured by monitors
    on the ceiling (locators). The hospital that is going to be involved in
    this project is the Rijnstate hospital, located in Arnhem. They provided
    the input necessary to define the requirements for the use case. Based
    on the requirements from the use case and the specifications of the positioning
    system six test cases were defined for analysis of the test data and development
    of the localization model. This MSc thesis describes a scientific approach
    to investigate the subject of indoor localization by performing data acquisition,
    processing and analysis of indoor position data. In order to localize
    the assets indoors, a map matching method is developed that takes into
    account several factors such as geometrical influences, characteristics
    of the positioning system and obstructions in the indoor environment.
    For matching the position data to a real world location, several location
    types are developed by subdividing the floor plan into location clusters.
    The research has shown that a sub-meter accuracy level can be achieved
    for locations that are within the high-resolution range of the locator.
    The performance for positioning at the smallest cluster levels can only
    be achieved when having a dense distribution of locators. Test cases that
    were defined for specific situations related to the hospital case show
    successful localization for the majority of the test data. A correction
    model for making coordinate adjustments of the position estimates is described
    based on the reliability of the data from the test cases.
  uuid: 31da4059-5dac-4e60-93d7-36cad2d8ab46
- surname: Willems
  name: Hester
  title: The localisation of freight wagons on marshalling yards
  supervisors: Stefan van der Spek; Edward Verbree; Wilko Quak
  year: 2015
  link: https://resolver.tudelft.nl/uuid:e0ea7327-4832-4e62-a702-c9e0acaa2939
  image: 2015_Willems.jpg
  abstract: Freight is moved by trucks on the road more and more, which is
    a worrying thing, especially for the environment. A very good alternative
    to transportation by trucks is transportation by trains. The Dutch government
    aims to increase the transportation of goods by train from 13% of all
    transportation to 20% of all transportation, but in reality, freight transportation
    by rail is used less and less. One of the main reasons is inefficiency
    in the process, which is caused partly by the fact that freight wagons
    or entire freight trains can get lost, easily for as long as a week. Not
    only does this cause inefficiency in the transportation of goods, it also
    poses dangerous situations if the location of wagons is not exactly known.
    In this thesis, performed at the company CGI, a system was researched
    and developed to make real time localisation of trains on marshalling
    yards possible, using low cost GNSS devices. Three characteristics of
    marshalling yards have played a large role in the development of this
    system. First, the fact that freight trains are usually stationary on
    marshalling yards, this posed an interesting research angle for this project.
    During the project, the influence of combining multiple GPS measurements
    to improve the accuracy of the result was investigated, both average and
    median calculations were used to take these previous measurements into
    account. A second important characteristic of a marshalling yard is the
    fact that trains will always be located on a specific track on the marshalling
    yard. In the time that it remained stationary, it cannot have moved from
    one track to the other. The tracks on the marshalling yards will be taken
    as an extra reference system in this project and play an important role
    in making the resulting location understandable for the end users of the
    system. The last characteristic is that the order of the wagons cannot
    change while the wagons are stationary. This order of the wagons is also
    important to make the result understandable. The order of the wagons on
    one track is calculated using the distance and the bearing between the
    different devices. Using these characteristics in the processing phase
    of the GPS measurements, a real time system to localise the freight wagons
    on marshalling yards has been developed.
  uuid: e0ea7327-4832-4e62-a702-c9e0acaa2939
  needs_review: true
- surname: Wu
  name: Haoxiang
  title: Integration of 2D architectural floor plans into Indoor OpenStreetMap
    for reconstructing 3D building models
  supervisors: Sisi Zlatanova; Liu Liu
  year: 2015
  link: https://resolver.tudelft.nl/uuid:26a4c6b8-8ea0-4246-b30e-5c83a28cccb4
  image: 2015_Wu.jpg
  abstract: All existing data sources used to reconstruct 3D building models
    have certain restrictions. An eye-catching alternative is IndoorOSM, one
    of the most popular examples of the newly evolved crowdsourced geodata.
    The potential power of this rich and simple-formatted data source has
    been proven by many researches. However, a fatal flaw of IndoorOSM is
    also pointed out, which is its accuracy. Another promising data source
    that has been looked into is 2D architectural floor plans. They are also
    commonly available and full of detailed indoor information. Due to the
    inconsistencies and ambiguities existing among real-life floor plans,
    previous researches all are established on different user cases. Althogh
    sharing a common pipeline, they differ from each other in every step,
    from the data structure, processing procedure to the 3D reconstruction
    method. The combination of these two data sources can be beneficial, because
    architectural floor plans can offer IndoorOSM better accuracy and extensive
    indoor information while IndoorOSM can provide a unified data structure
    and 3D reconstruction workflow for information extracted from floor plans.
    Based on a throughout review of the characters of real-life floor plans,
    a set of rules are proposed to redraw architectural floor plans from real
    life. These rules mainly focus on reorganizing information contained in
    floor plans, taking advantages of the layering and blocking functions
    supported by CAD application. The original geometry and graphical representation
    in the raw floor plans is reserved as much as possible. Redrawing is only
    required when unstandardized representation is encountered. Then, an automatic
    process is accordingly presented to extract desired information from the
    redrawn floor plans into an IndoorOSM database. Finally, highly detailed
    CityGML LoD4 models with interior structures can be generated using a
    method proposed by Dr. Marcus Goetz. The pipeline is tested with several
    floor plans from real life for 3D reconstruction. User feedback validated
    the feasibility and efficiency of the redrawing rules.
  uuid: 26a4c6b8-8ea0-4246-b30e-5c83a28cccb4
- surname: Zervakis
  name: Dimitrios
  title: Combining a Physics-based Model and Spatial Interpolation of Scarce
    Bed Topography Data in Meandering Alluvial Rivers
  supervisors: Peter van Oosterom; Martijn Meijers; Erik Mosselman
  year: 2015
  link: https://resolver.tudelft.nl/uuid:f41ba0a0-acd5-462e-b5aa-7c1c5878e1ac
  image: 2015_Zervakis.jpg
  abstract: All human life is dependent on fresh water and activities related
    to monitoring its availability have become crucial for financial and survival
    reasons. Most rivers are being constantly investigated today by both the
    private and public sector using various means. In advanced countries,
    the researches cover extensively the riverbed in order to fully assess
    its topography. However, there are quite often cases where the data collected
    are disorderly scarce, resulting in questionable assumptions and interpolated
    predictions. The purpose of this thesis is to provide a new method for
    reconstructing the riverbed topography when data are scarce, so as to
    achieve better results than the ones conventional methods currently give.
    The chosen course of action involves a combination of the datasets outputted
    by a simplified physics-based model and spatial interpolation of the available
    scarce topography data. The surrounding research involves numerous aspects
    of mathematics, physics and spatial analysis, which together are called
    in to provide a complete solution to an existing problem. The focus lies
    on meandering alluvial rivers, whose planform style is the most common
    in human-populated river basin areas. Three rivers of different extent
    and interest are explored, namely the Danube (Romanian area), IJssel (Netherlands)
    and Kootenai (United States). The study cases comprise river areas extracted
    from each of them, in order to focus on bends and mildly widening or narrowing
    parts of the rivers. The final outcome of this Master Graduation Thesis
    project was achieved through literature research, exploration and implementation
    of ideas and scientific methods, made possible through cooperation with
    the Deltares independent institute for applied research. The proposed
    method combines scarce riverbed topography data with the basics of river
    morphology and spatial interpolation techniques to come to a new method
    that achieves a result of higher value in the complex field of river and
    geomatics engineering. The method is further assessed and evaluated and
    will ideally be incorporated in the Rapid Assessment Tool for Inland Navigation
    (RAT-IN) which is currently under development at Deltares.
  uuid: f41ba0a0-acd5-462e-b5aa-7c1c5878e1ac
  needs_review: true
- surname: Zhou
  name: Kaixuan
  title: Exploring Regularities for Improving Quality of Facade Reconstruction
    from Point Cloud
  supervisors: Ben Gorte; Sisi Zlatanova; Pirouz Nourian
  year: 2015
  link: https://resolver.tudelft.nl/uuid:8f548788-1e42-475b-adbf-93f9dbcd04a1
  image: 2015_Zhou.jpg
  abstract: 'Facade reconstruction from terrestrial LiDAR point cloud is affected
    by both quality of point cloud itself and imperfectness of object recognition
    algorithms. In the facade, there are many features, which are shared within
    an object or among objects. For example, within one window, the boundaries
    of it may share parallel and orthogonal orientation; windows in the façade
    may share same shape and orientation. This thesis focuses on these features,
    which can be called regularities, to improve the quality of facade reconstruction.
    There are three main objectives in the research. The first is to detect
    the wall and its holes, which represent existence of windows, intrusions
    or extrusions on the wall. Second, local regularities within one hole
    and global regularities shared among holes are explored. Last, the quality
    is evaluated by testing two datasets in order to show overall effect of
    the procedure. The RANSAC plane fitting algorithms and prior rules are
    used to find the wall planes from the point cloud. Instead of extracting
    holes directly from 3D points, a rasterization approach is employed to
    extract holes, a more robust way to deal with noise and various densities
    without loss of information. Regularities can be classified into two categories:
    local regularity with one hole and global regularity among holes. Global
    regularities consist of two types: global regularities among similar holes
    or between different holes. Nine cases of regularities within these categories
    are listed and explored. A hierarchical clustering is employed to identify
    regularities in certain feature spaces where the objects sharing the regularities
    will be close. We propose procedures to focus on finding features for
    corresponding regularities so that clustering can be employed to identify
    and apply them. In the beginning of the procedure, ICP (iterative control
    points) is used to identify groups of similar holes. The registered points
    and transformation matrices are used for finding features for identifying
    and applying local regularity and first type of global regularity. The
    boundaries from different holes are used to extract features in order
    to identify and apply second type of global regularity. To test the performance
    of the algorithms, two datasets from terrestrial LiDAR point clouds are
    used. The local regularities and first type of global regularities are
    explored for both datasets. The second type of global regularities is
    explored only for the second dataset, as there is only one group of holes
    in the first dataset. The quality of both results presented by holes on
    the wall is analyzed. The two results both show good effects of applying
    regularities and good matching with original point cloud.'
  uuid: 8f548788-1e42-475b-adbf-93f9dbcd04a1
- surname: Krūminaitė
  name: Marija
  title: Space subdivision for indoor navigation
  supervisors: Sisi Zlatanova
  year: 2014
  link: https://resolver.tudelft.nl/uuid:c2a9a308-5cdc-4df2-bf30-9eea5ea176c5
  image: 2014_Kruminaite.jpg
  abstract: 'The aim of the research was to develop conceptual model for determination
    of functional areas with abstract borders within indoor space and to illustrate
    how determined functional areas can be applied to facilitate wayfinding
    process in indoor environments. The objectives of the research were to
    define criteria for determination of functional areas of objects by adopting
    principles of human behaviour and human perception of the environment,
    to develop rules how to subdivide indoor space into navigable and non
    navigable areas and to incorporate functional areas in a navigation model.
    Based on literature review conceptual model for functional area determination
    was developed. The designed model suggests that functional areas of indoor
    objects depend on their characteristics such as attractiveness, necessity,
    limited capacity, closeness to central areas, possession of transition
    area. Additionally, the developed model introduces private space concept
    to delineate functional areas taking into account human behavioural rules.
    Mathematical expressions and rules to deal with special cases in order
    to delineate functional areas were established. The proposed model was
    implemented for two case studies: Rotterdam Central Station (for peak
    and off-peak hours) and Faculty of Architecture and the Built Environment,
    TU Delft. The partition of indoor environment for wayfinding purposes
    was performed in two steps. Firstly, semantic indoor space partition was
    performed: separate functional areas were determined and the indoor space
    was partitioned into navigable and non-navigable areas using GIS tools
    (buffer, union, difference, aggregation). Secondly, geometric space subdivision
    was executed where navigable area was subdivided applying constrained
    Delaunay triangulation to generate navigation network in which functional
    areas were represented as dead-end nodes. The results derived applying
    the proposed model were verified using photographs and video records.
    Functional areas of objects were determined by measuring areas occupied
    by people around specific objects and distances that people keep between
    each other and objects. Measurements obtained from photographs were compared
    with the results obtained using the proposed model. Video records were
    inspected to examine people movement trajectories. The results of the
    image and video analysis indicate that the research successfully integrated
    findings of previous studies and new concepts introduced in this research
    in order to provide more realistic abstraction of the indoor environment
    and more accurate navigation path. Eight cases of determined functional
    areas were examined and the outcome of the validation showed that only
    one case was not supported. On the basis of the results of the validation,
    it was concluded that the selected criteria are appropriate measures to
    determine separate functional areas within indoor space and provide reliable
    results. In this research the determined functional areas were represented
    as dead-end nodes in the generated navigation networks. The results of
    the performed path computation tests showed that indication of these functional
    areas in computations of navigation paths allows generation of more realistic
    routes that adopt principles of human natural movement and avoidance of
    areas that are usually occupied. However, the findings of research showed
    that additional attention has to be paid while determining ranges of the
    criteria, analysis of object’s closeness to surrounding location has to
    be improved. Furthermore, the findings revealed that time impact on properties
    of objects has to be carefully evaluated taking into consideration different
    factors such as occurring events in the environment, total number of people
    within the environment, habits of people and other. Moreover, the research
    suggests that in the future studies different navigation models could
    be built such as navigation network based on a visibility graph or grid
    based navigation model, in order to investigate how functional areas can
    be indicated in these models and analyse which approach provides better
    path calculation results.'
  uuid: c2a9a308-5cdc-4df2-bf30-9eea5ea176c5
- surname: Liu
  name: Haicheng
  title: 'Comparing NetCDF and a multidimensional array database on managing
    and querying large hydrologic datasets: a case study of SciDB'
  supervisors: Peter van Oosterom; Theo Tijssen; Tom Commandeur; Roderik Lindenbergh
  year: 2014
  link: https://resolver.tudelft.nl/uuid:e55765a9-dfcb-4a6d-b9fb-f9279137c50c
  image: 2014_Liu.jpg
  abstract: Like many ICT related domains, hydrology enters the era of big
    data and managing large volume of data is a potential issue facing hydrologists.
    However at present, hydrologic data research is mostly concerned with
    data collection, interpretation, modelling and visualization. Management
    and query of large datasets do not draw much interest. The motivation
    of this research originates from a specific data management problem reflected
    by Hydrologic Research B.V. and that is, time series extraction costs
    intolerable time when the large multidimensional dataset is stored in
    NetCDF classic or 64-bit offset format. The essence of this issue lies
    in the contiguous storage structure adopted by NetCDF. So in this research,
    NetCDF-4 format and a multidimensional array database applying chunked
    storage structure are benchmarked to learn whether and how chunked storage
    structure can benefit queries executed by hydrologists. To achieve a convincing
    and representative benchmark result, expert consultancy was conducted
    to collect queries and sample datasets frequently handled by water experts.
    From the raw consultancy records, 5 classes of query were summarized and
    specific queries for benchmarking were devised. After this, 9 criteria
    were established to assess which multidimensional array database is most
    suitable for benchmarking and finally SciDB was chosen. To establish a
    fair benchmark test environment, HydroNET-4 system was utilized and adapters
    for NetCDF files and SciDB were developed to manage and query data. For
    final benchmark tests, influence of data compression on query, and scalability
    of diverse data solutions, i.e. 64-bit offset, NetCDF-4 and SciDB solutions
    were investigated. In addition, chunk size and dimensions order effect
    of SciDB arrays on query performance were also explored. It turns out
    that NetCDF-4 solution with a recommended chunk size has the best overall
    management and query performance among all solutions. SciDB arrays utilizing
    small chunk sizes present favorable performance. However with current
    implementation of SciDB, large amount of small chunks cause huge overload
    of main memory which constraints SciDB’s scalability. For SciDB, DEFLATE
    compression can either have negative or no effect on query performance.
    In time series extraction test, compression effect is found to be correlated
    with chunk size and the negative impact of compression on query decreases
    as chunk size reduces. It is deduced that with hypercubic and modest chunk
    sizes, the internal data structure of chunks in SciDB has no significant
    influence on query performance. The research demonstrates that for large
    data management and query, a file based solution can be a better choice
    than a database utilizing smart caching and indexing strategies. But due
    to the limited scope of the research, for instance no parallel query processing
    tested, more work need to be conducted in the future.
  uuid: e55765a9-dfcb-4a6d-b9fb-f9279137c50c
  needs_review: true
- surname: Tierie
  name: Elise
  title: Visualisation conformity of three dimensional IMGeo for emergency
    response
  supervisors: Sisi Zlatanova; Peter van Oosterom
  year: 2014
  link: https://resolver.tudelft.nl/uuid:9bb42bcc-9081-4e48-9b4e-34505e562bec
  image: 2014_Tierie.jpg
  abstract: The past seventy years the number of disasters that occur, man-made
    and natural, has increased. This problem requires suitable and efficient
    means to control and respond to emergency situations. Currently, the emergency
    responders use maps and software that allows for two dimensional visualisations
    of situations. Meanwhile the development of visualisation software continues.
    In the Netherlands the interest in CityGML, software for 3D city visualisation,
    has vastly increased after the 3D pilot ‘NL’, coordinated by Geonovum.
    As a result of this interest, Geonovum has set up a Dutch CityGML format,
    which is an extension of the existing 2D IMGeo format. This extension
    contains the standard 3D objects that make up a city, but might lack objects
    that are required specifically for disaster fighting. A three dimensional
    environment could provide a better overview of a location than a 2D map
    and also allow for 3D, and thus more realistic, computations such as 3D
    distance, 3D flow computation, 3D visibility analysis and for example
    flood simulations. These possibilities could have profits for emergency
    responders but might require extensions of the IMGeo information model
    and its data before IMGeo can be used for emergency response. There are
    a lot of organisations, actors, involved in emergency response. Based
    on their experience, obtained insight and a literature study, this thesis
    researched to what extent IMGeo and CityGML comply with the user requirements
    for an emergency response model. The results indicated that IMGeo covers
    the basics of an emergency response model, but that a lot of scenario
    related objects are missing (e.g. dikes). These objects are to be combined
    per scenario and thus form scenario based modelling; the base of this
    research. This modelling allows dosed relevant visuals of the model. which
    is important since too much information will slow down a model and could
    counteract the user.
  uuid: 9bb42bcc-9081-4e48-9b4e-34505e562bec
  needs_review: true
- surname: van der Laan
  name: Eva
  title: Radio propagation aided indoor localization
  supervisors: Wilko Quak; Stefan van der Spek; Pirouz Nourian
  year: 2014
  link: https://resolver.tudelft.nl/uuid:316d539f-d28e-478e-abf5-a255f920e61d
  image: 2014_van-der-Laan.jpg
  abstract: 'Indoor localization is a hot topic since the demand for Location
    Based Services (LBS) has increased, especially (semi) public places like
    museums, office buildings and congress halls would benefit from LBS. Outdoor
    localization and its applications like navigation systems are well implemented
    in society and used by many on a daily basis. Applications using indoor
    localization are underrepresented due to the lack of a robust and scalable
    indoor localization technique. Attempting to solve this problem, first,
    a suitable indoor localization technique (hardware) is selected and second,
    an indoor localization method (algorithm) is applied. For the localization
    technique two radio propagation techniques are tested in this research:
    first an established technique called Ultra High Frequency Radio Frequency
    Identification (UHF RFID) and second, a newly arrived technique called
    Bluetooth Low Energy (BLE). Both techniques use a sensor and tag. In the
    case of UHF RFID the person to be located carries a tag and is recorded
    by sensors on the ceiling. In the case of BLE the person to be located
    holds the sensor in hand and senses the tags on the ceiling. Results show
    that the UHF RFID is highly sensitive to environmental changes and water
    bodies (including the user itself). This makes the proximity indication
    of the technique unpredictable and the technique difficult to use in various
    locations with a large amount of users, which is often the case in (semi)
    public places. The BLE shows quite stable results in terms of its sensitivity
    to interferences and shows a clear correlation between distance and signal
    strength. The latter two characteristics make it a suitable technique
    for indoor localization. Two localization algorithms using BLE are proposed;
    first a dependent algorithm which takes into account the specific characteristics
    of the sensor, and second, an independent algorithm (referred to as PML)
    which functions independently from the type of sensor used. The latter
    is an advantage because the sensor is incorporated in the mobile phone
    of the user. Especially when there are potentially multiple users holding
    different types of mobile phones, the sensors can vary widely. The dependent
    algorithm is based on a probability function using a basic concept of
    trilateration dependent on the measurements of at least three beacons.
    PML is based on the ratio between measurements of at least three beacons.
    Results of both algorithms show in most cases a computed location within
    a meter of the actual location. Generally, the dependent algorithm shows
    slightly better results with regards to the PML method. However, the practical
    usability and scalability of the PML method makes it preferable over the
    dependent algorithm.'
  uuid: 316d539f-d28e-478e-abf5-a255f920e61d
  needs_review: true
- surname: van Winden
  name: Karl
  title: Automatically deriving and updating attribute road data from movement
    trajectories
  supervisors: Filip Biljecki; Stefan van der Spek
  year: 2014
  link: https://resolver.tudelft.nl/uuid:eec252e0-1a6b-4a3a-a167-45aaadc2bb7f
  image: 2014_van-Winden.jpg
  paper: http://doi.org/10.1111/tgis.12186
  abstract: 'There are many applications that use maps, and more detailed
    the maps are, more applications can benefit from the map. Many maps are
    still manually created and also the underlying attributes are informed
    in a manual process. This thesis presents a method to automatically derive
    and update attribute road data by mining and analyzing movement trajectories.
    The method used for this thesis implemented OpenStreetMap as the underlying
    map which will be updated. GPS tracks are the movement trajectories that
    will be used to derive the information for the road attributes. There
    are attributes that are already conceptually present in OpenStreetMap
    but are in practice rarely filled. The attributes that will be investigated
    to derive are: whether the road is a one or two way road, the speed limit
    of the road, the number of lanes of the road and which vehicles have access
    to the road. Also, new attributes are introduced in this thesis. These
    are the average speed of the road, the hours in which the road is congested,
    the importance of the road and whether the road has a certain geometrical
    error. Preprocessing is performed before the attributes can be derived.
    Important are the classification of the transportation mode of the GPS
    tracks and the map matching of the GPS points to the roads they are on.
    When the IDs of the roads, where the GPS points are on, are known the
    attribute extraction algorithms can be applied. These algorithms all have
    different methods for deriving their attributes. There are attributes
    that use the speed of the GPS point, the distance from the point to the
    road or the heading of the point. For some attributes, a hierarchical
    code list is created to provide different perspectives on the error of
    the attributes. The code list consists of the values of the attributes
    and the hierarchy between these lists describes the level of detail and
    the granularity of the values. While some attributes were classified correctly
    in almost 100\% of the cases, the extraction of the attributes were not
    all successful. The number of lanes proved to be too difficult to derive
    out of the available data and the importance of a road relies on a complete
    coverage of data which was not the case. Although, the latter is applied
    in this research. The other attributes had different results, the accuracy
    of the classification of the speed limit was 69,2\%. However, when taking
    into account speed limits that are only one step away (e.g. 60 km/h instead
    of the classified 50 km/h) the classification increases to 95\%. The classification
    of the roads that allow bicycles was 74\% and the attribute to determine
    whether a road is a one or two way road has a classification accuracy
    of 99\%. In the future, the attribute extraction algorithms could be improved
    or expanded. More detailed levels in the hierarchical code list could
    be added and constraints could be added to improve the attributes. Also,
    some techniques might be enhanced for better results. Finally, the ideal
    application of this method would be deriving and updating the attributes
    in real-time. This could lead to live maps which would change real-time
    with the changes on the road.'
  uuid: eec252e0-1a6b-4a3a-a167-45aaadc2bb7f
- surname: Xu
  name: Weilin
  title: Spatial model-aided indoor tracking
  supervisors: Liu Liu
  year: 2014
  link: https://resolver.tudelft.nl/uuid:8fd6a9ef-3dfb-4bd1-b54e-44d5b2cca973
  image: 2014_Xu.jpg
  abstract: In order to address the problem of indoor pedestrian tracking,
    this thesis reports a research on spatial models' ability to reduce tracking
    error of a WiFi positioning system. There are three main objectives in
    this research. First, it is to build a suitable spatial model for tracking.
    Second, it is to develop a tracking algorithm that can make full use of
    the spatial model. Last, the tracking algorithm should be tested in a
    live environment. Based on literature study, a grid-based spatial model
    is chosen to be built because it is easy to design and maintain, has high
    flexibility, has accurate location data and is powerful for computation.
    The thesis explores various geometric, topological and semantic features
    of the grid model and select out the most useful features upon tracking
    purposes. Among geometric features, coordinate, buffer, orientation vector
    and Euclidean distance are used. Among semantic features, space, obstacle,
    and door are employed. Among topological features, the difference between
    straight-line distance and shortest path distance is chosen. We develop
    the tracking algorithm combining multiple tracking techniques. In addition
    to the spatial model and WiFi positioning system, the algorithm also includes
    magnetometers and grid filters. The former one measures the orientation
    of a pedestrian. The latter one allows integrating all selected features
    of the grid model with the measurements from both the WiFi positioning
    system and the magnetometer to compute the location recursively. To test
    the algorithm's performance, we built a tracking system with database,
    web service and mobile client. Several experiments are carried out using
    the system in a real environment. The experiment results show that the
    algorithm is able to determine locations at reasonable places (in the
    correct space, outside obstacles and connected to the previous location)
    and derive the accurate moving direction of a pedestrian.
  uuid: 8fd6a9ef-3dfb-4bd1-b54e-44d5b2cca973
- surname: Boeters
  name: Roeland
  title: Automatic enhancement of CityGML LoD2 models with interiors and its
    usability for net internal area determination
  supervisors: Ken Arroyo Ohori; Sisi Zlatanova; Christian Veldhuis
  year: 2013
  link: https://resolver.tudelft.nl/uuid:b22a2b93-4a0a-4aa7-8e3b-6e08e0027634
  image: 2013_Boeters.jpg
  github: https://github.com/tudelft3d/lod2plus
  paper: http://doi.org/10.1080/13658816.2015.1072201
  abstract: Where Level of Detail (LoD) allow City Geography Markup Language
    (CityGML) models to be shared over different application domains, only
    one LoD defines building interiors. As there are potentially numerous
    applications with a need for building interiors (but not with all the
    details as defined in LoD4), in order to attain a larger applicability
    the LoD system should be extended with building interiors in accordance
    with the existing exterior definitions. Since CityGML LoD2 is a common
    LoD, in this research it is investigated how to automatically generate
    interiors for LoD2 (resulting in a model called LoD2+) in which the details
    are comparable to those of the exteriors. A key application in the Netherlands
    for LoD2+ is the determination of net internal area of buildings (the
    surface area which can be used by building owners). This property is useful
    for many applications which require the size of buildings, but is especially
    important for real estate taxations and sales. The registration of these
    values by Dutch municipalities (via Basisregistratie Adressen en Gebouwen
    (BAG) - Key Register for Addresses and Buildings) is at the moment still
    a manual process (determined from building blueprints), and is therefore
    error-prone. This research dealt with the design of a finite set of shape
    rules to generate valid LoD2+ city models from a CityGML LoD2 model with
    a small amount of semantic information. Here LoD2+ is defined as the existing
    building solids complemented by inner shells for each storey in a premises
    where space is allocated for walls, roofs, ceilings and floors. Using
    Boolean set operations (e.g. union, intersection and difference) the building
    exteriors can be split in the right amount of storeys according to BAG
    and erosion can be applied to offset walls, roofs, ceilings and floors
    to obtain storey solids according to LoD2+. From LoD2+ buildings in which
    interior surfaces are classified, the net internal area of the majority
    of premises can be estimated. By calculating these values from LoD2+ city
    models a comparison can be done, resulting in the validation of both the
    net internal area in BAG and the LoD2+ city model. Significant errors
    are found in the BAG registration, since net internal area was mostly
    not recalculated after the net internal area standards were changed/introduced.
    For this research prototype software has been developed in C++ for the
    conversion of LoD2 to LoD2+ buildings and the calculation of net internal
    area. This software package is open source and freely available at http://lod2plus.googlecode.com.
  uuid: b22a2b93-4a0a-4aa7-8e3b-6e08e0027634
- surname: de Vries
  name: Lars
  title: A research towards completing the asset information life cycle --
    An analysis of the relationships between data exchange, BIM and the asset
    life cycle and the solutions to overcome existing issues at Amsterdam
    Airport Schiphol.
  supervisors: Sisi Zlatanova; Peter van Oosterom; Nico Wasserman
  year: 2013
  link: https://resolver.tudelft.nl/uuid:88b6c2fc-b182-4fb2-98c8-25b6a24292ce
  image: 2013_de-Vries.jpg
  abstract: This thesis research for the Master of Science programme Geographical
    Information Management and Applications looks at the possibilities of
    completing the asset information life cycle at Amsterdam Airport Schiphol.
    Therefor an analysis was made of the current situation, after a literature
    research was conducted towards the subjects of data exchange and Building
    Information Modelling (BIM). The insights in data exchange principles
    are needed to understand the potential problems in completing the asset
    information life cycle. At the moment as-built information is delivered
    to SGIS, but not re-used in new projects. The most important problems
    are caused by systems that are not able to communicate with each other
    and data structures that are different by nature because of its native
    software. BIM is a topic that currently gets much attention in the world
    of design and construction. From their perspective BIM deals with another
    way of executing design and construction, where collaboration and integration
    are the key words. In practice BIM has a broader scope and can be defined
    as, being a process in which relevant actors collaborate on creating,
    analysing and managing multiple dimension data within a dynamic model
    representing one or more assets throughout its/their life cycle. For this
    thesis research the new data model for asset information at Amsterdam
    Airport Schiphol, Schiphol GIS or SGIS, was analysed. SGIS replaces four
    other systems that contained all asset information at Schiphol, but that
    also contained double and inconsistent information. With SGIS these problems
    must belong to the past. The data model mostly contains 2D or 2½D data
    of all assets, including the most relevant information on the asset. SGIS
    also communicates, or will do so within two years, with three other systems
    that as a complex are the back bone of the asset management process at
    Amsterdam Airport Schiphol. There are currently two problems with completing
    the asset information life cycle. The first problem is getting the information
    from the 3D model to SGIS. To solve this problem a workflow is suggested.
    This workflow includes an export to the open standard IFC from the original
    3D AEC modelling software. A small addition to SGIS has to be made therefor,
    to be able to support the 3D geometries that are coming from that software.
    The second problem is to get the information back from the operations
    and maintenance phase to a new design phase. Currently the most optimal
    solution seems to re-use the received IFC file and to add a DWG containing
    the changed geometries. Thereby it needs to be mentioned that the multi-patch
    objects from SGIS will be exploded to individual faces. The preferred
    solution would have been to work from one central (spatial) database,
    but that is technically not possible yet. The problems are caused by the
    fact that AEC (3D modelling) software and GIS do not share a common geometric
    data model. Additionally it needs to be researched what the actual information
    demand is for the design phase. In the current situation information gets
    lost after the exchange from construction to operations and maintenance,
    because the information need in those phases is less detailed. With the
    suggested solutions and changes/additions to SGIS it is possible to complete
    the asset information life cycle for Schiphol and the relevant stakeholders
    and main-contractors. An inventory of the necessary resources to plan
    these changes still needs to be made.
  uuid: 88b6c2fc-b182-4fb2-98c8-25b6a24292ce
- surname: Donkers
  name: Sjors
  title: Automatic generation of CityGML LoD3 building models from IFC models
  supervisors: Hugo Ledoux; John Zhao; Jantien Stoter
  year: 2013
  link: https://resolver.tudelft.nl/uuid:31380219-f8e8-4c66-a2dc-548c3680bb8d
  image: 2013_Donkers.jpg
  github: https://github.com/tudelft3d/ifc2citygml
  paper: http://doi.org/10.1111/tgis.12162
  abstract: 'CityGML is a standardized data format used to store the semantic
    information and geometries of buildings and other object classes of 3D
    city models. The Level of Detail of current state of the art city models
    (LoD2) is not sufficient for accurate environmental simulations like noise,
    the solar potential of windows and other types of analyses. An LoD3 building
    model represents the full architectural exterior of a building with balconies,
    windows and so forth. The generation of these models needs to be automated
    as it is otherwise infeasible due to the required high amount of manual
    labour. In the architectural world, detailed building models are created
    in IFC format. This thesis shows that it is possible to automatically
    generate valid and semantically rich CityGML LoD3 building models directly
    from IFC models. Also an initial investigation is done on the possibilities
    for the conversion of IFC models to CityGML LoD4. For the conversion the
    semantic and geometric validity requirements are determined for CityGML.
    A methodology for the conversion is developed and a prototype implementation
    is made to prove the effectiveness of the conversion. The conversion consists
    of three parts: 1) The extraction and mapping of IFC semantics to CityGML
    semantics; 2) A geometric generalization which extracts the exterior shell
    using a transformation based on Boolean and morphological operations;
    3) Semantic and geometric refinements which optimize the model for analyses.
    The developed prototype is able to successfully convert IFC models to
    CityGML LoD3. All the resulting models were geometrically validated according
    to the ISO19107 standard, and semantics were checked manually. Few improper
    semantics occur in the output due to missing semantics in IFC. For example,
    there are no semantics for balconies or dormers in IFC. Recommendations
    are given to improve the alignment between the two formats. For IFC additional
    semantics are recommended whereas it is important for CityGML to specify
    how certain aspects are to be modelled. The research presented in this
    thesis can be used as the foundation for future work on the interoperability
    between Architecture and Geomatics. The software package is open source
    and freely available at https://github.com/tudelft-gist/ifc2citygml.'
  uuid: 31380219-f8e8-4c66-a2dc-548c3680bb8d
- surname: Altena
  name: Bas
  title: Filling the white gap on the map
  supervisors: Ben Gorte; Christopher Nuth; Andreas Kääb; Massimo Menenti
  year: 2012
  link: https://resolver.tudelft.nl/uuid:f8cc2379-2275-449d-8f2d-902e9e7d0682
  image: 2012_Altena.jpg
  abstract: In this study the limits and potentials of the principle of photoclinometry
    for glacier elevation modelling is assessed. A combination of optical
    and laser remote sensing instruments are used to map the surface of different
    remote ice bodies. Loss and gain of a glaciers' mass is a good indicator
    for local climate. If mass-balances of glaciers are known on a world-wide
    scale, they can give a better understanding of global climate change.
    Due to the remoteness and harsh environments at which glaciers are located
    a mass-balance is difficult to maintain or even start-up. Therefore, the
    use of optical and laser remote sensing can be of great value. The focus
    of this thesis is to identify options in which optical and laser remote
    sensing instruments can reliably map the surface of a glacier. It will
    use the technique of photoclinometry, also known as shape-from-shading,
    onto optical acquisitions. Estimated surface and topographic information
    will be integrated with spaceborne laser altimetry. These methodologies
    will compose a workflow, which produces elevation estimates of a glaciers'
    surface. Snow has a homogeneous reflection pattern, therefore the perceived
    reflection of a surface is primarily dependent on the amount of received
    sunlight per unit area. In that sense brightness values, perceived by
    an optical spaceborne sensor, may directly be related to surface orientation.
    This relation is used in this study to estimate a surface model from an
    optical image. Estimation of this model is done through the relations
    of a Lambertian reflection function and inverse theory. Only small patches
    of imagery can be processed, as its estimation is limited in size due
    to accumulating elevation errors and computational limitations. The methodology
    was tested on the high mountain glacier of Zhadang, on the Tibetan Plateau.
    An optical acquisition from the Earth Observation (EO-1) satellite with
    the on board Advanced Land Imager (ALI) was used. The estimated surface
    model was assessed and validated with another elevation dataset and leveling
    transects from a surveying campaign. The resulting surface model needs
    transformation to be of use for elevation modelling. Different strategies
    are used to resolve the residual unknowns of the transformation. Registration
    of surface models was conducted on the icefield of Lomonosovfonna, Svalbard.
    Laser altimetric measurements from the Ice, Cloud and Elevation Satellite
    (ICESat) with the on board Geoscience Laser Altimeter System (GLAS) instrument
    are used for this registration problem. Both geometric and temporal relations
    are included into the registration model, but only under specific circumstances
    the registration is reliable. A profile based approach of photoclinometry
    is also investigated. It may give topographic correction to resolve errors
    due to miss-alignment of the ICESat GLAS laser profiler. However, assumptions
    on terrain geometry were too optimistic to resolve in a reliable correction.
  uuid: f8cc2379-2275-449d-8f2d-902e9e7d0682
  needs_review: true
- surname: Bhattacharya
  name: Prajnaparamita
  title: Quality assessment and object matching of OpenStreetMap in combination
    with the Dutch topographic map TOP10NL
  supervisors: Peter van Oosterom; Hugo Ledoux; Mathias Lemmens
  year: 2012
  link: https://resolver.tudelft.nl/uuid:e1501114-d947-4278-8612-1e249e4dc02f
  image: 2012_Bhattacharya.jpg
  abstract: The possibility of an automatic object matching process in combination
    with a VGI (Volunteered Geographical Information) type of map has been
    explored in this research. TOP10NL, the topographic map of the Netherlands
    and OpenStreetMap (OSM), the VGI type of map have been chosen for this
    purpose. The object matching process in this research became more critical
    as OSM does not always follow strict rules. Therefore, to overcome the
    complications special care has been taken into account on the characteristics
    of these two datasets and have been incorporated in the object matching
    process. Knowledge from previous studies in this field has been explored
    and adapted in this study. As TOP10NL and OSM represent completely different
    type of datamodels, a schema translation had to be done to harmonise them.
    The average geometric accuracy of TOP10NL is ±2 meter, whereas the quality
    of OSM is uncertain over locations. Therefore the quality of the OSM dataset
    over the study areas was also judged before developing the object matching
    model by some quality measures of geographic maps. Only the quality measures
    ‘data lineage’, ‘completeness’ and ‘positional accuracy’ were considered
    in this study. The data lineage shows that both datasets share quite a
    large number of objects from the same origin. It was found that the road,
    railway and building objects were quite complete in the OSM dataset over
    the study areas whereas the water objects were quite incomplete. Because
    of the reliable data lineage of the OSM data over the Netherlands the
    positional accuracy of the OSM data were found to be quite good. Considering
    the geographic location and the importance four areas within the Netherlands
    were chosen for the experiments. The urbanised Delft and Rotterdam, semi-urbanised
    Dokkum and the rural part of Echt were selected for the experiments. The
    common features within both TOP10NL and OSM, which are road, building,
    water and railway, were considered for the experiments. Two different
    object matching models were developed for line and polygon objects. For
    both models the decision rule was developed considering the characteristics
    of the datasets used in this study. For line matching the decision rule
    was developed to make the list of best matched pairs by accumulating them
    in a step by step procedure, whereas a straight forward simple rule has
    been developed for polygon matching process. These models were verified
    with the different object class data of the different study areas. The
    accuracy was high and for more than 90% instances the correct match was
    found. In the road matching process it was possible to insert the ‘street
    names’ from the OSM database as an attribute in the road network database
    of TOP10NL. A number of matching tables have been formed for different
    cardinality of matched objects which may be useful in the future in an
    automatic updating process of TOP10NL and OSM.
  uuid: e1501114-d947-4278-8612-1e249e4dc02f
  needs_review: true
- surname: Commandeur
  name: Tom
  title: Footprint decomposition combined with point cloud segmentation for
    producing valid 3D models
  supervisors: Hugo Ledoux; Peter van Oosterom
  year: 2012
  link: https://resolver.tudelft.nl/uuid:c0c665f7-0254-42c6-895b-cb59acc079f2
  image: 2012_Commandeur.jpg
  abstract: 'For the creation of three-dimensional (3D) city models, extrusion
    of building footprints is widely applied. Extrusion results in block shaped
    buildings. The main problem with these 3D models is that they do not represent
    height differences within a building. This thesis presents a method to
    improve building footprints by subdivision into parts describing height
    differences and roof shapes. These improved building footprints are used
    for creating 3D models by separate extrusion of each of these parts. Applying
    this method results in 3D building models with multiple heights. Several
    subjects are discussed in this thesis: generalization, decomposition,
    segmentation, 3D geometry reconstruction and their validation. This research
    is based on the combination of two existing methods, one for generalization
    and decomposition of building footprints, and one for segmentation of
    point clouds. These methods are extended and problems are solved by including:
    (1) direction of lines, (2) best fitting line, (3) adjacent buildings,
    (4) preservation of holes, (5) handling of slant lines, (6) quality statistics
    and (7) validation. The existing generalization method creates topology
    errors which are reduced by including knowledge from adjacent buildings.
    Decomposed building footprints are merged based on the segmented point
    cloud. The resulting decomposition is a subdivision describing multiple
    roof shapes and height jumps, based on linear features in the building
    footprint. Reconstruction of the actual 3D geometry is performed by extrusion
    of the decomposition cells. The resulting reconstruction is a Level of
    Detail 1 (LoD) model with height differences. To test the usability of
    the improved footprints for reconstruction of a LoD2 model, parametric
    shape fitting is applied. These tests are executed using a small set of
    roof shapes proving the usability. All reconstructed 3D building geometries
    are validated using Oracle Spatial 11g. In order to analyze, test and
    improve the developed algorithms, a prototype is implemented in C++. This
    prototype is tested intensively with several real-world data sets. Results
    from these tests are proving proper functioning of the developed method
    and support the conclusions.'
  uuid: c0c665f7-0254-42c6-895b-cb59acc079f2
  needs_review: true
- surname: Guerrero Iñiguez
  name: Josafat Isaí
  title: Three-dimensional reconstruction of underground utilities for real-time
    visualization
  supervisors: Sisi Zlatanova; Martijn Meijers; Erik Jansen
  year: 2012
  link: https://resolver.tudelft.nl/uuid:b7f43166-c138-475f-8490-b1f28ed1383d
  image: 2012_Guerrero-Iniguez.jpg
  abstract: This research discusses the conversion of underground utilities
    datasets into scene graph models for its 3D visualization using the WebGL
    technology, which is a Javascript interface to access the 3D graphics
    hardware. This conversion requires to reconstruct the volumetric appearance
    of the objects from its abstract representation, involving several decisions
    towards its mapping into a scene graph. Each decision taken carries consequences
    in the rendering performance and given the nature of the underground utilities,
    multiple problems arise which should be addressed before achieving a fluid
    visual- ization. This research considers multiple reconstruction approaches
    and studies the corresponding factors affecting the performance by introducing
    a testing framework. With the results of the tests, the considered factors
    are ranked based on their performance and used to give advice towards
    the best approaches for the reconstruction underground utilities and its
    applicability to WebGL environments.
  uuid: b7f43166-c138-475f-8490-b1f28ed1383d
  needs_review: true
- surname: Koudijs
  name: Marjolein
  title: Using ICESat/GLAS laser altimetry for water level estimations in
    the Mekong River
  supervisors: Roderik Lindenbergh; Massimo Menenti
  year: 2012
  link: https://resolver.tudelft.nl/uuid:6b269952-3000-4d26-8690-d8a4d553c47e
  image: 2012_Koudijs.jpg
  abstract: This study evaluates the potential of the Ice, Cloud and Elevation
    Satellite (ICESat) with the onboard Geoscience Laser Altimeter System
    (GLAS) instrument for the monitoring of water levels in river networks.
    The determination of water level estimations with GLAS altimetry data
    in the Mekong River (Southeast Asia) is evaluated. The research questions
    in this study aimed to develop a classification method to derive water
    level estimations and eventually water level trends in the Mekong River.
    Furthermore, the strengths and weaknesses of GLAS altimetry data for hydrological
    monitoring of water levels in the Mekong River are evaluated.
  uuid: 6b269952-3000-4d26-8690-d8a4d553c47e
  needs_review: true
- surname: Nedkov
  name: Simeon
  title: Knowledge-based optimisation of three-dimensional city models for
    car navigation devices
  supervisors: Hugo Ledoux
  year: 2012
  link: https://resolver.tudelft.nl/uuid:b429e899-9955-4a23-9ceb-66ffb6210b30
  image: 2012_Nedkov.jpg
  abstract: 'Three-dimensional maps are deemed better for navigation purposes
    as they offer a larger number and more realistic navigation cues than
    two-dimensional maps. Improvements in two key technologies have opened
    the doors towards utilization of 3D maps for car navigation devices. Advances
    in data acquisition technologies and data processing methods have made
    creating photorealistic three-dimensional city models cheaper and to a
    large extent automatic, while advances in mobile technologies have made
    e.g. modern smartphones powerful enough to visualize photorealistic 3D
    graphics. Despite the latter improvements, making three-dimensional mobile
    maps remains a challenge due to the large amounts of data and the device’s
    limited amount of memory and pro- cessing power. These limitations can
    be overcome by intelligently reducing the amount of information that is
    handled and displayed by the device. This thesis presents an information
    reduction and prototyping framework that reduces the amount of information
    contained in city models so a to enable their loading and display on car
    navigation devices. The information reduction method consists of two steps.
    The first step selects buildings that are close to the driver’s route
    with the idea that these aid the driver in navigating. Buildings that
    are far from the route are discarded. In the second step, the selected
    buildings’ external representation is adapted to match their navigational
    value that is based on their thematic, semantic and cognitive properties.
    For instance, a building of type ’restaurant’ and ’brand’ McDonald’s offers
    more navigational cues than a block of gray, anonymous residential buildings.
    The latter are styled in generic textures whereas the former is styled
    in photorealistic textures. The relations between a building’s semantic
    and thematic properties and its external representation are captured in
    visualisation rules. A prototype is built that implements the designed
    information reduction methods and tests their effectivity. The selection
    step is performed using a spatial database while the visualisation rules
    are processed by an expert system. The reduced 3D scenes are displayed
    in a game engine that also performs performance measurements. The obtained
    results are conclusive: the performance of a visualisaion in terms of
    frame rate and used graphics memory is governed by the the amount of textures,
    much more so than the number of geometries. Effort should therefore be
    directed towards the reduction and/or simplification of textures rather
    than geometries.'
  uuid: b429e899-9955-4a23-9ceb-66ffb6210b30
  needs_review: true
- surname: Peters
  name: Ravi
  title: A Voronoi- and surface-based approach for the automatic generation
    of depth-contours for hydrographic charts
  supervisors: Hugo Ledoux
  year: 2012
  link: https://resolver.tudelft.nl/uuid:5977a99b-0875-44b4-abe1-09288bf2aed1
  image: 2012_Peters.jpg
  abstract: 'Depth-contours are an essential part of any hydrographic chart—a
    map of a waterbody intended for safe ship navigation. Traditionally these
    were manually drawn by skilled hydrographers from a limited set of surveyed
    depth measurements. Nowadays this process of map making is shifted towards
    the digital domain, not in the last place because of the huge amounts
    of data resulting from modern surveying techniques. Furthermore, the task
    of automating the process of cartographic generalization that depends
    on subjective criteria is challenging. The produced depth-contours should
    comply with the four hydrographic generalization constraints of safety,
    legibility (smoothness), topology and waterbody morphology. I show that
    grid-based approaches to generalize depth contours that are currently
    used in practice do not always comply with those fundamental generalization
    constraints. Most notably, the safety constraint, that ensures that a
    map never indicates an area as being shallower than measured, is often
    violated. But also the legibility and morphology constraints are not always
    optimally respected. Furthermore, heterogeneous datasets (that contain
    a transition of very sparse to very dense data), can lead to unwished
    interpolation artifacts, when the popular Inverse Distance Weighting (IDW)
    spatial interpolation method is used. Part of this problem is the non-adaptive
    nature of IDW, that requires the user to re-set the interpolation parameters
    when the spatial distribution of the input point changes. I present and
    prototype a novel surface-based approach for the generalization of hydrographic
    depth-contours that is based on the Voronoi Diagram (VD) and performs
    generalization on the surface that defines the contours, rather on the
    contour lines individually. Through the VD, a fully adaptive, automatic
    and smooth spatial interpolation method known as the Laplace interpolant
    is coupled with a Delaunay Triangulation (DT) data structure that contains
    all data points with their exact planimetric coordinates. Using this concept
    a number of operators is defined that are able to perform the relevant
    cartographic generalization operations for hydrographic contours: simplification,
    smoothing, aggregation, omission and enlargement. The significance of
    the proposed approach lies herein that it honors all four hydrographic
    generalization constraints, most notably: it is guaranteed to be safe.
    As opposed to current automated approaches, it does therefore not require
    any form of manual safety verification. And, because all of the employed
    algorithms are local, it is also well scalable to big datasets in principle.'
  uuid: 5977a99b-0875-44b4-abe1-09288bf2aed1
