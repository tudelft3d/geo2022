- surname: Beeren
  name: Michel
  title: Improving 3D alpha wrapping by preserving concave features and reducing
    mesh complexity
  supervisors: Clara García Sánchez; Hugo Ledoux
  year: 2026
  graduation_date: '2026-06-26'
  link: https://resolver.tudelft.nl/uuid:a3876cb2-8740-4277-9292-d4f113de97b4
  image: 2026_Beeren.jpg
  github: https://github.com/michelbeeren/MSc_Geomatics_Thesis_3D_alpha_wrap
  abstract: 'CGAL’s 3D Alpha Wrap robustly produces valid enclosing meshes
    for defective input using two parameters: α, which controls the carving-ball
    size, and δ, an offset that controls the distance between the input and
    the output surface vertices. However, preserving sharp concave features
    often requires a small global α-value, which also increases refinement
    in regions where additional vertices do not substantially improve the
    approximation. This paper proposes a 𝜏-guided extension that adds a local
    face-to-input distance criterion to the original algorithm. The new parameter
    𝜏 triggers additional refinement only where the current wrap remains locally
    too far from the input. To make this refinement effective near concave
    features, we introduce R3 as an additional vertex-insertion strategy alongside
    the two insertion strategies of the original algorithm. R3 aims to place
    new vertices more directly near sharp concave features, whereas the original
    two insertion strategies may reach comparable vertex positions only after
    repeated refinement. The extension preserves the carving-based structure
    of the original algorithm, and we prove that the guarantees of termination,
    strict enclosure, watertightness, and manifoldness still hold. Experiments
    on 3D BAG building data show that the proposed method improves both average
    and local approximation quality, achieving lower directed Chamfer distances
    with fewer output faces than the original algorithm. Although R3 is less
    time efficient per insertion, it places vertices more effectively near
    concave features, so fewer insertions are needed to reach lower approximation
    errors. As a result, the proposed method can reduce runtime in the tested
    use case.'
  uuid: a3876cb2-8740-4277-9292-d4f113de97b4
- surname: Bi
  name: Xinya
  title: Recovering Visual Saliency from Intrinsic Properties of 3D Gaussian
    Splatting
  supervisors: Martijn Meijers; Liangliang Nan
  year: 2026
  graduation_date: '2026-06-17'
  link: https://resolver.tudelft.nl/uuid:d1148812-2a69-4d6b-b956-9560897e8b1d
  image: 2026_Bi.jpg
  github: https://github.com/MaxineXinyaBi/3DGS_Pruning
  abstract: '3D Gaussian Splatting (3DGS) represents scenes as collections
    of Gaussian primitives whose attributes are shaped by multi-view photographic
    supervision. This raises a natural question: does the photographer’s visual
    focus leave a measurable imprint on these intrinsic properties? While
    prior work has explored segmentation and scene decomposition in 3DGS,
    no existing method has investigated whether Gaussian attributes alone
    encode visual saliency. We propose a mask-free, post hoc classifier that
    recovers the photographer’s region of interest from Gaussian attributes,
    requiring neither the original training images nor any 2D foundation model.
    Trained on scenes from Tanks and Temples and MipNeRF360, our method achieves
    a mean LOOCV F1 of 0.957 and generalizes to unseen scenes with a mean
    test F1 of 0.929. Projected 3D saliency masks show strong alignment with
    U2-Net predictions on original training images, confirming that multi-view
    Gaussian intrinsic properties capture a geometrically consistent, view-stable
    notion of saliency that single-frame 2D methods cannot provide. These
    properties make our method applicable to automatic foreground extraction,
    capture intent analysis, and perceptual quality-driven compression for
    bandwidth-efficient streaming.'
