- surname: van Ree
  name: Jane Margaret
  title: Determination of the precision and reliability parameters of terrestrial
    laser scanners by creating a practical experiment set-up
  supervisors: Roderik Lindenbergh; Alexander Bucksch
  year: 2006
  link: https://resolver.tudelft.nl/uuid:071ea771-7bb0-4914-b97e-1e2294affe71
  image: 2006_van-Ree.jpg
  uuid: 071ea771-7bb0-4914-b97e-1e2294affe71
