  name: Myron
  title: Solid CAD Geometries in a Spatial DBMS - An Application in the Petrochemical
    Industry
  year: 2015
  link: https://resolver.tudelft.nl/uuid:2b5044e5-388d-47ee-bb13-65bec9443070
