- surname: Manden
  name: Bart
  title: Impact of building model voxel resolution in wind simulations using
    RANS
  supervisors: Clara García Sánchez; Jasper van der Vaart
  year: 2025
  graduation_date: '2025-10-29'
  link: https://resolver.tudelft.nl/uuid:7f192b96-9d07-4445-bbf7-376d00f6621e
  image: 2025_Manden.jpg
  abstract: Computational Fluid Dynamics (CFD) is widely used to analyse wind
    flow around buildings; however, creating detailed input geometries and
    corresponding meshes can be a time-consuming process. This thesis investigates
    voxelization as a means to simplify building models for their use in CFD
    and analyses the impact of voxel resolution on simulation accuracy. Three
    building geometries with varying roof shapes and footprints were converted
    from detailed continuous models into voxel models with increasingly finer
    voxel resolutions. The voxelized models were compared to a non-voxelized
    LoD 3.2 model to assess accuracy under four key wind directions (90°,
    45°, 22.5°, and 0°). The CFD simulations were performed using OpenFOAM’s
    RANS solver with a $k–\epsilon$ turbulence model. Due to its higher computational
    efficiency compared to other turbulence-resolving frameworks, the RANS
    approach enabled a large number of simulations while maintaining sufficient
    accuracy for urban CFD applications. A grid-independence test was conducted
    using the Grid Convergence Index (GCI) method for one model. The resulting
    grid-independent mesh was then scaled for the other models, ensuring that
    all simulations remained grid-independent. The results show that coarse
    voxel resolutions (1 m and 0.5 m) significantly increase the size of the
    building geometry and leads to large velocity differences compared to
    the non-voxelized model. Sloped roofs were most affected by voxelization,
    as these models showed greater velocity differences than those with rounded
    roofs. Wind direction also plays a significant role in voxelization accuracy.
    While the 90°, 22.5°, and 0° wind directions showed similar results across
    voxel resolutions, the 45° direction produced notable velocity differences.
    An exception was observed for the model with a rounded roof, which showed
    more consistent results across all wind directions. Overall, the velocity
    difference between non-voxelized and voxelized models decreases as voxel
    size decreases. However, below a voxel size of 0.1 m, the reduction in
    velocity difference stagnates, indicating that smaller voxel sizes offer
    limited additional benefit to CFD accuracy.
  uuid: 7f192b96-9d07-4445-bbf7-376d00f6621e
  needs_review: true
- surname: Martinez
  name: Javier
  title: Rock and soil classification using thermal and SAR data in deep learning
    models
  supervisors: Azarakhsh Rafiee; Rémi Charton
  year: 2025
  graduation_date: '2025-10-27'
  link: https://resolver.tudelft.nl/uuid:cb2d5329-61a2-400e-b311-0cc278537de0
  image: 2025_Martinez.jpg
  abstract: Fields like geology, mining, and construction have long relied
    on manual rock and soil classification methods, which remain time-consuming
    and labour-intensive. Accurate rock and soil classification is necessary
    for hazard assessment, urban management or resource exploration, which
    the rapid advances in artificial intelligence and remote sensing might
    facilitate. Though optical imagery has dominated remote sensing in the
    last decades, thermal data offers unique advantages such as sensitivity
    to material properties, sunlight independence or seasonal and diurnal
    changes responsiveness. This study explores the use of thermal imagery,
    along with SAR and NDVI data as complementary data, to leverage and automate
    the classification process with deep learning. Therefore, the aim is to
    develop two deep learning models capable of rock and soil segmentation
    with multi-modal datasets, and evaluate the performance of these models,
    Convolutional Neural Networks (CNNs) and Convolutional Long Short-Term
    Memory networks (ConvLSTMs) across diurnal, seasonal and multi-source
    scenarios as well as the effect of vegetation on the prediction results.
    Results show CNN tends to have a strong overall performance, especially
    with thermal and SAR data. Instead, ConvLSTM excels at capturing temporal
    dependencies, improving the classification of most datasets and variations.
    The findings demonstrate the potential of thermal imagery to be used as
    a powerful classification tool when combined with deep learning methods
    for rocks and soils. They also demonstrate the slightly negative influence
    of vegetation on the predictability of the outputs. By combining spatial
    and temporal dynamics, the models offer an automated, scalable, fast and
    cost-effective approach to more traditional workflows. This work intends
    to contribute towards modernizing geological practices for more informed
    decision-making in geology, mining, urban planning, hazard and resource
    management.
  uuid: cb2d5329-61a2-400e-b311-0cc278537de0
- surname: Michalas
  name: Michail
  title: Super-Resolution for Enhanced Aerial Imagery
  supervisors: Martijn Meijers; Azarakhsh Rafiee
  year: 2025
  graduation_date: '2025-06-30'
  link: https://resolver.tudelft.nl/uuid:455a295d-715c-4c90-b0ad-1a04e02d4038
  image: 2025_Michalas.jpg
  abstract: 'High-resolution aerial imagery plays a critical role in urban
    planning, energy mapping, and land-use classification. However, many datasets
    remain limited to lower resolutions due to acquisition costs or legacy
    data sources. Super-resolution (SR) techniques offer a means to enhance
    25 cm aerial imagery to 8 cm, making it more suitable for object-level
    analysis. This thesis investigates the capability of a modified SRGAN
    architecture to enhance the visual and structural fidelity of aerial images,
    thereby improving the representation of urban features such as rooftops,
    dormers, and solar panels. The architecture incorporates an EdgeMaskBlock
    to improve edge awareness and preserve sharp contours in reconstructed
    imagery. To address the challenges of spatial complexity and temporal
    misalignment, a two-phase training strategy is implemented. First, the
    model is trained on synthetically downsampled HR-LR pairs to establish
    a robust initialization. This is followed by fine-tuning on real-world
    25 cm inputs mis- aligned with their 8 cm HR counterparts, enabling the
    model to generalize under realistic and variable acquisition conditions.
    Evaluation is conducted across both training iterations using standard
    image quality metrics (PSNR, SSIM, LPIPS), along with downstream segmentation
    benchmarks. For Iteration 2, the gen- eralization capability of the model
    is assessed across new cities and seasonal conditions. Two segmen- tation
    pipelines are used: the Segment Anything Model (SAM) and the operational
    semantic segmen- tation system developed by Readar B.V., which detects
    buildings, dormers, and PV panels using both RGB and DSM data. Metrics
    such as precision, recall, and F1-score demonstrate that super-resolved
    outputs significantly outperform bicubic upsampling, particularly for
    fine-scale rooftop objects. The results show that the proposed SRGAN model
    improves perceptual quality while enabling effective domain transfer across
    seasons. These enhancements contribute to more reliable segmentation outputs,
    reinforcing the potential of GAN-based super-resolution as a practical
    tool in geospatial workflows that require fine-grained object recognition.'
  uuid: 455a295d-715c-4c90-b0ad-1a04e02d4038
- surname: Monahan
  name: Jessica
  title: 'Cool by Design. SOLFD: Extending SOLWEIG for Urban Design Decision-Making
    on Outdoor Thermal Comfort'
  supervisors: Clara García Sánchez; Hugo Ledoux
  year: 2025
  graduation_date: '2025-06-19'
  link: https://resolver.tudelft.nl/uuid:02dbba26-0535-4c05-a39b-e5b09c3d0712
  image: 2025_Monahan.jpg
  github: https://github.com/jsscmnhn/SOLWEIG_SOLFD
  abstract: 'As urbanization and climate change intensify, managing the urban
    microclimate becomes increasingly challenging, affecting outdoor thermal
    comfort. The practical integration of urban microclimate research into
    urban design remains limited, in part due to the complexity and inaccessibility
    of existing tools. To support early-stage, climate-sensitive urban design
    at the neighbourhood scale, I present SOLWEIG For Design (SOLFD): a computation
    framework that builds on the existing SOLWEIG tool. SOLFD enables urban
    designers to visualize current microclimatic conditions and assess the
    impact of design interventions on outdoor thermal comfort. In particular,
    it focuses specifically on (in)direct solar radiation and its effect as
    quantified by the mean radiant temperature. Key contributions include:
    (1) extending SOLWEIG’s 2.5D model to a layered 3D representation for
    improved accuracy in complex urban geometries; (2) automating the data
    pipeline using open Dutch geospatial datasets; (3) enabling the modification
    of the existing urban scene; (4) enhancing output usability through temporally
    grouped mean radiant temperature maps, derived physiological equivalent
    temperature maps, and comparison statistics; and (5) significantly reducing
    simulation time with GPU acceleration. The accuracy of SOLFD was validated
    using sensor data, achieving an RMSE of 5.39°C. Underneath structures,
    the RMSE increases to 5.83 °C. The potential of SOLFD is further demonstrated
    with a case study across various Dutch urban typologies. By laying the
    foundation for an accessible decision-support tool for outdoor thermal
    comfort, SOLFD takes a step toward integrating climate-responsive strategies
    into the urban design process.'
  uuid: 02dbba26-0535-4c05-a39b-e5b09c3d0712
- surname: Mouzakidis
  name: Dimitrios
  title: LADM-based 3D system for Archaeological Site Information Registration
  supervisors: Peter van Oosterom; Eftychia Kalogianni; Robert Voûte
  year: 2025
  graduation_date: '2025-10-30'
  link: https://resolver.tudelft.nl/uuid:a89624a8-015f-426f-86e9-95cb5fa68d46
  image: 2025_Mouzakidis.jpg
  abstract: This thesis develops an LADM-based (ISO 19152-2) profile for the
    legal registration and management of archaeological heritage in three
    dimensions. The research addresses the need to represent rights, restrictions,
    and responsibilities of protected sites while capturing their full vertical
    extent and linking them to cadastral information. A structured Design
    Science Research methodology guided the work from problem definition to
    model design. The resulting archaeological profile extends the core LADM
    packages, namely Party, Administrative, Spatial Unit, and Surveying and
    Representation, to meet archaeological requirements. Point clouds are
    integrated into the model to represent archaeological spatial units in
    3D, ensuring that the geometry of protected areas can be recorded and
    maintained with high precision. The archaeological profile demonstrates
    that the LADM standard can accommodate archaeological contexts by unifying
    legal, spatial, and survey information in a single framework. This work
    provides a comprehensive, conceptual, and database-ready model that enables
    accurate 3D registration, querying, and visualization of archaeological
    sites and offers a solid foundation for future cross-jurisdictional and
    international applications.
  uuid: a89624a8-015f-426f-86e9-95cb5fa68d46
- surname: Rahmawati
  name: Adhisye
  title: 'Scenario-based energy simulation: Modelling tree planting strategy
    to reduce heating and cooling demand under 2050 climate conditions'
  supervisors: Giorgio Agugiaro; Weixiao Gao
  year: 2025
  graduation_date: '2025-10-30'
  link: https://resolver.tudelft.nl/uuid:bf97005e-bd6c-4d76-b5e8-91a94c40d99f
  image: 2025_Rahmawati.jpg
  abstract: 'In recent years, rising energy demand and intensifying climate
    change impacts have placed urban energy systems under growing pressure.
    Higher average temperatures and more frequent heatwaves are projected
    to substantially increase cooling demand. UBEM offers a means to analyse
    such dynamics at the district scale; however, vegetation effects on building
    energy use remain under-represented. Existing approaches often rely on
    multiple coupled models, apply to small spatial extents, or omit future
    climate scenarios, thereby limiting their usefulness for urban planning
    and climate adaptation strategies. In this thesis, we introduce a neighbourhood-scale
    workflow that integrates a tree planting scenario into a single simulation-based
    UBEM platform. The main characteristic of the method lies in its use of
    standardised CityGML building models, simplified yet seasonally dynamic
    vegetation representations, and a unified modelling environment that allows
    consistent comparison of a planting strategy under both current and projected
    2050 climate conditions. Six scenarios were applied to two contrasting
    Rotterdam neighbourhoods to quantify heating and cooling demand at building
    and neighbourhood levels while separating climate-driven changes from
    vegetation impacts. Results indicate that, between 2023 and 2050, cooling
    demand increases by 32–39%, while heating demand decreases by approximately
    12%. Adding deciduous trees reduces neighbourhood cooling demand by 3–10%,
    depending on location and climate scenario, but winter shading introduces
    heating penalties of up to 2%, leading to small net annual changes at
    the neighbourhood scale (0.9 to 0.4%). Building-level effects are more
    heterogeneous: in compact districts, additional trees sometimes block
    limited winter solar gains, while in open areas with high cooling exposure,
    they consistently reduce peak summer loads. Orientation and facade exposure
    emerge as key factors shaping the balance between summer benefits and
    winter penalties. The workflow produces spatially explicit maps and scenario
    comparisons to support an energy-aware, location-specific planting strategy.
    However, simplified tree geometry, static building stock assumptions,
    monthly climate inputs, and computational limits constrain the accuracy
    and scalability of the results. Future research should integrate hourly
    climate data, species specific vegetation models, dynamic retrofitting
    scenarios, and larger spatial domains to better capture seasonal variability,
    urban morphological diversity, and the inter actions between greening
    and energy system decarbonisation pathways.'
  uuid: bf97005e-bd6c-4d76-b5e8-91a94c40d99f
- surname: Tarczyński
  name: Rafał Marek
  title: 'ST-SimNet: A Spatio-Temporal Graph Neural Network for Urban Freight
    Forecasting'
  supervisors: Martijn Meijers; Azarakhsh Rafiee
  year: 2025
  graduation_date: '2025-06-18'
  link: https://resolver.tudelft.nl/uuid:0cbc8705-3017-4887-9283-5607a5e691c1
  image: 2025_Tarczynski.jpg
  abstract: Urban freight transport is a critical yet complex component of
    city logistics, shaped not only by transport networks but also by the
    morphological structure of urban areas. Traditional forecasting models
    often neglect this spatial heterogeneity, relying primarily on traffic
    counts or infrastructure topology. This thesis proposes and evaluates
    ST-SimNet, a Spatio-Temporal Simulation Network designed to enhance freight
    flow prediction by integrating static urban morphology descriptors with
    dynamic freight data in a graph neural network framework. Focusing on
    the city of Amsterdam, the study explores the extent to which detailed
    urban morphology, including building features, land use, and spatial layout,
    can improve short-term freight flow forecasts at the road network level.
    Results demonstrate that incorporating static features significantly reduces
    error variance, improves peak hour prediction, and enhances node-level
    stability compared to dynamic-only baselines. Furthermore, analysis reveals
    that nodes with richer morphology information benefit most, while areas
    with sparse or noisy static features experience challenges that highlight
    opportunities for future refinement. The findings offer practical insights
    for integrating machine learning into digital twin platforms for urban
    mobility, providing a data-driven, spatially aware layer for freight forecasting
    in operational city planning systems. Limitations and future directions,
    including adaptive fusion mechanisms and cross-city generalisation, are
    discussed. Overall, ST-SimNet advances the integration of urban morphology
    into spatio-temporal predictive models and demonstrates its practical
    relevance for modern freight planning in complex urban environments.
  uuid: 0cbc8705-3017-4887-9283-5607a5e691c1
- surname: Tew
  name: Shawn Roy How Wei
  title: Leveraging Street Level Predictive Modelling with Green Infrastructure
    for Urban Resilience
  supervisors: Daniele Cannatella; Claudiu Forgaci
  year: 2025
  graduation_date: '2025-06-16'
  link: https://resolver.tudelft.nl/uuid:aeca557e-a350-45af-9427-d7a503416129
  image: 2025_Tew.jpg
  abstract: Urban resilience is an evergrowing issue as cities face environmental,
    social and infrastructural challenges. Green infrastructure is currently
    being used as one of the main approaches in achieving urban resilience
    by providing multifunctional benefits, such as improving microclimate,
    enhancing biodiversity, and increasing accessibility to nature. However,
    through this process the evaluation and optimisation of green infrastructure
    at the street level remains a methodological challenge, particularly in
    the case of integrating multi dimensional indicators into predictive models
    using nature based solutions. This study develops a machine learning based
    framework in order to assess and optimise green infrastructure in urban
    areas at a street level scale. Through the use of publicly available spatial
    datasets on environmental, biodiversity and morphological factors, the
    project constructs a comprehensive dataset incorporating factors such
    as urban heat islands, green infrastructure distribution, and green space
    accessibility. Modelling techniques such as gradient boosting regression
    and random forest regression are employed as a regression technique to
    predict urban resilience related targets. These will provide insights
    into how resilient different areas of Rotterdam can be. By focusing on
    the study at a street level approach, this study aims to offer a comprehensive
    understanding of green infrastructure effectiveness at a high resolution,
    providing urban planners with data driven recommendations for optimising
    and implementing green infrastructure solutions to areas in need. The
    findings of this research aim to contribute by bridging gaps in green
    infrastructure assessment by integrating geospatial data, network based
    spatial analysis, with machine learning, to assist in decision making
    to make urban areas more resilient.
  uuid: aeca557e-a350-45af-9427-d7a503416129
  needs_review: true
- surname: Tsalapati
  name: Victoria
  title: Assessing The Impact of Tree 3D Representations on Urban Daylight
    Simulation Based on Airborne Laser Scanning Point Cloud Data
  supervisors: Azarakhsh Rafiee; Eleonora Brembilla
  year: 2025
  graduation_date: '2025-10-27'
  link: https://resolver.tudelft.nl/uuid:3de9d68a-c565-450e-9d0a-742c94f312c4
  image: 2025_Tsalapati.jpg
  abstract: Daylight is a significant factor in the decision-making process
    of urban planners and architects when intervening in an urban environment.
    A considerable element in such a complex environment, assessed in daylight
    simulations, is greenery, particularly trees, due to their interaction
    with sunlight and their shading effects. This thesis investigates the
    impact of diverse tree 3D representations produced by Actueel Hoogtebestand
    Nederland (AHN) point cloud data when performing daylight simulation on
    scenes integrating them. The assessed tree 3D representations are point
    cloud based representation using small cubes instead of the points from
    the original point cloud, voxels, alpha shapes of individual trees, and
    convex hull of branch points. The tool for the daylight simulation was
    the Daylight Availability Workflow of Climate Studio plugin in Rhino software
    which produces time series of simulated illuminance values based on the
    location and the local solar data, the scene, the material properties
    of the objects of the scene and surface on which simulation is performed.
    Specifically, regarding the assigned materials for the voxel presentation,
    two approaches were followed; one related to the predefined opaque material
    properties in Rhino software and the other to transparent materials defined
    by the density point inside a voxel. The reference of the simulations
    was a dataset of actual illuminance values recorded by the sensor located
    on the west facade of the CCC building, where is the position that the
    simulation was conducted. Also, to examine how the seasonal changes influence
    the simulation results, simulations for two months, February and June,
    were performed. For the June simulations, a synthesized point cloud was
    generated by combining the AHN points with additional points representing
    the tree canopy. Next, results from all days in both months the results
    showed that the point cloud based representation caused a significant
    overestimation of simulated illuminance values, whereas the Alpha Shape
    and Convex Hull representations resulted in underestimation. In contrast,
    the simulation outcomes for voxel representations depended on their material
    properties (opaque or transparent), spatial allocation, and size. It was
    proven that for February via the voxel representations of sizes close
    to 0.10 m there was the best fit between simulations and sensor data,
    yet it is not clear which voxel material is the most optimal for all the
    different sky conditions. However, in June the simulations were not as
    accurate as in February, as the synthesized point cloud representation
    probably did not include a sufficient number of points and as the simulation
    system performed less accurately for days under clear sky conditions.
    Consequently, the study demonstrates that voxel representations with sizes
    around 0.10 m provide the most reliable results for tree modeling in daylight
    simulations in February, while clarifying the limitations that gave rise
    to to the poorer performance of alternative representations and of June
    simulations.
  uuid: 3de9d68a-c565-450e-9d0a-742c94f312c4
- surname: Tsipa
  name: Eirini Chrysovalantou
  title: Usability of the vario-scale approach in interactive and dynamic
    mapping
  supervisors: Martijn Meijers; Peter van Oosterom
  year: 2025
  graduation_date: '2025-01-15'
  link: https://resolver.tudelft.nl/uuid:39932cfe-97d0-40ee-a071-55d31e7b5d0c
  image: 2025_Tsipa.jpg
  abstract: This thesis explores methods to enhance the usability of vario-scale
    maps, focusing on user interaction, cognitive load, and overall satisfaction.
    Vario-scale maps, based on a continuous zooming approach introduced by
    Van Oosterom and Meijers, aim to reduce visual disruptions by allowing
    smooth generalisation of geographic data in real time. The research highlights
    their potential to merge precision and aesthetic clarity wxhile advancing
    beyond the conventional snapping behaviour inherent in multi-scale interfaces.
    A mixed-method approach was adopted to investigate whether vario-scale
    maps could improve navigation and user satisfaction. Data were collected
    through a pilot web-based usability study, followed by a laboratory eye-tracking
    study designed to capture detailed behavioural and cognitive processes.
    Quantitative metrics, such as fixation counts and scanpath lengths, were
    analysed to determine efficiency in map-use tasks, while think-aloud protocols
    and questionnaires provided qualitative insights into participant preferences
    and frustrations. Findings indicate that vario-scale and multi-scale maps
    offer similar levels of efficiency based on objective eye-tracking metrics.
    However, participants generally reported higher satisfaction with vario-scale
    maps, citing smoother transitions, less visual interruption, and a more
    intuitive zooming experience. The pilot study underscored the importance
    of user familiarity with Cartography, the careful placement of icons,
    and task complexity as influential factors in map usability. These insights
    informed the final study, which showed that vario-scale maps align more
    closely with user expectations for modern digital interfaces. By emphasising
    controlled task design, participant comfort, and iterative refinement
    through pilot testing, this thesis demonstrates how vario-scale maps can
    be optimised for enhanced usability. The results further suggest that
    leveraging cartographic principles—such as appropriate symbol density-plays
    an essential role in maintaining clarity and facilitating user orientation.
    Through comprehensive analysis of both objective metrics and subjective
    evaluations, this thesis provides evidence that improving vario-scale
    usability is both feasible and beneficial. Future research with broader
    user demographics and extended usage contexts is recommended to validate
    and refine the proposed design strategies, ultimately supporting a wider
    adoption of vario-scale technology for interactive and dynamic mapping
    applications.
  uuid: 39932cfe-97d0-40ee-a071-55d31e7b5d0c
- surname: van Arnhem
  name: Marieke
  title: 'Detecting Structural Building Changes from Bitemporal Point Cloud
    Datasets with a Certainty Index – Case Study: AHN and Rotterdam Datasets'
  supervisors: Edward Verbree; Peter van Oosterom
  year: 2025
  graduation_date: '2025-06-26'
  link: https://resolver.tudelft.nl/uuid:b1526eae-f17d-497c-a741-f4528479b03b
  image: 2025_van-Arnhem.jpg
  abstract: Up-to-date 3D data is essential for urban planning, building inspections,
    and monitoring changes in the built environment. While 2D aerial imagery
    is widely used, it lacks height information and is sensitive to shadows
    and seasonal effects. In contrast, 3D point clouds provide detailed spatial
    information and enables better interpretation. This thesis presents a
    method for detecting structural building changes using bitemporal airborne
    laser scanning (ALS) data from the national height model of the Netherlands
    (AHN) and the Rotterdam municipality. These datasets are pre-aligned in
    the stelsel van de rijksdriehoeksmeting (RD)-normaal Amsterdams peil (NAP)
    coordinate system and include building classifications, which allows the
    focus of this research to be placed directly on detecting change. Comparing
    point clouds from different time epochs is challenging due to differences
    in density, noise, occlusion, and scan geometry. To address this, a random
    forest (RF)-based classifier is trained on synthetically generated urban
    scenes that simulate realistic change scenarios. These synthetic scenes
    are made with different scanning parameters, incorporating diversity in
    the training dataset. A certainty index is introduced that combines the
    model’s probability output with occlusion visibility across both epochs,
    providing a confidence measure for each prediction. The method is applied
    to real AHN and Rotterdam datasets. Since no labelled ground truth is
    available, results are evaluated visually. The method successfully identifies
    structural changes such as dormers and extensions, and also detects moved
    or temporary objects such as sunshades or picnic tables. When combined
    with aerial imagery, the approach helps distinguish static from dynamic
    changes. This work is innovative in its integration of occlusion-aware
    certainty scoring, visual certainty feedback, and the automated generation
    of synthetic training data for change detection
  uuid: b1526eae-f17d-497c-a741-f4528479b03b
- surname: Wang
  name: Zhuoyue
  title: Structuring Semantics in Smart Point Clouds Using an HBIM Ontology
    for Heritage Objects with Propagation to Gaussian Splatting
  supervisors: Peter van Oosterom; Edward Verbree
  year: 2025
  graduation_date: '2025-06-26'
  link: https://resolver.tudelft.nl/uuid:06665492-fe43-45fb-9eb8-b193b68a7307
  image: 2025_Wang.jpg
  abstract: 'This thesis proposes a structured and scalable workflow for semantically
    enriched Smart Point Cloud (SPC) grounded in Heritage Building Information
    Model (HBIM) ontology. Rather than representing the heritage object with
    vector-based parametric models, this approach treats the smart point cloud
    itself as a valid HBIM geometry representation, preserving geometric fidelity
    while attaching multi-layered semantic information at the patch level.
    A structured semantic model is defined through a literature-based ontology
    review, encompassing structural, material, historical, cultural, and conservation-related
    characteristics. The SPC workflow is implemented and tested on two heritage
    case studies: the Herdenkingsmonument Kartuizerklooster and the Aula of
    TU Delft. Each case demonstrates the generality of the method under different
    geometric and semantic complexities. The semantic annotations are stored
    externally in structured JSON files, ensuring modularity, version control,
    and future interoperability. A lightweight web-based viewer was developed
    using Three.js to support interactive visualization and interpretation,
    enabling users to explore structure, material, and cultural information
    directly in the browser. Although full integration with 3D Gaussian Splatting
    (3DGS) could not be achieved due to current toolchain limitations, the
    thesis outlines strategies for propagating patch-level semantics to 3DGS
    centers, as well as segmenting and visualizing per patch with Gaussian
    Splatting, establishing groundwork for future research in full semantically
    integrated rendering. Overall, this study contributes a reproducible methodology
    for documenting, interpreting, and disseminating heritage datasets in
    a way that aligns with HBIM objectives while minimizing modeling overhead.
    The data processing and the visualization platform are shared on Github
    by https://github.com/Zhuoyuee/thesis and https://github.com/Zhuoyuee/spc
    viewer/tree/main.'
  uuid: 06665492-fe43-45fb-9eb8-b193b68a7307
- surname: Yang
  name: Qiaorui
  title: Integrating Spatial Knowledge Graphs and Graph Neural Networks for
    Clustering and Scenario-Based Enhancements in Regional Energy Systems
    Management
  supervisors: Azarakhsh Rafiee; Wilko Quak
  year: 2025
  graduation_date: '2025-10-27'
  link: https://www.gdmc.nl/publications/2025/MScThesisQiaoruiYang.pdf
  image: 2025_Yang.jpg
- surname: Zhao
  name: Xiaduo
  title: Structure guided roof heightmap completion
  supervisors: Weixiao Gao; Hugo Ledoux
  year: 2025
  graduation_date: '2025-06-19'
  link: https://resolver.tudelft.nl/uuid:7ffafb9f-2c91-4ee0-9f02-6a597d438214
  image: 2025_Zhao.jpg
  github: https://github.com/xdzhaooo/msc_roof_completion
  abstract: 'Urban digital twins rely on accurate rooftop geometry, yet airborne
    lidar point clouds are frequently sparse and incomplete, leading to substantial
    information loss in building reconstruction. This thesis investigates
    diffusion--based learning as a remedy for high-fidelity roof recovery
    under severe data corruption. This thesis proposes a two-stage framework
    that operates on 2.5D height-map representations. Stage~I introduces a
    dual-task diffusion model that jointly performs roof height-map completion
    and roof-line prediction. A novel Bidirectional Control Module enables
    reciprocal conditioning between the two tasks, enforcing geometric consistency
    during the denoising process. Stage~II employs a patch-based diffusion
    upsampler equipped with positional embeddings and a domain-specific global
    context encoder to synthesise high-resolution height maps while remaining
    computationally tractable for large and variably-sized buildings. A rigorous
    preprocessing pipeline further yields two challenging benchmarks, \textsc{S80\_i30}
    and \textsc{S80\_i80}, derived from 160k real-world building samples.
    Extensive experiments conducted on these datasets demonstrate the effectiveness
    of the proposed approach. Under moderate corruption (\textsc{S80\_i30}),
    the completion model attains an \textit{RMSE} of \textbf{0.89}~m and a
    Chamfer distance of \textbf{0.06}, improving upon the state-of-the-art
    RoofDiffusion baseline by 13.2\% and 17.3\%, respectively. In the severe
    setting (\textsc{S80\_i80}), the method sustains a 13.5\% \textit{RMSE}
    reduction. The upsampling stage delivers an additional 10\% \textit{RMSE}
    gain over the best classical interpolator, and the end-to-end pipeline
    achieves \textit{RMSE} values of 0.91~m (moderate) and 1.42~m (severe).
    The thesis contributes: (i) a structurally-aware diffusion framework for
    roof completion, (ii) a scalable patch-based upsampler, and (iii) public
    benchmarks that reflect real lidar degradation. Collectively, these advances
    close a critical gap between theoretical research and practical generation
    of LOD2.2 building models, facilitating more reliable urban analytics
    and planning applications.'
  uuid: 7ffafb9f-2c91-4ee0-9f02-6a597d438214
  programme_note: repository programme metadata lists another programme; verified
    as Geomatics
- surname: Batum
  name: Simay
  title: 'Spatial Plan Registration and Compliance Checks in Estonia, based
    on LADM Part 5: Spatial Plan Information'
  supervisors: Peter van Oosterom; Eftychia Kalogianni; Marjan Broekhuizen
  year: 2024
  graduation_date: '2024-10-30'
  link: https://resolver.tudelft.nl/uuid:77dce0e4-beac-462d-82d6-69e5b3764df3
  image: 2024_Batum.jpg
  abstract: 'Traditional planning processes are often manual, time-consuming,
    and prone to errors. While much of the recent research has focused on
    automating the permitting phase, this study addresses an earlier step:
    automating compliance checks between spatial plans and against local regulations
    in the early planning stages. To ensure that spatial plans align with
    general regulatory frameworks prior to the permitting stage, this research
    introduces a standardized approach by integrating Industry Foundation
    Classes (IFC) with the Land Administration Domain Model (LADM) Part 5
    Spatial Plan Information (ISO Draft International Standard: 19152-5).
    This integration enhances data management, facilitates seamless information
    exchange, and ensures adherence to international standards. By automating
    early-stage plan compliance checks—such as verifying building height limits
    or distances between structures—the research aims to streamline the process,
    ensuring that only compliant plans proceed to the permitting phase, where
    the design itself is assessed for approval. To achieve this, the integration
    of IFC with LADM Part 5 is explored to standardize model-based checking
    between spatial plans during the early planning stage, using Estonia as
    a case study. As one of the most advanced digital societies, Estonia is
    continually improving its digital services, making it an ideal setting
    for this research. The primary goal is to enhance efficiency, interoperability,
    and standardization in these checks by incorporating LADM Part 5 into
    the framework, ensuring that various levels of spatial plans adhere to
    both higher-level regulations and local requirements before progressing
    to the permitting stage. This includes assessments and validation between
    different plan levels (e.g., Master Plan vs Detailed Plan) and within
    the same level (e.g., Detailed Plan vs Detailed Plan). The methodology
    involves several key steps. First, a country profile for Estonia using
    LADM Part 5 is developed and tailored to the specific needs of the Estonian
    spatial planning system, detailing how the country acquires, stores, and
    manages its plan data. Subsequently, a new database is created based on
    this country profile, establishing a framework for data storage. Then,
    pilot Detailed Plan datasets, encoded in IFC format, are imported into
    the new LADM database using custom scripts, enabling checks to be executed
    through standardized data structures. Findings indicate that integrating
    LADM with Industry Foundation Classes improves data representation and
    interoperability while creating a consistent framework for plan assessments,
    thereby contributing to more efficient and reliable planning systems.
    Additionally, some simpler checks can be performed directly within the
    new database using straightforward queries.'
  uuid: 77dce0e4-beac-462d-82d6-69e5b3764df3
- surname: Brouwer
  name: Gees
  title: 'Automated data-driven generation of 3D coral reef models: Assessing
    and integrating empirical data sources'
  supervisors: Hugo Ledoux; Akshay Patil
  year: 2024
  graduation_date: '2024-10-31'
  link: https://resolver.tudelft.nl/uuid:4893ca9e-5cce-42ba-8ded-7cff98258cce
  image: 2024_Brouwer.jpg
  github: https://github.com/GGBRW/CoralGenerator
  abstract: While three-dimensional coral reef models are valuable for various
    applications, existing approaches like photogrammetric scanning and manual
    modeling require substantial time and expertise, limiting their scalability.
    Previous algorithmic approaches, particularly Agent-Based Models (ABM),
    have relied heavily on complex ecological simulations and deep domain
    knowledge. This thesis explores an alternative data-driven approach to
    automated coral reef modeling, investigating whether empirical data sources
    can provide a scalable method for generating ecologically plausible 3D
    models. Rather than simulating ecological processes from first principles,
    we develop a pipeline that leverages observational data to inform and
    constrain procedural generation techniques. Through systematic evaluation
    of available data sources, including the Global Biodiversity Information
    Facility (GBIF), CoralNet, the Allen Coral Atlas, the Coral Traits Database
    and the Smithsonian Institution's 3D coral collection, we identified both
    opportunities and significant limitations in current data availability.
    The research developed a modular pipeline implemented in Blender that
    combines procedural terrain generation with the placement of 3D coral
    models, integrating species occurrence data aggregated over geomorphic
    zones. To ensure robust data integration across sources and maintain compatibility
    with evolving taxonomic standards, the pipeline implements automated species
    name verification through the World Register of Marine Species (WoRMS)
    (WoRMS - World Register Of Marine Species, n.d.) API. While the resulting
    pipeline successfully establishes a foundation for automated coral reef
    modeling, limitations in available structural data necessitated the use
    of manually configured parameters for critical aspects such as terrain
    characteristics and population density. The pipeline's modular structure,
    standardized taxonomy handling, and integration with standardized classification
    systems position it well for future iterations as improved data sources
    become available. This research demonstrates the potential of data-driven
    approaches to coral reef modeling while highlighting the need for more
    comprehensive, fine-scale structural data to enable fully automated, ecologically
    plausible modeling of coral reef environments.
  uuid: 4893ca9e-5cce-42ba-8ded-7cff98258cce
- surname: Cai
  name: Yuduan
  title: 'SplitSFC: A database solution for massive point cloud data management'
  supervisors: Martijn Meijers
  year: 2024
  graduation_date: '2024-01-18'
  link: https://resolver.tudelft.nl/uuid:485371bf-9a86-4eef-92c3-125a8904672c
  image: 2024_Cai.jpg
  abstract: Point cloud data are gaining more importance in the Geomatics
    domain, with the development of modern sensing technologies like LiDAR
    and photogrammetry. The size of massive point clouds are growing, and
    the performance of traditional database solutions for its data management
    become insufficient. It remains a huge challenge for researchers to come
    up with a data management solution that handles the huge volumes of data,
    while providing standardized functionalities. Space Filling Curve (SFC)
    has been explored as a good spaital access techniques for organizing point
    clouds. Existing SFC-based database solutions include PlainSFC, HistSFC,
    etc. However, they use a flat table to store point records and it is not
    compact for massive point clouds. In this thesis, a SFC-based database
    solution that manages point cloud in blocks is proposed. The purpose is
    to improve the performance of current point cloud database solutions,
    especially with storage space. This model organizes the point clouds based
    on Space Filling Curve, and innovatively splits each SFC key to a head
    and a tile. The points with the same SFC head are placed in the same block.
    SFC tails and other property dimensions are stored as arrays in other
    columns. Compared with the pgPointCloud and Oracle SDO_PC, the intermediate
    SplitSFC prototype does not show significant advantage in storage and
    data retrieval efficiency so far. However, it is fair to believe that
    with the improvement of algorithms and implementations, it has the potential
    to be an approximate and efficient point cloud data management solution.
  uuid: 485371bf-9a86-4eef-92c3-125a8904672c
- surname: Chen
  name: Mengying
  title: 'Formalizing land indicators for SDGs: Implementation and evaluation
    using international standards'
  supervisors: Peter van Oosterom; Eftychia Kalogianni
  year: 2024
  graduation_date: '2024-10-30'
  link: https://resolver.tudelft.nl/uuid:1f082b4d-5d96-4c72-8777-c62f76cc2624
  image: 2024_Chen.jpg
  abstract: This thesis explores the integration of the Land Administration
    Domain Model (LADM) with Sustainable Development Goal (SDG) indicator
    1.4.2, which focuses on land tenure security and the availability of legal
    documentation. The primary objective is to design and implement a dynamic
    database system that simulates real-world land administration changes
    over time, incorporating the complexities of land rights transfers, party
    relationships, and spatial units. The research leverages PostgreSQL and
    PostGIS to create a flexible and scalable system capable of managing temporal
    data and generating SDG 1.4.2 reports. Through the use of multiple constraints
    and custom functions, the system ensures data integrity while dynamically
    tracking changes in land tenure and ownership. Testing was conducted using
    simulated datasets across three years, which modeled evolving land rights,
    population changes, and administrative updates. The results were validated
    by comparing manual calculations with the system’s automated outputs,
    demonstrating the accuracy and reliability of the approach. The findings
    highlight the potential of using LADM in SDG indicator calculations and
    demonstrate the system’s ability to handle complex, multi-dimensional
    land administration scenarios. However, limitations such as the use of
    artificial data and a focus solely on SDG 1.4.2 suggest that further work
    is needed to validate the model with real-world data and expand its application
    to other SDG indicators and land-related policies. This thesis contributes
    to the ongoing efforts to modernize land administration systems and provides
    a scalable solution for tracking land tenure security in line with global
    sustainability goals.
  uuid: 1f082b4d-5d96-4c72-8777-c62f76cc2624
- surname: Dechamps
  name: Louis
  title: Spatial and semantic enrichment of utility networks data
  supervisors: Giorgio Agugiaro
  year: 2024
  graduation_date: '2024-06-19'
  link: https://resolver.tudelft.nl/uuid:060a3f80-3200-4900-8b8f-572cbbb57e5f
  image: 2024_Dechamps.jpg
  abstract: Utility networks are critical components of urban infrastructure,
    providing essential services such as water supply, electricity, gas, and
    telecommunications. The traditional method for mapping these networks
    is typically two-dimensional (2D) schematic representations rather than
    topographically and geometrically correct maps. These representations
    lack the capacity to convey the complexity and vertical intricacies of
    urban infrastructures. This limitation hampers comprehensive planning,
    efficient management, and risk mitigation during construction activities
    because 2D maps do not effectively represent the multi-layered and interconnected
    nature of urban utilities, leading to potential oversights and inaccuracies.
    This thesis addresses the challenge of enriching utility network data
    by integrating detailed data from utility trench surveys. These surveys
    provide precise positional and attribute information about utilities that
    are often missing in standard maps, such as the exact depth, spatial configuration,
    and physical characteristics of the utility lines. Data from utility trenches
    in three Dutch cities—Enschede, Rotterdam, and Amsterdam—was acquired
    and analyzed. Methodologies were developed to extract, standardize, and
    integrate this data into existing utility network maps, enhancing their
    semantic content and spatial accuracy. The research demonstrated that
    integrating trench data can reveal inaccuracies in traditional utility
    network maps at the utility trench locations. Key findings include the
    development of algorithms for extracting and processing utility trench
    data, the identification of common challenges between cities such as cable/pipeline
    labeling inconsistencies, and the comparison of enriched utility data
    and that of traditional utility networks. The research also highlights
    the importance of standardizing data models and the potential of three-dimensional
    models to provide a more comprehensive understanding of utility networks.
    A resulting recommendation was to improve data collection by including
    all information found and providing properly geo-referenced data.
  uuid: 060a3f80-3200-4900-8b8f-572cbbb57e5f
- surname: Dinklo
  name: Constantijn
  title: Visualizing massive computation fluid dynamic outputs in game engines
    using voxelization and dynamic loading
  supervisors: Clara García Sánchez
  year: 2024
  graduation_date: '2024-04-10'
  link: https://resolver.tudelft.nl/uuid:605302d7-8939-416a-8488-ff48842b02ec
  image: 2024_Dinklo.jpg
  abstract: 'Computation Fluid Dynamics (CFD) simulations are used in a diverse
    set of fields such as aerodynamics, automotive, biomedical engineering
    and wind impact. With the advancements in technology the scale of these
    simulations has increased significantly. This has resulted in \textit{massive}
    CFD simulations --- simulations that do not fully fit within RAM. Due
    to the limitations in RAM, visualizing the results of \textit{massive}
    CFD simulations has become an issue, mainly on personal computers. Existing
    solutions necessitate either substantial external servers equipped with
    sufficient RAM, a costly and inefficient approach that struggles to accommodate
    increasingly larger CFD simulations, or reliance on manual intervention
    for data loading and unloading. However, manual intervention introduces
    potential for error. This thesis proposes a solution to automatically
    load/unload data from memory based on real-time demand. To achieve the
    proposed solution the methodology is split into two main stages: \textbf{(a)}
    pre-processing and \textbf{(b)} visualization. The pre-processing is required
    to efficiently manage the \textit{massive} amount of data during the visualization
    step. It involves segmenting the study area into smaller, more manageable
    regions. Furthermore, it generates multiple level of details for each
    region such that the desired level of detail can be used as required.
    The visualization is performed within game engines --- Unity for this
    thesis. Game engines provide a solid starting platform as they include
    aspects such as read/write operations, rendering capabilities, and flexible
    code execution. During visualization, the relevant regions --- regions
    that are within the user''s point of view --- are automatically loaded
    into memory. subsequently, regions that leave the user''s point of view
    are automatically loaded out of memory. Utilizing iso-surfaces, volume
    rendering, and barbs, the loaded data is then presented to the user. The
    results showcase that visualizing \textit{massive} CFD results within
    game engines is possible in real-time. However, through the data transformation
    performed in the pre-processing step the data has lost some accuracy.
    Thankfully, an downward trend can be seen in the loss of accuracy as the
    level of detail increases. The result show that for data used in the thesis
    the pre-processing takes between 390 seconds (6 minutes and 30 seconds)
    and 972 seconds (16 minutes and 12 seconds). Furthermore, a data size
    reduction of up to 84\% can be seen after the pre-processing has finished.'
  uuid: 605302d7-8939-416a-8488-ff48842b02ec
- surname: Feng
  name: Yingxin
  title: 3D building model edit with generative AI
  supervisors: Nail Ibrahimli; Ken Arroyo Ohori
  year: 2024
  graduation_date: '2024-06-20'
  link: https://resolver.tudelft.nl/uuid:a180e48a-4bd2-4606-bce5-9449559bee12
  image: 2024_Feng.jpg
  github: https://github.com/fengyingxin/MSc-Thesis
  abstract: Generative AI is developing rapidly and has shown great potential
    in generating and editing images with text prompts. It has achieved partial
    success in the challenging 3D model edits of common objects. However,
    there is a lack of attention in the building domain, which already faces
    certain limits in the 2D space. 3D building models automatic edit has
    wide application potential, especially for renovation, concept comparison,
    and large-scale scenes. Therefore, the thesis aims to edit the building
    models effectively through texture creation and geometric changes with
    generative AI by evaluating the existing 3D edit pipelines and putting
    forward practical solutions based on them. The thesis first examines the
    current methods. Latent-paint, Text2Tex and X-Mesh are chosen as the representative
    existing explicit representation (mesh) based pipelines for their relatively
    satisfying performance in common objects and the different ideas contained.
    Modifications are made based on them to improve output quality from the
    aspects of the control module and edit module. For the first aspect, attempts
    include adding the view specification text prompt to the original X-Mesh
    and using the image as the control for X-Mesh. Image control X-Mesh is
    also further experimented with placing higher attention on the input image
    view and editing the key semantic parts of the building separately. For
    the latter aspect, modifications include freezing sampled vertices geometry
    and combining X-Mesh and Text2Tex. Results show that Latent-Paint mainly
    creates texture with only major colour and lacks details. Text2Tex generally
    generates fine textures for inputs with richer depth information. X-Mesh
    creates textures and edits geometry jointly. It can improve the fidelity
    of the input mesh to some extent but suffers from noise problems. Image
    control X-Mesh generates more realistic results and outperforms the text
    control pipeline. Combining Text2Tex with X-Mesh takes advantage of Text2Tex,
    which can generate smoother and more realistic textures compared to X-Mesh
    in some cases. The combination is especially recommended for low-fidelity
    mesh of small or medium size. The user study also shows that the combination
    of X-Mesh and Text2Tex generates the most favoured results while image
    control X-Mesh ranks second. There are still limitations in geometric
    deformation scope, fidelity, generalizability and computational efficiency
    in the proposed 3D edit pipelines. The thesis succeeds in proving the
    application potential of 3D edit pipelines in the building domain and
    obtaining high-quality results by modifying existing methods.
  uuid: a180e48a-4bd2-4606-bce5-9449559bee12
- surname: Gheorghiu
  name: Irina
  title: Analysis of the visibility of GPS satellites in the urban environment
    using point cloud representation
  supervisors: Edward Verbree
  year: 2024
  graduation_date: '2024-01-19'
  link: https://resolver.tudelft.nl/uuid:0d4f6592-456a-413a-a10b-e7d30930e126
  image: 2024_Gheorghiu.jpg
  abstract: Global Navigation Satellite System is a spatial data acquisition
    technique, mostly used in navigation and positioning. One of the main
    components of this technique is the satellite visibility, which refers
    to the connection between the satellite and the ground receiver. It is
    known that the GNSS positioning systems are not as performing in urban
    areas due to the dense coverage of obstacles (buildings, trees, high terrain
    etc.). These obstacles can obstruct and reflect the lines of sight between
    the satellite and the ground receiver which can affect the quality of
    the performance of the GNSS service. The geometry configuration of the
    satellites above the receiver is another important aspect that has to
    be taken into consideration. This research focuses on implementing a simulation
    similar to that of GNSS mission planning tools, but using point cloud
    data as the 3D representation of the surroundings of the receiver and
    using only the GPS constellation of satellites. Due to the large size
    of a point cloud sample, two visibility algorithms have been implemented
    to filter the necessary 3D data. The main output of the simulation are
    the dilution of precision values which give further information about
    the satellites' positions. The main purpose of this research is to understand
    the dilution of precision values, which are directly related to the geometry
    of the satellite configuration above the receiver. Understanding the behaviour
    and how the receiver's environment influences the DoP values can result
    in leading GNSS surveying missions with better results. This output is
    then compared with the data acquired from a GNSS receiver in a real scenario.
    While the results are not favorable for the implemented simulation, it
    gives a better understanding of the surroundings of the receiver's location
    by using point cloud data than the already existing online GNSS tools.
  uuid: 0d4f6592-456a-413a-a10b-e7d30930e126
- surname: Gong
  name: Sicong
  title: 'Towards Adaptive Trajectory Data Management: Modelling, Accessing,
    Distributing, and Query Optimization in Distributed Database'
  supervisors: Martijn Meijers
  year: 2024
  graduation_date: '2024-06-17'
  link: https://resolver.tudelft.nl/uuid:2a3d6f15-c8d5-4ab6-b3c5-f46c6c433d43
  image: 2024_Gong.jpg
  abstract: 'With the proliferation of the IoT infrastructure, the trajectory
    data is dynamically emerging. This data originates from a variety of moving
    objects, containing big volumes of multi-dimensional information such
    as space, time, semantics etc. The underlying information can be potentially
    applied to create added value through scientific research, decision-making,
    emergency management etc. However, due to the special properties of the
    trajectory data, namely high frequency, cardinality, dimensionality, heterogeneity
    etc., traditional data management systems face difficulties in handling
    such data. Even though some distributed solutions or big data solutions
    exist in other fields, they are not designed considering the modelling,
    accessing, distributing and querying characteristics of this special spatio-temporal
    data. Given the spatial data management problems, a clustering/indexing
    solution for high dimensional Point Cloud by Space-filling curve considering
    the heterogeneous data spatial distribution has been developed, advocated
    and validated by a series of research finished at the GDMC, TU Delft.
    However, it is uncertain whether the framework can be extended to other
    types of space-related phenomena. Furthermore, whether distributed database
    techniques can be utilized remains to be explored and what adjustments
    should be made is still unclear. To some extent, this thesis is an expanded
    study based on the Point Cloud research mentioned above. To address these
    data management challenges, this thesis focuses on trajectory data modelling
    and compression, indexing and clustering, partitioning and distributing.
    Also, the querying strategies are studied. More specifically, the three
    main results of this thesis are: Model the trajectory as the sequence
    split by semantic attributes and a spatio-temporal cube. This modelling
    takes proximity (locality) preservation and trajectory preservation into
    account at the same time, resulting in a balanced level of flexibility
    and aggregation, mitigating the storage burden by row-wise compression.
    For different subdivision resolutions (depth of Octree for space partitioning),
    the compression ratio can be up to 10. Access the trajectory data by Space-filling
    Curve. The Space-filling Curve indexing method maps the 3D (high dimensional)
    indices to 1D (low dimensional) indices, overcoming the contradiction
    between high dimensionality and high cardinality. Adaptive Octree is used
    to mitigate the heterogeneity of the trajectory data. Based on the experiment
    results, the optimal tree depth is 4 or 5. The query optimization (specifically,
    the range merging technique) is also preliminarily explored. Distribute
    the data on the distributed machines. This distributed deployment results
    in higher (nearly linearly in the experiment) scalability (horizontal
    expansion of disk, memory and CPU resources) and speed-up. The Space-filling
    Curve distributing strategy results in better load-balancing. However,
    due to the lack of flexibility of the distributed database platform used
    (specifically, Greenplum), the localization of data and computation (such
    as local aggregation) is limited.'
  uuid: 2a3d6f15-c8d5-4ab6-b3c5-f46c6c433d43
- surname: Hengelmolen
  name: Maren
  title: Urban computational fluid dynamics simulations set-up validations
  supervisors: Clara García Sánchez
  year: 2024
  graduation_date: '2024-01-16'
  link: https://resolver.tudelft.nl/uuid:4bfbc01f-1681-4640-9b00-c1a800a4f74d
  image: 2024_Hengelmolen.jpg
  github: https://github.com/MarenHengelmolen/thesis
  abstract: 'Computational Fluid Dynamics (CFD) simulations for residential
    areas are becoming increasingly important as the urban population keeps
    growing and extreme weather conditions due to climate change are becoming
    more prevalent. Since CFD simulations simulate and visualise fluid flows,
    users can analyse and predict air flows in urban environments, giving
    insight in pollution, heat dissipation, and weather conditions. Performing
    these simulations demands expertise and time: 3D urban models must be
    prepared, and pre-run setups must be defined to obtain accurate results.
    Partial automation can streamline this process. Therefore, we developed
    a method that identifies geometric errors and defines mesh parameters
    for the open source CFD software OpenFOAM. This method follows the ISO19107
    standard and recent CFD guidelines for urban areas, ensuring accurate
    simulation results. We validated algorithms with a variety of urban models
    and parameters, and analysed the workflow developed for the mesh parameters
    definition. Additionally, we created a prototype, in the form of a web
    application, in which these algorithms are implemented. Our prototype
    will simplify the use of CFD simulations for urban areas, making them
    more accessible to everyone.'
  uuid: 4bfbc01f-1681-4640-9b00-c1a800a4f74d
- surname: Kaal
  name: Tessel Elisabeth
  title: 'Optimizing Energy Balance in Multi-Energy Microgrids -- Enhancing
    Grid Efficiency: Utilizing Deep Reinforcement Learning for Efficient Distribution
    of Local Renewable Energy Resources'
  supervisors: Azarakhsh Rafiee
  year: 2024
  graduation_date: '2024-07-03'
  link: https://resolver.tudelft.nl/uuid:5d20ed5a-9467-4760-b086-6da90073a257
  image: 2024_Kaal.jpg
  abstract: 'The transition to a fully electrified energy grid in the Netherlands
    is essential for the country''s energy transition strategy. However, the
    existing grid infrastructure struggles to support the increased demand
    due to electrification, leading to congestion and potential outages anticipated
    before 2030. Microgrids, decentralized networks where generation, heat,
    storage, and consumption are coordinated, offer a promising solution by
    providing the required flexibility for the integration of Distributed
    Renewable Energy Resources (DERs) and potentially reducing energy losses
    associated with long-distance energy exchange. This study explores the
    implementation of Deep Reinforcement Learning (DRL) in a district-level
    microgrid in the Netherlands. The primary objective is to minimize grid
    connection dependency and reduce energy exchange distances within the
    microgrid cost-effectively, thereby enhancing grid reliability and sustainability,
    answering the research question: \textit{Main Research Question}: \emph{How
    can Distributed Energy Resources be deployed and managed in a cost-effective
    manner within an electrified microgrid to achieve a balance between energy
    consumption and production in order to minimize the burden on the central
    grid given fluctuating demand?} A comprehensive framework was developed
    offering a structured approach for simulating and optimizing microgrid
    scenarios, providing practical solutions and frameworks for the efficient
    management and deployment of microgrids. The study demonstrates that DERs
    can be effectively deployed and managed within an electrified microgrid
    through a combination of simulation techniques with geographical data
    input, a DRL model with a Deep Q-Network (DQN) that controls the system,
    and dynamic mappings and visualization. While the DQN demonstrated its
    potential in optimizing microgrid configurations, challenges were noted
    due to the large action spaces required for routing optimization. To overcome
    these limitations, future work is proposed to combine DRL with Graph Neural
    Networks (GNNs). This novel method shows promise in enhancing the scalability
    and efficiency of the optimization process, enabling distance and routing
    optimization without an aggregated model. Scenarios were created to test
    the influence of different components, demonstrating how various factors
    affect overall system performance. The results of the model were as expected,
    and undertakings to optimize the model further led to significant improvements
    in the variability of the learning curve and of the rewards. The study
    concludes that the developed pipeline contributes to existing works by
    offering a structured approach for simulating and optimizing microgrid
    scenarios and testing different setups. While this research approach has
    proven effective, future work should enhance the realism of components
    and address some computational limitations encountered. Refining these
    methodologies by incorporating GNNs, integrating real-world data, and
    extending the model with additional algorithms for performance comparison
    will further advance the field. This effort ultimately supports the vision
    of a reimagined, sustainable, resilient, and efficient energy grid.'
  uuid: 5d20ed5a-9467-4760-b086-6da90073a257
- surname: Kan
  name: Leo
  title: Spatial Height Prediction of ICESat-2 Data using Random Forest Regression
  supervisors: Hugo Ledoux
  year: 2024
  graduation_date: '2024-01-17'
  link: https://resolver.tudelft.nl/uuid:50e2609e-644d-4241-b3f2-a17f204d2c06
  image: 2024_Kan.jpg
  github: https://github.com/leowlk/RF_Terrain
  abstract: The Earth's surface is a complex landscape that is essential for
    a wide range of applications, from urban planning to environmental monitoring.
    Digital models of the Earth's surface are generated through mathematical
    calculations using elevation data collected from various sources and the
    Digital Terrain Model (DTM) which captures the bare earth's surface topography
    in 2.5D. The creation of DTM is an approximation of terrain in unsample
    locations, by using x-y coordinates and one z value. Traditionally, terrain
    interpolation uses deterministic or geo-statistical methods to calculate
    elevation. This research would use random forest regression as an alternative
    method and to compare the results against traditional interpolation. Comparing
    different locations against traditional interpolation yields similar results
    overall. Feature importance, within the the points that are closest to
    the sampled ICESat-2 data point are more significant than other features
    used in Random Forest model. The correlation between these datasets and
    the spatial relationship established would impact on the results of the
    elevation. The improvement overall of using traditional interpolation
    compared to random forest regression is limited depending on the location
    and using model trained with local datasets. For model trained on other
    geographical locations, which shows similar differences.
  uuid: 50e2609e-644d-4241-b3f2-a17f204d2c06
- surname: Kawasaki
  name: Maria Luisa Tarozzo
  title: 'Common Ground: Bridging Subsurface Information Models and Climate
    Adaptation Design'
  supervisors: Peter van Oosterom; Ulf Hackauf; Alexander Wandl; Rob van der
    Krogt; Wilfred Visser
  year: 2024
  graduation_date: '2024-06-17'
  link: https://resolver.tudelft.nl/uuid:6331f94b-b1f0-49f7-96d7-6ddb3e45d124
  image: 2024_Kawasaki.jpg
  abstract: 'The Delta Program states that the Netherlands must be climate-resilient
    and water-robust by 2050, posing a great challenge to spatial planning.
    This imminent challenge of climate adaptation requires a common ground
    of interdisciplinary approach as monodisciplinary reductionist approaches
    are often not enough to deal with complex phenomena such as climate change.
    In this context, combining information models can support well-informed
    design decisions, since many interventions related to climate adaptation,
    such as those related to water storage, soil infiltration and underground
    spatial management, require a deeper knowledge of subsurface characteristics
    and configurations. However, this interdisciplinary approach still face
    many organizational, technological and institutional barriers, related
    to inherent characteristics of design and geoinformatics in combination
    with practical challenges related to standardization and interface of
    existing products. There has not been yet an integrated approach that
    relates subsurface information models and local climate adaptation design
    interventions in a single place even if literature and design examples
    suggest information needs. This thesis aims to explores how subsurface
    information models, in particular 3D ones, can aid the cause of concrete
    well-informed urban climate adaptation design interventions, identifying
    the reasons for an under use of existing subsurface data models and assessing
    existing subsurface information models, both in 2D and 3D, to better understand
    what are the information requirements for climate adaptation design interventions
    in the Netherlands. As climate adaptation can often be a broad concept,
    this research opted to focus on concrete examples of standards for climate
    adaptation in urban design, coming from the Leidraad 2.0, the Maatlat,
    and the Klimaateffectatlas. The interventions used for the design analysis
    are also standardized and refer to a document published by the Dutch government
    containing the twenty five most relevant climate adaptation design interventions
    in the Netherlands. The study of these interventions, standards, and models,
    along with the study of their interdependence, indicate information needs
    for local climate adaptation design. Therefore, this thesis provides both
    theoretical and practical foundations for better integrating subsurface
    data models into standardized urban design practices for climate adaptation.
    As a result of this research, a tangible tool named CLIMACAT is developed.
    CLIMACAT integrates pre-existing subsurface information models in accordance
    with FAIR data principles: ensuring findability, accessibility, interoperability,
    and reusability. Subsequently, both the tool and the established information
    models undergo testing via design proposals across four neighborhoods
    within the city of Utrecht.'
  uuid: 6331f94b-b1f0-49f7-96d7-6ddb3e45d124
- surname: Keurentjes
  name: Lisa
  title: 'An automatic geometry repair framework for semantic 3D city models:
    Develop a framework for the automatic repair and reconstruction of 3D
    city models to facilitate different use cases and implement a prototype'
  supervisors: Hugo Ledoux
  year: 2024
  graduation_date: '2024-11-01'
  link: https://resolver.tudelft.nl/uuid:b5de420d-e0a2-4265-8bac-e7ae12f75e8c
  image: 2024_Keurentjes.jpg
  github: https://github.com/Lkeurentjes/AUTOr3pair
  abstract: The growing complexity of urban environments has intensified the
    need for accurate 3D city models to support simulations and analyses in
    various fields such as urban planning, energy demand, and computational
    fluid dynamics (CFD). However, these models often contain geometric and
    topological errors, such as non-watertight solids, intersecting volumes,
    and missing surfaces, limiting their usability. This thesis presents AUTOr3pair,
    an automatic framework designed to repair semantic 3D city models and
    address these issues. The process begins with validating 3D city models
    using val3dity, which ensures geometric validity based on ISO 19107 standards.
    Errors are addressed hierarchically, starting with ring-level fixes and
    progressing to solid interaction-level corrections, focusing on localized
    repairs to minimize alterations while preserving geometric and topological
    integrity. Existing repair methods are integrated alongside new algorithms
    designed to meet the specific needs of different use cases, including
    visualization, energy demand estimation, solar potential analysis, and
    CFD simulations. Written in C++ for optimal performance, the framework
    supports CityJSON and OBJ. The repairs prioritize maintaining semantic
    consistency and minimizing data loss, but textures are excluded. This
    approach results in a robust validation and repair pipeline that generates
    detailed error reports and post-processing outputs, significantly improving
    the overall quality of 3D city models. Extensive tests on real-world datasets,
    including 3DBAG tiles from Leiden and a dataset from Brussels, demonstrated
    that AUTOr3pair successfully repaired most geometric errors, raising validity
    rates to nearly 100%. The framework achieved additional requirements,
    such as watertight geometry and proper surface orientation, for the specific
    use cases, CFD, energy demand, visualization, and solar power estimation.
    While some floating-point errors and geometric differences, due to global
    repairs, persist in complex cases, AUTOr3pair significantly reduces manual
    pre-processing and improves model suitability for various applications.
    This thesis demonstrates that automatic geometry repair is feasible and
    essential for improving the quality and usability of 3D city models. It
    provides a foundation for further research and development, particularly
    in extending the framework to support more file types and refining its
    capabilities for additional use cases.
  uuid: b5de420d-e0a2-4265-8bac-e7ae12f75e8c
- surname: Köbben
  name: Stein
  title: Integrating 3D Functionality into a Web Application for Sharing Geo-information
  supervisors: Martijn Meijers; Eftychia Kalogianni
  year: 2024
  graduation_date: '2024-06-18'
  link: https://resolver.tudelft.nl/uuid:ca630fac-e9ed-4653-af9e-325bcb821794
  image: 2024_Kobben.jpg
  abstract: Geo-information has many applications in various sectors and is
    used by public agencies as well as the private sector. A key method for
    sharing and visualising geo-information is through web viewers. Extensive
    infrastructure exists for creating web viewers to publish 2D geo-information
    without the need of coding, much of which is based on OpenLayers. 3D geo-information
    is becoming increasingly important for many use cases, such as urban planning,
    asset management, and disaster management. Consequently, there is an increasing
    need to publish 3D geo-information in web viewers without the need of
    coding. Since applications to do this for 2D geo-information are widely
    in use, it would be useful to be able to effectively integrate 3D functionality
    into an existing application. This research investigates the needs for
    integrating 3D functionality into an existing OpenLayers based GIS web
    application that allows the user to publish geo-information in web viewers.
    This includes both the technical needs, e.i. how to integrate the necessary
    code, and the user needs, e.i. what features does the user need to make
    the application useful and user-friendly. A proof of concept was developed
    to investigate the technical needs. The proof of concept is an extension
    of the existing application Tailormap. Tailormap is based on OpenLayers
    and allows users to publish geo-information in web viewers without the
    need of coding. 3D functionality is integrated into Tailormap to allow
    the users to publish 3D vector data, such as buildings, alongside 2D OpenLayers
    maps. This integration was achieved by incorporating Cesium functionality
    to load and visualise 3D Tiles datasets. To ascertain the user needs,
    interviews were conducted with Tailormap users and the created proof of
    concept was tested with them to gather feedback. The interviews and testing
    sessions revealed that the most critical type of 3D data for publishing
    in a web viewer was vector data, specifically buildings. Furthermore,
    specific functions were identified that make the application useful for
    the users. The developed technical methodology and the identified user
    needs are primarily applicable to integrating 3D functionality into Tailormap
    but can also serve as guidelines for integrating 3D functionality into
    other OpenLayers-based GIS web applications for publishing geo-information
    in web viewers.
  uuid: ca630fac-e9ed-4653-af9e-325bcb821794
- surname: Koster
  name: Gabriela
  title: 'Implementing a Dutch building energy simulation tool: Energy model
    testing for Rijssen-Holten'
  supervisors: Camilo León Sánchez
  year: 2024
  graduation_date: '2024-06-26'
  link: https://resolver.tudelft.nl/uuid:4fce75a7-05f6-4854-b3f8-7fff5de114aa
  image: 2024_Koster.jpg
  abstract: 'Lowering energy demand in buildings is high on the political
    agenda considering household energy consumption accounts for 22% of the
    total final energy usage in the Netherlands. Tools that can run these
    types of simulations for an entire city are required for effective policy
    design to lower energy consumption within the built environment. This
    thesis explores how to build such a tool that allows for space heating
    demand to be computed that follows the NTA 8800 norm. Therefore, the main
    research question is: “To what extent can a heat demand model be developed
    that adapts and implements the NTA 8800 to be coupled with CityGML-based
    semantic 3D city models?”. The thesis uses a mixed-method research approach
    of qualitative concept mapping and quantitative modelling to build a space
    heating demand model for urban analysis. The final product is a Python-based
    model with database interactions, compatible with CityGML-based semantic
    3D city models, following the NTA 8800 computation methods. Initial testing
    on two buildings highlighted areas for model development, including the
    underestimating of ventilation losses and the omission of windows and
    doors in transmission estimates. Improved window quality could result
    in significant energy savings, according to the solar gain analysis. The
    model’s capacity to mimic anticipated trends in space heating demand was
    verified using benchmark data, although it deviated from previous consumption
    patterns, indicating the need for additional research. The model was tested
    for Rĳssen-Holten and produced rapid results within 5 minutes. Despite
    limitations due to data availability and model assumptions, the thesis
    model underscores the utility of Geomatics in urban energy management
    and the results can help design energy policy design for sustainable development.'
  uuid: 4fce75a7-05f6-4854-b3f8-7fff5de114aa
- surname: Li
  name: Sitong
  title: Enhancing 3D model for urban area with neural representations
  supervisors: Ken Arroyo Ohori; Nail Ibrahimli
  year: 2024
  graduation_date: '2024-07-03'
  link: https://resolver.tudelft.nl/uuid:c9211a3c-2b54-4895-8a85-06dcdfe6df3b
  image: 2024_Li.jpg
  github: https://github.com/StoneLee0917/DSM-with-nueral-representation-
  abstract: 'The accuracy and comprehensiveness of 3D city models have become
    increasingly important for applications like monitoring, sustainability
    evaluation, disaster management, and urban planning. However, creating
    accurate and complete 3D models is challenging. Traditional methods, such
    as photogrammetry and Light Detection and Ranging (LiDAR), often face
    issues like time-consuming processes and data gaps caused by occlusion.
    Additionally, these methods typically produce discrete models that fail
    to capture all the information from the original objects, limiting the
    ability to reconstruct small structures. In this thesis, we explore the
    potential and characteristics of enhancing 3D models for urban areas using
    implicit neural representation. This method offers generalizability, ensures
    no void areas, and provides more detailed information when using multi-modal
    inputs. The datasets used for model training include Actueel Hoogtebestand
    Nederland 3 (AHN3), 2019 Luchtfoto Beeldmateriaal, 3D Basisregistratie
    Adressen en Gebouwen (BAG), and Basisregistratie Grootschalige Topografie
    (BGT). The city center of Eindhoven is used for training and testing,
    and the city center of Rotterdam serves as a test dataset. The method
    involves learning location-dependent latent codes from raw point cloud
    and orthophoto, and adjusting the probability of space occupancy based
    on point clouds sampled from the 3D city model. A decoder is used to calculate
    the probability of existence for any point in the 3D space from the continuous
    field. Proper sampling allows us to derive a continuous Digital Surface
    Model (DSM) with unlimited resolution from the neural network. The results
    show a high degree of accuracy: the generated DSM for the training area
    in Eindhoven demonstrated a median absolute error of 0.484 m overall.
    Accuracy for building areas was recorded at 0.798 m, and for terrain,
    it was 0.302 m. The model also displayed robust generalization capabilities,
    with an accuracy of 0.336 m in the Eindhoven test area and 0.23 meters
    in Rotterdam. Additionally, the model''s ability to fill voids was confirmed
    through both visual inspection and quantitative evaluations. This research
    underscores the potential of implicit neural representation for generating
    detailed DSMs and effectively filling no-data voids.'
  uuid: c9211a3c-2b54-4895-8a85-06dcdfe6df3b
- surname: Madanu
  name: Sharath Chandra
  title: A Confidence-aware Deep Learning Framework for Refining Laser-scanned
    Point Cloud Classification
  supervisors: Shenglan Du; Daan van der Heide; Jantien Stoter
  year: 2024
  graduation_date: '2024-11-04'
  link: https://resolver.tudelft.nl/uuid:e6ab08b9-a4d9-4e9c-86ec-3805631cf998
  image: 2024_Madanu.jpg
  github: https://github.com/AutumnMoon00/RefineNet
  abstract: Accurately classifying laser-scanned point cloud data remains
    a critical challenge in geospatial analysis, particularly due to the complexity
    and volume of the data. This thesis presents a novel, confidence-aware
    deep learning framework designed to improve the classification accuracy
    of point cloud data, specifically focusing on the Actueel Hoogtebestand
    Nederland (AHN) dataset. The framework integrates geospatial knowledge
    into the deep learning process, enabling the model not only to refine
    its predictions through iterative learning but also to enhance the training
    data along the way via iterative online learning, ensuring continuous
    improvement in both training data quality and model performance. The preprocessing
    phase assigns confidence scores to each point in the point cloud based
    on local neighborhood properties, with additional input from multispectral
    imagery (MSI) to further enhance the confidence estimation. These confidence
    scores are central to the online learning process, where the model prioritizes
    high-confidence points for training while progressively updating lower-confidence
    points to improve accuracy. To test the hypothesis that confidence-aware
    learning can enhance point cloud classification, we selected the KPConv
    network due to its suitability for handling unstructured data and capturing
    complex geometric features. Extensive experiments demonstrate that the
    proposed framework, particularly with the Online strategy, enables deep
    learning models to perform better when trained solely on native point
    cloud attributes (elevation and intensity) compared to models without
    this strategy. Importantly, the Online strategy qualitatively enhances
    the training data by refining labels and reducing noise, thereby supporting
    more robust model performance. While incorporating additional features
    from aerial imagery showed no overall improvement, specific classes, like
    High tension and others did see performance gains.
  uuid: e6ab08b9-a4d9-4e9c-86ec-3805631cf998
- surname: Mantas
  name: Dimitris
  title: CNN-based roofing material segmentation using aerial imagery and
    LiDAR data fusion
  supervisors: Hugo Ledoux
  year: 2024
  graduation_date: '2024-10-31'
  link: https://resolver.tudelft.nl/uuid:c463e920-61e6-40c5-89e9-25354fadf549
  image: 2024_Mantas.jpg
  github: https://github.com/DimitrisMantas/RoofSense
  abstract: Roofing material classification is becoming pivotal in urban decision-making,
    supporting processes like asbestos mapping, disaster preparation, and
    urban heat island detection. However, research has mainly focused on a
    restricted set of materials. Additionally, many studies rely on expensive
    multi- or hyper-spectral imagery and often use outdated or ineffective
    classification methods, overlooking the transformative capabilities of
    advanced deep learning and data fusion. This thesis explores using a convolutional
    neural network for pixel-level classification of Dutch buildings by merging
    standard aerial images with LiDAR data, enabling detailed mapping and
    addressing concerns about classification efficacy relative to image- and
    object-level methods. A framework was devised to generate a new semantic
    segmentation dataset with over 15.5 million pixels from 200 randomly selected
    images nationwide, covering eight distinct materials. To facilitate material
    identification in unfavourable lighting conditions, true-colour aerial
    imagery from the BM5 dataset was combined with rasterised features extracted
    from the national point cloud (AHN4), specifically reflectance, slope,
    and planar point density. Additionally, a quasi-normalised elevation model
    (nDRM) was employed, based on the corresponding digital surface model
    and median roof elevation of buildings in each scene, as provided by the
    3DBAG dataset. The research was further investigated using the DeepLabv3+
    semantic segmentation architecture with a ResNet-18 backbone, and the
    model was trained end-to-end on the generated dataset. In this context,
    a novel stratified splitting algorithm and weighting scheme to combat
    class imbalance in the training subset were introduced. After thorough
    hyperparameter tuning, we achieved a 64.68% mean intersection over union
    on the test subset. Membranes and gravel outperformed almost every other
    study. However, there were notable confusion and omission errors with
    light-permitting surfaces and metal. Further testing of pixel-wise material
    maps' generalization to different LoDs of the 3DBAG considerably decreased
    gross errors. However, it might overlook some minor original predictions,
    thus not improving overall performance notably. Generally, LoD1.2 was
    inadequate for modelling multi-material roofs of different heights. While
    LoD1.3 improved this, it still missed small roof sections, unlike LoD2.2,
    which also had more outliers. Additionally, an ablation study on the LiDAR-derived
    component of the new dataset showed that removing slope and nDRM reduced
    performance by 10.31% and 8.61%, respectively, while density had the least
    impact. All ablated features were semantically linked, suggesting they
    should be combined into a single dataset. The thesis showcases the relevance
    of pixel-based classification with DL and data fusion, providing resources
    for future research and indicating areas for dataset expansion and improved
    annotation.
  uuid: c463e920-61e6-40c5-89e9-25354fadf549
- surname: Mao
  name: Ping
  title: A digital twin based on Land Administration
  supervisors: Peter van Oosterom; Azarakhsh Rafiee
  year: 2024
  graduation_date: '2024-07-08'
  link: https://resolver.tudelft.nl/uuid:e8d8fa2a-91b5-4ef7-8d19-a354dccfd6c7
  image: 2024_Mao.jpg
  abstract: As urban architectural environments become increasingly complex
    and densely populated, the demand for precise registration of legal statuses,
    encompassing both private and public interests, has become more urgent.
    Traditional 2D cadastral registration systems are increasingly inadequate
    for addressing the multifaceted and vertical nature of modern urban landscapes.
    These systems are limited in scope and unable to fully capture the intricacies
    of multi-level property rights, overlapping parcels, and underground constructions.
    This study uses a BIM/IFC model for the building’s physical representation.
    The party and Rights, Restrictions, and Responsibilities (RRRs) data are
    stored in a DBMS, with all data and the building location being fictitious.
    Visualization is achieved in 3D over the web using Cesium JS, an extensible
    globe viewer. Unlike earlier 3D cadastral systems, this research has developed
    a new 3D Land Administration prototype based on ISO 19152-2 (Land Administration
    Domain Model (LADM)). The objective is to explore improved methods for
    analyzing and visualizing RRRs in complex buildings. Novel techniques
    include presenting UML instance-level LADM diagrams for selected parties
    and/or apartments, showing RRRs and BAUnits linking them. The study introduces
    a new method for displaying surrounding buildings at varying Level of
    Detail (LoD), with closer buildings rendered in higher detail and more
    distant buildings shown in less detail. This selective detailing enhances
    both performance and clarity in visualizations. A key feature of this
    digital twin system is its real-time update capability. This study supports
    the updating of party and rights information in the backend database,
    accurately reflecting these updates in the public front-end version. This
    ensures the maintenance and visualization of the most current property
    rights data. The system also integrates sunlight simulation, which is
    crucial for urban planning, architectural design, and aiding buyer decision-making.
    For more details, visit the project’s website 3D web-visualization platform.
  uuid: e8d8fa2a-91b5-4ef7-8d19-a354dccfd6c7
- surname: Monté
  name: Sérénic
  title: Creating a methodology to more objectively measure the performance
    of reconstruction algorithms for large urban objects generated from low
    detailed complete ground truth models
  supervisors: Nail Ibrahimli
  year: 2024
  graduation_date: '2024-06-27'
  link: https://resolver.tudelft.nl/uuid:47fbe5bb-fdf2-44b4-8aa0-19d16385f781
  image: 2024_Monte.jpg
  abstract: In this thesis we present a new idea to objectively assess reconstruction
    algorithms. Because it is not feasible to completely scan a high-detailed
    ground truth mesh of large urban objects, the performance of the reconstructed
    meshes can therefore not be measured objectively. To solve this, we present
    a new mesh evaluation methodology that can more objectively assess the
    quality of the generated mesh based on a low detailed ground truth mesh.
    We achieved this by creating a synthetic dataset based on low-detailed
    models of large urban buildings and using this as a ground truth mesh
    and input data for the reconstruction algorithms. Thanks to our new methodology,
    we were able to compare the output mesh and ground truth mesh using a
    wireframe model of the meshes. This allows us to give a more objective
    score to the results without having to look at entire model, which is
    the usual method. The results of this thesis show that the new methodology
    has potential to be used for creating a new benchmark, and it opens a
    new door to using more readily available objects that could not be used
    before.
  uuid: 47fbe5bb-fdf2-44b4-8aa0-19d16385f781
- surname: Nestoras
  name: Georgios Konstantinos
  title: Exploring the potential of 5G positioning via RSSI, comparing its
    efficacy with GNSS-RTK positioning
  supervisors: Edward Verbree; Martijn Meijers; Robert Voûte
  year: 2024
  graduation_date: '2024-10-31'
  link: https://resolver.tudelft.nl/uuid:269af5b6-1278-4afc-9b06-64cfba0bbf40
  image: 2024_Nestoras.jpg
  abstract: Accurate positioning has become an essential component of modern
    life, crucial for applications ranging from navigation and industrial
    operations to emergency response. The Global Navigation Satellite System
    (GNSS) has traditionally provided reliable positioning, but its effectiveness
    diminishes in environments where satellite signals are obstructed, such
    as dense urban areas and indoor spaces. This thesis explores the potential
    of Fifth-Generation (5G) wireless communication technology, specifically
    utilizing Received Signal Strength Indicator (RSSI) data for positioning,
    as an alternative to GNSS. The research investigates the effectiveness
    of 5G positioning through trilateration and compares it with GNSS-Real-Time
    Kinematic (RTK) positioning. The study aims to validate the accuracy and
    the reliability of 5G positioning and various real-world scenarios, focusing
    on challenging environments. Key aspects examined include the impact of
    topography on positioning accuracy and the influence of network distribution
    on Position Dilution of Precision (PDOP). By attaching a 5G modem to a
    laptop, field measurements were collected and analyzed against the "ground
    truth" provided by GNSS-RTK. The results demonstrate the potential of
    5G RSSI-based positioning to serve as a robust positioning solution. This
    study’s findings hold significant relevance for the geomatics community,
    with implications for urban planning, infrastructure development, environmental
    monitoring, and disaster management. Through critical analysis and validation,
    this thesis contributes to the advancement of positioning technologies,
    highlighting the limitations of 5G trilateration using RSSI, yet proposing
    it as a potential complement to GNSS. The findings pave the way for future
    research and practical applications in enhancing precise positioning systems.
  uuid: 269af5b6-1278-4afc-9b06-64cfba0bbf40
- surname: Poon
  name: Hoi-Kang (Chris)
  title: Inferring the residential building type from 3DBAG
  supervisors: Camilo León Sánchez
  year: 2024
  graduation_date: '2024-01-18'
  link: https://resolver.tudelft.nl/uuid:3ef77acb-b38b-4fa5-9b1e-31813b00b739
  image: 2024_Poon.jpg
  github: https://github.com/tudelft3d/ML_bldg_type
  abstract: Urban Energy Modeling (UEM) provides a comprehensive approach
    to urban planning, helping to create sustainable, resilient, and energy-efficient
    cities that meet the needs of current and future generations. The key
    inputs for UEM methodologies and tools are the geometry of the building
    stock and its thermophysical properties. In the Netherlands, the 3DBAG
    provides the building stock geometry, while the thermophysical properties
    can be approximated using energy consumption estimates specific to each
    residential building type from the IEE project TABULA. However, a challenge
    arises as open data on residential building types at a national level
    is currently not readily available, necessitating the development of a
    method to infer this information from other accessible data sources. In
    response to similar successful studies, this thesis also focuses on utilising
    machine learning to address this challenge. Support Vector Machine (SVM)
    and Random Forest (RF) algorithms were tested and compared. These algorithms
    were trained using data on the residential building types obtained from
    the Rijssen-Holten energy testbed and EP-online, with the latter requiring
    preprocessing to obtain the relevant information. Additionally, 25 features
    derived from cadastral data and building geometry underwent a selection
    process to identify the essential features for accurate classification
    of building types. Eight models were trained and applied across eight
    case studies, containing subsets of the Netherlands representative for
    the whole country. The combined results were analyzed to determine necessary
    features, required data, and the most suitable machine learning approach
    for this research. The results revealed that features such as adjacency
    to other buildings, width, and volume in LoD2.2 correlated the most with
    Dutch residential building types. However, critical features like the
    number of storeys, the presence of an open porch, or galleries were not
    available as open data, even though they directly relate to the definition
    of certain residential building types. This thesis presented successful
    models, demonstrating accuracies between 61.1% and 98.5%, and balanced
    accuracies ranging from 51.6% to 94.2%. Importantly, performance differences
    were observed in various case studies, particularly in distinguishing
    accuracy between multi-dwelling and single-dwelling houses. Despite the
    longer tuning and training time, the suitability and accuracy of the RF
    models generally outperformed the SVM models. These findings highlights
    the capacity of machine learning to attain robust classification outcomes
    for the Dutch building stock when trained on representative datasets.
    Nevertheless, it is emphasized that the accuracy of results is contingent
    on data quality, and difficulties may arise in scenarios involving intricate
    buildings with multiple components and ambiguous classification rules.
  uuid: 3ef77acb-b38b-4fa5-9b1e-31813b00b739
- surname: Post
  name: Oliver
  title: 'The City Stack: A morphology-based city analysis and generation
    framework'
  supervisors: Hugo Ledoux; Akshay Patil
  year: 2024
  graduation_date: '2024-11-01'
  link: https://resolver.tudelft.nl/uuid:d6dc629c-c75e-4578-b1a1-8ac741133751
  image: 2024_Post.jpg
  github: https://github.com/OliverJPost/CityStack
  abstract: 'This thesis introduces the “city stack” framework and the concept
    of the “typology grid” to analyze and procedurally generate cities using
    publicly available geospatial data. It builds upon existing urban morphology
    research and combines existing metrics with new metrics to examine road
    networks and building footprints across 43 cities worldwide. The resulting
    unsupervised clustering of road patterns produced mixed outcomes: some
    global road typologies were consistently identified, while others lacked
    clarity or validity. Supervised classification of building typologies
    showed potential for city generation applications but faced challenges
    related to data quality and validation methods. To encode the captured
    urban form, the typology grid was introduced, which allows for straightforward
    comparison between cities and links the analysis phase with the generation
    phase. While this approach simplifies complex urban patterns for better
    understanding, it may oversimplify details needed for effective city regeneration,
    needing future research into parameterizing the grid. The simulated annealing
    optimization technique was applied to generate new city models to produce
    typology grids resembling those of actual cities. It proved a promising
    method, with relatively plausible results from just a few shape-based
    rules in the objective function. Computation time and grid size were a
    limiting factor, ruling out real-time use. The road and building generation
    methods based on the typology grid and city stack framework demonstrated
    the approach’s feasibility but indicated that further refinement is necessary.
    Further contributions by this thesis are an open source command line tool
    for analyzing the urban form real-life cities based on publicly available
    geospatial data, a proof of concept tool for generating cities, and a
    publicly available dataset of the analyzed cities. In conclusion, the
    city stack framework and typology grids offer a viable method for captur-
    ing and generating urban form and can be used as a starting point for
    future research.'
  uuid: d6dc629c-c75e-4578-b1a1-8ac741133751
- surname: Rao
  name: Chengzhi
  title: Reconstructing a high-detailed 2D areal representation of road network
    based on OSM data
  supervisors: Ken Arroyo Ohori; Stelios Vitalis
  year: 2024
  graduation_date: '2024-10-29'
  link: https://resolver.tudelft.nl/uuid:0bae72e4-ff16-4921-8f6e-d92fa4a377d7
  image: 2024_Rao.jpg
  abstract: Road network models are essential for modern urban planning, transportation
    analysis, and digital map reconstruction. This thesis addresses the development
    of a comprehensive digital road network model that advances from linear
    representation to a lane-level and areal polygonal representation, based
    on OpenStreetMap (OSM) data. While OSM provides rich road network data,
    challenges remain in reconstructing high-resolution, lane-level networks
    that are both geometrically precise and topologically consistent. The
    objective of this research is to create a reffned digital road model that
    enhances the geometric accuracy and topological integrity of road networks
    by transitioning from road-level centerlines to lane-level polygons and
    full areal representations. This model is designed to capture essential
    aspects and semantic information such as traffic modes (motorized and
    cycling), intersection complexity, and road connectivity. To achieve these
    objectives, the lane network generation methodology integrates OSM data
    with graph theory and civil engineering principles, focusing on lane topology
    and connectivity. The approach enhances linear geometry into areal geometry
    by combining a buffer-based method for road ribbons with a node-based
    method for intersection geometry. This process generates multiple intermediate
    results, including a road-level data model, a traffic-level data model,
    and grouped strokes representing global and local adjacency as graph-like
    models. Additionally, lane-level networks, lane geometry, and areal representations
    of roads and intersections are developed. Key innovations include a generalized
    method for lane centerline and polygon generation, ensuring road-lane
    correspondence and consistency between low-LoD linear models and high-LoD
    areal models. The final product is a digital road network model that accommodates
    variations in road shapes, realistic intersection geometry, and detailed
    trafffc lane information, enabling highly detailed urban simulations and
    transportation analyses. While challenges remain regarding lane alignment,
    complex intersections, and the lack of detailed trafffc signal data, this
    research successfully bridges the gap between OSM’s raw linear road centerline
    data and the lane-level areal representations.
  uuid: 0bae72e4-ff16-4921-8f6e-d92fa4a377d7
- surname: Shen
  name: Qiwei
  title: Plant Skeleton Extraction and Stem-leaf Segmentation
  supervisors: Liangliang Nan
  year: 2024
  graduation_date: '2024-10-30'
  link: https://resolver.tudelft.nl/uuid:42ae723f-4924-402c-9d8a-992f70f21bf4
  image: 2024_Shen.jpg
  github: https://github.com/qiweishen/Plant2Skeleton
  abstract: Plant phenotyping plays a vital role in plant genetics and breeding
    programs, providing the foundation for screening and evaluating genetic
    diversity and linking phenotypic parameters to the genetic determinants
    of trait expression. This process is critical for identifying molecular
    markers and accelerating genetic breeding improvement, thereby enhancing
    plant resilience to biotic and abiotic stresses such as drought, salinity,
    and diseases. Recent advancements in 3D sensing technology have empowered
    researchers to extract precise phenotypic parameters from plant point
    clouds, enabling more detailed and accurate plant phenotyping. A critical
    step in point cloud-based plant phenotyping is plant organ segmentation.
    Among the available segmentation methods, skeleton-based approaches are
    simple and intuitive, and could leveraging both local and global geometric
    information from plant point clouds to facilitate accurate organ segmentation.
    These methods have gained considerable attention in recent years. However,
    plant skeletonization, the core component of these approaches, remains
    limited in handling leafy plants, especially herbaceous species with complex
    shoot architectures, lateral stems, and multiple leaves. These structural
    complexities pose challenges that current skeletonization techniques struggle
    to address effectively. To address this challenge, we propose a skeleton-based
    plant organ segmentation framework that accurately extracts curve skeletons
    from individual plant point clouds and performs precise stem-leaf segmentation
    based on these skeletons. Our framework is particularly effective in handling
    leafy plants. It preserves fine structural details during skeletonization
    while avoiding abnormal or noisy local branches by extending the Laplacian-based
    contraction (LBC) algorithm through the integration of the Constrained
    Laplacian Operator. Moreover, we introduce Adaptive Constraints and Tip
    Points Preservation within the contraction loops to further refine skeleton
    quality. Additionally, a modified Locally Optimal Projection (LOP) operator
    is utilized to perform skeleton points calibration, ensuring that the
    extracted skeleton is centrally aligned with the original plant shape.
    Furthermore, to evaluate the performance of our proposed framework, we
    contribute a photogrammetric 3D plant point cloud dataset of 56 Polygonum
    lapathifolium plants, complete with detailed annotations. Experiment results
    demonstrate that our framework robustly handles various shapes and sizes
    of leafy plants and tree branches. In conclusion, our study enhances the
    LBC algorithm by integrating the Constrained Laplacian Operator, Adaptive
    Constraints, and Tip Points Preservation. These improvements increase
    the accuracy and quality of curve skeleton extraction from leafy plant
    point clouds, enabling satisfactory plant organ segmentation.
  uuid: 42ae723f-4924-402c-9d8a-992f70f21bf4
- surname: Spit
  name: Josephine
  title: Evaluating Gender-Blindness and User Satisfaction in Dutch Campus
    Map Creation
  supervisors: Bastiaan van Loenen; Stefano Calzati
  year: 2024
  graduation_date: '2024-10-31'
  link: https://resolver.tudelft.nl/uuid:c97064d2-6ddb-4297-81bf-8e159ffd1d2e
  image: 2024_Spit.jpg
  abstract: This thesis evaluates the presence and implications of gender-blindness
    in the design of campus maps at five Dutch universities. Through a combination
    of literature review and case study analysis, the research explores how
    feminist critiques of mapping practices — particularly the accusation
    that maps claim neutrality, unknowingly neglecting certain perspectives
    and user needs — apply to campus map design. The universities examined
    include Delft University of Technology, Vrije Universiteit Amsterdam,
    Erasmus University Rotterdam, Wageningen University & Research, and Eindhoven
    University of Technology. The methodology involves qualitative interviews
    with map makers and a quantitative survey of campus users, combined with
    qualitative comments and follow-up interviews, offering insights into
    both the creation and evaluation of the maps. The findings suggest that
    a lack of awareness of gender-related issues, along with limited incorporation
    of diverse perspectives and technical constraints, may result in the neglect
    of the needs of different campus users. However, the potential negative
    consequences this has on (spatial) inequalities on campus seems limited,
    as campus users appear not to be frequent campus map users.
  uuid: c97064d2-6ddb-4297-81bf-8e159ffd1d2e
- surname: Sterkman
  name: Pam
  title: Exploring the potential of explorative point clouds in floodplain
    maintenance
  supervisors: Edward Verbree
  year: 2024
  graduation_date: '2024-01-17'
  link: https://resolver.tudelft.nl/uuid:e1fdfc2b-c0e3-4c02-bb78-cdbf0cc10c1a
  image: 2024_Sterkman.jpg
  abstract: Water management is an integral part of Dutch history, driven
    by the continuous need to reduce flood risk. Because a large area of the
    country is located below Normaal Amsterdams Peil (NAP), there is an ongoing
    challenge to safely discharge all the water to the sea. Therefore, flood
    safety policy has become crucial to protect the Netherlands from natural
    hazards. An essential part of this strategy involves the Waardegedreven
    Onderhoudscontract Uiterwaarden (WOCU) Rijntakken project, which is responsible
    for managing the floodplains adjacent to the Rijntakken within the Netherlands.
    The current lack of efficiency and effectiveness regarding change inspection
    in the large and sometimes inaccessible areas of the floodplain requires
    the use of remote sensing change detection to move toward a data-driven
    maintenance process, in particular, by using point cloud data. This is
    nowadays a widely used data source in a variety of fields to capture elevations
    and in this way extract valuable information from terrains. Despite its
    usage in a variety of applications, the data is often underused since
    the data is frequently processed directly to other data formats. This
    research therefore aims to reveal the potential of explorative point clouds
    in floodplain maintenance. Light Detection and Ranging (LiDAR)- and multispectral
    data were acquired at two moments, one before and one after the summer,
    with a time interval of 45 days. Subsequently, these acquired datasets
    evolved into an explorative point cloud by adding attributes, including
    vegetation health, also known as Normalized Difference Vegetation Index
    (NDVI), and the distance between these two point clouds, the cloud-to-cloud
    distance. This explorative point cloud with the integrated additional
    information was visualised to several disciplines involved in the WOCU
    project. This was done in Three Dimensional (3D) by using Virtual Reality
    (VR). This collaborative approach revealed the potential use cases of
    the Red, Green, Blue (RGB), cloud-to-cloud distance, and NDVI point clouds
    highlighting the potential of explorative point clouds. Potential use
    cases that were found are; highly detailed area modeling, vegetation overgrowth
    monitoring, bank erosion detection, flora status assessment, monitoring
    of vegetation types, digital inspection of remote sites, participation
    medium, and identification of atrophied ground patches. Attributes added
    to point clouds enhanced insights. Especially the RGB point cloud sparked
    excitement due to its realistic appearance. The Cloud-to-Cloud Distance
    (C2CD) attribute showed potential, especially for erosion detection. However,
    due to the short timeframe between measurements, it could not be detected.
    The NDVI attribute was perceived as less interesting. The use of explorative
    point clouds, generated from raw LiDAR point cloud data, offers potential
    uses and insights for floodplain maintenance. The interdisciplinary value
    of explorative point clouds was clearly visible. This thesis emphasizes
    that underused raw LiDAR data, by making it explorative, can act as a
    valuable resource.
  uuid: e1fdfc2b-c0e3-4c02-bb78-cdbf0cc10c1a
- surname: Tsai
  name: Bing-Shiuan
  title: '3DCityDB-Tools plug-in for QGIS: Adding server-side support to 3DCityDB
    v.5.0'
  supervisors: Giorgio Agugiaro; Camilo León Sánchez; Claus Nagel; Zhihang
    Yao
  year: 2024
  graduation_date: '2024-10-29'
  link: https://resolver.tudelft.nl/uuid:5992ba24-8618-48d7-9e24-28839b5da16b
  image: 2024_Tsai.jpg
  github: https://github.com/bsttsai/3DCityDB-Tools-for-QGIS_beta/tree/thesis_final
  abstract: 'Semantic 3D city models are essential for visualising, analysing,
    and managing the built environment. CityGML is an international standard
    for representing 3D spatial information with a Unified Modelling Language
    (UML)-based data model to address data heterogeneity and facilitate data
    exchange. Common formats for encoding CityGML data include Extensible
    Markup Language (XML), CityJSON, and relational databases, with PostgreSQL
    preferred for its spatial data management capabilities enhanced by PostGIS.
    Although relational databases like 3D City Database (3DCityDB) support
    CityGML v.1.0 and 2.0, challenges remain due to complex schemas and the
    need for advanced Structured Query Language (SQL) knowledge to access
    nested features and attributes of the encoded CityGML data, especially
    through Geographical Information System (GIS) software like QGIS, which
    is widely used by Architecture, Engineering and Construction (AEC) professionals.
    To address these issues, the 3DCityDB-Tools plug-in for QGIS (plug-in)
    developed by the 3D Geoinformation group at TU Delft simplifies interactions
    with 3DCityDB-encoded data by providing a user-friendly QGIS interface,
    enabling the creation of GIS layers composed of unique feature geometries
    and associated with attributes. With the release of CityGML v.3.0 in 2021,
    3DCityDB is being updated to version 5.0, requiring corresponding changes
    to the plug-in for compatibility. This thesis investigates the changes
    in the CityGML spatial concepts and the differences in 3DCityDB encoding.
    The methods are derived based on the 3DCityDB v.5.0 structure, which consists
    of schema-wise scans for checking the existing feature geometries and
    attributes. The scan results are then stored in the metadata tables for
    users to select the desired feature geometries and attributes for generating
    GIS layers. In the implementation, feature geometries are determined by
    the inherited fixed spatial properties of space or boundary features.
    In contrast, the feature attributes are classified into four types: ”Inline-Single”,
    ”Inline-Multiple”, ”Nested-Single” and ”Nested-Multiple” according to
    the modified 3DCityDB encoding. Each type requires specific flattening
    (linearisation) strategies to be joined with the geometries. Finally,
    users can generate GIS layers by joining the queried feature geometries
    and attributes. Several query time performance tests are conducted to
    determine the method for storing query results and creating the layers.
    The generated GIS layers demonstrate flexible access to the feature geometries
    and attributes with enhanced attribute management. The attribute flattening
    method facilitates the consumption of complex attributes, making them
    accessible for batch querying in QGIS. While direct editing of geometries
    and attributes in GIS layers is not yet supported, these advancements
    increase the usability of CityGML data. Coping with the XML complex feature
    schema is a persistent technical challenge in the GIS applications; the
    proposed approach provides promising alternatives that align with the
    ongoing development efforts in the QGIS community, offering a complementary
    pathway for handling complex geospatial data.'
  uuid: 5992ba24-8618-48d7-9e24-28839b5da16b
- surname: van Aalst
  name: Marjolein
  title: A standards-based portal for integrated Land Administration information
    - A case study of the Netherlands
  supervisors: Peter van Oosterom
  year: 2024
  graduation_date: '2024-04-10'
  link: https://resolver.tudelft.nl/uuid:1de8932b-2106-4b7b-9b32-7fc4b70a3cc6
  image: 2024_van-Aalst.jpg
  abstract: Land administration is the organized and systematic process of
    establishing and maintaining information about land. The efficient practice
    of land administration is anticipated to organize land registers for the
    provision of cross-sector and cross-border land administration services.
    Such a system should provide fundamental information regarding land administration
    without requiring access to land registers or geoportals. Due to disaggregated
    land administration systems in the Netherlands, land administration information
    related to the Dutch territory must be accessed through various geoportals.
    These geoportals include PDOK, Ruimtelijkeplan nen, Wozwaardeloket, Bagviewer,
    and Kaartenvannederland. These geoportals utilize different approaches
    to information delivery, processing and retrieval. The basic assumption
    for the functionality of land administration is the interoperability of
    data from different registers and geoportals containing land administration
    information. Therefore, there appears to be a need for an integrated land
    administration information system. The Land Administration Domain Model
    (LADM) as a conceptual model is a way to integrate land administration
    information into the organized environment of a Spatial Data Infrastructure
    (SDI) for efficient data organization and accessibility. The second edition
    of LADM consists of five parts about the generic conceptual model, land
    registration, marine georegulation, valuation information and spatial
    plan information. This study examines the benefits and drawbacks of the
    implementation of the LADM Edition II for data dissemination in the Netherlands
    with a linked data portal. An analysis has been conducted on the current
    state of LADM Edition II. Two use cases were identified and modelled to
    assess the implementation of LADM. Country profiles of the Netherlands
    were developed to adapt the model to country-specific needs. Linked data,
    a technique based on standardized web technologies, can enhance the capabilities
    of an SDI. To enable the implementation of the model with linked data,
    the country profiles were converted into an OWL ontology model, and datasets
    based on the Dutch registers were created in accordance with the ontology.
    Finally, a data story was developed using SPARQL queries to query and
    present the data for the use cases. A data story is a narrative that makes
    data comprehensible to a wider audience. The assessment shows that the
    implementation of LADM Edition II for data dissemination in the Netherlands
    with a linked data portal has the potential to offer benefits in terms
    of time efficiency, resource efficiency and usability. This is the result
    of linking multiple registers from different domains of land administration,
    which enables the consultation of a single geoportal, the data story.
    However, this requires significant investment. The country profile has
    to be validated, datasets have to be created according to the ontology
    by matching the attributes in the Dutch registers with the attributes
    in LADM, and SPARQL queries have to be written to retrieve the data. These
    last two steps require a thorough understanding of the Dutch land administration
    systems and the ontology, and can be a time-consuming task. It remains
    to be seen whether the benefits of LADM in the Dutch context are worth
    the investment required for implementation.
  uuid: 1de8932b-2106-4b7b-9b32-7fc4b70a3cc6
- surname: van Esch
  name: Marieke
  title: From thermal comfort to heat mitigation action - A reproducable QGIS
    plugin for calculating the physiological equivalent temperature in Dutch
    cities
  supervisors: Edward Verbree; Stefan van der Spek; Marjolein van Esch
  year: 2024
  graduation_date: '2024-04-17'
  link: https://resolver.tudelft.nl/uuid:c05dedaa-5beb-45f9-b107-9ccd93b29e64
  image: 2024_van-Esch.jpg
  abstract: In the summer of 2023, heatwaves became quite prominent in the
    south of Europe. Due to the extreme heat, the health of those citizens
    was affected. The Netherlands Meteorological Institute predicts an increase
    in heatwaves in the future for the Netherlands as well. The main research
    question is how to propose a strategy for a liveable environment by designing
    public spaces while mitigating heat stress for vulnerable target groups
    in the context of Bospolder Tussendijken in Rotterdam. This research questions
    also how a reproducible tool could help identify heat stress and test
    design interventions in Dutch cities. The research included a literature
    review, expert consultations, scenario planning, modelling of the urban
    environment and mapping techniques. Comparing the heat stress software
    reproducibility, computation time, possibility to test design interventions
    and the scale of modelling were important. Improvements in the reproducibility
    of the PET map of Koopmans et al. (2020) are made by creating an open-accessible
    QGIS plugin applicable to Dutch cities. This helps urban designers to
    indicate and test their design interventions. Refinement of the wind calculation
    contributed to speeding up calculation times of the wind for neighbourhood
    and city scale areas. Future research should focus on some refinement
    in PET calibration to work properly, and advanced wind modelling is required
    for urban design practices. The application in the Rotterdam test case
    study emphasizes the importance of maintaining liveability now and in
    the future. By enhancing social liveability and physical liveability within
    a network of heat-mitigating interventions liveability is guaranteed.
    By revealing the vulnerable groups and their social interactions on a
    summer day, the most frequently used routes are qualified for refurbishment.
    Based on the current quality of social space and walkable environment,
    ownership and degree of open space on the street level, the interventions
    are chosen for the situation. The research emphasized the importance of
    identifying heat stress in public spaces and the need for urgent action
    to maintain the quality of life in the future. By integrating informed
    strategies from multiple fields like Geomatics and Urbanism a climate-adaptive
    and healthy environment can take shape.
  uuid: c05dedaa-5beb-45f9-b107-9ccd93b29e64
- surname: Wei
  name: Qiuxian
  title: Multi-levels of detail terrain construction for navigation
  supervisors: Ken Arroyo Ohori; Stelios Vitalis
  year: 2024
  graduation_date: '2024-07-03'
  link: https://resolver.tudelft.nl/uuid:5b504409-dace-4569-93c0-a9be4f49c478
  image: 2024_Wei.jpg
  abstract: Web mapping is essential in many fields, including navigation,
    real estate, and tourism. With advances in mapping technology, 3D web
    mapping has been introduced by multiple geospatial platforms. Compared
    to 2D web mapping, 3D web mapping provides more details, better visual
    effects, and is crucial for applications like digital twins. In navigation,
    terrain is a fundamental element in 3D mapping. However, the vast amount
    of data from 3D models requires the use of multiple Levels of Detail (LoDs)
    to reduce data consumption and request time on the client side. Without
    further processing, different LoD models will have gaps at their boundaries.
    Such gaps can cause visual inconsistency and artifacts. Locking boundaries
    is a commonly used method to solve the gaps in different LoDs problems,
    that is to maintain the vertices on the boundaries during simplification.
    While this the method causes inefficiency in simplification. Nanite (Nan)
    proposed a method using triangle clustering to address issues with Level-of-detail
    (LoD) model gaps, inefficiencies in cluster simplifications, and visual
    inconsistencies caused by locked boundaries. This method can be applied
    to large-scale models, such as terrain data. However, this method was
    only applied to local data use cases and not to web mapping. Therefore,
    this thesis investigates adapting the triangle clustering method for web
    mapping. Considering the fact that the Nanite triangle clustering method
    performs well on multi-LoD models (Nan), we believe this method could
    also be migrated to the area of large-scale terrain. We proposed a method
    to construct multi-level LoD terrain for navigation based on Nanite method.
    In our approach, large-scale terrain data is distributed using web tiles
    for navigation purposes. Keywords— WebGIS; Web mapping; 3D map; Multi-LoD
  uuid: 5b504409-dace-4569-93c0-a9be4f49c478
- surname: Xu
  name: Longxiang
  title: Large-scale, High-resolution Urban solar potential analysis through
    semantic 3D city models
  year: 2024
  image: 2024_Xu.jpg
  paper: https://repository.tudelft.nl/record/uuid:5a8d60e7-ac2b-4786-b003-57f3007a473c
