- surname: Bantis
  name: Thanos
  title: Aerostat Photogrammetry for Large Scale Hydrological Modeling with
    Special Focus on Energy Balance Terms
  supervisors: Nick van de Giesen; Kourosh Khoshelham; Sisi Zlatanova
  year: 2008
  link: https://resolver.tudelft.nl/uuid:3617d20d-43e8-4bbb-a54e-e1a5323cf882
  image: 2008_Bantis.jpg
  abstract: Knowledge of temperature distributions on streams and lakes is
    considered to be a valuable source of information for a wide range of
    disciplines such as ecologists, hydrologists and geochemists, as it can
    provide insights into the dynamics of these water bodies (Westhoff, 2006).
    Modeling of surface water temperature on the other hand is a complex process
    requiring coupling of spatial and hydrological data (Boyd, Kasper, 2003).
    At local scales, all influences of the landscape to the water temperature
    are considered important, even those which are too difficult to quantify.
    High resolution terrain data can compensate landscape influences by providing
    insight in the thermal effects of direct solar radiation (by shadow modeling)
    and longwave radiation (by modeling of ‘Sky View Coefficient’, SVC). Usually,
    the demand on high resolution terrain data is translated into increased
    costs during acquisition. As a result, scientists interested in temperature
    distribution along streams are forced to make a compromise between costs
    and more detailed temperature modeling. Photogrammetry employed from an
    aerostat platform is proposed as an inexpensive technique, able at providing
    terrain data of centimeter level accuracy and resolution. The applicability
    of the proposed method was tested on a first order stream located in Maisbich
    subcatchment in central Luxembourg, where temperature modeling experiments
    are taking place. A 10 x 10 cm digital elevation model (DEM) was extracted
    using photogrammetric principles for the upstream and downstream part
    of the subcatchment. The accuracy of the derived DEM was assessed using
    ground truth points measured by a total station and points collected using
    the floating mark principle. The resulted height root mean squared error
    was found 7cm for the upstream and 6.44 cm for the downstream part having
    the ground truth points as reference, and 8.34 cm and 23.14 cm having
    the floating mark points as reference. The DEM served as a basis for information
    extraction relevant to the temperature distribution model. The influence
    of shadow in the stream temperature was modeled using hillshade and viewshed
    algorithms. The SVC was modeled by using upward looking viewshed algorithms.
    The resulted data were imported in the temperature model. An improvement
    of 0.0727°C was observed when compared to the temperature output using
    data from a coarser DEM (5 x 5 meters).
