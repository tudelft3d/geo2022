    as Geomatics
- surname: Herrera
  name: Meylin Herrera
  title: Landslide Detection using Random Forest Classifier
  supervisors: Mathias Lemmens
  year: 2019
  graduation_date: '2019-11-07'
  link: https://resolver.tudelft.nl/uuid:52fe6b3b-ec0b-4cad-b51d-7798830688a4
  image: 2019_Herrera.jpg
  abstract: Landslides are destructive and recurrent natural disasters that
    cost annually significant social and economic losses all over the world.
    These events can be induced by natural factors as earthquakes and extreme
    rainfall, as well as by human intervention, including construction and
    mining. A primary resource to conduct landslides studies for prediction,
    risk assessment, and mitigation are historical databases with accurate
    location of individual events. To increase the location accuracy of those
    past landslide events, and optimize conventional time- and cost- consuming
    mapping routines, this study aims to develop an automatic landslide detection
    method from free-of-charge optical satellite imagery (Sentinel-2) and
    global Digital Elevation Model (ALOS World3D-30m DEM) using Object-based
    Image Analysis (OBIA) in combination with Machine Learning (ML). Existing
    works have successfully used earth-observation datasets for the generation
    of landslides databases. Most of them apply rule-based techniques using
    features thresholds that are not global and therefore perform poorly when
    applied to new regions where the method was not developed. This study
    presents a first attempt of an automatic method that generalizes to landslides
    occurring over the entire world without knowledge of their cause or triggering
    factor. To obtain a robust method that can deal with the complex characteristics
    of landslides (e.g. diversity of shapes/sizes, land cover, illumination
    and spectral variability), we explored OBIA, an image processing technique
    that has demonstrated better performance than the pixel-based approach,
    specially when the target objects are bigger than the cell resolution.
    The developed method consists in cloud-free images acquisition and determination
    of suitable features for image segmentation and image classification.
    For the image segmentation, we developed a two-step approach that consists
    in an initial segmentation using k-means and the Red/Green Difference
    (RGD) as input feature to create homogeneous segments and isolate landslides
    from non-landslides. This first approach leads to oversegmentation of
    non-landslide areas and, consequently, to an imbalanced dataset. The second
    step consists in a merging algorithm using Normalized Difference Vegetation
    Index (NDVI) as input feature to merge homogeneous non-landslide segments
    and balance the dataset. These two-stages include the setting of parameters
    as the number of clusters (K) and NDVI thresholds that were experimentally
    derived. Once the segments are created and the dataset is balanced, a
    non-parametric supervised classification using Random Forest (RF) was
    applied to identify landslide segments; the main advantage of this classifier
    is that it can deal with different statistical distributions of features
    and can handle imbalanced datasets. Using a training and testing set of
    70% and 30%, our method achieved a precision of 83%, recall of 83%, and
    f1-score of 83%. We found that topographic features have less influence
    than spectral ones; however, their exclusion decreases the model performance
    in about 10%. Our method is built using entirely open source technologies
    allowing its applicability and re-usability. For future work, we propose
    to use our method to detect new landslides and increase the number of
    training samples. Additionally, we recommend to explore a complementary
    approach to the merging algorithm to reduce the number of non-landslide
    segments, balance the dataset, and keep accurate classification results
    while more training images are added to the model.
  uuid: 52fe6b3b-ec0b-4cad-b51d-7798830688a4
- surname: Klaassen
  name: Pim
  title: Using neural networks to model the behavior in vessel trajectories
  supervisors: Martijn Meijers
  year: 2019
  graduation_date: '2019-10-29'
  link: https://resolver.tudelft.nl/uuid:a8ffd9f2-43b3-413e-a9f7-7e6c94cd65c1
  image: 2019_Klaassen.jpg
  abstract: The contemporary trend shows a shift from rule-based algorithms
    to deep learning. In the last few years, this field has been developing
    rapidly and its popularity has increased to a large extent. This happened
    for a good reason, since deep learning was able to solve some of the hardest
    problems in fields like image recognition, natural language processing
    and speech recognition. A large proportion of its success has to be credited
    to the explosion of big data in the past two decades. Structured data
    sets are essential to deep learning systems. The rising amount of automatic
    identification system data is a key example in the current big data boom.
    The automatic identification system produces spatiotemporal movement data
    of vessels. It was designed as a collision avoidance system, but researchers
    have been looking into ways to leverage its data for other tasks. Analyzing
    behavior in the movement data of vessels can help policymakers and monitoring
    operators with decision making processes. Improving these processes lead
    to safer and more resilient marine environments. Unfortunately, the possibility
    of applying deep learning on vessel movement data is an underexposed topic.
    This project attempts to explore the research gap in this topic. The objective
    is therefore to give an overview of the possibilities, complications and
    opportunities given the current state of the art. Ultimately, this project
    may serve as a rough guide for those who wish to explore the crossings
    where deep learning and vessel movement data meet.
  uuid: a8ffd9f2-43b3-413e-a9f7-7e6c94cd65c1
- surname: Kleijwegt
  name: Cathelijne
  title: Establishing an object identification method based on the description
    of the neighbouring elements
  supervisors: Martijn Meijers
  year: 2019
  graduation_date: '2019-01-25'
  link: https://resolver.tudelft.nl/uuid:a52a8c16-d682-4a75-b430-af6f2a1d3504
  image: 2019_Kleijwegt.jpg
  abstract: 'Broken glass from a bus stop, litter on the ground, a broken
    lamppost, and more things like this can be encountered in a municipality.
    To improve the process of mapping the issues and fixing them Fixi is developed
    by Decos. Fixi is an application in which citizens can report issues in
    public space. A citizen can report the issue he or she encounters in Fixi
    and the handlers of the municipality will use this inventory to improve
    the quality of the municipality. The issues are mapped using GNSS or pin-pointing
    it out on the map, but these options are not always available. This thesis
    research explores object identification based on the description of neighbouring
    elements. By providing a method to identify the object by a description,
    an additional option for reporting issues is made available in Fixi. The
    neighbouring elements which are described by the user will function as
    reference points for the method. By combining the information, a suggestion
    of one or more objects can be presented to the user which should include
    the described object. The flow from description to output consists of
    five different elements: data input, preprocessing of the data, user input,
    processing, and output. Three versions of input and processing are developed
    and tested in this thesis research. (1) With spatial relationships and
    distances indicated by the user, (2) with spatial relationships, and (3)
    with distances indicated by the user. The type of elements that can be
    described by the user are based on the theory of Lynch [1960] and can
    be categorised in five different types: path, edge, district, node, and
    landmark. To test the method, the selectivity of the elements is tested
    and the output of the process is evaluated. This last test is done based
    on six criteria: (1) number of questions, (2) presence of object, (3)
    amount of suggested objects, (4) average distance to elements, (5) covered
    area of suggested objects, and (6) completion time of description. The
    tests have been executed on thirty scenarios spread over three municipalities:
    Westervoort, Amsterdam, and Joure. All scenarios presented the described
    object as one of the suggested objects, which means the object has been
    identified. In general scored version 3 with the distances indicated by
    the user the best results in the tested cases. Improvements are possible
    in elements like number of questions, average distance, and completion
    time.'
  uuid: a52a8c16-d682-4a75-b430-af6f2a1d3504
- surname: Meulmeester
  name: Roeland Willem Erik
  title: 'BIM Legal: Proposal for defining legal spaces for apartment rights
    in the Dutch cadastre using the IFC data model'
  supervisors: Peter van Oosterom
  year: 2019
  graduation_date: '2019-07-01'
  link: https://resolver.tudelft.nl/uuid:ca32eb79-7f53-4948-b3cb-d52a3b8c18a5
  image: 2019_Meulmeester.jpg
  abstract: In this thesis, a proof of concept is developed that describes
    a complete data processing chain for registering new apartment rights
    in 3D. This chain starts by defining and adding legal space to Industry
    Foundation Classes (IFC) Building Information Model (BIM) models. Once
    the IFC BIMs are enriched with legal space, the 3D parcels are automatically
    extracted. The legal space is checked and validated, and stored in a Land
    Administration Domain Model (LADM) compliant database. Finally, the legal
    space is visualised on a desktop and browser-based client. Currently,
    there is no functional 3D Cadastral system functional in the Netherlands.
    A pilot study has been conducted to register 3D rights on the railway
    station in the city of Delft. This complex area contained many stacked
    objects such as a tunnel, offices, shops, etc. [Stoter et al., 2017].
    However, the 3D drawings of the area were stored in a PDF document, which
    only serves as a visualisation tool in a separate document in the Public
    Registers. As a result, it is not possible to check for overlap with other
    3D Cadastral objects. This research focuses on registering apartment rights
    for a 3D cadastre by using IFC BIM models as source data. Apartment rights
    are one of the most common rights found in apartment complexes. The IFC
    file format is chosen because it is the most widely used open data format
    for the exchange of BIM. In the Netherlands, submitting a IFC BIM file
    is mandatory for obtaining a construction permit for buildings with a
    value of 10 million euro or higher. IFC BIM files contain a lot of information,
    including 3D geometries of the indoor spaces, constructions and building
    infrastructure. However, there is no explicit information defining the
    individual apartments (property units). Therefore, the IFC is enriched
    with legal space in order to enable fully automatic extraction of the
    3D spaces that belong to one apartment. This enrichment is based on analysing
    the current way of registering apartment rights using annotated 2D floorplans
    as part of a notarial deed [Kadaster, 2014, 2019c], analysing the Dutch
    legal system related to apartment rights, and based on this knowledge
    make a proposal for enriched IFC IFC files. To reach practical suggestions
    for the IFC enrichment, that can be used in the Architecture, Engineering
    and Construction (AEC) industry, stakeholders such as notaries, the Dutch
    cadastre, BIM experts and other parties are involved. Also, current guidelines
    and practices in the Netherlands on IFC usage have been taken carefully
    into consideration, such as specification documents of the National Government
    and the National BIM Platform. The conclusions of this research are that
    it is possible to enrich IFC BIM model with legal space in such a way
    that it fits current IFC BIM practices and legal system as much as possible.
    This is demonstrated with two use cases that describe the registration
    process of a (fictional) new apartment building, and sub splitting apartment
    rights of a (fictional) existing building. It is also concluded that there
    is still many future work to be done, such as improving the definition
    of legal space in IFC, further researching cadastral administration systems,
    and the changes to the current in the legal system that are required to
    facilitate 3D registration of property units.
  uuid: ca32eb79-7f53-4948-b3cb-d52a3b8c18a5
- surname: Micha
  name: Ioanna
  title: Design and Evaluate the OGC Web Services Architecture of a Geohazard
    analysis tool
  supervisors: Peter van Oosterom; Gerrit Hendriksen
  year: 2019
  graduation_date: '2019-11-01'
  link: https://resolver.tudelft.nl/uuid:2071a403-830f-4750-89d4-37e01f8f5034
  image: 2019_Micha.jpg
  abstract: Open standards like Open Geospatial Consortium (OGC) standards
    can be used to improve interoperability and re-usability among geospatial
    tools, datasets and services across the web. Today more than six thousands
    commercial and non commercial implementations of the OGC Web Services
    (OWS) are available, and more and more Geographical Information Systems
    (GIS) web applications, platforms and datasets are being published from
    organizations in the global geospatial community. This thesis explores
    if the GIS standards, their implementations, and the organizations themselves
    are mature enough to support quality decision making in sectors like the
    risk management, by developing GIS web applications with up-to-date spatial
    datasets and complex geo-processes. Motivation for this research has been
    the Risk Indicators for Infrastructure in Data scarce Environments (RI2DE)
    GIS web tool of Deltares institution, a tool that performs GIS analysis
    based on datasets with global coverage, in order to detect areas around
    road infrastructures that are susceptible against climate related geohazards,
    and its need to provide quality risk maps and more friendly to the user
    Graphical User Interface (GUI) through status reporting messages and control
    of the processes. The tool is developed with open source technology components,
    OWS and standard data formats (such us Geographic JavaScript Object Notation
    (JSON) (GeoJSON), JSON and eXtensible Markup Language (XML). Having as
    case study the RI2DE tool, within this research the OGC Web Processing
    Service (WPS) 2.0.2 standard that is responsible for publishing geoprocesses
    as web services and its free and open source PyWPS 4.0.0 implementation
    has been evaluated according to the new operations for job monitoring
    and job control that the standard offers, in order to assess if it is
    feasible to have status report messages and control of the processes.
    Moreover it has be assessed how easy is to find and access up-to-date
    datasets, services and tools from distributed Spatial Data Infrastructures
    (SDI)s that implement the Catalogue Service for the Web (CSW) standard,
    and how flexible are the WPS to accept different inputs. From an early
    stage of this research it has been clear that the status reporting and
    the control of the process would have been difficult to be implemented,
    since the PyWPS implementation of the WPS 2.0.2 is still undergoing until
    the delivery of this thesis. While the standard has been published since
    2015, the only available full implementation of it is from the ZOO-Project,
    which arise question regarding the complexity of the standard specification
    and the currently state-of-the-art technology. The greatest achievement
    of this thesis has been the integration of the distributed searching for
    services at different CSW catalogues, at the RI2DE tool web browser. While
    the implementation was achieved, many question were arise concerning the
    sharing of the produced geospatial information from organizations and
    countries.
  uuid: 2071a403-830f-4750-89d4-37e01f8f5034
- surname: Oldenburg
  name: Davey
  title: Reverse Household Waste Flow Mapping
  supervisors: Rusne Šileryte; Jantien Stoter
  year: 2019
  graduation_date: '2019-07-08'
  link: https://resolver.tudelft.nl/uuid:098b385b-5e63-4559-931d-679837bd13db
  image: 2019_Oldenburg.jpg
  abstract: 'Our linear way of producing has to come to an end. More and more
    companies and government institutions see the value of circularity of
    raw materials. The municipal- ity of Amsterdam published several reports
    to clarify the directions towards circu- larity. A report on waste-chains
    highlights the importance of organic residual flows for circular economy
    transition. This thesis focuses on organic residual streams, the lack
    of understanding of these streams has been mentioned as an obstacle to
    plan- ning by many of regional stakeholders. The topic of this thesis
    is formulated within the context of the REPAiR project by the AMS Institute.
    The starting point of this thesis is the waste collection location in
    public space and follows the waste back to the retailers of food. The
    households are identified, after which the used trashcan and the retailers
    of food are identified. To create the geographical connection between
    the three nodes in this thesis, a related works research is conducted.
    The main source of food waste is food retail and the main disposal is
    collection of residual waste. Since the municipality of Amsterdam is not
    collection organic waste separately, residual waste is considered. Multiple
    researches added spatial dimensions to their material flows, trying to
    cre- ate a better insight in sinks and flows of the chains. Household
    level is not reached. This leads to the research question: How can household
    waste flows be mapped in reverse based on their environment? To create
    the mentioned connections, two main methods are developed. First, the
    method household-to-trashcan and second, the method household-to-retail.
    The first method is simulating the pedestrian path from a household towards
    their used trashcan. A least cost raster is created from the BGT, the
    direct environment is translated into walkability values representing
    the willingness to walk on a certain object. By comparing the paths to
    different trashcans, the trashcan reachable with the smallest least cost
    value is picked. Another factor is inserted, considering that walking
    to the trashcan is mandatory trip, executed in as less time as possible,
    city hotspots are inserted. The hypothesis suggests that people are willing
    to walk further, if the residents can combine their trip to the trashcan
    with their trip to, for example, the supermarket. By changing the values
    in the least cost raster, this direction is made preferable. After the
    validation of this method is concluded, that a stronger influence of the
    city hotspot (among the tested values), results in a higher positive correlation
    of the number of households per trashcan and the mass of waste in the
    trashcan in kg. The second method household-to-retail, is a demonstration,
    due to the uncer- tainly and the many involved personal factors. Food
    retailers in different isochrone areas are given importance values based
    on their distance towards the considered household and the floor size
    of the retailer. After establishing the connections from trashcan to household
    and from house- hold to food retail, reverse distribution of the waste
    measure in the trashcan can be executed. In this way is known which household
    contributed how many kg per year to the trash composition of the used
    trashcan. When adding the other step, the contribution by the food retailers
    can be given. This thesis generates the first step in mapping residual
    waste flows touching household level. Promising positive correlations
    between the number of households using a trashcan and the kg measured
    inside this trashcan are shown. The method household-to-retail cannot
    be validated and is therefore only a demonstration. The outcome of this
    thesis is a step in the right direction to be able to follow waste through
    the waste chain, by analyzing results in trash composition and knowing
    which households and retailer contribute to this composition.'
  uuid: 098b385b-5e63-4559-931d-679837bd13db
- surname: Ruben
  name: Pablo
  title: 3D City Models in the Context of Urban Mining
  supervisors: Rusne Šileryte; Giorgio Agugiaro
  year: 2019
  graduation_date: '2019-07-05'
  link: https://resolver.tudelft.nl/uuid:0fd2ffec-f25a-4391-be68-e816cc2611dd
  image: 2019_Ruben.jpg
  abstract: 'Recently, the application of machine learning and data fusion
    techniques on hyperspectral imagery have demonstrated potential for ground
    cover classification at material level. Hereby, specific locations of
    resources enclosed in cities (e.g. roof materials) can be identified,
    which is critically relevant within the field of urban mining. A limitation
    of this approach is the so-called ''pepper and salt effect'', the oversensitivity
    of the classifiers to spectral variations within a pixel (e.g. chimneys,
    roof windows). Identifying and correcting affected pixels can be done
    statistically (e.g. using a majority filter), but not in cases where spectral
    variations affect a majority of pixels characterizing a surface. A solution
    to this limitation would be the usage of 3D city models containing the
    objects inducing the spectral variations. However, such highly detailed
    3D city models are often unavailable as they cannot be produced automatically
    yet. An alternative covered by this research is to use a less detailed
    3D city model and semantically enrich it with the required data. As 3D
    city models are usually produced using a point cloud, such a point cloud
    is used to perform the enrichment. The main research question addressed
    is therefore: How can a CityGML LOD2 model be semantically enriched in
    order to improve material classification performed on roof surfaces?.
    To address this, an existing LOD2 model was compared to a point cloud
    acquired by Ligth Detecation and Ranging and ''deviation'' points were
    identified. This identification uses a distance check for seed selection
    and performs a region growing with an orientation check. In a subsequent
    step, ''deviation'' point regions were translated into a geometric shape
    by usage of their Voronoi diagram and fused with the pixels of hyperspectral
    imagery. Part of this research is also a nominal validation analyzing
    a total of 41 buildings and 831 pixels located in the south of Rotterdam
    (Netherlands). Overall kappa values of up to 0.7 and commission errors
    as low as 10% (for the class ''clean'' pixels) were obtained, showing
    potential of the chosen method. Additionally, a rational validation was
    performed to assess the impact of potential tolerance of classifiers for
    ''spectral deviations''. This one only included 10 buildings, but took
    into account 328 pixels located up to 30% outside the roof surface A main
    outcome is the recommendation on settings to use depending on the specific
    user needs. To accurately quantify materials, relatively ''loose'' settings
    are recommended. In contrast, to identify presence of materials, stricter
    settings are recommended. Beyond this, recommendations to data suppliers
    and potential applications of the method to other fields are formulated.'
  uuid: 0fd2ffec-f25a-4391-be68-e816cc2611dd
- surname: Sajadian
  name: Melika
  title: Spatial and Temporal Analysis of Road Deformation based on Remote
    Sensing and Subsurface Exploration
  supervisors: Mathias Lemmens
  year: 2019
  graduation_date: '2019-11-07'
  link: https://resolver.tudelft.nl/uuid:9e836468-7291-4279-aa08-7d723ef11327
  image: 2019_Sajadian.jpg
  abstract: 'In the western part of the Netherlands, the soil contains mainly
    sand, peat, and clay which are known as soft soil layers. The buildings
    and infrastructures, such as roads, constructed on these soil layers are
    usually associated with substantial construction measures during the execution
    of the project and might suffer from damages induced by the post-construction
    deformations. In practice, one of the primary stages of road construction
    involves geotechnical in-situ investigations for determining the soil
    properties based on which the settlement is predicted through empirical
    models. There are several techniques for monitoring the post-construction
    deformation on roads, among which the most time and cost-efficient technique
    is advanced Differential InSAR (D-InSAR). Since no research has been dedicated
    to establishing a direct link between the geotechnical in situ measurements
    and deformation measurements, in this research, the main focus is to develop
    a fully data-driven methodology to model road deformation based on loading/unloading
    conditions and soil properties. The study area is the newly constructed
    part of the A4 highway (Delft-Schiedam) in the Netherlands. The proposed
    methodology in this research consists of three steps. In the first step
    of the methodology, the measurements that represent soil properties, loading/unloading
    and deformation measurements should be determined and gathered. Cone Penetration
    Testing (CPT) measurements and boreholes are two freely available data
    sets that represent soil properties. Another important soil property is
    the variations in soil water content can be characterized by temperature
    and precipitation. The latest stage of loading/unloading history can be
    determined by comparing the elevation of the study area before and after
    the construction. Deformation time series produced by D-InSAR techniques
    are suitable measurements for investigating spatiotemporal deformations
    on roads. After determining pre-processing steps for each of the raw data
    sets, the relevant parameters from each data source are extracted. In
    the next step, the correlations and similarities between the soil properties,
    loading/unloading condition, and deformation are investigated. The last
    step deals with extracting suitable features from CPT profiles in order
    to use machine learning to model the relationship between soil properties,
    loading/unloading conditions, and deformation. To this end, the CPT profiles
    are segmented, then qualitative (soil types) or quantitative descriptors
    of the segments are used as features. To determine the soil classes, Support
    Vector Machines (SVM) classifier is used. The relationship between soil
    properties, loading/unloading and the linear rate of deformation is modeled
    through two tree-based algorithms, i.e. Random Forests and Gradient tree-boosting.
    The Pearson correlation and the coefficient of determination between soil
    properties, loading/unloading and the linear rate of deformation are 0.6
    and 0.4, respectively. The correlation of deformation time series and
    temperature and precipitation is quite low and no consistent pattern could
    be found between the time delays. The soil classification by SVM classifier
    is more accurate compared to empirical charts. For the deformation modeling,
    the best performance metrics are obtained through the Gradient Boosting
    algorithm with quantitative descriptors as features, (Mean Absolute Error
    (MAE) is 1.1 mm/year, Root Mean Squared Error (RMSE) is 1.5 mm/year and
    the coefficient of determination is 0.5). In conclusion, the resulting
    models with different algorithms and different sets of features are of
    moderate accuracy. The uncertainty of the models is due to three main
    reasons: 1. The complexity of the study area in terms of construction
    history 2. Lack of other necessary data 3. The uncertainties caused by
    the proposed methodology.'
  uuid: 9e836468-7291-4279-aa08-7d723ef11327
- surname: Salheb
  name: Nebras
  title: Automatic Conversion of CityGML to IFC
  supervisors: Jantien Stoter
  year: 2019
  graduation_date: '2019-10-30'
  link: https://resolver.tudelft.nl/uuid:455b6060-5152-46eb-8c64-5382f915442b
  image: 2019_Salheb.jpg
  github: https://github.com/nsalheb/CityGML2IFC
  paper: https://www.int-arch-photogramm-remote-sens-spatial-inf-sci.net/XLIV-4-W1-2020/127/2020/
  abstract: This study presents a methodology to convert from the most dominant
    3D city model standard in 3D GIS to BIM. Namely, CityGML to IFC. IFC is
    chosen because it is the common open standard to exchange data in the
    BIM world. For the aim of this study, the two standards are divided into
    5 comparable sub-parts; Semantics, Geometry, Geographical coordinates,
    Topology, and Encoding. The characteristics of each of these sub-parts
    are studied and a theoretical conversion method is proposed for it from
    the first standard to the other. This is done by performing a semantic
    and geometrical mapping between the two standards, converting the georeferencing
    from Global to local, converting the encoding that the two standards use
    from XML to STEP, deciding which topological relations are to be retained,
    and providing a basic implementation that is created using Python to combine
    the above tasks. The work presented in this thesis can provide a foundation
    for future work in converting CityGML to IFC. It provides an insight into
    the relationship between the two standards and a methodology for the conversion
    from one to the other, and the process of developing software to perform
    such conversion. This is done in a way that can be extended for future
    specific needs.
  uuid: 455b6060-5152-46eb-8c64-5382f915442b
- surname: Theocharous
  name: Evangelos
  title: 'How to solve spatial problems using linked-data: the case of planning
    a shopping center in Delft'
  supervisors: Peter van Oosterom
  year: 2019
  graduation_date: '2019-04-10'
  link: https://resolver.tudelft.nl/uuid:843174be-bb0c-4bde-8df1-70022448e26e
  image: 2019_Theocharous.jpg
  abstract: The promotion of the data re-usability was the main motivation
    behind the conception of linked data. Spatial data can also be expressed
    as linked data. This thesis explores different approaches to utilize spatial
    data in linked data format, in order to determine if the technologies
    have matured enough to assist solving spatial problems. More precisely,
    it attempts to select a position to build a new shopping center in Delft,
    Netherlands by using relational data and linked data. Five different Linked-data
    implementations are identified and examined; two of them, a Geographic
    SPARQL Protocol and Resource Description Framework (RDF) Query Language
    (a recursive acronym for GeoSPARQL) (GeoSPARQL) endpoint and an API, are
    offered from Publieke Dienstverlening Op de Kaart (PDOK). The other three
    approaches are designed using Oracle Spatial and Graph. From the latter
    three, one approach utilizes linked data stored in a local database while
    the rest utilize relational data mapped into linked-data. All five approaches
    are assessed for GeoSPARQL compliance and are compared to a QGIS solution.
    From the aforementioned approaches, only the two mapping ones have achieved
    the desired solution. However, none of them fully complies with GeoSPARQL
    specification hence, further research is necessary.
  uuid: 843174be-bb0c-4bde-8df1-70022448e26e
- surname: Tzounakos
  name: Nikolaos
  title: Robust interior-exterior classification for 3d models
  supervisors: Liangliang Nan
  year: 2019
  graduation_date: '2019-06-27'
  link: https://resolver.tudelft.nl/uuid:9a8ebd7a-b807-4b7f-a9f6-cce73cc5315b
  image: 2019_Tzounakos.jpg
  abstract: The use of 3D models has been rapidly expanding, finding applications
    in both scientific and commercial fields. One common requirement for these
    various applications is the geometrical and topological validity of these
    models. However, many models available online contain deficiencies in
    various forms, such as duplicated geometry, gaps in the surface, etc..
    To cope with those deficiencies, a standard solution is the clean extraction
    of the model’s boundary, and simultaneously the model’s reconstruction
    in a way that its structure is valid. This thesis tackles a more generalized
    problem, the inside-outside classification for these models. Where many
    approaches might have requirements for running analysis, the methodology
    presented strives to robustly handle all cases. These last decades, there
    have been various approaches in solving the ”inside - outside classification
    problem”. A major attempt utilizes the winding number algorithm, in order
    to assign values to elements whose position is relevant to the input model.
    By assessing that value, a decision on whether the element in question
    is interior or exterior is taken. Other approaches work with casting rays,
    or other geometric analysis to also identify the borders of a model and
    segment the interior from the exterior. Also, since deficiencies inhibit
    the kick-starting of the necessary analysis, there are methods that try
    to restructure said models in order to clear any existing deficiencies.
    The methodology within this thesis will attempt a different approach from
    those that have been presented until now, which is transferring the problem
    from three into two dimensions. The first step is introducing a planar
    cross section on the area of interest. From there, through some graph
    reconstruction, geometric and optimization applications, a valid 1-manifold
    boundary of the cross-section is created. On that, the application of
    inside-outside classification through ray casting is possible. Assessing
    the results of the pipeline proves that the automated process can produce
    valid results, for a particular point of interest, related to an input
    model. The pipeline has been proven to function regardless of the cutting
    plane’s orientation, and can handle robustly a multitude of geometrically
    and topologically defective models. The results from this thesis can inspire
    further applications, and improvements on the pipeline can further evolve
    the quality of its outcome.
  uuid: 9a8ebd7a-b807-4b7f-a9f6-cce73cc5315b
- surname: van der Maaden
  name: Jippe
  title: Vario-scale visualization of the AHN2 point cloud
  supervisors: Peter van Oosterom; Martijn Meijers
  year: 2019
  graduation_date: '2019-04-15'
  link: https://resolver.tudelft.nl/uuid:42496941-d12a-48b0-af48-ae4cb12984a6
  image: 2019_van-der-Maaden.jpg
  abstract: LiDAR technologies are used to measure point cloud data of the
    earth's surface. The usage of LiDAR allows for the fast collections of
    massive data sets. The AHN2 point cloud data set, part of Rijkswaterstaats
    initiative to map the surface of the Netherlands, contains 639 478 217
    460 points. For efficient visualization in web viewers, these massive
    point clouds are stored in an octree data structure. Visualization through
    this method has the downside of discretely visualizing the point cloud.
    These discrete artefacts are referred to as density jumps, and are visible
    where there is a boundary between blocks retrieved from the octree. These
    blocks contain different densities because they are retrieved from different
    levels of the octree. This thesis proposes a continuous visualization
    method for massive point cloud data sets that aims to eliminate these
    density jumps. While the continuous visualization of vector data sets
    has been extensively researched, this is a novel field of research for
    point cloud data sets. This thesis explores the feasibility of a vario-scale
    visualization method, and aims to implement it in an existing web viewer
    architecture. Due to the massive nature of the AHN2 data set, cloud computing
    and distributed computing techniques are used to imrove the workflow.
    The presented methodology removes the \textit{density jumps} by determining
    an upper density bound for the point cloud density relative to the camera
    position. Circle packing theory is used to reinforce the upper bound continuously,
    thus removing artefacts created by discrete density jumps. A proof-of-concept
    for this theory is implemented in an existing point cloud web viewer architecture.
  uuid: 42496941-d12a-48b0-af48-ae4cb12984a6
- surname: Wang
  name: Qu
  title: 3D breakline extraction from point clouds with the medial axis transform
  supervisors: Ravi Peters
  year: 2019
  graduation_date: '2019-06-09'
  link: https://resolver.tudelft.nl/uuid:ba8e4bf4-e473-410b-a1f0-ef48e9c2fbf3
  image: 2019_Wang.jpg
  abstract: 'This project develop a new method to generate breakline from
    the point cloud directly with the MAT. The breakline is a structured line
    of the object surface which has high curvature. Meanwhile, the reciprocal
    of the medial edge ball''s radius can represent the point with high curvature,
    which is the fundamental idea of this project. The key parts of the method
    are: (a) with the help of MAT detecting candidate points having high curvature;
    (b) connect the candidate points to get breaklines with graph theory or
    polynomial fitting. The topology of the breakline is considered. In addition,
    this project also provides the polyline simplification and smoothing.
    In the resulting breakline, 27/32 are true positive. In general, the average
    correctness is 97% and 96%, the average quality is 90.67% and 91.19%,
    and the average completeness is 93.84% and 93.92% for valley and ridge.
    Most of accuracy parameters are above 80%. The accuracy is high. As to
    the precision, the average polyline precision is 0.3 and 0.23, and the
    average vertex precision is 1.14 meter and 1.12 meter. Comparing with
    the point density 2 pts/m^2. 25 of 27 breaklines'' polyline precision
    is better than 0.5. 16 of 27 breakline''s vertex precision is better than
    1.0; and 23 of 26 is better than 1.5. The precision is also good. The
    source code is on Github: https://github.com/qq2012/geoflow-nodes.'
  uuid: ba8e4bf4-e473-410b-a1f0-ef48e9c2fbf3
- surname: Wu
  name: Teng
  title: Visibility analysis in a point cloud based on the medial axis transform
  supervisors: Ravi Peters
  year: 2019
  graduation_date: '2019-11-11'
  link: https://resolver.tudelft.nl/uuid:1b2da021-816b-4516-9e4d-e8315707b6fc
  image: 2019_Wu.jpg
  github: https://github.com/twut/geoflow-nodes
  abstract: This thesis proposes a novel medial axis transform (MAT) based
    method to achieve visibility analysis in a point cloud. There are several
    advantages of this MAT based method. This method avoids surface reconstruction
    from a point cloud. It also works for the situation when there is surface
    missing in the input point cloud. For different point cloud datasets such
    as point cloud generated from meshes, AHN3 point cloud and point cloud
    generated from dense image matching, this method successfully deliver
    decent visibility result for all of them. The main challenge overcome
    in this thesis is the interior and exterior MAT separation. Two approaches,
    normal reorientation approach and bisector based approach are experimented
    in the thesis to separate MAT. The normal reorientation approach only
    works for point cloud generated from meshes. The bisector based approaches
    works for all the datasets testes. It successfully separates the interior
    and exterior MAT when there is surfacing missing. To speed up of the query
    process, spatial index is generated for interior MAT. In this thesis,
    two spatial indices are implemented, KD-Tree and R-Tree. Due to the limitation
    of my KD-Tree implementation, the KD-Tree does not improve the running
    speed obvious. There is a room to improve the KD-Tree implementation.
    The R-Tree achieves sharply improvement on running time of the queries.
    For 51567 points, the query based on R-Tree finished in 1880 ms. In a
    word, this thesis proposed an efficient MAT based method of visibility
    analysis in a point cloud.
  uuid: 1b2da021-816b-4516-9e4d-e8315707b6fc
- surname: Xenakis
  name: Dimitris
  title: 'Placement optimization of Positioning Nodes: Maximizing the distinction
    of Indoor Zones'
  supervisors: Edward Verbree; Martijn Meijers
  year: 2019
  graduation_date: '2019-10-29'
  link: https://resolver.tudelft.nl/uuid:4539b64d-1b05-49d0-9dfe-cacf3ffbfd7c
  image: 2019_Xenakis.jpg
  abstract: The performance of an Indoor Positioning System is highly related
    to the placement of the transmitting nodes that are used as references
    for the positioning estimations. Within this graduation project, we propose
    a methodology that can be used to optimize such a deployment and thus,
    increase the performance of an Indoor Positioning System that a) is based
    on Received Signal Strength Fingerprinting and b) is orientated towards
    providing location or zone estimations instead of exact positioning. The
    optimization process involves 4 fundamental components. Firstly, the modeling
    of the obstructions in the indoor environment and also the zone modeling.
    Then, the definition of the performance metric that can be used to evaluate
    each different deployment scenario, in which case, our proposed metric
    considers the separation area and distances between the zones in the RSS
    vector space. The third component is the radio propagation model, required
    for simulating the transmitted signals from each node, where a model based
    on the ray tracing technique is selected. Finally, the last component
    is the selection of the optimization function that will control and drive
    the whole optimization process by choosing which deployment schemes to
    evaluate. For that, the utilization of a Genetic Algorithm has been selected.
    The evaluation of our methodology showed that the most problematic regions
    in terms of localization accuracy are, as expected, those where different
    zones become adjacent. Yet, comparisons between regular node deployments
    and our optimized solutions indicated that, regardless the number of nodes,
    our optimization introduced in each case an overall localization improvement
    that was especially concentrated at the most problematic regions.
  uuid: 4539b64d-1b05-49d0-9dfe-cacf3ffbfd7c
- surname: Xu
  name: Yixin
  title: 'Improving location accuracy of a crowdsourced weather station by
    using a point cloud: use case base Netatmo on the Hague'
  supervisors: Ken Arroyo Ohori; Alexander Wandl
  year: 2019
  graduation_date: '2019-07-04'
  link: https://resolver.tudelft.nl/uuid:b9cd47d6-c54f-40f4-95f9-4e9624f1c859
  image: 2019_Xu.jpg
  github: https://github.com/yancyee/TUDMaster_code
  abstract: 'The world’s continuously increasing population leads to environmental
    challenges, among which, the urban heat island effect has been recognized
    as one of the leading environmental issues recently. Using traditional
    weather station (usually one or two within one city and placed in rural
    area) to monitor and model the canopy layer urban heat phenomenon does
    not provide enough spatial resolution. Alternatively, the Netatmo weather
    station, a low cost and citizen science weather sensor, is able to collect
    crowdsourced temperature records and has significant strength in spatial
    and temporal resolution in temperature measurement. Thanks to the variety
    of uses of the Netatmo weather station and its open API, more temperature
    data could be used for UHI research. However, for scientific use, the
    main challenge is the data quality. For one thing, the stations’ locations
    are set by users and are thus not accurate enough for temperature modeling
    in a complex city environment. For another, sensors some time generate
    unreliable records when exposed to solar radiance directly. These two
    things are actually highly interactional. Knowing the accurate location
    of stations could be helpful to calculate when the stations are exposed
    sun then filter outliers, and vice versa. However, the location information
    could be used to improve its accuracy is quite limited. Thus, the current
    work is focusing on develop an approach to determine the likely correct
    location of the stations. For the development of the relocation method,
    different spatial and sensor datasets have been used. The temperature
    data in the Hague in May, 2018 have been collected from Netatmo weather
    stations. Additionally, the AHN3 points cloud for solar simulation and
    BGT shapefile for creating new location have been investigated. The methodology
    of relocation process is divided into 6 steps: Sensor data pre-processing,
    Detecting higher temperature time, Generating potential location of stations,
    Computing sky view (dome) and solar parameter, Finding the most likely
    horizontal location of the station, and Assigning height value to points.
    These steps also have been used with another period time in the Hague
    for validation and one sample Netatmo sensor experiment in Delft will
    be conducted. The results proved the feasibility and rationality of the
    adopted methodology. Around 67% stations (new location) is shown more
    than 0.5 similarity when comparing with their solar simulation. Validation
    result detained by two period comparison indicates that over 70% Netatmo
    stations’ new location show high quality on both the horizontal and vertical
    dimensions after applying the process. Validation experiment is shown
    a real example of fluctuated air temperature and how it will be influenced
    by solar radiance. In the experiment, the location error is reduced from
    16 meters to 4 meters, which proves that the methodology adopted by the
    project is helpful to improve the station’s location accuracy.'
  uuid: b9cd47d6-c54f-40f4-95f9-4e9624f1c859
- surname: Braggaar
  name: Rob
  title: Wi-Fi network-based indoor localisation - The case of the TU Delft
    campus
  supervisors: Stefan van der Spek; Edward Verbree; Alexandra den Heijer
  year: 2018
  graduation_date: '2018-01-31'
  link: https://resolver.tudelft.nl/uuid:bb3009cb-605e-4b80-9cf6-85f7dbc9ace8
  image: 2018_Braggaar.jpg
  abstract: 'The current trend towards the use of smart tools within universities
    open up new opportunities. Insight in the location and daily rhythms of
    users within the building form valuable input for many decision-making
    processes within campus management. Unlike the outdoor environment, where
    the position is easily obtained through omnipresent satellite-based positioning
    systems such as GPS, the use of these systems in indoor environments is
    limited. Various implementations of indoor positioning systems try to
    fill this gap and provide indoor positioning capabilities. However, the
    complex indoor environment presents its own challenges regarding positioning.
    The effectiveness of current implementations varies depending on techniques
    and methods used, while often being limited to function only within small
    test bed environments. Privacy, cost, scalability, ease of integration
    in the environment and many other decisive factors steer the choice for
    certain indoor positioning systems. Within this research the focus is
    on the development of a non-intrusive network-based indoor positioning
    system using Wi-Fi. Wi-Fi has clear advantages over other measuring techniques
    in that these systems are ubiquitous, cost-effective and their use is
    multi-faceted. Now over 85% of the users carry a smartphone. These off-the-shelf,
    unmodified smartphones and other Wi-Fi-enabled mobile devices can be used
    as mobile stations to indicate user locations through an iterative positioning
    process. Besides the mobile stations, existing Wi-Fi infrastructures and
    networking equipment can be re-used with minor adaptations. The following
    research question was addressed in this research: ''To what extent can
    indoor Wi-Fi positioning be used for indoor localisation in order to determine
    occupancy rhythms and movement patterns within and between rooms to support
    campus management?''. The research question was approached starting with
    exploring the different techniques and methods suited for indoor positioning
    or localisation. The case study was used to review and develop a system
    suitable for indoor campus environments. As the case study requires a
    non-intrusive and low-cost solution that functions without active user
    participation a signal propagation-based technique was chosen. Distances
    were estimated employing the signal strength metadata extracted from various
    802.11 management frames originating from user mobile devices. Various
    influences on the Wi-Fi signals were identified and a solution to counteract
    those influences was designed in the form of a differential Wi-Fi system
    using a grid of interconnected reference stations. With the use differential
    Wi-Fi correction parameters the positioning improved by mitigating for
    temporal environmental influences that are continuously present in indoor
    environments. Next, based on a comparison of different methods, a multilateration
    method was developed as the core of the positioning system. The multilateration
    algorithms combined with various filtering algorithms provide for a highly
    maintenance-free system with minimal manual set-up required. As the environment
    changes new training data is automatically acquired for ready-use. All
    algorithms were designed to work both in (near) real-time as well as non
    real-time, with configurable processing delays of at least 10 seconds.
    The longer delays allow for more observations, while the shorter delays
    are better for moving users and fast updates. Accuracies of 2 meters at
    the lower bounds are reported, ranging up to the 10 meter mark due to
    Wi-Fi characteristics. Various filtering and post-processing mechanisms
    were designed to generate accurate mappings from mobile devices to user
    counts. Furthermore, in the preparation phase different geometries were
    tested with reference stations 10 to 20 meters apart from each other.
    Preferred spatial geometries were matches as closely as possible for the
    deployment of the system in a real-world test case scenario. The designed
    reference stations were deployed in the Architecture faculty building
    to monitor occupancy and movement patterns before, during and after a
    fire drill. Ground truth was acquired using BLE wrist bands and manual
    counting. The fire drill had different elements: counting the number of
    users per m2 and per room, the occupancy rhythms over time and the movement
    patterns. Overall during 48% of the uncontrolled testing a 100% match
    between BLE wrist band equipped user counts and Wi-Fi counts was achieved.
    In 77% of the cases there was a 1 person difference in counting, where
    in more than 95% of the cases the maximum difference was 4 persons. In
    conclusion, with this localisation system the occupancy rhythms and movement
    patterns of users can be measured to a large extent to aid in the various
    tasks of campus management, e.g. planning, and safety evacuations.'
  uuid: bb3009cb-605e-4b80-9cf6-85f7dbc9ace8
- surname: Cemellini
  name: Barbara
  title: Web-based visualization of 3D cadastre
  supervisors: Peter van Oosterom; Marianne de Vries; Rodney Thompson
  year: 2018
  graduation_date: '2018-07-13'
  link: https://resolver.tudelft.nl/uuid:c38d2ee0-9fe7-47db-9f9e-d1afc899ee2c
  image: 2018_Cemellini.jpg
  abstract: Many countries in the world are extending their cadastral visualization
    systems in the third dimension. The reason of this, stems from the increasing
    complexity of contemporary cities, the growing 3D approach in other fields
    (including 3D spatial data acquisition, spatial data processing and visualization)
    which made 3D cadastre technologically feasible, and the need to overcome
    the issues of 2D visualization. The visualization of cadastral parcels
    in 3D is a huge challenge, since legal boundaries are, in some cases,
    invisible in the real world. Several countries built their own 3D cadastre
    (partial) systems/prototypes which are still lacking some crucial functionalities,
    therefore this research will try to fill some of the gaps of the existing
    cadastral systems with a special focus on visualization and dissemination
    aspects. The goal of this research is to solve issues of occlusion, representation
    of unbounded vol- umes and ambiguous perception (in terms of position,
    size and shape) of objects in the con- text of 3D cadastre visualization.
    Additionally, the combination of topography and cadastral parcels is a
    double-edged sword; on one hand, it is useful for orientation purposes
    but, on the other hand, the growing complexity and increasing occlusion
    can make the visualization more challenging. The exploration of specific
    interaction techniques is fundamental to over- come these issues. This
    document provides guidance on the system design choices to implement a
    3D cadas- tre prototype. The study starts with a theoretical and a technological
    research carried out to investigate the state of the art in 3D cadastre
    visualization and to explore the existing WebGL platforms on which to
    build a successful prototype. Along with these phases, two lists of requirements
    are created; the first one related to 3D visualization issues and the
    second one related to the web viewer functionalities. The implementation
    of the prototype is carried out following (part of) the requirements listed,
    leaving the rest for future work. The development phase is the core of
    the research and includes the selection of the datasets and of the area
    of interest located in the city centre of Brisbane, Australia. In addition
    to that, the definition of the LADM compliant storage schema and the process
    of data encoding, to transform the data from survey plans to a cadastral
    database, are described. Although these steps are not in the main scope,
    they are crucial for the development of the prototype. After that, different
    visualization functionalities have been implemented, each of them presenting
    drawbacks and difficulties mainly related to the data format chosen. In
    order to assess the usability and user-friendliness of the 3D cadastre
    prototype, a ques- tionnaire has been handed out to potential users of
    the application. Their feedback is funda- mental for this research and
    will provide insights on how to improve the actual design of the prototype.
  uuid: c38d2ee0-9fe7-47db-9f9e-d1afc899ee2c
- surname: Christodoulou
  name: Antria
  title: An image-based method for the pairwise registration of mobile laser
    scanning point clouds
  supervisors: Peter van Oosterom; Ravi Peters; Peter Joosten; Berry van Someren
  year: 2018
  graduation_date: '2018-10-30'
  link: https://resolver.tudelft.nl/uuid:5c1d2d90-8f2f-4dc2-b6c3-d5c635323c35
  image: 2018_Christodoulou.jpg
  abstract: In this thesis, an image-based method is proposed for solving
    the relative translation errors of 3D point clouds collected by Mobile
    Laser Scanning (MLS) techniques. The process of matching 3D point clouds
    is known as registration. Due to environment-depending limitations of
    the positioning component of MLS systems, when recording a certain scene
    more than once, point clouds recorded at different times tend to have
    mainly positioning distortions. Additionally, due to yaw-angle errors
    of the recording platform it is possible that the point clouds have small
    distortions around their Z axis or the point clouds are scanned with fuzziness.
    This project deals only with the translation errors. Various methods can
    be found in the literature to perform pair-wise registration of point
    clouds. Commonly, the challenge of aligning 3D features is tackled in
    3D. Only a few techniques for registering point clouds in 2D have being
    explored. However, the approach presented in this thesis uses the attributes
    of the 3D points to generate and match 2D-projections, by employing a
    simple correlation technique instead of matching in 3D. As a result, the
    developed method depends more on the number of pixels in the 2D-projections
    and less on the number of points in the point clouds. This leads to a
    more cost-efficient method in contrast to 3D registration techniques.
    The method uses this benefit to provide redundant translation parameters
    for each point cloud pair. Particularly, several images are created from
    each point cloud tile. The constructed images illustrate the density of
    the points, the intensity, the gradient of intensity, the depth, the gradient
    of the depth and the normal vectors of the points. As a result, the translation
    parameters are retrieved from the matching of various image-techniques
    and that is how redundant solutions are provided. Next, with the utilization
    of image-based evaluation criteria the reliable translation parameters
    are detected and only those are used to compute the final solutions. The
    reliable estimations are taken into account for the estimation of the
    final solutions. Since redundant solutions are provided, the confidence
    levels of each final estimation can be computed. In addition, an indication
    of robustness showing how many estimations where included for the computation
    of the final solution is included. As a result, the developed approach
    is capable of providing information about the precision and reliability
    of each pairwise registration. In such a way it is known which of the
    results can be used in a following step, such as a global registration.
    Furthermore, a 2D Gaussian elliptical fitting is used to obtain sub-pixel
    accuracy registration results, as the accuracy of the estimations is restricted
    to the pixel size of the generated images. It is proven that the developed
    image-based registration method has the capability to produce reliable
    matches when there is at least some overlap between two overlapping point
    clouds and corresponding objects between the point clouds are distinct
    in pairs of 2D projections. The technique developed for the computation
    of sub-pixel accuracy results seems to have potential, but further improvement
    is required.
  uuid: 5c1d2d90-8f2f-4dc2-b6c3-d5c635323c35
- surname: den Duijn
  name: Xander
  title: A 3D data modeling approach for integrated management of below and
    above ground utility network features
  supervisors: Sisi Zlatanova; Wilko Quak
  year: 2018
  graduation_date: '2018-01-24'
  link: https://resolver.tudelft.nl/uuid:fed24b16-cf95-4fa0-a109-ece6e91b61e9
  image: 2018_den-Duijn.jpg
  abstract: 'Precise and comprehensive knowledge about 3D urban space, critical
    infrastructures, and below ground features is required for simulation
    and analysis in the fields of urban and environmental planning, city administration
    and disaster management. In order to facilitate these applications, geo-information
    about functional, semantic, and topographic aspects of urban features,
    their mutual dependencies and relations are needed. Substantial work has
    been done in the modeling and representation of above ground features
    in the context of 3D city modelling by means of CityGML. However, the
    below ground part of the real world, of which utility networks form a
    big part, is often neglected in 3D city models. At the same time, several
    existing utility network data models exist. These are, however, commonly
    tailored to a specific domain and not suitable for the integrated modeling
    and representation of utility networks and city objects in 3D urban space
    This research proposes a 3D data modeling approach for integrated management
    of below ground utility networks features (viz. electricity and sewer)
    and related above ground city objects (viz. streetlights and manhole covers).
    The data modeling approach is successfully examined by implementing relationships
    between 1) the below ground electricity network and above ground streetlights
    and 2) between the sewer network and the above ground manhole covers.
    Having existing utility network data and city objects as input, a file
    in CityGML Utility Network ADE format is created. The manipulation of
    the data structure and content, according the proposed data modeling approach,
    is completed in FME. The output CityGML dataset allows interoperability
    but may become very large and objects may be arbitrarily nested leading
    to complex data structures. Therefore carefully optimized database schemas
    are required that enables efficient storage, management and data access
    of the CityGML data. The object-oriented CityGML data model, including
    the Utility Network ADE, is mapped to a relational database by means of
    the 3DCityDB. Subsequently, the CityGML data is inserted into the derived
    relational database. Several relevant (network) analyses are performed
    by querying the designed relational database. It shows the possibility
    to simulate what network features are affected by e.g. a utility strike
    by means of pgRouting and visualization in a GIS. This research made one
    of the first attempts to thoroughly model existing utility network data
    and city objects according the CityGML Utility Network ADE. Following
    are further research that could optimize the proposed data modeling approach
    for better decision making in the field of asset management: - Modeling
    multiple different utility networks and city objects - Modeling in a higher
    LoD - Detailing the CityGML Utility Network ADE classes and use - Better
    investigating on more types of analyses - Implementing larger datasets
    - Implementing datasets with a different accuracy - Exporting a CityGML
    file from the relational database - Better investigating on visualization
    of the data - Investigating on how to model different types of relationships'
  uuid: fed24b16-cf95-4fa0-a109-ece6e91b61e9
- surname: Dukai
  name: Balázs
  title: Exploring the automatic Level of Detail inference for the validation
    of buildings in 3D city models
  supervisors: Filip Biljecki
  year: 2018
  graduation_date: '2018-01-30'
  link: https://resolver.tudelft.nl/uuid:5e9ed2f0-ec9e-4d9e-9a6b-57488ddd0222
  image: 2018_Dukai.jpg
  abstract: There are several 3D city models available openly, worldwide.
    These models are used in various applications, from which many expects
    a homogeneous Level of Detail (LoD). Validating the accuracy of the LoD
    of a model requires the inference its LoD class and its conformance to
    the real-world object. This process quickly becomes infeasible for large
    models when done manually. Yet there is no automatic method for LoD inference
    and validation. Therefore the thesis proposes a method to automatically
    infer the geometric LoD (LoD0-2.3) in 3D city models. A central aspect
    of this work is the use of machine-learning to classify building models
    based on their LoD. It follows the assumption that a process is possible
    where a classifier trained in a synthetic 3D city model containing all
    LoD classes, and applied in real city model. Therefore ten geometry measures
    (features) are computed from the objects and tested with six classification
    algorithms. The six experiments the transferability of a classifier from
    the synthetic city model to the real one, multi-class (LoD0-2.3) and binary
    (LoD2 or not) classification, and the effect of LoD class imbalance by
    introducing various amounts of LoD1 objects into the LoD2 model. Furthermore,
    by using a point cloud as ground truth, this explored the possibility
    of validating the inferred LoD classes. The results indicate that the
    classifier is not transferable to the real data set when trained on the
    synthetic city model, which is probably due to the significant difference
    in object shapes between the two models. Binary classification outperforms
    the multi-class case and it is favourable for LoD validation where the
    main question is whether the model conforms the stated LoD or not. Finally,
    class-imbalance can reduce the classification with as much as 20%.
  uuid: 5e9ed2f0-ec9e-4d9e-9a6b-57488ddd0222
- surname: Griffioen
  name: Simon
  title: A voxel-based methodology to detect (clustered) outliers in aerial
    lidar point clouds
  supervisors: Ravi Peters; Hugo Ledoux
  year: 2018
  graduation_date: '2018-11-12'
  link: https://resolver.tudelft.nl/uuid:2ffa73f4-34cc-4ea0-82df-11e61cb47bea
  image: 2018_Griffioen.jpg
  abstract: 'To obtain 3D information of the Earth’s surface, airborne LiDAR
    technology is used to quickly capture high-precision measurements of the
    terrain. Unfortunately, laser scanning techniques are prone to producing
    outliers and noise (i.e. wrong measurements). Therefore, a pre-process
    of the point cloud is required to detect and remove spurious measurements.
    While outlier detection in datasets has been extensively researched, in
    3D point cloud data it is still an ongoing problem. Especially, clustered
    outliers are hard to detect with previous local-neighborhood based algorithms.
    This research explores the possibilities of using a voxel-based approach
    to automatically remove outliers from aerial point clouds. A workflow
    is designed in which a series of voxel-based operations are integrated,
    with the aim to detect all types of outliers and minimize false positives.
    Voxels can be processed more efficiently than 3D points for two reasons:
    (1) A voxelgrid can be analyzed using efficient image processing techniques;
    (2) Voxels group inner points before feature extraction using neighborhood
    operators. Outliers are detected in two steps. First, the source point
    cloud is voxelized. Secondly, outliers are detected by computing connected
    components and labeling voxels not connected to the largest region as
    outliers. Simultaneously, analysis of the point’s local density, shape
    (planar) and intensity minimize classification of false positives. The
    presented algorithm generally detects outliers with a higher accuracy
    than previous local neighborhood-based methods. A comparison with an existing
    approach shows that more outliers are detected. Above all, clustered outliers
    are removed. However, some issues can still be improved. First, more research
    is necessary to classify outliers based on non-arbitrary decisions. This
    could potentially be improved by introducing supervised learning algorithms.
    Secondly, more attention is required to process massive point clouds that
    do not fit in internal memory. This study proposes a possible streaming
    solution.'
  uuid: 2ffa73f4-34cc-4ea0-82df-11e61cb47bea
- surname: Groeneveld
  name: IJsbrand
  title: Generalisation of Hydrography Networks for a Vario-scale Basemap
  supervisors: Peter van Oosterom; Martijn Meijers; Radan Suba
  year: 2018
  graduation_date: '2018-02-01'
  link: https://resolver.tudelft.nl/uuid:a08dc9f7-6d7b-419d-ac42-44ea3b5318ab
  image: 2018_Groeneveld.jpg
  abstract: The vario-scale concept has proved an alternative for the well
    known discrete multi-scale solution. However the vario-scale concept is
    still ongoing research and requires further development e.g. on how to
    generate better content for vario-scale maps? This research does focus
    on how to incorporate hydrography networks in the vario-scale solution
    and how to continuously generalise hydrography networks throughout all
    scales. The pre-processing of topographic data is adjusted, information
    on hydrography features that are below another feature is stored and hydrography
    line features are added. The planar partition created in the pre-processing
    is used for the creation of the initial topological Generalised Area Partition
    (tGAP). Hydrography graphs are created by iterating over all hydrography
    features in the data structure and storing the hydrography features as
    objects and the connection between two neighbouring hydrography features
    as links. Based on the links between objects the connected components,
    in this case the hydrography networks are created. There can be multiple
    hydrography networks in one data set, which are used for the decisions
    made in the generalisation process. The proposed improvements and decisions
    for hydrography features do result in meaningful hydrography networks
    throughout all scales and are an improvement to the vario-scale approach
    without these improvements and decisions.
  uuid: a08dc9f7-6d7b-419d-ac42-44ea3b5318ab
- surname: Hemmes
  name: Tom
  title: Classification of large scale outdoor point clouds using convolutional
    neural networks
  supervisors: Mathias Lemmens; Peter van Oosterom; Kaixuan Zhou; Maarten
    Kruithof
  year: 2018
  graduation_date: '2018-04-17'
  link: https://resolver.tudelft.nl/uuid:c0cfa739-13dc-44de-92bc-4bba6f582c7e
  image: 2018_Hemmes.jpg
  abstract: There is a paradigm shift from two- to three-dimensional data,
    from maps to information dense models. Self-driving cars, digitization
    of historic buildings or maintenance of highway infrastructure are a small
    selection of many applications that use laser scanning to acquire three-dimensional
    data of our physical surroundings. Most of these applications require
    more than the shape of their surroundings. For example, a self-driving
    car needs to identify pedestrians, road signs and traffic lights in order
    to navigate safely. Therefore the point cloud acquired by laser scanning
    needs to be enriched with additional information. Automatic assignment
    of the object type a point belongs to is called classification. This research
    focuses on deep learning for point cloud classification, because it revolutionized
    classification of imagery. PointNet is used to enable deep learning directly
    on point cloud data sets. To date PointNet is proven for indoor point
    clouds, this research explores the application of PointNet on an outdoor
    highway scene. The methodology creates point cloud training data efficiently
    by reusing known 2D object locations. Different spatial representations
    and sampling methods for the points are tested. On average the method
    classifies 50% of the points correctly in four object classes. In combination
    with clustering of the point-wise predictions, the method predicts 60%
    of the 2D object locations successfully. The performance is comparable
    to the 47% average class accuracy PointNet achieves for 13 classes on
    the indoor data set.
  uuid: c0cfa739-13dc-44de-92bc-4bba6f582c7e
- surname: Karydakis
  name: Panagiotis
  title: Simplification & visualization of BIM models through Hololens
  supervisors: Ken Arroyo Ohori
  year: 2018
  graduation_date: '2018-10-29'
  link: https://resolver.tudelft.nl/uuid:748e5ed7-4a0d-4396-904b-64244ac0e56e
  image: 2018_Karydakis.jpg
  abstract: Augmented Reality (AR) is the technology that superimposes digital
    generated objects on the physical world. It has the potential to create
    new products and services,like visualizing future buildings or objects
    that will decorate a place, which creates new opportunities for applications
    in both the public and private sector. The architecture and construction
    fields are particularly interested in investigating this innovative technology
    to engage stakeholders, such as designers and engineers, in every stage
    of decision making and to minimize discrepancies between the original
    design of a building and the final outcome. Portability is one of the
    greatest advantages of Head-Mounted Display (HMD) AR technologies, but
    there are limitations regarding the amount of data which can be visualized
    using the computational power of the current generation of devices. Also,
    automated methods and approaches that can cope with the intricacy of the
    models have to be produced and tested to make the usage of augmented reality
    feasible.Within this thesis, a methodology is developed to isolate each
    storey of a Building Information Modeling (BIM) model and its exterior
    envelope. Firstly, the model was converted, from the Revit file format,
    to the open standard Industry Foundation Classes (IFC), which made the
    file human readable. Only semantic information was used to isolate each
    storey of the building, while for the extraction of the outer shell geometrical
    calculations were performed. This extraction took place by sending rays
    from one side of the model to the other and checking the intersection
    of the rays with the model.Afterwards, the storeys and the exterior were
    visualized through an AR device,the Hololens. The Unity platform, which
    provides many tools for holographic development, was used for the configuration
    of the scene where the final user will interact with the created models.
    Scripts in the C# programming language were developed to allow interaction
    between the user and the holograms. I created a simple and intuitive menu,
    consisting of 3D buttons to allow the user to visualize only the desired
    parts of the model. After having visualized the model, the user has the
    ability to scale and rotate the model using the corresponding buttons.
    In the same way, when the user stares at an element of the building, this
    element is high-lighted and by making the tap gesture, he/she can visualize
    metadata information about this element as text above the model. Finally,
    spatial perception functionality is provided by virtually placing the
    model on horizontal planes identified by the device.The proposed methodology
    was tested in a use case on a sample BIM model, and specifically of the
    Amsterdam Medical Center. The large size of the file and the high complexity
    of its geometry made the model a challenging test that made it possible
    to highlight the limitations and efficiency of the developed approach.
    Despite the positive results of the process, the accuracy is affected
    by the computational power of the current generation of hardware. Nevertheless,
    the clear perception of a construction coupled with the interactions capabilities
    provide an immersive experience which can actively involve the user with
    the visualization process
  uuid: 748e5ed7-4a0d-4396-904b-64244ac0e56e
- surname: Kotoula
  name: Lydia
  title: The Smart Point Cloud framework to detect pipelines using raw point
    cloud generated from panoramic images
  supervisors: Edward Verbree
  year: 2018
  graduation_date: '2018-07-12'
  link: https://resolver.tudelft.nl/uuid:40dddb4e-d0fa-42f5-9a54-f4fc32384cf4
  image: 2018_Kotoula.jpg
  abstract: Spatial data acquisition is rapidly developing, making point clouds
    available and easily accessible for many applications and to many end-users.
    Nowadays, point clouds are the main surveying product and have more added
    value than derived products as they keep details and they are not interpolated.
    Raw point clouds do not contain information that relates the points to
    the semantic meanings of the real word objects that are represented. Moreover,
    through different procedures (classification and segmentation techniques)
    important semantic information could be derived, creating an intelligent
    environment and structure, a Smart Point Cloud (SPC). In this research,
    a SPC framework will be created combining different techniques and methods
    in order to detect the pipes in an industrial environment. Close-range
    photogrammetry will be used to generate a point cloud, for which panoramic
    images are the main source data. The features and the attributes from
    both the data (panoramic images and point cloud) will be combined to get
    characteristics from both sources (2D & 3D) in order to select, analyze,
    manipulate and identify the pipes as one object.
  uuid: 40dddb4e-d0fa-42f5-9a54-f4fc32384cf4
- surname: Li
  name: Weiran
  title: Detection of subsurface meltwater in East Antarctica using SAR Interferometry
  supervisors: Agung Indrajit; Paco López Dekker; Stef Lhermitte
  year: 2018
  graduation_date: '2018-07-02'
  link: https://resolver.tudelft.nl/uuid:783417aa-7e14-4e35-a362-9440ab0b6bc8
  image: 2018_Li.jpg
  abstract: Climate change has been a heated topic in recent years, and the
    mass loss of ice sheets is one aspect of it. The Antarctic Ice Sheet has
    experienced certain mass loss in the form of ice-shelf collapse and (sub-)surface
    melting, but thorough study remains limited due to the remote location
    of the continent. Therefore, remote sensing is expected to provide valuable
    information on Antarctica, in order to monitor its mass balance and gain
    insights on the extent of climate change. As one of the factors to the
    mass loss in Antarctica, subsurface melt can be critical yet hard to capture.
    The limitation of remote sensing data, especially valid optical images
    over polar regions may add to the issue. This study aims to exploit the
    potentiality of SAR Interferometry in detecting subsurface melt, as the
    microwave bands are not affected by weather and illumination, and the
    interferometric data may provide supportive information reflecting the
    properties of the physical environment. It is expected that by using this
    technique, the gap can be filled in when optical images are not available,
    or pure SAR images are not informative. The technique is applied to two
    ice shelves in East Antarctica, Roi Baudouin Ice Shelf and Amery Ice Shelf.
    And this study is expected to be operated over a broader scale such as
    the Antarctic continent and Greenland.
  uuid: 783417aa-7e14-4e35-a362-9440ab0b6bc8
- surname: Manolova
  name: Manuela
  title: Integration of 3D BIM Models in a Web GIS for Life Cycle Asset Management
  supervisors: Marianne de Vries; Hendrik Ploeger; Hilbert Davelaar; Henri
    Veldhuis
  year: 2018
  graduation_date: '2018-11-09'
  link: https://resolver.tudelft.nl/uuid:2a2523d1-c751-44e2-8129-676ef1eec379
  image: 2018_Manolova.jpg
  abstract: In recent years, there has been a growing necessity for 3D geoinformation
    in urban planning and infrastructure management to provide a more realistic
    representation of urban areas and the built environment. A key concept
    in public infrastructure management is Life Cycle Asset Management (LCAM),
    which aims to improve the decision making in each phase of the life cycle
    of infrastructure assets, such as road and utility networks, civil structures,
    and green areas. Traditional systems in LCAM are limited in terms of analysis
    and visualization opportunities due to the use of simpler tools like tables.
    In this respect, Geographic Information System (GIS) solutions have been
    widely integrated in LCAM to optimise the administration and monitoring
    of infrastructure assets. The incursion of semantic 3D models complements
    the use of GIS by introducing new and innovative modelling and visualization
    methods. As one of the most common design techniques in the building and
    construction industry, Building Information Modelling (BIM) facilitates
    the generation of multidimensional models to describe the physical and
    functional characteristics of built objects. This research studies the
    integration of 3D BIM models in a Web GIS system for public space management
    to improve the procedure in the maintenance phase of LCAM. The goal is
    to solve the challenges related to the acquisition, processing, and visualization
    of 3D models. The thesis outlines the process of the development of a
    3D prototype in an attempt to demonstrate a possible solution for the
    integration of BIM models in an existing GIS application. The research
    starts with a scientific literature review to familiarise with the LCAM
    concept, Web GIS, and semantic 3D models. Then, the stakeholders in the
    project are identified and their requirements with regard to the functional
    capabilities of the prototype are gathered in order to create a design
    concept. Consequently, the BIM model used in this study is presented and
    processed to comply with the Dutch national standards for inspection and
    maintenance. The prototype is developed on the basis of Web Graphics Library
    (WebGL), a technology for web rendering of interactive 3D graphics and
    animations supported by all modern web browsers. At the end of the development
    process, the prototype is evaluated by experts in the LCAM and BIM fields
    to assess its usability by means of a questionnaire survey. The input
    from the participants in the survey is essential for the further improvement
    of the prototype and its release as fully functional product.
  uuid: 2a2523d1-c751-44e2-8129-676ef1eec379
- surname: Ortega-Córdova
  name: Lessie M.
  title: Urban Vegetation Modeling 3D Levels of Detail
  supervisors: Jantien Stoter; Anna Labetski
  year: 2018
  graduation_date: '2018-08-09'
  link: https://resolver.tudelft.nl/uuid:8b8967a8-0a0f-498f-9d37-71c6c3e532af
  image: 2018_Ortega-Cordova.jpg
  abstract: '3D city models are now common planning and analysis tools. Urban
    vegetation as a feature in these models, however, is neglected overshadowed
    by the focus on buildings, so its inclusion in 3D city models is often
    symbolic. On the other hand, urban vegetation improves the comfort and
    social well being of a city’s inhabitants and is a resource for sustainable
    urban growth and an environmentally friendly resource for mitigating the
    negative effects of climate change, e.g., frequent heat waves, floods
    from storm downpours and extended dry periods. Trees also mitigate Urban
    Heat Island (UHI) effects. Urban vegetation’s ecosystem services (ecoservices)
    as mitigation functions of pollution and negative effects of climate change
    have propelled research, studies, applications, and simulations that need
    data and 3D models of existing vegetation e.g., for spatial simulations,
    to assess the canopy cooling impact to surroundings or to identify areas
    prone to UHI. In view of these needs, urban vegetation in 3D city models
    is underrepresented. Guidelines for modelling vegetation are already provided
    in CityGML, the 3D city modelling standard, but they are insufficient
    for today’s needs because it has vagueness and focuses mostly on built
    infrastructures. In this research, 14 Single Vegetation Object (SVO) Levels
    of Details (LOD) and four root LODs are proposed. They target to meet
    different adherence requirements and scales. Their formulation is based
    on LOD specification approaches, and on a needs analysis that identified
    the vegetation models and data most commonly required in applications
    in the urban environment. Vegetation LOD description approaches include
    semantic 3D modelling standards, industry, and common practices of municipality
    users which are also GIS data providers. Current vegetation LOD descriptions
    approaches fall into two different groups based on the geometry they adopted
    for their specifications: implicit or explicit, and no one approach fulfills
    identified needs. Acquisition techniques and demand in IT resources have
    influenced the definitions of vegetation LODs, the adoption of one geometry
    type or the other, and the wide use (or not) of certain LODs. Refined
    SVO LODs specifications of this research combine the strengths of each
    group with descriptions that cover beyond geometric specifications. Refined
    LODs incorporate implicit components, underground representations and
    reconstruction LODs not defined by any approach. With them, most datasets
    can be represented by at least one LOD, and modelers can tell what LOD
    is possible to implement based on the data they already have. For acquisition,
    it is possible to tell what data is required for a particular LOD, and
    which LOD can be used to obtain data needed for an application. The broad
    spectrum of refined LOD allows them to meet different requirements. A
    shadow analysis case study was done with implementations of refined SVO
    LOD specifications. Acquisition from aerial and mobile LiDAR data was
    done in a workflow that brought the 0D tree inventory of the municipality
    of Rotterdam to 3D models using mainstream and open source tools. The
    case study confirmed a quantitative impact in shadow duration and extent
    by each LOD indicating that each is independently differentiated. Volumetric
    and non-volumetric models had different shadow over and underestimation
    impacts. The study further highlighted the properties of the crown of
    the real-world object that help in choosing a LOD and gave insights offered
    by lower LOD models. The implementation of the assorted LODs revealed
    that while much research has been done in acquiring vegetation parameters
    from LiDAR data, the many options, methods and algorithms are scattered
    necessitating a unifying process or tool.'
  uuid: 8b8967a8-0a0f-498f-9d37-71c6c3e532af
- surname: Sirdeshmukh
  name: Neeraj
  title: Utilizing a Discrete Global Grid System For Handling Point Clouds
    With Varying Locations, Times, and Levels of Detail
  supervisors: Edward Verbree; Peter van Oosterom
  year: 2018
  graduation_date: '2018-06-25'
  link: https://resolver.tudelft.nl/uuid:56e06ce9-fbad-4ded-8cd5-978f21f9aa2c
  image: 2018_Sirdeshmukh.jpg
  abstract: Discrete Global Grid Systems (DGGS) have emerged in recent years
    as a new specification for working with global heterogeneous datasets
    of different types, such as vector, raster, and quantitative datasets.
    There exists no research on using point clouds with a DGGS. This research
    aims to analyse the extent to which a DGGS can be used to handle LIDAR
    point clouds having varying coordinate systems, acquired at different
    levels of detail, and at different times in the creation of a global ‘map’
    of point clouds. Various ways of mapping and modelling the Earth, indexing
    strategies for creating a continuous index of the surface of the Earth
    (including what is above and below it), performing analysis of 2D, 3D
    or 4D point clouds using DGGS, and the querying and visualization of massive
    point clouds is discussed. A DGGS is compared and contrasted with conventional
    coordinate systems. The advantages, opportunities, challenges, and limitations
    of point cloud integration in a DGGS are presented.
  uuid: 56e06ce9-fbad-4ded-8cd5-978f21f9aa2c
- surname: Vermeer
  name: Martijn
  title: Large-scale efficient extraction of 3D roof segments from aerial
    stereo imagery
  supervisors: Hugo Ledoux; Tom Commandeur
  year: 2018
  graduation_date: '2018-01-26'
  link: https://resolver.tudelft.nl/uuid:24e59c42-b019-4fd8-a968-307eae8e4460
  image: 2018_Vermeer.jpg
  abstract: '3D reconstruction of the built environment is a widely studied
    Geomatics topic. Resulting city models are used for a great variety of
    purposes. The reconstruction of roofs remains challenging. These roofs
    are not only building blocks for the city models but are of direct interest
    as well. The company READAAR uses roof segments for the detection of asbestos
    and PV potential analysis. Typical clients for such analysis are muncipalities
    and provinces. Currently, READAAR extracts roof segments from the gridded
    LiDAR dataset: algemeen hoogtebestand nederland 2 (AHN2). The use of LiDAR
    data however comes with some limitations. Most importantly, outside the
    Netherlands, LiDAR data is not always available as it is relatively expensive
    to gather. Furthermore, the point density of the AHN is 6-10 points/m^2,
    which limits the amount of detail that can be extracted. In the Netherlands
    countrywide aerial stereo imagery is available at a resolution of 10cm,
    this potentially gives a point density of 100 points/m^2 after image matching.
    This research explores the possibilities of using aerial stereo imagery
    instead of LiDAR data for the efficient large-scale extraction of 3D roof
    segments. A workflow is designed in which stereo matching and extraction
    of segments are integrated. This makes the workflow both efficient and
    easily scalable. Roof segments are extracted in two steps. First, a watershed
    segmentation is applied to retrieved color segments. Second, these color
    segments are clustered based on their orientation. The resulting roof
    segments generally have a higher quality than the segments retrieved with
    READAARs LiDAR-based approach. However, problems do occur, especially
    in shaded areas. This could possibly be solved by integrating LiDAR data
    when available. Another recommendation for future research is improving
    the matching by using multi-view matching or possibly neural networks.
    Furthermore, the segmentation could potentially be improved by using multiple
    images from different years and processing building blocks.'
  uuid: 24e59c42-b019-4fd8-a968-307eae8e4460
- surname: Wang
  name: Cheng-Kai
  title: 'Urban building energy modeling using a 3D city model and minimizing
    uncertainty through Bayesian inference: A case study focuses on Amsterdam
    residential heating demand simulation'
  supervisors: Jantien Stoter; Simon Tindemans; Giorgio Agugiaro; Clayton
    Miller
  year: 2018
  graduation_date: '2018-10-31'
  link: https://resolver.tudelft.nl/uuid:bc0d7164-be60-485a-ad7d-f7a049a3851d
  image: 2018_Wang.jpg
  paper: https://doi.org/10.1080/19401493.2020.1729862
  abstract: To cut down immense greenhouse gases emission and energy consumption
    in the rapidly urbanizing world, a holistic understanding and rethinking
    of our dynamic urban energy system are inevitable. Performing bottom-up
    building energy modelings at urban scale based on Geographic Information
    System (GIS) and semantic 3D city models could be a promising option to
    provide quantitative and integrated energy solutions. Nevertheless, input
    uncertainties either caused by limited data accessibility in most cities
    or parameters with stochastic variability (e.g. house occupancy profile)
    become one of the biggest obstacles to produce reliable and acceptable
    building energy modeling results. This study aims to address the heating
    demand simulation performance gap caused by input uncertainties. In this
    case study based on Amsterdam residential building stock, parameter importance
    ranking of the 14 simulation inputs are first derived according to the
    sensitivity analysis. The selected key uncertain parameters are then modeled
    in a probabilistic distribution way at postcode 6 level (approximately
    or slightly more than 10 buildings). Model calibration is based on the
    Bayesian approach and given six years (2010-2015) of gas consumption data
    to infer parameter posterior distributions. After the training phase,
    the calibrated annual heating demand simulation results of the validation
    years show significant improvement in modeling accuracy. Comparing the
    baseline and the calibrated simulation results, the averaged absolute
    percentage errors of energy use intensity (EUI) among at least 84 valid
    postcodes have decreased from 24.96% to 8.31% in 2016 and from 19.93%
    to 7.70% in 2017 respectively. The calibrated urban building energy model
    would be most interested by municipalities, urban planners, and engineering
    consultancies. It can be used to evaluate long-term energy supply and
    demand strategies, identify building renovation saving potential, perform
    large-scale building performance mapping, and carry out retrofit measures
    assessment.
  uuid: bc0d7164-be60-485a-ad7d-f7a049a3851d
- surname: Haayen
  name: Jade
  title: Towards interoperable standards for 1D time series data within the
    water sector
  supervisors: Peter van Oosterom; Nick van de Giesen
  year: 2017
  graduation_date: '2017-11-10'
  link: https://resolver.tudelft.nl/uuid:b0ec4837-a641-41c1-b869-b20d2621c077
  image: 2017_Haayen.jpg
  abstract: 'Water management is becoming increasingly important in the world.
    Population growth, climate change, and increasing demands placed on infrastructure
    call for a smart and standardized approach. The data needs to stay at
    the source and sharing information in a more efficient way is becoming
    increasingly important. To make this possible in the water sector a platform
    is needed to facilitate the exchange of information. This platform allows
    for keeping data at the source, which can then be accessed all over the
    world. The data exchange will become possible when the platform works
    according the right standards. An integrated model based on existing standards
    is one of the first steps in achieving better communication and interoperability.
    The research goal is to to design a well defined information model based
    on standards that will be optimal for implementation in a information
    infrastructure within the water sector to make the 1D time series data
    exchange easier. This is done by a research to the existing standards
    and there capabilities. The standards are described and from their background
    an information a model is created to illustrate in one overview the relations
    between these standards on several levels. To create one Hydrological
    TimeSeries Stan- dard Based Information Model (HydroTS-SBIM) the international
    standards that are most relevant are selected and reviewed; ISO 19156
    O&M, OGC Timeseries Profile of O&M and WaterML 2.0: Part 1- Timeseries.
    This is done to get a clear and complete HydroTS-SBIM that gives an accurate
    insight on both the positive and negative aspects of the existing standards,
    and will show in one information model the possible relation between them.
    For now the standards cannot be merged into one complete model due to
    the inconsistencies among the standards. Therefore the HydroTS-SBIM 2.0
    is created to illustrate these inconsistencies and complications on each
    level. To create an HydroTS-SBIM thorough research has been done, including
    interviews with highly educated specialists within the fields of data
    standardization, governance and the water sector. A survey was used as
    feedback for the creation of a demo version of the proposed solution,
    called the Packet Plan. The Packet Plan is an step-by-step approach to
    the standards. To show the use of the packets, the core packet is developed
    which is called core packet A. It illustrates that there is no need to
    implement the total standard in all its richness at once to be able to
    share data, instead it presents a model with the concept of compact packets.
    This is a time efficient process where the implementation of the standard
    will be in parts, leading to less information at once but divided over
    the packets. The user will only get the required information for the specific
    part the user needs at that time, resulting in an easier and more time
    efficient data exchange.'
  uuid: b0ec4837-a641-41c1-b869-b20d2621c077
- surname: Kang
  name: Yuxuan
  title: Straightening and simplifying a multi-view stereo mesh of a city
  supervisors: Hugo Ledoux; Abdoulaye Diakite
  year: 2017
  graduation_date: '2017-07-06'
  link: https://resolver.tudelft.nl/uuid:8f3a74c2-3264-4433-adc9-217dfa94754a
  image: 2017_Kang.jpg
  abstract: With fast development of both hardware and software, 3D real-world
    scene data, for example multi view stereo mesh, can be acquired efficiently.
    And since 3D city data are more realistic and more useful in some applications,
    they begin to appear in the market. Although the generation of 3D city
    data like multi view stereo mesh can be fast, the data might contain many
    measurement errors. Because of these measurement errors, some regular
    objects such as building, ground etc sometimes are not exactly flat. Points
    which should be on the same plane have small deviations from the plane
    they belong to, which makes the flat surface bumpy. One way to solve this
    problem is to control the quality of data acquisition and data processing.
    Unfortunately, even the data error sources are known, it is not possible
    to eliminate all the errors, and accurate but expensive data acquisition
    equipment sometimes are not affordable. In that case, processing existing
    data is much more economic and time saving compared with collecting data
    again. This MSc thesis aims at solving above problem. It provides a methodology
    on straightening planar parts of multi view stereo mesh of the city. After
    straightening the mesh, this thesis also tries to simply the mesh by removing
    redundant vertices and faces in the mesh, so that the data will be clean
    and the data storage can be reduced.
  uuid: 8f3a74c2-3264-4433-adc9-217dfa94754a
- surname: Kyritsis
  name: Dimitrios
  title: The identification of road modality and occupancy patterns by Wi-Fi
    monitoring sensors as a way to support the “Smart Cities” concept
  supervisors: Edward Verbree; Sisi Zlatanova
  year: 2017
  link: https://resolver.tudelft.nl/uuid:68a1d7d2-3828-4df5-9c05-63a2511188e4
  image: 2017_Kyritsis.jpg
  abstract: As world urbanization continues apace and total population increases,
    there is an immediate demand for better monitoring and exploitation of
    space. In view of the above, the “Smart Cities” concept has been developed
    and numerous efforts are made to deploy technology to this end. The main
    information needed for city development and planning is road modality
    and the relevant occupancy patterns. However, it is quite difficult to
    collect this information. There have been several different approaches
    towards providing this information and various methods have been used.
    However, each of them has weaknesses which do not allow it to be used
    on its own. On the other hand, thanks to the new technological developments
    and due to the growing needs of society over the last years, the system
    of Wi-Fi monitoring sensors has been increasingly used in outdoor environments.
    Many companies have already used this method to collect data and provide
    information about users’ behavior in places such as public areas, shopping
    centers and malls. Nonetheless, the contribution of this thesis is the
    study of the applicability of this method, the assessment of the reliability
    of its outcomes and the identification of crucial parameters which significantly
    affect the final accuracy. Thus, the aim of this research is to investigate
    what kind of road modality and occupancy patterns can be recognized using
    Wi-Fi monitoring sensors in a city area as well as which setup parameters
    can influence the final outcome. The system is implemented in the city
    of Dordrecht, which constitutes the research area of this study. First
    of all, the design of the observation network is described and the relevant
    parameters are taken into account. Using the data collected by the system
    and the known distances between the sensors, the movement speed of each
    device is computed. Street-uses criteria of the research area are also
    used as input to the system, and in combination with the computed speed
    three categories of users are recognized and each device is categorized
    as “pedestrian”, “bicyclist”, or “vehicle”. Under this classification
    each street’s road modality is studied. The relationship between the categories
    throughout the day is investigated and preferred streets for each kind
    of users are recognized. Based on the ability of the system to identify
    every device in the research area throughout the day, the movement behaviors
    of users are researched and similarities between them as well and the
    most frequent patterns are identified. Three sets of movement patterns
    are studied considering the number of sensors which scan the same device
    within a time period. Each set is investigated separately for every kind
    of users. Moreover, using the number of devices scanned at each sensor
    point, occupancy patterns are identified both for users as a whole and
    for each user category separately. It is argued that this constitutes
    an important advantage of the system. Rush hours, recession periods and
    movement trends are recognized for the different days of the week as well
    as the occupancy relationship between the research area and its surroundings.
    Finally, a questionnaire and random samplings with Bernoulli trial are
    used to validate the outcomes. A quite strong correlation between the
    system’s results and reality is revealed, especially with regard to pedestrians
    and bicyclists. However, despite the quite promising findings, further
    implementation and testing of the system in different environments is
    needed in order to draw an indisputable conclusion about its effectiveness.
  uuid: 68a1d7d2-3828-4df5-9c05-63a2511188e4
- surname: Ligtvoet
  name: Birgit
  title: Crowdsensing as a tool for up-to-date road asset distress detection
  supervisors: Edward Verbree
  year: 2017
  graduation_date: '2017-07-03'
  link: https://resolver.tudelft.nl/uuid:61924097-f0f7-4d5a-979c-fe991017a3ce
  image: 2017_Ligtvoet.jpg
  abstract: Contractors are moving from traditional maintenance to preventive
    maintenance. To apply preventive maintenance, up-to-date data is required
    which is unavailable. The goal is to research the applicability of crowdsensing
    to detect road pavement distresses, and to investigate how the positions
    of these detections can be used to gain information on a road pavement
    section. The construction sector is currently moving from traditional
    maintenance contracts, where maintenance was a pay per bill business,
    to contracts focused on the performance and availability of assets. These
    types of contracts shift the risk during the maintenance phase from the
    government to the contractor. The contractor receives a fine if either
    the minimum performance or the availability is not met. This fine in combination
    with the risk of unforeseen maintenance costs creates a demand for more
    efficient maintenance methods like preventive maintenance. However, in
    the field of road asset management, there is a knowledge gap in how road
    pavement distresses develop over time. To fill this knowledge gap, up-to-date
    information is required. The up-to-date information cannot be provided
    using the current high-quality methods due to the limited availability
    of equipment. In this research, raw data is gathered on the state of the
    road through crowdsourcing with smartphones. This data is then preprocessed
    by signal analysis, positioning analysis and event detection to retain
    only the information which describes the occurrence of a road pavement
    distress. Next, a database analysis consisting of clustering, asset linking
    and averaging is performed to gather information on the measurements of
    an instance of road pavement distress. The position of the instance of
    road pavement distress can be seen as the position of a virtual sensor.
    A virtual sensor groups events together from multiple smartphones. The
    location of the virtual sensor is linked to the location of the nearest
    road pavement asset, allowing asset managers, the people who plan maintenance
    tasks at contractors, to send their maintenance crew to the correct location.
    The results from the experiments show that the detection of road pavement
    distress is possible by using crowdsensing. The position of the virtual
    sensor increases in accuracy when more data is used. However, it is possible
    that two different virtual sensors can be merged due to positioning errors.
    It is also possible to connect the position of the virtual sensor to a
    real world asset location by using the Dutch national road sections and
    the hectometer posts. The resulting information can be used to get an
    indication of the status of different assets, giving asset managers insight
    into which areas and assets they need to focus on.
  uuid: 61924097-f0f7-4d5a-979c-fe991017a3ce
- surname: Psomadaki
  name: Stella
  title: Using a Space Filling Curve for the Management of Dynamic Point Cloud
    Data in a Relational DBMS
  supervisors: Theo Tijssen; Peter van Oosterom
  year: 2017
  link: https://resolver.tudelft.nl/uuid:c1e625b0-0a74-48b5-b748-6968e7f83e2b
  image: 2017_Psomadaki.jpg
  abstract: 'The rapid developments in the field of point cloud acquisition
    technologies have allowed point clouds to become an important source of
    information for many applications. One of the newest applications of point
    clouds concerns the monitoring of the coast. Many countries, among which
    the Netherlands, use this source of data in order to determine the changes
    in coastal elevations. This means that point clouds are collected every
    hour, day, month, year; ultimately talking about dynamic point clouds.
    To be able to efficiently use this plethora of data, the management of
    those point clouds, dynamic or not, is proven to be crucial. Point clouds,
    like the majority of geodata, have been traditionally managed using file-based
    solutions. Nevertheless, the last years database solutions have emerged.
    Typical examples are the point cloud extensions for PostgreSQL and the
    Oracle Database. Both options use a similar block-based organisation.
    In addition to the block based organisations, point clouds can also be
    managed using a flat table where each point is stored in a separate row.
    While the first approach is very scalable and efficient, the second is
    easier to implement and to update. To make the flat model scalable, a
    Space Filling Curve (SFC) can be used to cluster the data. Nonetheless,
    both approaches in their current forms, are not suited for the management
    of dynamic points. The reason for this is the fact that they do not consider
    the time dimension as part of the organisation and further insertions
    for the block-based approaches are not straightforward. Within this thesis
    a SFC approach for managing dynamic point clouds is investigated. For
    this, the flat model approach using an Index Organised Table (IOT) within
    a Relational Database Management System (RDBMS) is used. Two variants
    coming from two extremes of the space - time continuum are then taken
    into account. In the first approach, space and time are both used within
    the SFC (integrated approach), while in the second one, time dominates
    over space (non-integrated approach). Along these two approaches, two
    treatments of the z dimension are, also, studied: as attribute or as part
    of the SFC. In addition to that, building on the coastal monitoring applications,
    the most important queries are identified: space - time, only time, only
    space. The efficiency of the implemented methodology is tested through
    the execution of a benchmark. Using two use cases coming from coastal
    applications, the benchmark is executed once for daily and once for yearly
    data. The results show that the SFC approach is an appropriate method
    for managing dynamic point clouds. Furthermore, the integrated approach
    is the most suitable way to proceed. Achieving scalability, time efficiency
    and dynamic insertions can be achieved for various use cases.'
  uuid: c1e625b0-0a74-48b5-b748-6968e7f83e2b
- surname: Soffers
  name: Pieter
  title: Designing an integrated future data model for survey data and cadastral
    mapping
  supervisors: Peter van Oosterom; Edward Verbree
  year: 2017
  link: https://resolver.tudelft.nl/uuid:b9a712da-f70e-43d9-b539-9e4c491966c0
  image: 2017_Soffers.jpg
  abstract: For nearly 200 years the Netherlands’ Cadastre, Land Registry
    and Mapping Agency – in short ‘Kadaster’ has been the organization that
    registers and maintains all legal rights concerning property in the Netherlands.
    An elementary part of its activities is the spatial description of parcels
    that are built up by boundaries which are surveyed in the field and depicted
    on the Dutch cadastral map. Nowadays this is an open source digital map
    which provides an overview of the cadastral situation for the entire country.
    The map exists of unique representations of all cadastral boundaries and
    parcels. It must be pointed out though that these locations are only depicted
    by approximation, which is caused by several factors. The most precise
    location of a boundary still remains the original survey data in the field,
    which is documented on separate survey documents. In the Dutch cadastral
    map every parcel has its own number, which is the link to original survey
    documents. Relating the boundary on the map to the correct survey data
    happens by intuition. This is feasible when cadastral situations are documented
    from scratch. However the Dutch cadastral situation is dynamic; parcels
    can split and merge, which results in new numbers and extra survey documents.
    As a result searching for survey data is getting more and more complex.
    Additionally the Kadaster has used different survey techniques over time
    offering different meta data, administration and accuracy. The survey
    data have been stored at different locations. Also boundary reconstructions
    lead to extra survey documents for one boundary. All these factors together
    have decreased the interaction and overview of quality. This thesis presents
    a research to design a data model which relates all survey data directly
    to its boundaries in the Dutch cadastral map instead of parcel numbers.
    As a starting point for this data model requirements are defined, which
    are based on preliminary investigation of the Dutch cadastral work flow.
    The requirements are establishing a link between survey data and the Dutch
    cadastral map, incorporating all survey methods, assuming more elements
    in the Dutch cadastral map as entities in their own right, the maintenance
    of topology, the maintenance of quality and the use of ISO standards.
    The design of the data model uses the Land Administration Domain Model
    (LADM) as template. This is an international standard for land administration.
    This data model was adjusted to the situation of the Kadaster. This is
    a common method applied by cadastral organizations to improve their work
    flow. The LADM template offers solutions for generally upcoming cadastral
    issues as well as a data organization that is clearer and more accessible
    for externals. Nevertheless there are multiple approaches to solve the
    issues of the Kadaster by this template. This research will discuss several
    options to meet the stated requirements and deliberate on the best choice.
    Real Dutch cadastral cases are used to demonstrate how the final data
    model operates. At last a comparison is made with related cadastral systems
    abroad to reflect on its drawbacks and benefits. The final model can support
    the current work flow of the Kadaster by assuming boundaries as own entities.
    A direct link to its related survey data saves time, labour and expert
    knowledge. The model places similar objects in similar classes in order
    to increase overview. The data model may be a starting point for improvement
    of the Dutch cadastral map.
  uuid: b9a712da-f70e-43d9-b539-9e4c491966c0
  needs_review: true
- surname: Staats
  name: Bart
  title: Identification of walkable space in a voxel model, derived from a
    point cloud and its corresponding trajectory
  supervisors: Sisi Zlatanova
  year: 2017
  graduation_date: '2017-07-05'
  link: https://resolver.tudelft.nl/uuid:6a827a88-ce09-43f1-adb9-da886448a1fc
  image: 2017_Staats.jpg
  abstract: 'Navigation from a room inside a building to another room inside
    a building which is across the street consists of three parts: first,
    the indoor part at the building where you start your journey. Secondly,
    the outdoor part and thirdly, another indoor part inside the building
    of destination. As regards to the outdoor environment, a navigation aid
    is well used and implemented in many types of applications. However, it
    is not common to use an aid to navigate inside a building. While such
    an indoor navigation aid is not necessary in small buildings, it is a
    necessity in more complex buildings like hospitals, airports, conference
    venues and large shopping malls. The indoor navigation aid can help visitors
    finding their way inside these, for them, unknown locations. The systems
    behind a navigation aid consist of several elements like an indoor positioning
    system, an indoor navigable map, specific destinations (points of interest)
    and an appropriate guidance throughout a building. This research focusses
    on the creation of indoor navigable maps that can be displayed and used
    to plan possible routes throughout the entire building. The indoor environment
    is far more complex than the outdoor environment. First, most people lose
    their orientation inside a building after they change their direction
    several times. Second, since there are no pre-existing routes inside a
    building, there are many different possible ways to arrive at a destination.
    Third, there is a large variety of associated spaces which all have their
    own unique interior design. Therefore, automating the process of making
    an indoor map is more challenging and time consuming than generating an
    outdoor map. Most research in the field of automatic generation of indoor
    maps is focused on the already available 2D floorplans and only few of
    them use the more complex 3D representations. Using a 2D floorplans for
    the purpose of indoor navigation has its limitations because of various
    factors. Firstly, the 2D maps are already a simplification of the complex
    3D environment which can lead to difficulties in representation. Secondly,
    the connectivity between different floor plans can be difficult as each
    floor plan is a separate entity. Thirdly, the maps that are available
    do not always contain furniture. Fourthly, in addition to the third one,
    most existing methods only focus on reconstructing the indoor space as
    an empty hull which results in a navigation aid which has does not emphasize
    the attention to obstacle detection. At last, most floor plans are out
    of date because some buildings are not built according to their blue prints.
    Their interiors might change after several years through the modification
    of walls and doors and furniture may be repositioned to the users preferences.
    Therefore, information about the indoor environment must be updated in
    most cases. This research concentrates on the automatic generation of
    indoor navigable spaces for pedestrians based on laser scanning with a
    Mobile Laser Scanner (MLS) device. These devices scan the environment
    continuously along a trajectory which makes them more time efficient than
    terrestrial laser scanners. To aid pedestrians in their indoor navigation,
    features needed for path computation such as floors, stairs, walls and
    furniture elements, need to be identified. These must be extracted from
    the point cloud which is generated by the MLS. How to identify these elements,
    like walls and doors, is investigated a lot. These researches are built
    on a set of constraints, like a Manhattan World or a flat surface constraint.
    These constraints are not problematic for a regular office building but
    they will provide difficulties in more complex buildings. This means that
    it is important to focus on a method with less or without constraints.
    Scanning the indoor environment of an building often happens during business
    hours which automatically leads to the inclusion of dynamic objects like
    pedestrians or small vehicles in the final point cloud. These dynamic
    elements do not represent any type of building elements (like furniture)
    and thus need to be identified and removed. Beside the point cloud, the
    MLS also stores the trajectory of the MLS device. This trajectory contains
    three types of valuable information. The points directly below the trajectory
    indicate areas where pedestrians can walk, since the MLS device was operated
    by a pedestrian. The height difference between neighboring trajectory
    points can be used to detect stairs, slopes and flat surfaces and the
    trajectory also provides information about the connection of different
    surfaces and represents the complexity of the building. In this research,
    a method for the identification of walkable surfaces based on the analysis
    of a point cloud and the corresponding trajectory of the MLS is developed.
    First, the point cloud is voxelized. Second, the trajectory is analysed
    to detect the three different types of navigation surfaces: stairs, slopes
    and horizontal surfaces. This classified trajectory is projected vertically
    on the voxel model to acquire seed voxels. These seed voxels are then
    used to create areas by using region growing. These areas can be modified
    by identifying dynamic objects, entryways and furniture elements so that
    each area represents a specific navigable voxel space inside a building.
    Experiments shows that by applying this method, it is possible to create
    a continuous navigable space in buildings including several floors, stairs
    and elevations. Data can be captured during opening hours because the
    method detects and removes dynamic objects in the final result. The proposed
    method can be used for any type of room without any constraints because
    the complexity of the building is already present in the trajectory of
    the MLS.'
  uuid: 6a827a88-ce09-43f1-adb9-da886448a1fc
- surname: ten Kate
  name: Jan
  title: Predicting noise nuisance from outdoor music events in the built
    environment
  supervisors: Filip Biljecki
  year: 2017
  graduation_date: '2017-11-06'
  link: https://resolver.tudelft.nl/uuid:a1663ff7-d6a4-410c-80fa-5fc8654fd5c6
  image: 2017_ten-Kate.jpg
  abstract: 'Noise nuisance caused by outdoor music events has become a heavily
    discussed issue in metropolitan environments such as Amsterdam. The main
    objective of this research is to lay the foundation for a map that effectively
    disseminate noise information and facilitates well-informed decision making
    concerning the impact and assessment of outdoor music events. A noise
    map disseminates noise level information and is a common tool for environmental
    noise caused by roads or industries. The research question is: can a noise
    map be a valid tool for predicting noise nuisance from outdoor music events
    in the built environment? This master thesis is an exploration whether
    subjective opinions that are the result of a realworld event can be predicted
    by spatial analysis. Sound is a phenomenon with a spatial attribute and
    the knowledge of sound propagation is applied frequently in many different
    industries. In practice noise level prediction is an important instrument
    to decide by authorities whether an event can take place or not, therefore
    a study to better understand the relationship between complaints and noise
    level prediction is valuable. Noise measurements have been made at several
    events in the surrounding area of Amsterdam. The noise measurements have
    been used to investigate the accuracy of the current noise level prediction
    methodology. Spatial data and noise measurements were gathered from actual
    noise nuisance complaints to gain insight into the relation between the
    noise levels and nuisance complaints. Finally recommendations are made
    to help the municipality and event-producers better assess the possible
    impact of an outdoor music event.'
  uuid: a1663ff7-d6a4-410c-80fa-5fc8654fd5c6
- surname: Tryfona
  name: Maya
  title: Bidirectional enrichment of CityGML and Multi-View Stereo Mesh models
  supervisors: Hugo Ledoux
  year: 2017
  graduation_date: '2017-07-03'
  link: https://resolver.tudelft.nl/uuid:560bd9fb-7688-492f-b1c0-799644707be9
  image: 2017_Tryfona.jpg
  abstract: The use of 3D city models has increased the last decades due to
    the evolution of technology. Their use is related to the need for solutions
    on issues that correspond to the building environment. Modelling aspects,
    like geometric, semantic information and topology are necessary, in order
    to provide an integrated result of spatial analysis. The creation of a
    complete 3D city model that contains all the needed information for an
    application, is a time consuming and complex process. Furthermore, different
    3D city model formats can contain different aspects of the same features.
    For example, a CityGML model can have the semantic information of a 3D
    object, while a Multi-View Stereo Mesh model can contain all the geometric
    and appearance information of the same 3D object. This thesis is documenting
    the possible enrichments that can be done bidirectionally between these
    two different 3D city model formats, when both exist for the same entities.
    Moreover, it presents the exploration of possible automated enrichment
    methodologies that can enrich each 3D city model automatically with information
    from the other one. Finally, an automatic bidirectional enrichment methodology
    is proposed and is implemented on a testing area, provided in the two
    different 3D city model formats. This method is based on distance computations
    between the meshes of the two 3D city models, used to match corresponding
    features, or part of features, in order to segment semantically the Multi-View
    Stereo Mesh model (roof, wall, road, terrain, uncertain) and transfer
    texture to the surfaces of the CityGML model that correspond with the
    surfaces of the Multi-View Stereo Mesh model. In addition, distance computations
    are performed for the validation of the absence of buildings and the shapes
    of the roofs in the CityGML model, with respect to the information given
    from the Multi-View Stereo Mesh model. After the implementation of the
    proposed methodology, it is found that both 3D city model formats can
    be used for the proposed enrichments of either 3D city model format. Future
    improvements are presented for the achievement of using existing information
    of different formats of 3D city models of the same entities, in order
    to supplement each 3D city model format with useful information, enhance
    the performance of spatial analysis and boost the evolution on the use
    of such models on real life applications.
  uuid: 560bd9fb-7688-492f-b1c0-799644707be9
- surname: Willems
  name: Oscar
  title: Exploring a pure landmark-based approach for indoor localisation
  supervisors: Sisi Zlatanova; Edward Verbree
  year: 2017
  graduation_date: '2017-11-03'
  link: https://resolver.tudelft.nl/uuid:6332755b-72ea-4a74-a781-5cb3f951de67
  image: 2017_Willems.jpg
  abstract: Humans interact more and more with their environment through technology,
    recent decades have seen a huge increase in the need for and availability
    of Location-Based Services (LBS). Recently landmarks have gotten a renewed
    interest in the field of LBS , although already a quite old phenomenon.
    In both the outdoor and indoor environment they are being used to enrich
    existing services such as navigation, but not used as the basis for a
    technique or service. The indoor environment relies heavily on building
    specific and less-scalable sensor-based localisation techniques (such
    as Wi-Fi and Bluetooth), alternatives to sensor-based are becoming a necessity
    and would be a welcome addition. The exploration and development of landmark-based
    approaches for indoor localisation is something that can extend the field
    of geomatics and \ac{lbs}. This research investigates if a pure landmark-based
    approach works for indoor localisation and which characteristics of landmarks
    can be exploited. This is achieved by developing a conceptual framework
    that explores how a landmark-based indoor localisation would work from
    an artificial point of view. A Minimal Viable Product (MVP) is implemented
    to evaluate if a landmark-based approach works and what needs to be improved
    or considered in future studies Starting from an artificial test case,
    the MVP to achieve indoor localisation is implementing and evaluated using
    a manually digitised real-world and more complex test case. The fundamental
    principle of landmark-based localisation is that through the observation
    of landmarks within the (indoor) environment a user’s location is obtained
    because the visibility and location of landmarks are known. The workflow
    to go from an observation to a location is by 1) calculating the visibility/isovist
    area of each landmark, 2) interpret the observations into a combination
    of landmarks, 3) intersect the visibility of all landmarks in the observation,
    4) refine the location based on relative landmark constellations, and
    5) follow-up with questions on potentially visible landmarks to improve
    location further One of the key giveaways of this research is that approach
    for indoor localisation a landmark-based is feasible, principles and techniques
    exist (or are being developed), it is only a matter of setting them up
    in the right order and format them to work, and connect input with the
    researched process and use them for LBS driven applications. Future work
    on the subject of landmark-based localisation and LBS is connecting with
    existing spatial standards, extend the principles into the 3 rd dimension,
    and integrate more aspects of landmark salience.
  uuid: 6332755b-72ea-4a74-a781-5cb3f951de67
- surname: Xu
  name: Yueqian
  title: Construction of a Responsive Web Service for Smooth Rendering of
    Large SSC Dataset and the Corresponding Preprocessor for Source Data
  supervisors: Martijn Meijers
  year: 2017
  graduation_date: '2017-06-29'
  link: https://resolver.tudelft.nl/uuid:73a070d2-2d4c-46e3-9372-9dd5121ef5cd
  image: 2017_Xu.jpg
  abstract: This research focuses on a smooth rendering of continuous 2D map
    based on a smooth 3D vario-scale geographical data structure. A Space
    Scale Cube (SSC) offers non-redundant geometric data for the different
    level of details. SSC model represents geographic data as a closed polyhedron,
    to generate a 2D map; SSC is intersected with the projection plane; resulting
    in a set of 2D polygons. However, problems emerge when creating maps with
    a large sized SSC dataset under web environment due to limited bandwidth
    and decoding speed. Repetitively transmitting data from the server to
    the client can be time and bandwidth consuming. A preprocess should be
    applied to a source that allows the follow-up development of an online
    traffic and time-efficient prototype. After preprocessing, large sized
    data will be subdivided based on octree algorithm to minimize transmission
    time from server to the client; moreover, accessible to WebGL. A prototype
    has been developed which enables smooth and timely vario-scale map rendering
    against heavy user actions such as fast zooming and panning in a short
    period. Modified prototype program allows query of only relevant data
    chunks by current viewport position; it prevents repeated loading of same
    chunks; what is more, repeated transmission of data from outside to GPU
    is eliminated. A tree structure is embedded at the client side that facilitates
    retrieve time. Rendering happens every frame; hence the prototype responses
    to heavy user actions timely. Also, it can obtain coordinates in RD coordinate
    system by double clicking. After testing the modified program with a 9km
    by 9km dataset online, exceptional performance is indicated by a high
    average frame rate (57 fps) and low main memory occupation (with a network
    speed at 9MB/s). The prototype performance is significant affected by
    the client network condition; low network speed can decrease the frame
    rate. For instance, the web service achieved a frame rate of 47 fps at
    a network speed at 6MB/s.
  uuid: 73a070d2-2d4c-46e3-9372-9dd5121ef5cd
- surname: Broersen
  name: Tom
  title: Automatic identification of water courses from AHN3 in flat and engineered
    landscapes
  supervisors: Hugo Ledoux; Ravi Peters
  year: 2016
  link: https://resolver.tudelft.nl/uuid:7a64a9f7-2fef-46b1-9e48-5e0b0d736056
  image: 2016_Broersen.jpg
  paper: http://dx.doi.org/10.1016/j.cageo.2017.06.003
  abstract: The Netherlands is characterised by mostly low lying, flat, and
    engineered agricultural lands, which are sensitive to flooding. To protect
    against floods, a correct network characterisation is of the utmost importance.
    A Dutch water resources management company, the HDSR, wishes to have a
    highly automated method to characterise the water course network. In this
    thesis, I investigate the possibilities of automatically identifying water
    courses in flat and engineered landscapes, using the raw points of the
    AHN3 LiDAR dataset. I found that there are many methods described in literature
    which identify channel-like features, and some which identify water courses
    in engineered landscapes, but none of these are suitable for this application.
    Thus, I designed a new methodology which is based on two concepts; (1)
    concave hulls, and (2) the MAT. The concave hull approach makes use of
    the presence of water in the water courses, while the MAT uses the concave
    profiles of the water courses to identify them. A workflow was implemented
    which uses the raw AHN3 LiDAR point cloud to identify for every water
    course the polygons of the water surface, and the geographical position
    of the water surface's centre lines. The implemented prototype was used
    for four different areas to test its applicability to different environments;
    a clay, peat, urban, and sand area. The water course characteristics in
    terms of water surface width and surface concavity, differ between these
    areas. The resulting datasets were validated to obtain mapping and positional
    accuracies. The experiments performed in this thesis show the potential
    of the designed methodology. The concave hull method is very robust to
    errors in the identification; there are relatively few errors of commission.
    However, the method does not perform well for high vegetation coverage
    or low water surface width. It is particularly suited for use in areas
    where relative water levels are high, water courses are wide, and vegetation
    coverage is low. The MAT is able to operate well when water levels are
    low, or even when water courses are dry, and it is relatively insensitive
    to vegetation coverage. However, it does not perform well for water courses
    which show little surface curvature, and is prone to errors of commission
    caused by local non-watercourse convexities and concavities. The combined
    prototype provides a strong and promising approach for the automatic identification
    of water courses in flat and engineered landscapes from the raw AHN3 point
    cloud. When the methods are combined, they manage to identify 98% of all
    water courses for the clay area, 97% for the peat area, 95% for the urban
    area, and 76% for the sand area. Clearly, the identification rates profit
    from the combination of methods. However, the relatively high error of
    commission of the MAT also radiates into the combined method. The error
    of commission is then 8% for the clay and peat area, 47% for the urban
    area, and 17% for the sand area. A number of possible improvements are
    identified which could elevate the identification rate for the sand area,
    but specifically lower the presented commission rates. Although the methods
    currently require a small amount of calibration when applied to new areas,
    they can in principle be fully automated.
  uuid: 7a64a9f7-2fef-46b1-9e48-5e0b0d736056
- surname: de Liefde
  name: Ivo
  title: Exploring the Use of the Semantic Web for discovering, retrieving
    and processing data from Sensor Observation Services
  supervisors: Marianne de Vries; Martijn Meijers
  year: 2016
  link: https://resolver.tudelft.nl/uuid:44d66025-3e51-4d32-81aa-e093f0aca833
  image: 2016_de-Liefde.jpg
  abstract: 'Developments such as smart cities, the Internet of Things (IoT)
    and the Infrastructure for Spatial Information in Europe (INSPIRE) are
    causing a growing amount of observation data to be produced. The Open
    Geospatial Consortium (OGC) has developed Sensor Web Enablement (SWE)
    standards for modelling and publishing this data online. However, their
    use is currently limited to geo information specialists, who have knowledge
    about which data services are available and how to access them. With the
    use of the semantic web, online processes can automatically find and understand
    observation metadata. This opens up the SWE services to a large user audience.
    Therefore, this thesis has designed a conceptual system architecture that
    uses the semantic web to improve sensor data discovery as well as the
    integration and aggregation of sensor data from multiple sources. A conceptual
    system architecture is presented containing two web processes. The first
    process automatically creates an online semantic knowledge base of sensor
    metadata, by harvesting Sensor Observation Services. Metadata based on
    the Observations and Measurements (O&M) data model are retrieved, which
    includes the location of deployed sensors, what they observe, how they
    observe it and at which SWE service their data can be requested. The second
    process automatically translates logical queries of users into observation
    data requests. It also performs further processing before returning the
    observation data to the user. Both of these processes have been tested
    in a proof of concept implementation. A Web Processing Service (WPS) has
    been created as a proof of concept, making the two processes available
    online. The proof of concept is able to harvest sensor metadata, convert
    it to linked data, and publish it on the semantic web with links to and
    from other metadata. It results in a semantic knowledge base of sensor
    metadata, which improves the discovery in a machine understandable way.
    It allows multiple Sensor Observation Services to be used in combination
    with each other, due to the harmonisation involved in creating linked
    data. The WPS is therefore able to retrieve and process observation data
    from multiple Sensor Observation Services, using queries such as: What
    are the average particulate matter levels per month in neighbourhoods
    of Delft over the last five years? In conclusion, the presented conceptual
    system architecture contains two processes which improve the discovery,
    retrieval and aggregation of sensor data from multiple Sensor Observation
    Services using the semantic web. However, creating a completely automated
    process for harvesting metadata, which works with every Sensor Observation
    Service is not yet feasible, as non-meaningful identifiers are allowed
    to be used according to the SWE standards. Linked data ontologies should
    also be extended to include all available metadata. Currently there are
    no ontologies able to define the concept of a geo web service. Another
    conclusion is that the SPARQL endpoints used in this thesis cannot cope
    with complex vector geometries. This is due to their inability to handle
    verbose queries. Nevertheless, the proof of concept shows that the semantic
    web can enable current SWE services to be used in new ways, making observation
    data available to a larger user audience.'
  uuid: 44d66025-3e51-4d32-81aa-e093f0aca833
